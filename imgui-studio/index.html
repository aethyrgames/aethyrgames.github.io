});
bind('edit', 'Ctrl+X', { key: 'X', ctrl: true }, 'Cut subtree', 'Structure', () => cutSelection());
bind('edit', 'Ctrl+V', { key: 'V', ctrl: true }, 'Paste after selection', 'Structure', () => pasteClipboard());
bind('edit', 'R', { key: 'R', shift: false }, 'Repeat the last insert', 'Structure', () => repeatInsert());
bind('edit', 'Ctrl+Z', { key: 'Z', ctrl: true, shift: false }, 'Undo', 'Structure', () => undo());
bind('edit', 'Ctrl+Shift+Z', { key: 'Z', ctrl: true, shift: true }, 'Redo', 'Structure', () => redo());
bind('edit', '', { key: 'Y', ctrl: true }, 'Redo', 'Structure', () => redo());

bind('edit', 'V', { key: 'V', shift: false }, 'Back to select (disarm)', 'Insert', () => disarm());
for (const letter of Object.keys(FAMILIES)) {
  const names = FAMILIES[letter].map(t => WIDGETS[t].name).join(', ');
  bind('edit', letter + ' / Shift+' + letter, { key: letter, shift: false },
    'Arm ' + names + ' (press again to cycle)', 'Insert', () => arm(letter, false));
  bind('edit', '', { key: letter, shift: true },
    'Cycle ' + letter + ' family backward', 'Insert', () => arm(letter, true));
}
bind('edit', '/', { key: '/' }, 'Insert menu (filter all widgets)', 'Insert', () => openCmdk('insert'));
// Hotbar: bare key arms the pinned widget, Ctrl+key pins the current selection
// (or the armed widget) into that slot. Reordering is how you rebind.
HOTBAR_KEYS.forEach((k, i) => {
  bind('edit', i === 0 ? '0…9 - =' : '', { key: k, ctrl: false },
    'Arm the widget in hotbar slot ' + (i + 1), 'Insert', () => {
    const type = hotbar[i];
    if (!type) return false;         // empty slot declines, key falls through
    return rearm(type);              // so does a type with no arming family
  });
  bind('edit', i === 0 ? 'Ctrl+0…9' : '', { key: k, ctrl: true },
    'Pin the selected or armed widget to hotbar slot ' + (i + 1), 'Insert', () => {
    const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
    const type = armed ? armedType() : (node && node.type);
    if (!type) return false;
    pinToHotbar(type, i);
  });
});

bind('global', 'Ctrl+K', { key: 'K', ctrl: true }, 'Command palette', 'Global', () => openCmdk('all'));
bind('global', '?', { key: '?' }, 'Keyboard shortcuts', 'Global', () => toggleHelp());

window.addEventListener('keydown', e => {
  const t = e.target;
  if (isTextEntry(t) || (t && t.tagName === 'SELECT')) {
    if (e.key === 'Escape') {
      // Escape from a field is a full back-out, including a drag that was
      // started while the palette filter still held focus
      t.blur();
      closeOverlays();
      cancelDrag();
      disarm();
      e.preventDefault();
    }
    return;
  }
  // a focused checkbox keeps Space for its own toggle; everything else dispatches
  if (t && t.tagName === 'INPUT' && e.key === ' ') return;
  if (e.key === ' ' && !e.ctrlKey && !e.altKey) { handleSpaceDown(e); return; }
  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) { handleTabDown(e); return; }
  if (e.key === 'Escape' && (!cmdkEl.hidden || !helpEl.hidden)) {
    closeOverlays();
    e.preventDefault();
    return;
  }
  // never steal keys from an active ImGui text field in live mode
  if (!editMode && engineWantsText) return;
  const contexts = [];
  if (drag) contexts.push('drag');
  contexts.push(editMode ? 'edit' : 'live');
  contexts.push('global');
  for (const ctx of contexts) {
    const matches = KEYMAP.filter(b => b.ctx === ctx && keyMatches(e, b));
    if (!matches.length) continue;
    // Several bindings may legitimately share a key within one category, so
    // repeated presses cycle through them; a lone binding behaves as before.
    if (matches.length > 1) {
      const sig = ctx + '|' + comboLabel(matches[0]);
      const now = Date.now();
      cycleState.idx = (cycleState.sig === sig && now - cycleState.at < 900) ? cycleState.idx + 1 : 0;
      cycleState.sig = sig;
      cycleState.at = now;
    } else {
      cycleState.sig = '';
    }
    const start = matches.length > 1 ? cycleState.idx : 0;
    for (let i = 0; i < matches.length; i++) {
      const b = matches[(start + i) % matches.length];
      if (b.run(e) === false) continue; // declined, keep looking / keep default
      e.preventDefault();
      return;
    }
  }
});

const cycleState = { sig: '', idx: 0, at: 0 };

window.addEventListener('keyup', e => {
  if (e.key === 'Tab') handleTabUp();
  else if (e.key === ' ') releaseSpace();
});

// ---------- command palette and insert menu ----------

const cmdkEl = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const helpEl = document.getElementById('helpov');
const helpInput = document.getElementById('helpInput');
const helpList = document.getElementById('helpList');

let cmdkItems = [];
let cmdkSel = 0;

function commandEntries() {
  return [
    { label: 'Undo', k: 'Ctrl+Z', run: undo },
    { label: 'Redo', k: 'Ctrl+Shift+Z', run: redo },
    { label: 'Toggle Edit / Live mode', k: 'Tab', run: () => setLiveMode(editMode) },
    { label: 'Duplicate selection', k: 'Ctrl+D', run: duplicateSelection },
    { label: 'Delete selection', k: 'Del', run: deleteSelection },
    { label: 'Wrap selection in Group', k: 'Ctrl+G', run: wrapSelection },
    { label: 'Unwrap container', k: 'Ctrl+Shift+G', run: unwrapSelection },
    { label: 'Toggle SameLine join', k: 'J', run: toggleJoin },
    { label: 'Repeat last insert', k: 'R', run: repeatInsert },
    { label: 'Keyboard shortcuts', k: '?', run: toggleHelp },
    { label: 'Reset document to the sample', run: () => document.getElementById('resetBtn').onclick() },
    { label: 'Reset panel layout', run: () => resetPanelLayout() },
    { label: 'Export JSON', run: () => document.getElementById('exportBtn').onclick() },
    { label: 'Copy generated C++', run: () => navigator.clipboard.writeText(generateCode()) },
  ];
}

function openCmdk(mode) {
  const inserts = Object.entries(WIDGETS)
    .filter(([, s]) => !s.hidden)
    .map(([type, s]) => ({
      label: 'Insert ' + s.name,
      k: FAMILY_OF[type] || '',
      run: () => insertNodeAt(type, dropAfterSelection()),
    }));
  cmdkItems = mode === 'insert' ? inserts : commandEntries().concat(inserts);
  cmdkEl.hidden = false;
  cmdkInput.value = '';
  cmdkInput.placeholder = mode === 'insert' ? 'insert widget...' : 'search commands and widgets...';
  cmdkSel = 0;
  renderCmdk();
  cmdkInput.focus();
}

function renderCmdk() {
  const term = cmdkInput.value.trim().toLowerCase();
  const vis = cmdkItems.filter(i => !term || i.label.toLowerCase().includes(term));
  // rank prefix matches first so short queries land where expected
  vis.sort((a, b) => {
    const ap = a.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    const bp = b.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    return ap - bp;
  });
  const shown = vis.slice(0, 40);
  cmdkSel = Math.max(0, Math.min(cmdkSel, shown.length - 1));
  cmdkList.innerHTML = '';
  shown.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'ov-item' + (i === cmdkSel ? ' sel' : '');
    const l = document.createElement('span');
    l.textContent = item.label;
    row.appendChild(l);
    if (item.k) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = item.k;
      row.appendChild(k);
    }
    row.onclick = () => { closeOverlays(); item.run(); };
    cmdkList.appendChild(row);
  });
  cmdkList.__visible = shown;
}

cmdkInput.addEventListener('input', () => { cmdkSel = 0; renderCmdk(); });
cmdkInput.addEventListener('keydown', e => {
  const vis = cmdkList.__visible || [];
  if (e.key === 'ArrowDown') { cmdkSel++; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { cmdkSel--; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const item = vis[cmdkSel];
    closeOverlays();
    if (item) item.run();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    // must live here: the stopPropagation below keeps real keypresses from
    // ever reaching the window listener's overlay handling
    closeOverlays();
    e.preventDefault();
  }
  e.stopPropagation();
});

function renderHelp() {
  const term = helpInput.value.trim().toLowerCase();
  const activeCtx = new Set(['global', editMode ? 'edit' : 'live', drag ? 'drag' : null]);
  const rows = [
    { show: 'Space', help: 'Hold to test interaction, release to return to editing', cat: 'Global' },
    { show: 'Tab', help: 'Toggle Edit / Live. Hold to peek Live, release to snap back.', cat: 'Global' },
  ];
  // Every binding gets its own row, labelled from its live combo. Hiding the
  // second half of a pair behind a hand-written "Up / Down" left it unlistable
  // and unrebindable, and the static label went stale the moment either half
  // was rebound.
  for (const b of KEYMAP) {
    if (!activeCtx.has(b.ctx)) continue;
    rows.push(b);
  }
  helpList.innerHTML = '';

  const hint = document.createElement('div');
  hint.className = 'ov-cat';
  hint.textContent = capturing
    ? 'press a key for: ' + capturing.help + '   (Esc cancels)'
    : 'click any shortcut to rebind it';
  hint.style.color = capturing ? 'var(--mk-green)' : 'var(--mk-comment)';
  helpList.appendChild(hint);

  let lastCat = '';
  for (const r of rows) {
    const label = r.id ? comboLabel(r) : r.show;
    if (term && !(label + ' ' + r.help).toLowerCase().includes(term)) continue;
    if (r.cat !== lastCat) {
      lastCat = r.cat;
      const c = document.createElement('div');
      c.className = 'ov-cat';
      c.textContent = r.cat;
      helpList.appendChild(c);
    }
    const fixed = !r.id;   // Space/Tab are hardwired quasimodes
    const row = document.createElement('div');
    row.className = 'ov-item';
    const l = document.createElement('span');
    l.textContent = r.help;
    row.appendChild(l);
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = capturing === r ? '…press a key' : (fixed ? r.show : comboLabel(r));
    if (!fixed && bindOverrides[r.id]) k.style.color = 'var(--mk-green)';
    row.appendChild(k);
    if (!fixed) {
      row.style.cursor = 'pointer';
      row.onclick = () => { capturing = r; renderHelp(); };
    }
    helpList.appendChild(row);
  }

  const reset = document.createElement('div');
  reset.className = 'ov-item';
  reset.style.cursor = 'pointer';
  reset.style.color = 'var(--mk-comment)';
  reset.textContent = 'Reset all shortcuts to defaults';
  reset.onclick = () => { resetBinds(); renderHelp(); };
  helpList.appendChild(reset);
}

let capturing = null;   // binding awaiting a keypress

// While capturing, the next keypress becomes the binding instead of firing.
function captureKey(e) {
  if (!capturing) return false;
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return true;
  e.preventDefault();
  if (e.key === 'Escape') { capturing = null; renderHelp(); return true; }
  const cand = {
    key: e.key.length === 1 ? e.key.toUpperCase() : e.key,
    ctrl: e.ctrlKey || e.metaKey, alt: e.altKey, shift: e.shiftKey,
  };
  const clash = rebind(capturing, cand);
  capturing = null;
  renderHelp();
  if (clash) {
    const hint = helpList.firstChild;
    hint.textContent = comboLabel(cand) + ' is already "' + clash.help + '" under '
      + clash.cat + '. Keys can only be shared inside one group.';
    hint.style.color = 'var(--mk-pink)';
  }
  return true;
}

helpInput.addEventListener('input', renderHelp);
helpInput.addEventListener('keydown', e => {
  if (captureKey(e)) { e.stopPropagation(); return; }
  if (e.key === 'Escape') { closeOverlays(); e.preventDefault(); }
  e.stopPropagation();
});

function toggleHelp() {
  if (helpEl.hidden) {
    helpEl.hidden = false;
    helpInput.value = '';
    renderHelp();
    helpInput.focus();
  } else {
    helpEl.hidden = true;
  }
}

function closeOverlays() {
  cmdkEl.hidden = true;
  helpEl.hidden = true;
  if (typeof closeConfirm === 'function') closeConfirm();
  if (typeof closeSettings === 'function') closeSettings();
  // Focus would otherwise stay parked in the now-hidden input, and the
  // dispatcher's text-entry guard would treat every later key as typing,
  // leaving the whole keyboard dead until the user clicked something.
  if (document.activeElement === cmdkInput || document.activeElement === helpInput) {
    document.activeElement.blur();
  }
}

cmdkEl.addEventListener('mousedown', e => { if (e.target === cmdkEl) closeOverlays(); });
helpEl.addEventListener('mousedown', e => { if (e.target === helpEl) closeOverlays(); });

// ---------- code generation ----------

function pascal(s, fallback) {
  const words = (s || '').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!words.length || /^[0-9]/.test(words[0])) return fallback;
  return words.map(w => w[0].toUpperCase() + w.slice(1)).join('');
}

function camel(s, fallback) {
  const p = pascal(s, fallback);
  return p[0].toLowerCase() + p.slice(1);
}

const CPP_KEYWORDS = new Set([
  'alignas', 'alignof', 'and', 'asm', 'auto', 'bool', 'break', 'case', 'catch', 'char',
  'class', 'const', 'constexpr', 'continue', 'decltype', 'default', 'delete', 'do',
  'double', 'else', 'enum', 'explicit', 'export', 'extern', 'false', 'float', 'for',
  'friend', 'goto', 'if', 'inline', 'int', 'long', 'mutable', 'namespace', 'new',
  'noexcept', 'not', 'nullptr', 'operator', 'or', 'private', 'protected', 'public',
  'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch',
  'template', 'this', 'throw', 'true', 'try', 'typedef', 'typeid', 'typename',
  'union', 'unsigned', 'using', 'virtual', 'void', 'volatile', 'while', 'xor',
]);

const WINDOW_FLAGS = [
  ['noTitleBar', 'NoTitleBar'], ['noResize', 'NoResize'], ['noMove', 'NoMove'],
  ['noScrollbar', 'NoScrollbar'], ['noCollapse', 'NoCollapse'], ['autoResize', 'AlwaysAutoResize'],
];

function generateCode() {
  const usedNames = new Set();
  const labelCount = new Map();
  const fields = [];
  const fieldSeen = new Set();
  const owners = [];   // index into `out` -> node id that produced that line
  const skipped = [];  // widgets with no valid C++ form, reported to the user

  const groupNames = new Map();
  // A counter alone isn't enough: "Value" then "Value 1" then "Value" would
  // hand out `value`, `value1`, `value1`. Track what's actually taken.
  const claim = base => {
    if (CPP_KEYWORDS.has(base)) base += 'Value';
    let name = base;
    let i = 1;
    while (usedNames.has(name)) name = base + (i++);
    usedNames.add(name);
    return name;
  };

  const uniqName = (node, spec) => {
    // Radio buttons in one group deliberately share a backing variable. The
    // shared name still goes through the counter once, so an unrelated widget
    // labelled the same can't end up declaring a second field of that name.
    if (spec.fieldName) {
      const g = spec.fieldName(node);
      if (!groupNames.has(g)) groupNames.set(g, claim(camel(g, node.type)));
      return groupNames.get(g);
    }
    return claim(camel(node.label || node.type, node.type));
  };

  // Duplicate on-screen labels need distinct ImGui IDs, and the suffix has to
  // come from the occurrence rather than the field name, since radio buttons
  // in one group deliberately share a field.
  const imguiId = label => {
    const s = String(label ?? '');
    const c = (labelCount.get(s) || 0) + 1;
    labelCount.set(s, c);
    return q(c === 1 ? s : s + '##' + c);
  };

  const addField = d => {
    for (const line of Array.isArray(d) ? d : [d]) {
      if (line && !fieldSeen.has(line)) { fieldSeen.add(line); fields.push(line); }
    }
  };

  // Scopes that end a tab bar's reach, matching the engine's threading of the
  // same flag. A tab item outside one is an assert in ImGui, not a no-op.
  const ENDS_TABBAR = new Set(['child', 'popup', 'modal', 'tooltip', 'menu', 'menubar', 'table', 'tabitem']);

  const out = [];
  const emit = (node, depth, index, parentType, inTabbar) => {
    const spec = WIDGETS[node.type];
    if (!spec) return;
    const ind = '    '.repeat(depth);
    // These arrangements assert inside ImGui, so there is no valid C++ to emit
    // and the subtree has nowhere to go. Record what was dropped: the code pane
    // warns before Apply reads the text back and makes the loss permanent.
    const skip = reason => {
      const lost = countNodes(node.children);
      skipped.push({ type: spec.name, label: node.label || '', reason, lost });
      out.push(ind + `// ${spec.name}${node.label ? ' "' + node.label + '"' : ''}: ${reason}`);
      if (lost) out.push(ind + `// ${lost} widget${lost > 1 ? 's' : ''} inside it cannot be emitted either.`);
    };
    if (node.type === 'tabitem' && !inTabbar) {
      skip('a Tab item needs a Tab bar around it, so it is skipped');
      return;
    }
    // BeginMenuBar only works on a window carrying ImGuiWindowFlags_MenuBar,
    // and asserts outright if one is already being appended.
    if (node.type === 'menubar' && parentType !== 'window') {
      skip('a Menu bar must sit directly on the window, so it is skipped');
      return;
    }
    const v = uniqName(node, spec);
    const hasLabel = (spec.props || []).some(p => p[0] === 'label');
    const idStr = hasLabel ? imguiId(node.label) : q(node.type);
    // Remember which output lines this node produced, so the code pane can
    // scroll to a widget. Claimed on the way out and only where still unclaimed,
    // which leaves each child owning its own lines and the parent owning the
    // Begin/End scaffolding around them.
    const ownFrom = out.length;
    const claimLines = () => {
      for (let k = ownFrom; k < out.length; k++) if (!owners[k]) owners[k] = node.id;
    };

    if (parentType === 'table') out.push(ind + 'ImGui::TableNextColumn();');
    else if (node.sameline && index > 0) out.push(ind + 'ImGui::SameLine();');

    if (spec.field) addField(spec.field(node, v));

    // Colour pushes wrap the whole widget, and for a container they wrap its
    // Begin/End pair because values like ChildBg are read at Begin time.
    const cols = Object.entries(node.colors || {})
      .filter(([slot]) => colorSlots(node.type).includes(slot));
    for (const [slot, c] of cols) {
      out.push(ind + `ImGui::PushStyleColor(ImGuiCol_${slot}, `
        + `ImVec4(${f(c[0])}, ${f(c[1])}, ${f(c[2])}, ${f(c[3] === undefined ? 1 : c[3])}));`);
    }
    const popColors = () => {
      if (cols.length) out.push(ind + `ImGui::PopStyleColor(${cols.length});`);
    };

    const res = spec.code ? spec.code(node, v, idStr) : null;
    if (!res) { popColors(); claimLines(); return; }
    if (Array.isArray(res)) {
      for (const l of res) out.push(ind + l);
      popColors();
      claimLines();
      return;
    }

    for (const l of res.open) out.push(ind + l);
    const braced = res.braced !== false;
    if (braced) out.push(ind + '{');
    const cd = braced ? depth + 1 : depth;
    const kids = node.children || [];
    const childTab = node.type === 'tabbar' ? true : (ENDS_TABBAR.has(node.type) ? false : inTabbar);
    for (let i = 0; i < kids.length; i++) emit(kids[i], cd, i, node.type, childTab);
    if (res.extra) for (const l of res.extra) out.push('    '.repeat(cd) + l);
    if (res.pop) out.push('    '.repeat(cd) + res.pop);
    if (braced) out.push(ind + '}');
    else if (res.close) out.push(ind + res.close);
    popColors();
    claimLines();
  };

  const kids = doc.children || [];
  for (let i = 0; i < kids.length; i++) emit(kids[i], 1, i, 'window', false);

  const base = pascal(doc.label, 'MyPanel');
  const flags = WINDOW_FLAGS.filter(([k]) => doc[k]).map(([, f]) => 'ImGuiWindowFlags_' + f);
  if (kids.some(c => c.type === 'menubar')) flags.push('ImGuiWindowFlags_MenuBar');

  const head = [];
  head.push('// Generated by ImGuiStudio');
  head.push('');
  head.push(`struct ${base}State`);
  head.push('{');
  for (const f of fields) head.push('    ' + f);
  head.push('};');
  head.push('');
  head.push(`void Draw${base}(${base}State& state)`);
  head.push('{');
  if (flags.length) head.push(`    ImGuiWindowFlags flags = ${flags.join(' | ')};`);
  if (doc.w > 0 || doc.h > 0) {
    head.push(`    ImGui::SetNextWindowSize(ImVec2(${f(doc.w)}, ${f(doc.h)}), ImGuiCond_FirstUseEver);`);
  }
  // Code the user wrote around the window in the C++ pane, replayed at the same
  // spot so editing the document can't delete it.
  if (doc.pre) for (const l of String(doc.pre).split('\n')) head.push(l ? '    ' + l : '');
  // Window colours have to be pushed before Begin: WindowBg and the title-bar
  // slots are read while the window is being opened, not while it is filled.
  const winCols = Object.entries(doc.colors || {})
    .filter(([slot]) => colorSlots('window').includes(slot));
  for (const [slot, c] of winCols) {
    head.push(`    ImGui::PushStyleColor(ImGuiCol_${slot}, `
      + `ImVec4(${f(c[0])}, ${f(c[1])}, ${f(c[2])}, ${f(c[3] === undefined ? 1 : c[3])}));`);
  }
  head.push(`    ImGui::Begin(${q(doc.label || 'My Panel')}${flags.length ? ', nullptr, flags' : ''});`);
  const tail = ['    ImGui::End();'];
  if (winCols.length) tail.push(`    ImGui::PopStyleColor(${winCols.length});`);
  if (doc.post) for (const l of String(doc.post).split('\n')) tail.push(l ? '    ' + l : '');
  tail.push('}');
  generateCode.skipped = skipped;
  // Shift the ownership map onto the final line numbering for revealInCode.
  generateCode.owners = head.map(() => null)
    .concat(Array.from({ length: out.length }, (_, i) => owners[i] || null),
      tail.map(() => null));
  return head.concat(out, tail).join('\n');
}

// Monokai-family highlighter for the code pane: a single-pass tokenizer whose
// scopes mirror editor themes (chained replaces can't express the call-site vs
// definition distinctions). Lookbehinds resolve against the raw source, so
// already-emitted spans can't confuse later branches.
function highlightCpp(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const master = new RegExp([
    /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/,                                    // 1 comment
    /("(?:[^"\\]|\\.)*")/,                                              // 2 string
    /\b(if|else|return|for|while|switch|case|break|struct|const|static)\b/, // 3 keyword + storage
    /\b(void|bool|float|char|int|double|unsigned)\b/,                   // 4 storage.type
    /\b(true|false|nullptr|NULL)\b/,                                    // 5 constant.language
    /\b(\d+(?:\.\d+)?f?)\b/,                                            // 6 constant.numeric
    /\b(ImGui)\b/,                                                      // 7 support namespace
    /\b(ImVec[24])\b/,                                                  // 8 support struct
    /\b(IM_[A-Z_]+)\b/,                                                 // 9 macro
    /((?<=::)[A-Za-z_]\w*(?=\())/,                                      // 10 support.function (call)
    /\b([A-Za-z_]\w*)(?=\()/,                                           // 11 entity.name.function
    /((?<=\b(?:bool|float|char|int|double|unsigned)\s{1,4})[a-z]\w*)/,  // 12 field declaration
    /((?<=\.)[a-z]\w*)/,                                                // 13 field access
    /\b([a-z]\w*)(?=\.)/,                                               // 14 the variable it hangs off
    /\b([A-Z]\w*)\b/,                                                   // 15 entity.name.class
    /((?<=&\s)[a-z]\w*(?=\)))/,                                         // 16 variable.parameter
    /(::|&|=|-)/,                                                       // 17 keyword.operator
  ].map(r => r.source).join('|'), 'g');
  const classes = ['c-com', 'c-str', 'c-kw', 'c-type', 'c-const', 'c-num',
    'c-support', 'c-class', 'c-macro', 'c-supfn', 'c-fn', 'c-field', 'c-field',
    'c-param', 'c-class', 'c-param', 'c-op'];
  let out = '';
  let last = 0;
  let m;
  while ((m = master.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    let cls = '';
    for (let g = 1; g < m.length; g++) {
      if (m[g] !== undefined) { cls = classes[g - 1]; break; }
    }
    out += cls ? '<span class="' + cls + '">' + esc(m[0]) + '</span>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

    'c-com': t.com, 'c-str': t.str, 'c-kw': t.kw, 'c-type': t.type,

      + ' { color: ' + col + '; font-style: ' + (it.has(cls) ? 'italic' : 'normal') + '; }');

// ---------- panels, docks, rulers ----------
// A fixed tiled layout with splitters, not a free-form docking system. For four
// panels the research is unanimous that drag-to-tab/floating is over-built, so
// panels move between the two docks and that is the whole story.

const LAYOUT_KEY = 'imguistudio.layout.v1';
const PANEL_DEFAULTS = {
  palette:    { dock: 'left',  order: 0, collapsed: false, hidden: false },
  hierarchy:  { dock: 'left',  order: 1, collapsed: false, hidden: false },
  properties: { dock: 'left',  order: 2, collapsed: false, hidden: false },
  templates:  { dock: 'left',  order: 3, collapsed: true,  hidden: false },
  code:       { dock: 'right', order: 0, collapsed: false, hidden: false },
};
const DOCK_SIDES = ['left', 'right', 'top', 'bottom'];
const SIZE_DEFAULTS = { left: 280, right: 470, top: 200, bottom: 200 };
let layout = {
  panels: JSON.parse(JSON.stringify(PANEL_DEFAULTS)),
  size: { ...SIZE_DEFAULTS },
};

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {}
}

// Sizes are stored in absolute px, so a layout saved on a big monitor would
// otherwise squeeze the canvas to nothing on a smaller one.
const DOCK_MIN = 150;
function clampDockSizes() {
  const pairs = [
    ['left', 'right', Math.max(DOCK_MIN * 2, window.innerWidth - 320)],
    ['top', 'bottom', Math.max(DOCK_MIN * 2, window.innerHeight - 320)],
  ];
  for (const [a, bSide, budget] of pairs) {
    // cap each side first: scaling alone can't help when one dock is bigger
    // than the whole budget, because the other still holds its minimum
    for (const side of [a, bSide]) {
      const v = Math.round(Number(layout.size[side]) || SIZE_DEFAULTS[side]);
      layout.size[side] = Math.max(DOCK_MIN, Math.min(v, budget - DOCK_MIN));
    }
    const total = layout.size[a] + layout.size[bSide];
    if (total > budget) {
      const scale = budget / total;
      layout.size[a] = Math.max(DOCK_MIN, Math.round(layout.size[a] * scale));
      layout.size[bSide] = Math.max(DOCK_MIN, Math.round(layout.size[bSide] * scale));
    }
  }
}

function resetPanelLayout() {
  layout = {
    panels: JSON.parse(JSON.stringify(PANEL_DEFAULTS)),
    size: { ...SIZE_DEFAULTS },
  };
  saveLayout();
  applyLayout();
}

function loadLayout() {
  try {
    const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
    if (!s || !s.panels) return;
    for (const k of Object.keys(PANEL_DEFAULTS)) {
      if (s.panels[k]) layout.panels[k] = { ...PANEL_DEFAULTS[k], ...s.panels[k] };
      if (!DOCK_SIDES.includes(layout.panels[k].dock)) layout.panels[k].dock = 'left';
    }
    // `width` is the old two-dock shape, kept readable so saved layouts survive
    if (s.size) layout.size = { ...layout.size, ...s.size };
    else if (s.width) layout.size = { ...layout.size, ...s.width };
  } catch (e) {}
}

const panelEls = {};

function buildPanels() {
  for (const el of document.querySelectorAll('.panel')) {
    const key = el.dataset.panel;
    const body = document.createElement('div');
    body.className = 'panel-body';
    while (el.firstChild) body.appendChild(el.firstChild);

    const head = document.createElement('div');
    head.className = 'panel-head';
    head.innerHTML = '<span class="tw">▾</span><span class="ttl"></span>';
    head.querySelector('.ttl').textContent = el.dataset.title;
    const close = document.createElement('button');
    close.textContent = '✕';
    close.title = 'Hide this panel';
    close.onclick = e => { e.stopPropagation(); layout.panels[key].hidden = true; applyLayout(); };
    head.appendChild(close);
    head.onclick = () => {
      layout.panels[key].collapsed = !layout.panels[key].collapsed;
      applyLayout();
    };
    head.addEventListener('mousedown', e => startPanelDrag(e, key));

    el.appendChild(head);
    el.appendChild(body);
    panelEls[key] = el;
  }
  applyLayout();
}

function dockEl(side) {
  return document.getElementById('dock' + side[0].toUpperCase() + side.slice(1));
}

function applyLayout() {
  const docks = {};
  for (const s of DOCK_SIDES) { docks[s] = dockEl(s); docks[s].innerHTML = ''; }
  // Hidden panels stay in the DOM as display:none rather than being detached.
  // Detaching them took their render targets out of getElementById, so the next
  // renderPalette/renderProps threw and every edit after that died with it.
  const entries = Object.entries(layout.panels)
    .sort((a, b) => a[1].order - b[1].order);
  for (const [key, p] of entries) {
    const el = panelEls[key];
    el.classList.toggle('collapsed', p.collapsed);
    el.classList.toggle('gone', !!p.hidden);
    el.querySelector('.tw').textContent = p.collapsed ? '▸' : '▾';
    (docks[p.dock] || docks.left).appendChild(el);
  }
  clampDockSizes();
  docks.left.style.width = layout.size.left + 'px';
  docks.right.style.width = layout.size.right + 'px';
  docks.top.style.height = layout.size.top + 'px';
  docks.bottom.style.height = layout.size.bottom + 'px';
  renderPanelButtons();
  saveLayout();
  requestAnimationFrame(syncCanvasSize);
}

function renderPanelButtons() {
  let host = document.getElementById('panelbtns');
  if (!host) {
    host = document.createElement('span');
    host.id = 'panelbtns';
    host.style.display = 'flex';
    host.style.gap = '4px';
    document.querySelector('#apphead .spacer').after(host);
  }
  host.innerHTML = '';
  for (const [key, p] of Object.entries(layout.panels)) {
    const b = document.createElement('button');
    b.className = 'panelbtn' + (p.hidden ? '' : ' on');
    b.textContent = panelEls[key].dataset.title;
    b.title = (p.hidden ? 'Show ' : 'Hide ') + panelEls[key].dataset.title;
    b.onclick = () => { p.hidden = !p.hidden; applyLayout(); };
    host.appendChild(b);
  }
}

// Drag a panel header to any edge. The zone is picked by which edge the cursor
// is nearest, normalised so a short window's top and bottom compete fairly with
// a wide window's left and right.
let panelDrag = null;
const dropzone = document.getElementById('dropzone');

function edgeUnderCursor(x, y) {
  const ws = document.getElementById('workspace').getBoundingClientRect();
  const d = {
    left: (x - ws.left) / ws.width,
    right: (ws.right - x) / ws.width,
    top: (y - ws.top) / ws.height,
    bottom: (ws.bottom - y) / ws.height,
  };
  return DOCK_SIDES.reduce((best, s) => (d[s] < d[best] ? s : best), 'left');
}

// Where a dock would land if it isn't on screen yet, so the preview is the real
// size the panel is about to get rather than a generic band.
function dockPreviewRect(side) {
  const ws = document.getElementById('workspace').getBoundingClientRect();
  const live = dockEl(side).getBoundingClientRect();
  if (live.width > 1 && live.height > 1) return live;
  const size = layout.size[side] || SIZE_DEFAULTS[side];
  if (side === 'left') return { left: ws.left, top: ws.top, width: size, height: ws.height };
  if (side === 'right') return { left: ws.right - size, top: ws.top, width: size, height: ws.height };
  if (side === 'top') return { left: ws.left, top: ws.top, width: ws.width, height: size };
  return { left: ws.left, top: ws.bottom - size, width: ws.width, height: size };
}

// Draw the dock at its real size and split it into slots, one per panel that
// will share it, with the dragged one marked. "Somewhere on the right" tells
// you much less than "this tall, second of three".
function showDropPreview(side, key) {
  const r = dockPreviewRect(side);
  const stacks = side === 'left' || side === 'right';
  const sharing = Object.entries(layout.panels)
    .filter(([k, p]) => !p.hidden && p.dock === side && k !== key)
    .sort((a, b) => a[1].order - b[1].order)
    .map(([k]) => k)
    .concat([key]);
  dropzone.style.display = 'block';
  dropzone.style.left = r.left + 'px';
  dropzone.style.top = r.top + 'px';
  dropzone.style.width = r.width + 'px';
  dropzone.style.height = r.height + 'px';
  dropzone.style.flexDirection = stacks ? 'column' : 'row';
  dropzone.innerHTML = '';
  for (const k of sharing) {
    const slot = document.createElement('div');
    slot.className = 'dzslot' + (k === key ? ' me' : '');
    slot.textContent = panelEls[k] ? panelEls[k].dataset.title : k;
    dropzone.appendChild(slot);
  }
}

function startPanelDrag(e, key) {
  if (e.button !== 0 || e.target.tagName === 'BUTTON') return;
  panelDrag = { key, startX: e.clientX, startY: e.clientY, moved: false };
}

// Escape and losing focus both abandon the drag. Without this the dropzone
// overlay stayed up and a later click committed a dock move nobody asked for.
function cancelPanelDrag() {
  if (!panelDrag) return;
  panelEls[panelDrag.key].classList.remove('dragging');
  panelDrag = null;
  dropzone.style.display = 'none';
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panelDrag) { cancelPanelDrag(); e.preventDefault(); }
}, true);

document.addEventListener('mousemove', e => {
  if (!panelDrag) return;
  if (!panelDrag.moved) {
    if (Math.abs(e.clientX - panelDrag.startX) + Math.abs(e.clientY - panelDrag.startY) < 6) return;
    panelDrag.moved = true;
    panelEls[panelDrag.key].classList.add('dragging');
  }
  panelDrag.side = edgeUnderCursor(e.clientX, e.clientY);
  showDropPreview(panelDrag.side, panelDrag.key);
});

document.addEventListener('mouseup', () => {
  if (!panelDrag) return;
  const d = panelDrag;
  panelDrag = null;
  dropzone.style.display = 'none';
  panelEls[d.key].classList.remove('dragging');
  if (!d.moved || !d.side) return;
  const p = layout.panels[d.key];
  if (p.dock !== d.side) {
    p.dock = d.side;
    p.hidden = false;
    p.order = Math.max(0, ...Object.values(layout.panels)
      .filter(x => x.dock === d.side).map(x => x.order + 1));
  }
  applyLayout();
});

// dock splitters
for (const [id, side] of [['resizeLeft', 'left'], ['resizeRight', 'right'],
  ['resizeTop', 'top'], ['resizeBottom', 'bottom']]) {
  const el = document.getElementById(id);
  const vertical = side === 'top' || side === 'bottom';
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    el.classList.add('dragging');
    const startX = vertical ? e.clientY : e.clientX;
    const startW = layout.size[side];
    const move = ev => {
      const at = vertical ? ev.clientY : ev.clientX;
      // top and left grow as the cursor moves away from the origin; the far
      // sides grow as it moves back toward it
      const delta = (side === 'left' || side === 'top') ? at - startX : startX - at;
      layout.size[side] = Math.max(DOCK_MIN, Math.min(760, startW + delta));
      dockEl(side).style[vertical ? 'height' : 'width'] = layout.size[side] + 'px';
      syncCanvasSize();
    };
    const up = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      saveLayout();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  // double-click a splitter to reset that dock
  el.addEventListener('dblclick', () => {
    layout.size[side] = SIZE_DEFAULTS[side];
    applyLayout();
  });
}

// ---------- canvas sizing, rulers, guides ----------

const rulerTop = document.getElementById('rulerTop');
const rulerLeft = document.getElementById('rulerLeft');
const rulerBottom = document.getElementById('rulerBottom');
const rulerRight = document.getElementById('rulerRight');
// side -> is it a horizontal rule, and which edge do its ticks grow from
const RULERS = [
  { cv: rulerTop, horiz: true, flip: false },
  { cv: rulerLeft, horiz: false, flip: false },
  { cv: rulerBottom, horiz: true, flip: true },
  { cv: rulerRight, horiz: false, flip: true },
];
const guidesEl = document.getElementById('guides');
let showRulers = true;
let showGrid = true;
let guides = [];        // { axis: 'x'|'y', pos }
let cursorCanvas = { x: -1, y: -1 };

// The wasm surface follows its container instead of being a fixed 1000x740 box,
// so the preview uses whatever width the docks leave.
function syncCanvasSize() {
  const w = Math.max(64, Math.floor(canvasHost.clientWidth));
  const h = Math.max(64, Math.floor(canvasHost.clientHeight));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    if (engineReady) Module.ccall('engine_resize', null, ['number', 'number'], [w, h]);
  }
  drawRulers();
}

new ResizeObserver(() => syncCanvasSize()).observe(canvasHost);
// A window that shrinks past what the docks were sized for has to re-clamp
// them, or the canvas gets squeezed out from between them.
window.addEventListener('resize', () => {
  const before = JSON.stringify(layout.size);
  clampDockSizes();
  if (JSON.stringify(layout.size) !== before) applyLayout();
  syncCanvasSize();
});

function drawRulers() {
  if (!showRulers) return;
  const W = canvasHost.clientWidth, H = canvasHost.clientHeight;
  for (const { cv, horiz, flip } of RULERS) {
    const len = horiz ? W : H;
    cv.width = horiz ? len : 20;
    cv.height = horiz ? 20 : len;
    const g = cv.getContext('2d');
    g.fillStyle = '#141414';
    g.fillRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#49483E';
    g.fillStyle = '#75715E';
    g.font = '10px JetBrains Mono, monospace';
    g.beginPath();
    for (let p = 0; p < len; p += 10) {
      const major = p % 100 === 0, mid = p % 50 === 0;
      const size = major ? 20 : (mid ? 8 : 4);
      // the bottom and right rules grow their ticks from the canvas edge, which
      // for them is the near side rather than the far one
      if (horiz) {
        const y0 = flip ? 0 : 20 - size, y1 = flip ? size : 20;
        g.moveTo(p + 0.5, y0); g.lineTo(p + 0.5, y1);
      } else {
        const x0 = flip ? 0 : 20 - size, x1 = flip ? size : 20;
        g.moveTo(x0, p + 0.5); g.lineTo(x1, p + 0.5);
      }
      if (major && p > 0) {
        if (horiz) g.fillText(String(p), p + 2, flip ? 17 : 8);
        else {
          g.save();
          g.translate(flip ? 17 : 8, p + 2);
          g.rotate(-Math.PI / 2);
          g.fillText(String(p), -String(p).length * 5, 0);
          g.restore();
        }
      }
    }
    g.stroke();
    // cursor position marker, the measurement half of a ruler
    const c = horiz ? cursorCanvas.x : cursorCanvas.y;
    if (c >= 0) {
      g.strokeStyle = '#66D9EF';
      g.beginPath();
      if (horiz) { g.moveTo(c + 0.5, 0); g.lineTo(c + 0.5, 20); }
      else { g.moveTo(0, c + 0.5); g.lineTo(20, c + 0.5); }
      g.stroke();
    }
  }
}

function renderGuides() {
  guidesEl.innerHTML = '';
  guides.forEach((gd, i) => {
    const el = document.createElement('div');
    el.className = 'guide ' + (gd.axis === 'x' ? 'gx' : 'gy');
    if (gd.axis === 'x') el.style.left = gd.pos + 'px';
    else el.style.top = gd.pos + 'px';
    el.title = gd.axis + ' = ' + gd.pos + ' (drag to move, double-click to remove)';
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const move = ev => {
        const r = canvas.getBoundingClientRect();
        gd.pos = Math.round(gd.axis === 'x' ? ev.clientX - r.left : ev.clientY - r.top);
        renderGuides();
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        saveGuides();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      guides.splice(i, 1);
      renderGuides();
      saveGuides();
    });
    guidesEl.appendChild(el);
  });
}

function saveGuides() {
  try { localStorage.setItem('imguistudio.guides', JSON.stringify(guides)); } catch (e) {}
}

// drag out of a ruler to create a guide
for (const [cv, axis] of [[rulerTop, 'y'], [rulerLeft, 'x'],
  [rulerBottom, 'y'], [rulerRight, 'x']]) {
  cv.addEventListener('mousedown', e => {
    e.preventDefault();
    const gd = { axis, pos: 0 };
    guides.push(gd);
    const move = ev => {
      const r = canvas.getBoundingClientRect();
      gd.pos = Math.round(axis === 'x' ? ev.clientX - r.left : ev.clientY - r.top);
      renderGuides();
    };
    const up = ev => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      const r = canvas.getBoundingClientRect();
      const inside = ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top && ev.clientY <= r.bottom;
      if (!inside) guides.pop();   // dropped back on the ruler: discard
      renderGuides();
      saveGuides();
    };
    move(e);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

canvasHost.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  cursorCanvas = { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
  drawRulers();
  const host = canvasHost.getBoundingClientRect();
  coordTip.style.display = 'block';
  coordTip.textContent = cursorCanvas.x + ', ' + cursorCanvas.y;
  // flip to the other side of the cursor near the edges so it stays readable
  const lx = e.clientX - host.left + 14;
  const ly = e.clientY - host.top + 16;
  coordTip.style.left = Math.min(lx, host.width - coordTip.offsetWidth - 4) + 'px';
  coordTip.style.top = Math.min(ly, host.height - coordTip.offsetHeight - 4) + 'px';
  updateHoverStatus(e);
});
canvasHost.addEventListener('mouseleave', () => {
  cursorCanvas = { x: -1, y: -1 };
  coordTip.style.display = 'none';
  drawRulers();
  updateHoverStatus(null);
});

function setRulers(on) {
  showRulers = on;
  document.getElementById('canvasarea').classList.toggle('norulers', !on);
  guidesEl.style.display = on ? '' : 'none';
  document.getElementById('rulerBtn').classList.toggle('on', on);
  requestAnimationFrame(syncCanvasSize);
  try { localStorage.setItem('imguistudio.rulers', on ? '1' : '0'); } catch (e) {}
}

function setGrid(on) {
  showGrid = on;
  document.getElementById('gridBtn').classList.toggle('on', on);
  if (engineReady) Module.ccall('engine_set_grid', null, ['number', 'number'], [on ? 1 : 0, 20]);
  try { localStorage.setItem('imguistudio.grid', on ? '1' : '0'); } catch (e) {}
}

document.getElementById('gridBtn').onclick = () => setGrid(!showGrid);
document.getElementById('rulerBtn').onclick = () => setRulers(!showRulers);

// ---------- hotbar ----------
// Positional slots, auto-assigned. Rebinding is reordering, which is what every
// surveyed tool does instead of a per-slot key-remap UI.

function saveHotbar() {
  try { localStorage.setItem(HOTBAR_KEY, JSON.stringify(hotbar)); } catch (e) {}
}

// Returns false when a full bar has nowhere to put the tool, so the caller can
// say so instead of the click looking like it did nothing.
function pinToHotbar(type, slot) {
  if (slot === undefined) {
    if (hotbar.includes(type)) return true;
    slot = hotbar.indexOf(null);
    if (slot < 0) return false;
  }
  // one slot per tool: a second copy just costs a key for no extra reach
  const dupe = hotbar.indexOf(type);
  if (dupe >= 0 && dupe !== slot) hotbar[dupe] = null;
  hotbar[slot] = type;
  saveHotbar();
  renderPalette();
  return true;
}

function unpin(type) {
  const i = hotbar.indexOf(type);
  if (i >= 0) { hotbar[i] = null; saveHotbar(); renderPalette(); }
}

// ---------- ui rendering ----------

const paletteCount = Object.values(WIDGETS).filter(w => !w.hidden).length;

// Category collapse state persists. A filter force-opens sections that contain
// a match and restores the pre-filter state when cleared, so searching is a
// view and never a mutation.
const CAT_KEY = 'imguistudio.cats';
let catOpen = {};
try { catOpen = JSON.parse(localStorage.getItem(CAT_KEY) || '{}'); } catch (e) {}
for (const c of CATEGORIES) if (catOpen[c] === undefined) catOpen[c] = true;

function saveCats() {
  try { localStorage.setItem(CAT_KEY, JSON.stringify(catOpen)); } catch (e) {}
}

function paletteButton(type, spec) {
  const b = document.createElement('button');
  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = spec.name;
  b.appendChild(lbl);
  b.dataset.type = type;
  const fam = FAMILY_OF[type];
  const slot = hotbar.indexOf(type);
  b.title = (spec.container ? 'Container. ' : '') + 'Click to append, or drag onto the canvas'
    + (fam ? '. Key: ' + fam : '') + (slot >= 0 ? '. Hotbar: ' + HOTBAR_KEYS[slot] : '');
  const badge = slot >= 0 ? HOTBAR_KEYS[slot] : fam;
  if (badge) {
    const k = document.createElement('span');
    k.className = 'kbd';
    if (slot >= 0) k.style.color = 'var(--mk-purple)';
    k.textContent = badge;
    b.appendChild(k);
  }
  b.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    drag = { kind: 'palette', type, started: false, startX: e.clientX, startY: e.clientY, drop: null };
  });
  b.addEventListener('contextmenu', e => {
    e.preventDefault();
    openContextMenu(e, paletteMenu(type, slot >= 0));
  });
  return b;
}

function renderPalette() {
  const host = document.getElementById('palette');
  const term = document.getElementById('filter').value.trim().toLowerCase();
  host.innerHTML = '';

  const matches = ([k, s]) => !s.hidden
    && (!term || s.name.toLowerCase().includes(term) || k.includes(term));

  // pinned first, so the things you use most never need scrolling to
  const pinned = hotbar.filter(t => t && WIDGETS[t] && matches([t, WIDGETS[t]]));
  if (pinned.length) {
    const open = term ? true : catOpen['★ Pinned'] !== false;
    const h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = '<span class="tw"></span><span></span>';
    h.querySelector('.tw').textContent = open ? '▾' : '▸';
    h.lastChild.textContent = '★ Pinned  (' + pinned.length + ')';
    h.style.color = 'var(--mk-purple)';
    h.onclick = () => {
      catOpen['★ Pinned'] = !open;
      saveCats();
      renderPalette();
    };
    host.appendChild(h);
    if (open) for (const t of pinned) host.appendChild(paletteButton(t, WIDGETS[t]));
  }

  for (const cat of CATEGORIES) {
    const entries = Object.entries(WIDGETS).filter(([k, s]) => s.cat === cat && matches([k, s]));
    if (!entries.length) continue;
    // a filter that matched inside a collapsed section force-opens it
    const open = term ? true : catOpen[cat];
    const h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = '<span class="tw"></span><span></span>';
    h.querySelector('.tw').textContent = open ? '▾' : '▸';
    h.lastChild.textContent = cat + '  (' + entries.length + ')';
    h.onclick = () => { catOpen[cat] = !catOpen[cat]; saveCats(); renderPalette(); };
    host.appendChild(h);
    if (!open) continue;
    for (const [type, spec] of entries) host.appendChild(paletteButton(type, spec));
  }
  // the button offers whichever action is further from where you are now
  const anyOpen = CATEGORIES.some(c => catOpen[c]) || catOpen['★ Pinned'] !== false;
  palToggleAll.textContent = anyOpen ? 'collapse all' : 'expand all';
}

const palToggleAll = document.getElementById('palToggleAll');
palToggleAll.onclick = () => {
  const anyOpen = CATEGORIES.some(c => catOpen[c]) || catOpen['★ Pinned'] !== false;
  for (const c of CATEGORIES) catOpen[c] = !anyOpen;
  catOpen['★ Pinned'] = !anyOpen;
  saveCats();
  renderPalette();
};

// ---------- context menus ----------
// Items carry a group id and an order; the renderer sorts by them and inserts a
// separator wherever the group changes. That gives deterministic ordering,
// automatic separators, and destructive-last for free.

const ctxEl = document.getElementById('ctxmenu');
const IMGUI_MANUAL = 'https://pthom.github.io/imgui_manual_online/manual/imgui_manual.html';

function openContextMenu(e, items) {
  ctxEl.innerHTML = '';
  const live = items.filter(Boolean);
  live.sort((a, b) => (a.group || '5').localeCompare(b.group || '5') || (a.order || 0) - (b.order || 0));
  let lastGroup = null;
  for (const it of live) {
    if (it.header) {
      const h = document.createElement('div');
      h.className = 'hdr';
      h.textContent = it.header;
      ctxEl.appendChild(h);
      lastGroup = it.group;
      continue;
    }
    if (lastGroup !== null && it.group !== lastGroup) {
      const s = document.createElement('div');
      s.className = 'sep';
      ctxEl.appendChild(s);
    }
    lastGroup = it.group;
    const row = document.createElement('div');
    row.className = 'mi' + (it.danger ? ' danger' : '');
    if (it.disabled) row.style.opacity = '0.4';
    const l = document.createElement('span');
    l.textContent = it.label;
    row.appendChild(l);
    if (it.key) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = it.key;
      row.appendChild(k);
    }
    if (!it.disabled) {
      row.onclick = () => { closeContextMenu(); it.run(); };
    }
    ctxEl.appendChild(row);
  }
  ctxEl.style.display = 'block';
  // keep it on screen
  const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
  ctxEl.style.left = Math.min(e.clientX, window.innerWidth - w - 6) + 'px';
  ctxEl.style.top = Math.min(e.clientY, window.innerHeight - h - 6) + 'px';
}

function closeContextMenu() { ctxEl.style.display = 'none'; }
document.addEventListener('mousedown', e => {
  if (ctxEl.style.display === 'block' && !ctxEl.contains(e.target)) closeContextMenu();
}, true);
window.addEventListener('blur', closeContextMenu);

// The label promises a page about THIS widget, so resolve the widget's own
// ImGui function and open its declaration (and doc comment) in the pinned
// header. Falls back to the manual only when the function can't be resolved.
function docsUrlFor(type) {
  const entry = Object.entries(parseCpp.schema || {}).find(([, e]) => e.type === type);
  const line = entry && IMGUI_DOC_LINES[entry[0]];
  return line
    ? `https://github.com/ocornut/imgui/blob/${IMGUI_DOC_TAG}/imgui.h#L${line}`
    : IMGUI_MANUAL;
}

function docsItem(type) {
  return {
    group: '9_docs', order: 0,
    label: 'ImGui reference for ' + WIDGETS[type].name,
    run: () => window.open(docsUrlFor(type), '_blank', 'noopener'),
  };
}

function cppSnippet(node) {
  const saved = JSON.stringify(doc.children);
  const savedSel = selectedId;
  doc.children = [JSON.parse(JSON.stringify(node))];
  const code = generateCode();
  doc.children = JSON.parse(saved);
  selectedId = savedSel;
  const body = code.split('\n');
  const a = body.findIndex(l => l.includes('ImGui::Begin('));
  const b = body.findIndex(l => l.includes('ImGui::End()'));
  return body.slice(a + 1, b).map(l => l.replace(/^ {4}/, '')).join('\n');
}

function paletteMenu(type, isPinned) {
  const spec = WIDGETS[type];
  const sel = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  return [
    { group: '1_insert', order: 0, label: 'Insert after selection', key: 'Enter',
      run: () => insertNodeAt(type, dropSiblingAfterSelection()) },
    { group: '1_insert', order: 1, label: 'Insert inside selection',
      disabled: !(sel && isContainer(sel)),
      run: () => insertNodeAt(type, { parentId: sel.id, index: (sel.children || []).length }) },
    { group: '1_insert', order: 2, label: 'Insert at end',
      run: () => insertNodeAt(type, { parentId: 'root', index: doc.children.length }) },
    { group: '3_pin', order: 0,
      label: isPinned ? 'Unpin from hotbar'
        : (hotbar.includes(null) ? 'Pin to hotbar' : 'Pin to hotbar (bar is full)'),
      disabled: !isPinned && !hotbar.includes(null),
      run: () => (isPinned ? unpin(type) : pinToHotbar(type)) },
    { group: '4_copy', order: 0, label: 'Copy ImGui call',
      run: () => navigator.clipboard.writeText(cppSnippet(makeNode(type))) },
    docsItem(type),
  ];
}

// The canvas and hierarchy menus share a spine and differ only in the head,
// which is what every surveyed tool does.
function widgetMenu(node, inTree) {
  const spec = WIDGETS[node.type] || {};
  const parent = findParent(node.id);
  const container = isContainer(node);
  const kids = (node.children || []).length;
  return [
    { group: '1_head', order: 0, label: 'Toggle SameLine join', key: 'J',
      disabled: !parent || parent.children.indexOf(node) === 0,
      run: () => { selectId(node.id); toggleJoin(); } },
    { group: '1_head', order: 1, label: 'Rename', key: 'F2',
      disabled: !(spec.props || []).some(p => p[0] === 'label'),
      run: () => { selectId(node.id); beginInlineEdit(node.id); } },
    { group: '2_structure', order: 0, label: 'Wrap in Group', key: 'Ctrl+G',
      run: () => { selectId(node.id); wrapSelection(); } },
    { group: '2_structure', order: 1, label: 'Unwrap container', key: 'Ctrl+Shift+G',
      disabled: !container,
      run: () => { selectId(node.id); unwrapSelection(); } },
    { group: '3_order', order: 0, label: 'Move up', key: 'Ctrl+Up',
      run: () => { selectId(node.id); reorderSelection(-1, false); } },
    { group: '3_order', order: 1, label: 'Move down', key: 'Ctrl+Down',
      run: () => { selectId(node.id); reorderSelection(1, false); } },
    { group: '5_clip', order: 0, label: 'Cut', key: 'Ctrl+X',
      run: () => { selectId(node.id); cutSelection(); } },
    { group: '5_clip', order: 1, label: 'Copy', key: 'Ctrl+C',
      run: () => { selectId(node.id); copySelection(); } },
    { group: '5_clip', order: 2, label: 'Duplicate', key: 'Ctrl+D',
      run: () => { selectId(node.id); duplicateSelection(); } },
    { group: '6_code', order: 0, label: 'Copy C++ snippet',
      run: () => navigator.clipboard.writeText(cppSnippet(node)) },
    { group: '6_code', order: 1, label: 'Show in generated code',
      run: () => { selectId(node.id); revealInCode(node.id); } },
    { group: '1_head', order: 2, label: 'Go to', key: 'F',
      run: () => { selectId(node.id); focusSelection(); } },
    inTree && container && kids
      ? { group: '7_tree', order: 0, label: 'Select children',
          run: () => selectMany((node.children || []).map(c => c.id)) }

    docsItem(node.type),
    { group: '9z_del', order: 0, label: container && kids ? 'Delete (keep children)' : 'Delete',
      key: 'Del', danger: true,
      run: () => { selectId(node.id); container && kids ? unwrapThenDelete(node.id) : deleteSelection(); } },
    container && kids
      ? { group: '9z_del', order: 1, label: 'Delete subtree', danger: true,
          run: () => { selectId(node.id); deleteSelection(); } }

function backgroundMenu() {
  return [
    { group: '1_paste', order: 0, label: 'Paste', key: 'Ctrl+V',
      disabled: !clipboardNode, run: pasteClipboard },
    { group: '2_select', order: 0, label: 'Select all', key: 'Ctrl+A',
      run: () => selectMany(doc.children.map(c => c.id)) },
    { group: '2_select', order: 1, label: 'Deselect', key: 'Esc',
      run: () => { clearSelection(); refresh(); } },
    { group: '4_view', order: 0, label: (showGrid ? 'Hide' : 'Show') + ' grid',
      run: () => setGrid(!showGrid) },
    { group: '4_view', order: 1, label: (showRulers ? 'Hide' : 'Show') + ' rulers',
      run: () => setRulers(!showRulers) },
    { group: '4_view', order: 2, label: 'Clear guides',

    { group: '6_code', order: 0, label: 'Copy all generated C++',

// remove a container but keep its children, the "Delete (keep children)" case
function unwrapThenDelete(id) {
  const node = findNode(id);
  if (!node) return;
  const parent = findParent(id);
  const idx = parent.children.indexOf(node);
  const kids = node.children || [];
  if (node.sameline && kids[0]) kids[0].sameline = true;
  parent.children.splice(idx, 1, ...kids);
  selectId(kids[0] ? kids[0].id : parent.id);
}

// Same highlighting, but each line is wrapped and tagged with the widget that
// produced it. Highlighting runs per line so a tag can never split a span.
function highlightOwned(src, owners) {
  return src.split('\n').map((line, i) => {
    const id = owners && owners[i];
    const html = highlightCpp(line);
    return id ? `<span class="cline" data-node="${id}">${html}</span>` : html;
  }).join('\n');
}

function revealInCode(id) {
  const pre = document.getElementById('code');
  for (const m of pre.querySelectorAll('.cline.hl')) m.classList.remove('hl');
  const mine = [...pre.querySelectorAll('[data-node]')].filter(m => m.dataset.node === id);
  if (!mine.length) { pre.scrollIntoView({ block: 'nearest' }); return; }
  for (const m of mine) m.classList.add('hl');
  mine[0].scrollIntoView({ block: 'center' });
}

// Containers the user has folded shut. Absent means open, so a new document
// starts fully expanded and nothing has to be seeded.
const treeCollapsed = new Set();
const treeFilterEl = document.getElementById('treeFilter');

function treeRowMatches(node, term) {
  return (node.type + ' ' + (node.label || '')).toLowerCase().includes(term);
}

// A row survives the filter if it matches or anything under it does, so the
// path down to a match stays visible instead of the match appearing orphaned.
function treeSubtreeMatches(node, term) {
  return treeRowMatches(node, term)
    || (node.children || []).some(c => treeSubtreeMatches(c, term));
}

function renderTree() {
  const host = document.getElementById('tree');
  const term = treeFilterEl.value.trim().toLowerCase();
  host.innerHTML = '';
  const emit = (node, parent, index, depth) => {
    if (term && !treeSubtreeMatches(node, term)) return;
    const spec = WIDGETS[node.type] || {};
    const isContainerRow = !!spec.container || node === doc;
    // a filter force-opens containers, the same way it does in the palette
    const open = term ? true : !treeCollapsed.has(node.id);
    const row = document.createElement('div');
    row.className = 'row' + (selection.has(node.id) || node.id === selectedId ? ' selected' : '');
    row.style.paddingLeft = (6 + depth * 12) + 'px';
    row.onclick = e => {
      if (e.shiftKey || e.ctrlKey || e.metaKey) toggleSelected(node.id);
      else selectId(node.id);
    };
    row.oncontextmenu = e => {
      e.preventDefault();
      if (!selection.has(node.id)) selectId(node.id);
      openContextMenu(e, node === doc ? backgroundMenu() : widgetMenu(node, true));
    };

    if (isContainerRow) {
      const c = document.createElement('span');
      c.className = 'box';
      c.textContent = (node.children || []).length ? (open ? '▾' : '▸') : '·';
      c.title = 'Collapse or expand';
      c.onclick = e => {
        e.stopPropagation();
        if (treeCollapsed.has(node.id)) treeCollapsed.delete(node.id);
        else treeCollapsed.add(node.id);
        renderTree();
      };
      row.appendChild(c);
    }

    const t = document.createElement('span');
    t.className = 'wtype';
    t.textContent = node.type;
    row.appendChild(t);

    const l = document.createElement('span');
    l.className = 'wlabel';
    l.textContent = node.label || '';
    row.appendChild(l);

    if (node.sameline && index > 0) {
      const j = document.createElement('span');
      j.className = 'join';
      j.textContent = '⤷';
      j.title = 'joined to previous line (SameLine)';
      row.appendChild(j);
    }

    if (parent) {
      for (const [txt, fn] of [['↑', () => moveNode(node.id, -1)], ['↓', () => moveNode(node.id, 1)], ['✕', () => removeNode(node.id)]]) {
        const b = document.createElement('button');
        b.textContent = txt;
        b.onclick = e => { e.stopPropagation(); fn(); };
        row.appendChild(b);
      }
    }
    host.appendChild(row);
    if (isContainerRow && open) {
      (node.children || []).forEach((c, i) => emit(c, node, i, depth + 1));
    }
  };
  emit(doc, null, 0, 0);
  const sel = host.querySelector('.row.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  treeExpandAll.textContent = treeCollapsed.size ? 'expand all' : 'collapse all';
}

function renderProps() {
  const host = document.getElementById('propbody');
  host.innerHTML = '';
  const node = selectedId ? findNode(selectedId) : null;
  if (!node) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Select a widget in the hierarchy or canvas.';
    host.appendChild(d);
    return;
  }
  const spec = WIDGETS[node.type] || { props: [] };

  const addField = (labelText, input, isSet) => {
    const l = document.createElement('label');
    l.textContent = labelText;
    if (isSet) l.className = 'set';
    host.appendChild(l);
    host.appendChild(input);
  };

  const addHead = text => {
    const h = document.createElement('div');
    h.className = 'prophead';
    h.textContent = text;
    host.appendChild(h);
  };

  // what is selected, said plainly, so the panel is self-explanatory
  const ident = document.createElement('div');
  ident.className = 'propident';
  const nb = document.createElement('b');
  nb.textContent = node === doc ? (doc.label || 'Window') : (node.label || spec.name || node.type);
  ident.appendChild(nb);
  const ns = document.createElement('span');
  ns.textContent = spec.name || node.type;
  ident.appendChild(ns);
  host.appendChild(ident);
  addHead(node === doc ? 'window' : 'properties');

  for (const [key, type, , opts] of spec.props || []) {
    let inp;
    if (type === 'bool') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!node[key];
      inp.onchange = () => { node[key] = inp.checked; refresh(false); };
    } else if (type === 'enum') {
      inp = document.createElement('select');
      for (const o of opts || []) {
        const [text, val] = Array.isArray(o) ? o : [String(o), o];
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = text;
        inp.appendChild(opt);
      }
      inp.value = node[key];
      inp.onchange = () => { node[key] = Number(inp.value); refresh(false); };
    } else if (type === 'int' || type === 'float') {
      inp = document.createElement('input');
      inp.type = 'number';
      inp.step = type === 'int' ? '1' : 'any';
      inp.value = node[key];
      inp.oninput = () => {
        // int props truncate here too, so the preview and the emitted literal
        // can't disagree about a fractional entry
        const v = Number(inp.value);
        node[key] = Number.isFinite(v) ? (type === 'int' ? Math.trunc(v) : v) : 0;
        refresh(false);
      };
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 200;
      inp.value = node[key] ?? '';
      inp.oninput = () => { node[key] = inp.value; refresh(false); };
    }
    addField(key, inp);
  }

  if (node !== doc) {
    addHead('layout');
    const parent = findParent(node.id);
    const first = parent && parent.children.indexOf(node) === 0;
    const t = document.createElement('div');
    t.className = 'toggle' + (node.sameline && !first ? ' on' : '');
    t.innerHTML = '<span class="track"></span><span class="lb"></span>';
    t.querySelector('.lb').textContent = first
      ? 'nothing to join to'
      : (node.sameline ? 'joined to the line above' : 'starts a new line');
    t.title = first
      ? 'The first widget in a container has no previous line to join'
      : 'ImGui::SameLine() puts this widget on the same row as the one before it (J)';
    if (first) t.style.opacity = '0.5';
    // full refresh: normalizeDoc may drop the flag on a first child, and the
    // control has to stop showing it as set
    else t.onclick = () => { node.sameline = !node.sameline; refresh(); };
    addField('SameLine', t, !!node.sameline && !first);
  }

  // ---- colour overrides ----
  const slots = colorSlots(node.type);
  if (!slots.length) return;
  const overridden = slots.filter(s => node.colors && node.colors[s]).length;
  addHead('colors' + (overridden ? ' (' + overridden + ' overridden)' : ''));

  for (const slot of slots) {
    const cur = node.colors && node.colors[slot];
    const row = document.createElement('div');
    row.className = 'colorrow';

    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = cur ? rgbToHex(cur) : defaultHexFor(slot);
    inp.title = 'ImGuiCol_' + slot;
    inp.oninput = () => {
      if (!node.colors) node.colors = {};
      node.colors[slot] = hexToRgb(inp.value);
      refresh(false);
    };
    row.appendChild(inp);

    // the value in the same notation the generated C++ uses
    const hex = document.createElement('span');
    hex.className = 'hex';
    hex.textContent = cur ? rgbToHex(cur).toUpperCase() : 'default';
    row.appendChild(hex);

    if (cur) {
      const clr = document.createElement('button');
      clr.className = 'unset';
      clr.textContent = 'unset';
      clr.title = 'Stop overriding this colour';
      clr.onclick = () => {
        delete node.colors[slot];
        if (!Object.keys(node.colors).length) delete node.colors;
        refresh();
      };
      row.appendChild(clr);
    }

    // an overridden value is marked, so "changed here" is visible at a glance
    addField(slot, row, !!cur);
  }
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
}

function rgbToHex(c) {
  const h = x => Math.round(Math.max(0, Math.min(1, x)) * 255).toString(16).padStart(2, '0');
  return '#' + h(c[0]) + h(c[1]) + h(c[2]);
}

// rough stand-ins for the dark theme so an untouched swatch isn't misleading
const SLOT_DEFAULTS = {
  Text: '#f2f2f2', TextDisabled: '#808080', WindowBg: '#0f0f0f', ChildBg: '#000000',
  PopupBg: '#141414', Border: '#6e6e80', FrameBg: '#294a7a', FrameBgHovered: '#4296fa',
  FrameBgActive: '#4296f0', TitleBg: '#0a0a0a', TitleBgActive: '#294a7a',
  Button: '#4296f0', ButtonHovered: '#4296fa', ButtonActive: '#0f87fa',
  Header: '#4296f0', HeaderHovered: '#4296fa', HeaderActive: '#4296f0',
  CheckMark: '#4296fa', SliderGrab: '#3d85e0', SliderGrabActive: '#4296f0',
  Tab: '#26599e', TabHovered: '#4296fa', PlotLines: '#9c9c9c', PlotHistogram: '#e6b200',
  TableHeaderBg: '#303033',
};
const defaultHexFor = slot => SLOT_DEFAULTS[slot] || '#cccccc';

function renderCode() {
  // while the code pane is being edited it owns the document; regenerating
  // under the user's cursor is the two-writer race the research warns about
  if (codeEditing) return;
  document.getElementById('code').innerHTML = highlightOwned(generateCode(), generateCode.owners);
  // the selection is the same thing in three panes, so the code pane marks it too
  for (const m of document.querySelectorAll('#code .cline')) {
    if (selection.has(m.dataset.node)) m.classList.add('sel');

// ---------- editing the generated C++ ----------

let codeEditing = false;
const parseCpp = createParser(WIDGETS, makeNode, colorSlots);
const codeEl = document.getElementById('code');
const codeEdit = document.getElementById('codeEdit');
const codeStatus = document.getElementById('codeStatus');
const editBtn = document.getElementById('editCodeBtn');
const applyBtn = document.getElementById('applyCodeBtn');
const cancelBtn = document.getElementById('cancelCodeBtn');
const reloadBtn = document.getElementById('reloadCodeBtn');

function setCodeEditing(on) {
  codeEditing = on;
  codeEl.hidden = on;
  document.getElementById('codeEditWrap').hidden = !on;
  codeStatus.hidden = !on;
  editBtn.hidden = on;
  applyBtn.hidden = !on;
  cancelBtn.hidden = !on;
  reloadBtn.hidden = true;   // only offered once the document actually moves on
  if (on) {
    codeEdit.value = generateCode();
    paintCodeEditor();
    const gone = generateCode.skipped || [];
    const lost = gone.reduce((n, s) => n + 1 + s.lost, 0);
    codeStatus.className = gone.length ? 'err' : '';
    codeStatus.textContent = 'Editing the C++. Apply parses it back into the document; '
      + 'anything not recognised as a widget is preserved verbatim and shown as a '
      + 'placeholder. Formatting inside generated blocks is normalised on the way back.'
      + (gone.length
        ? `\nHeads up: ${lost} widget${lost > 1 ? 's' : ''} have no valid C++ form `
          + `(${gone.map(s => s.type + ' — ' + s.reason).join('; ')}). `
          + 'They are only comments here, so applying will remove them.'
        : '');
    codeEdit.focus();
  } else {
    renderCode();
  }
}

// Shown when the canvas moved on while the pane was open. Reloading is offered
// because the alternative — silently overwriting the text — loses C++ edits.
function markCodeStale() {
  if (!codeEditing || codeEdit.value === generateCode()) return;
  codeStatus.className = 'err';
  codeStatus.textContent = 'The document changed on the canvas after this C++ was '
    + 'generated. Applying replaces those changes with the text below. '
    + 'Press Reload to pull the newer document in instead.';
  reloadBtn.hidden = false;
}

editBtn.onclick = () => setCodeEditing(true);
reloadBtn.onclick = () => { setCodeEditing(false); setCodeEditing(true); };
cancelBtn.onclick = () => setCodeEditing(false);

applyBtn.onclick = () => {
  let result;
  try {
    result = parseCpp(codeEdit.value, nextId);
  } catch (err) {
    // never blank the canvas on a parse failure: keep the last good document
    codeStatus.className = 'err';
    codeStatus.textContent = 'Could not parse: ' + err.message
      + '\nThe document is unchanged.';
    return;
  }
  const before = countNodes(doc.children);
  const ids = new Set(['root']);
  nextId = Math.max(nextId, result.nextId);
  const cleaned = sanitize(result.children, ids);
  const after = countNodes(cleaned);
  const raws = countType(cleaned, 'rawcode');

  doc.children = cleaned;
  if (result.windowLabel !== null && result.windowLabel !== undefined) {
    doc.label = result.windowLabel;
  }
  const winCols = sanitizeColors('window', result.windowColors);
  if (winCols) doc.colors = winCols; else delete doc.colors;
  // code the user wrote around the window, kept so Apply never eats it
  if (result.pre) doc.pre = result.pre; else delete doc.pre;
  if (result.post) doc.post = result.post; else delete doc.post;
  clearSelection();
  refresh();

  const notes = result.errors.map(e => '· ' + e.msg);
  codeStatus.className = raws ? '' : 'ok';
  codeStatus.textContent = `Applied. ${before} widgets before, ${after} after`
    + (raws ? `, ${raws} block${raws > 1 ? 's' : ''} kept as raw C++ (preserved, not executed).` : '.')
    + (notes.length ? '\n' + notes.join('\n') : '');
  setCodeEditing(false);
};

function countNodes(list) {
  let n = 0;
  for (const c of list || []) n += 1 + countNodes(c.children);
  return n;
}

function countType(list, type) {
  let n = 0;
  for (const c of list || []) n += (c.type === type ? 1 : 0) + countType(c.children, type);
  return n;
}

// ---------- the C++ editor ----------
// Enough of an IDE to be usable: highlighting under the caret, Tab that
// indents instead of leaving the field, and indentation that follows braces.

const codeEditHl = document.getElementById('codeEditHl');
const codeEditWrap = document.getElementById('codeEditWrap');
const INDENT = '    ';

function paintCodeEditor() {
  // trailing newline keeps the last line's box alive so the two layers agree
  codeEditHl.innerHTML = highlightCpp(codeEdit.value) + '\n';
  codeEditHl.scrollTop = codeEdit.scrollTop;
  codeEditHl.scrollLeft = codeEdit.scrollLeft;
}

codeEdit.addEventListener('input', paintCodeEditor);
codeEdit.addEventListener('scroll', () => {
  codeEditHl.scrollTop = codeEdit.scrollTop;
  codeEditHl.scrollLeft = codeEdit.scrollLeft;
});

// insertText keeps the browser's own undo stack intact, which setRangeText
// throws away. It quietly does nothing when the field isn't really focused,
// so the result is checked rather than the return value trusted.
function replaceRange(from, to, text, selStart, selEnd) {
  const was = codeEdit.value;
  codeEdit.setSelectionRange(from, to);
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok || codeEdit.value === was) codeEdit.setRangeText(text, from, to, 'end');
  if (selStart !== undefined) codeEdit.setSelectionRange(selStart, selEnd === undefined ? selStart : selEnd);
  paintCodeEditor();
}

const lineStartAt = (v, i) => v.lastIndexOf('\n', i - 1) + 1;
const indentOf = line => (line.match(/^[ \t]*/) || [''])[0];

// Returns true when it took the key, which is the signal to stop it going any
// further. Anything it doesn't claim types normally.
function handleCodeEditorKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (e.key === 'Escape') { setCodeEditing(false); e.preventDefault(); return true; }
  const v = codeEdit.value;
  const s = codeEdit.selectionStart, t = codeEdit.selectionEnd;

  if (e.key === 'Tab') {
    e.preventDefault();
    const multi = v.slice(s, t).includes('\n');
    if (!multi && !e.shiftKey) { replaceRange(s, t, INDENT, s + INDENT.length); return true; }
    // block indent or outdent, keeping the whole span selected afterwards
    const from = lineStartAt(v, s);
    const to = v.indexOf('\n', t) === -1 ? v.length : v.indexOf('\n', t);
    const lines = v.slice(from, to).split('\n');
    const out = lines.map(l => {
      if (!e.shiftKey) return INDENT + l;
      if (l.startsWith(INDENT)) return l.slice(INDENT.length);
      return l.replace(/^[ \t]{1,4}/, '');
    });
    const text = out.join('\n');
    replaceRange(from, to, text, from, from + text.length);
    return true;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const ls = lineStartAt(v, s);
    const line = v.slice(ls, s);
    let ind = indentOf(line);
    // opening a block indents the next line, and a closing brace already
    // waiting on the right gets pushed onto its own line below
    const opens = /[{(]\s*$/.test(line.trimEnd());
    const closesNext = /^\s*[}\)]/.test(v.slice(t));
    if (opens) {
      const inner = ind + INDENT;
      if (closesNext) {
        const text = '\n' + inner + '\n' + ind;
        replaceRange(s, t, text, s + 1 + inner.length);
      } else {
        replaceRange(s, t, '\n' + inner, s + 1 + inner.length);
      }
      return true;
    }
    replaceRange(s, t, '\n' + ind, s + 1 + ind.length);
    return true;
  }

  // typing a closing brace pulls its line back out one level
  if (e.key === '}' && s === t) {
    const ls = lineStartAt(v, s);
    const before = v.slice(ls, s);
    if (/^[ \t]+$/.test(before) && before.length >= INDENT.length) {
      e.preventDefault();
      const ind = before.slice(0, before.length - INDENT.length);
      replaceRange(ls, s, ind + '}', ls + ind.length + 1);
      return true;
    }
    return false;
  }

  // Backspace at the head of a line eats a whole indent level
  if (e.key === 'Backspace' && s === t) {
    const ls = lineStartAt(v, s);
    const before = v.slice(ls, s);
    if (before.length && /^[ \t]+$/.test(before) && before.length % INDENT.length === 0) {
      e.preventDefault();
      replaceRange(s - INDENT.length, s, '', s - INDENT.length);
      return true;
    }
  }
  return false;
}

// A sameline flag on a first child is suppressed at render and emit time
// rather than deleted from the model: deleting it meant a transient reorder
// through index 0 silently destroyed the join.

// rebuildProps=false keeps focus in the inspector while typing, and doubles
// as the history coalescing signal: bursty property edits merge into one
// undo step, discrete operations each get their own.
function refresh(rebuildProps = true) {
  renderTree();
  if (rebuildProps) renderProps();
  renderCode();
  pushDoc();
  saveLocal();
  pushHistory(!rebuildProps);
  // The pane holds a snapshot taken when editing started. If the document moves
  // on underneath it, say so: Apply reads the text, so it would otherwise throw
  // away the newer canvas edits without a word.
  if (codeEditing) markCodeStale();
}

document.getElementById('filter').oninput = renderPalette;


document.getElementById('copyBtn').onclick = () => {

// ---------- templates ----------
// Starting points, kept apart from projects: a template is a shape you stamp
// out repeatedly, a project is a thing you are working on.

const TEMPLATES_KEY = 'imguistudio.templates.v1';
const tn = (type, extra) => Object.assign(makeNode(type), extra || {});

function builtinTemplates() {
  const defs = [
    ['Blank window', () => []],
    ['Settings dialog', () => [
      tn('separatortext', { label: 'Display' }),
      tn('checkbox', { label: 'Fullscreen' }),
      tn('checkbox', { label: 'V-Sync' }),
      tn('sliderfloat', { label: 'Brightness' }),
