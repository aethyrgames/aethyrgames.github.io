<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImGuiStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Monokai theme, ported from dougfessler.com */
  :root {
    --mk-bg:      #1e1e1e;
    --mk-surface: #2d2d2d;
    --mk-gutter:  #141414;
    --mk-fg:      #F8F8F2;
    --mk-comment: #75715E;
    --mk-pink:    #F92672;
    --mk-orange:  #FD971F;
    --mk-yellow:  #E6DB74;
    --mk-green:   #A6E22E;
    --mk-cyan:    #66D9EF;
    --mk-purple:  #AE81FF;
    --mk-border:  #49483E;

    --font:   'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --radius: 3px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --glow-chroma:
      0.03em 0 0 rgba(249, 38, 114, 0.35),
      -0.03em 0 0 rgba(102, 217, 239, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    font: 12px/1.45 var(--font); background: var(--mk-bg); color: var(--mk-fg);
  }

  /* Scanlines live only on the header chrome, and as a background layer so
     they paint behind the text rather than over it. The workspace and the
     preview canvas stay completely clean. */
  #apphead {
    height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--mk-border);
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.30) 3px,
        rgba(0,0,0,0.30) 4px
      ),
      var(--mk-gutter);
  }
  .brand {
    color: var(--mk-green); font-weight: 700; font-size: 14px;
    text-shadow: var(--glow-chroma); white-space: nowrap;
  }
  .brand::before { content: '> '; color: var(--mk-comment); }
  .tagline { color: var(--mk-comment); font-size: 11px; }
  #apphead .spacer { flex: 1; }
  .sitelink {
    color: var(--mk-comment); font-size: 11px; text-decoration: none;
    padding: 3px 9px; border: 1px solid var(--mk-border); border-radius: var(--radius);
    transition: color 0.1s, border-color 0.1s;
  }
  .sitelink:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  /* opaque, so nothing from behind can bleed into the panes */
  #workspace { display: flex; flex: 1; min-height: 0; background: var(--mk-bg); }

  h3 {
    margin: 0; padding: 9px 10px 6px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--mk-green);
    border-bottom: 1px solid var(--mk-border); flex-shrink: 0;
  }
  h3::before { content: '/* '; color: var(--mk-comment); text-transform: none; }
  h3::after  { content: ' */'; color: var(--mk-comment); }

  /* ---- dockable panels ---- */
  .dock { display: flex; flex-direction: column; min-height: 0; overflow: hidden; flex-shrink: 0; }
  #dockLeft { width: 280px; border-right: 1px solid var(--mk-border); }
  #dockRight { width: 470px; border-left: 1px solid var(--mk-border); }
  .dock:empty { display: none; }
  .dock:empty + .dockresize, .dockresize:has(+ .dock:empty) { display: none; }
  .dockresize {
    width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent;
  }
  .dockresize:hover, .dockresize.dragging { background: var(--mk-cyan); opacity: 0.5; }

  /* share the dock's height by weight rather than by content size, or the
     palette's long list starves the panels under it */
  .panel {
    display: flex; flex-direction: column; min-height: 0; flex: 1 1 0;
    border-bottom: 1px solid var(--mk-border);
  }
  .panel[data-panel="palette"] { flex-grow: 2.2; }
  .panel[data-panel="hierarchy"] { flex-grow: 1.4; }
  .panel.collapsed { flex: 0 0 auto; }
  .panel.collapsed .panel-body { display: none; }
  .panel-head {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px 6px;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--mk-green);
    border-bottom: 1px solid var(--mk-border); cursor: grab; user-select: none;
    flex-shrink: 0; background: var(--mk-gutter);
  }
  .panel-head:active { cursor: grabbing; }
  .panel-head .tw { color: var(--mk-comment); font-size: 9px; width: 8px; }
  .panel-head .ttl { flex: 1; }
  .panel-head .ttl::before { content: '/* '; color: var(--mk-comment); text-transform: none; }
  .panel-head .ttl::after { content: ' */'; color: var(--mk-comment); }
  .panel-head button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    font-family: var(--font); font-size: 12px; padding: 0 3px; line-height: 1;
  }
  .panel-head button:hover { color: var(--mk-fg); }
  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel.dragging { opacity: 0.4; }

  #dropzone {
    position: fixed; display: none; pointer-events: none; z-index: 30;
    background: rgba(102, 217, 239, 0.16); border: 2px solid var(--mk-cyan);
  }

  /* panels the user hid are relaunchable from here */
  #apphead .panelbtn {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); font-family: var(--font); font-size: 10px;
    padding: 2px 7px; cursor: pointer;
  }
  #apphead .panelbtn:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  #apphead .panelbtn.on { color: var(--mk-green); border-color: var(--mk-green); }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #palette {
    padding: 0 8px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
    overflow-y: auto; flex: 1; min-height: 0; align-content: start;
  }
  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  #propbody {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    display: grid; grid-template-columns: 78px 1fr; gap: 5px; align-content: start;
    align-items: center;
  }
  #filter {
    width: calc(100% - 16px); margin: 6px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    padding: 4px 6px; font-family: var(--font); font-size: 11px;
  }
  #filter:focus { outline: none; border-color: var(--mk-cyan); }
  /* The ellipsis lives on an inner span, not the button: Chrome collapses a
     <button>'s content box to zero height when overflow:hidden is set on the
     button itself, which silently squashes the whole palette. */
  #palette button {
    background: var(--mk-surface); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 6px 4px; cursor: grab; font-size: 11px;
    line-height: 1.4; font-family: var(--font); user-select: none; text-align: center;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  #palette button .lbl {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #palette button:hover {
    background: #3a4a55; color: var(--mk-cyan); border-color: var(--mk-cyan);
  }
  #palette button:active { background: var(--mk-gutter); }

  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  .row {
    display: flex; align-items: center; padding: 2px 8px 2px 6px; cursor: pointer; gap: 5px;
    border-left: 2px solid transparent;
  }
  .row:hover { background: rgba(255,255,255,0.04); }
  .row.selected { background: var(--mk-surface); border-left-color: var(--mk-pink); }
  .row.selected .wlabel { color: var(--mk-pink); }
  .row .wtype { color: var(--mk-cyan); font-size: 10px; opacity: 0.8; flex-shrink: 0; }
  .row .wlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
  .row .join { color: var(--mk-yellow); font-size: 11px; }
  .row .box { color: var(--mk-purple); font-size: 10px; }
  .row button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    padding: 0 2px; font-size: 11px; font-family: var(--font);
  }
  .row button:hover { color: var(--mk-fg); }

  #propbody label { color: var(--mk-comment); font-size: 11px; }
  #propbody input[type=text], #propbody input[type=number], #propbody select {
    background: var(--mk-gutter); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 6px; width: 100%; font-family: var(--font); font-size: 11px;
  }
  #propbody input:focus, #propbody select:focus { outline: none; border-color: var(--mk-cyan); }
  #propbody .empty { grid-column: 1 / 3; color: var(--mk-comment); padding: 6px 0; }
  #propbody .empty::before { content: '// '; }

  input[type=checkbox] { accent-color: var(--mk-green); }

  #toolbar {
    padding: 8px 12px; background: var(--mk-gutter); border-bottom: 1px solid var(--mk-border);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  #toolbar strong { color: var(--mk-green); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  #toolbar label { color: var(--mk-comment); font-size: 11px; }
  #modeHint { color: var(--mk-comment); font-size: 11px; }
  #modeHint b { color: var(--mk-fg); font-weight: 600; }
  #modeHint.livehint { color: var(--mk-green); }
  #modeHint.livehint b { color: var(--mk-green); }
  #toolbar .spacer { flex: 1; }
  #toolbar button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 11px;
    font-family: var(--font); transition: color 0.1s, border-color 0.1s;
  }
  #toolbar button::before { content: '$ '; color: var(--mk-comment); }
  #toolbar button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  /* Rulers frame the canvas; the canvas itself fills whatever is left, and the
     wasm surface is resized to match rather than being a fixed box. */
  #canvasarea {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: 20px 1fr; grid-template-rows: 20px 1fr;
    background: var(--mk-gutter);
  }
  #canvasarea.norulers { grid-template-columns: 0 1fr; grid-template-rows: 0 1fr; }
  #canvasarea.norulers #rulerTop, #canvasarea.norulers #rulerLeft,
  #canvasarea.norulers #rulerCorner { display: none; }
  #rulerCorner { background: var(--mk-gutter); border-right: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border); }
  #rulerTop { border-bottom: 1px solid var(--mk-border); cursor: ns-resize; display: block; }
  #rulerLeft { border-right: 1px solid var(--mk-border); cursor: ew-resize; display: block; }
  #canvashost { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  #canvas { background: var(--mk-gutter); outline: none; display: block; }

  #guides { position: absolute; inset: 0; pointer-events: none; }
  .guide { position: absolute; background: var(--mk-cyan); pointer-events: auto; }
  .guide.gx { top: 0; bottom: 0; width: 1px; cursor: ew-resize; }
  .guide.gy { left: 0; right: 0; height: 1px; cursor: ns-resize; }
  .guide::after {
    content: ''; position: absolute; inset: -3px;
  }
  #marquee {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan); background: rgba(102, 217, 239, 0.10);
  }

  /* ---- hotbar ---- */
  #hotbar {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px;
    border-bottom: 1px solid var(--mk-border); flex-shrink: 0;
  }
  #hotbar:empty { display: none; }
  #hotbar .slot {
    position: relative; display: flex; align-items: center; gap: 4px;
    background: var(--mk-surface); border: 1px solid var(--mk-purple);
    border-radius: var(--radius); padding: 4px 7px 4px 5px; cursor: grab;
    font-size: 10.5px; color: var(--mk-fg); user-select: none; max-width: 100%;
  }
  #hotbar .slot:hover { border-color: var(--mk-cyan); color: var(--mk-cyan); }
  #hotbar .slot.armedbtn { border-color: var(--mk-green); color: var(--mk-green); }
  #hotbar .slot .n {
    color: var(--mk-purple); font-weight: 700; font-size: 10px; min-width: 7px;
  }
  #hotbar .slot .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- collapsible palette sections ---- */
  .cat {
    color: var(--mk-comment); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 4px 3px; cursor: pointer;
    grid-column: 1 / 3; display: flex; align-items: center; gap: 5px;
    user-select: none;
  }
  .cat:hover { color: var(--mk-fg); }
  .cat .tw { font-size: 9px; }
  .cat::before { content: none; }

  /* ---- context menu ---- */
  #ctxmenu {
    position: fixed; display: none; z-index: 40; min-width: 190px; padding: 4px;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow); font-size: 11.5px;
  }
  #ctxmenu .mi {
    display: flex; align-items: center; gap: 10px; padding: 5px 8px;
    border-radius: var(--radius); cursor: pointer; color: var(--mk-fg);
  }
  #ctxmenu .mi:hover { background: rgba(255,255,255,0.07); }
  #ctxmenu .mi.danger { color: var(--mk-pink); }
  #ctxmenu .mi .k { margin-left: auto; color: var(--mk-comment); font-size: 10px; }
  #ctxmenu .sep { height: 1px; background: var(--mk-border); margin: 4px 2px; }
  #ctxmenu .hdr {
    padding: 4px 8px 5px; color: var(--mk-comment); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.07em;
  }

  #selbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan);
    box-shadow: 0 0 0 1px rgba(102, 217, 239, 0.3), 0 0 12px rgba(102, 217, 239, 0.15);
  }
  /* secondary members of a multi-selection: same hue, quieter */
  #selboxes { position: absolute; inset: 0; pointer-events: none; }
  #selboxes .sb {
    position: absolute; border: 1px dashed var(--mk-cyan); opacity: 0.75;
  }
  /* Right / bottom / corner only: the flow cursor pins the left and top edges,
     so a left or top handle would be a control that resists the drag. */
  .rh {
    position: absolute; width: 8px; height: 8px; background: var(--mk-cyan);
    border: 1px solid var(--mk-bg); pointer-events: auto; display: none;
  }
  #selbox.resizable .rh { display: block; }
  #selbox.resizable .rh-r { right: -5px; top: 50%; margin-top: -4px; cursor: ew-resize; }
  #selbox.resizable .rh-b { bottom: -5px; left: 50%; margin-left: -4px; cursor: ns-resize; }
  #selbox.resizable .rh-c { right: -5px; bottom: -5px; cursor: nwse-resize; }
  #selbox.noh .rh, #selbox.now .rh-r, #selbox.now .rh-c { display: none; }
  #selbox.noh .rh-r { display: block; }

  #inlineEdit {
    position: absolute; display: none; z-index: 12; padding: 1px 3px;
    background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-cyan); border-radius: 2px;
    font-family: var(--font); font-size: 12px; outline: none;
  }
  #dropline {
    position: absolute; display: none; pointer-events: none;
    background: var(--mk-yellow);
    box-shadow: 0 0 6px rgba(230, 219, 116, 0.4);
  }
  #dropbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px dashed var(--mk-yellow); background: rgba(230, 219, 116, 0.07);
  }
  #ghost {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: var(--mk-surface); border: 1px solid var(--mk-cyan); border-radius: var(--radius);
    padding: 3px 8px; font-size: 11px; color: var(--mk-fg); box-shadow: var(--shadow);
  }

  #codehead { display: flex; align-items: center; border-bottom: 1px solid var(--mk-border); flex-shrink: 0; }
  #codehead select {
    margin: 4px 0 4px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    font-family: var(--font); font-size: 11px; padding: 3px 6px; cursor: pointer;
  }
  #codehead select:focus { outline: none; border-color: var(--mk-cyan); }
  #codehead button {
    margin: 4px 8px; background: transparent; color: var(--mk-green);
    border: 1px solid var(--mk-green); border-radius: var(--radius);
    padding: 4px 12px; cursor: pointer; font-size: 11px; font-family: var(--font);
    transition: background 0.15s, color 0.15s;
  }
  #codehead button::before { content: '$ '; color: var(--mk-comment); }
  #codehead button:hover { background: var(--mk-green); color: var(--mk-bg); }
  #codehead button:hover::before { color: var(--mk-bg); }

  /* Structural only: colors come from the generated #themeStyle rules */
  #code {
    flex: 1; margin: 0; padding: 12px; overflow: auto; font: 12px/1.5 var(--font);
    white-space: pre; user-select: text;
  }
  #codeEdit {
    flex: 1; margin: 0; padding: 12px; border: none; resize: none;
    font: 12px/1.5 var(--font); white-space: pre; outline: none;
    background: var(--mk-gutter); color: var(--mk-fg);
  }
  #codeEdit:focus { box-shadow: inset 2px 0 0 var(--mk-green); }
  #codeStatus {
    padding: 6px 10px; font-size: 11px; border-top: 1px solid var(--mk-border);
    color: var(--mk-comment); max-height: 32%; overflow-y: auto; white-space: pre-wrap;
  }
  #codeStatus.err { color: var(--mk-pink); }
  #codeStatus.ok { color: var(--mk-green); }

  #status { padding: 4px 12px; font-size: 11px; color: var(--mk-comment); border-top: 1px solid var(--mk-border); }
  #status::before { content: '// '; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mk-border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mk-comment); }

  #palette button { position: relative; }
  #palette button .kbd {
    position: absolute; top: 0; right: 4px; font-size: 9px; color: var(--mk-comment);
  }
  #palette button.armedbtn { color: var(--mk-green); border-color: var(--mk-green); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: flex-start; justify-content: center; z-index: 20;
  }
  .overlay[hidden] { display: none; }
  .overlay-box {
    margin-top: 11vh; width: 500px; max-height: 64vh; display: flex; flex-direction: column;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .overlay-box input {
    margin: 8px; padding: 6px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    font-family: var(--font); font-size: 12px;
  }
  .overlay-box input:focus { outline: none; border-color: var(--mk-cyan); }
  .ov-list { overflow-y: auto; padding: 0 4px 6px; }
  .ov-item {
    display: flex; gap: 8px; padding: 4px 8px; cursor: pointer;
    border-radius: var(--radius); align-items: baseline;
  }
  .ov-item.sel, .ov-item:hover { background: rgba(255, 255, 255, 0.06); }
  .ov-item .k { margin-left: auto; color: var(--mk-comment); font-size: 10px; white-space: nowrap; }
  .ov-cat {
    color: var(--mk-comment); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 8px 2px;
  }
  .ov-cat::before { content: '// '; }
</style>
<style id="themeStyle"></style>
</head>
<body>
  <div id="apphead">
    <span class="brand">ImGuiStudio</span>
    <span class="tagline">// drag widgets, copy the C++</span>
    <span class="spacer"></span>
    <a class="sitelink" href="https://aethyr.gg" target="_blank" rel="noopener">aethyr.gg</a>
  </div>

  <div id="workspace">
    <!-- Panels start in the DOM (not a template) so element lookups elsewhere
         in the script work regardless of init order; buildPanels() wraps each
         one with a header in place and applyLayout() moves them per saved state. -->
    <div class="dock" id="dockLeft">
      <section class="panel" data-panel="palette" data-title="Palette">
        <input type="text" id="filter" placeholder="filter widgets...">
        <div id="hotbar"></div>
        <div id="palette"></div>
      </section>
      <section class="panel" data-panel="hierarchy" data-title="Hierarchy">
        <div id="tree"></div>
      </section>
      <section class="panel" data-panel="properties" data-title="Properties">
        <div id="propbody"></div>
      </section>
    </div>
    <div class="dockresize" id="resizeLeft"></div>

    <div id="center">
      <div id="toolbar">
        <span id="modeHint">hold <b>Space</b> to test interaction</span>
        <span class="spacer"></span>
        <button id="gridBtn" title="Toggle background grid">Grid</button>
        <button id="rulerBtn" title="Toggle rulers and guides">Rulers</button>
        <button id="resetBtn" title="Restore the sample layout">Reset</button>
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      </div>
      <div id="canvasarea">
        <div id="rulerCorner"></div>
        <canvas id="rulerTop"></canvas>
        <canvas id="rulerLeft"></canvas>
        <div id="canvashost">
          <canvas id="canvas" tabindex="0"></canvas>
          <div id="selboxes"></div>
          <div id="selbox">
            <i class="rh rh-r" data-axis="w"></i>
            <i class="rh rh-b" data-axis="h"></i>
            <i class="rh rh-c" data-axis="wh"></i>
          </div>
          <div id="dropbox"></div>
          <div id="dropline"></div>
          <div id="marquee"></div>
          <div id="guides"></div>
          <input id="inlineEdit" type="text" spellcheck="false">
        </div>
      </div>

          <button id="applyCodeBtn" hidden>Apply</button>
