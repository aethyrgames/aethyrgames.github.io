  ];

  return defs.map(([name, build]) => {
    // built from a function so one bad widget type can't take the whole list
    // down at load time
    let built = [];
    try { built = build(); } catch (e) { built = []; }
    const windows = Array.isArray(built)
      ? [win(name, built.filter(n => n && WIDGETS[n.type]))]
      : (built.windows || []).filter(w => w && w.type === 'window');
    let i = 0;
    for (const w of windows) w.id = 'tw' + (i++);
    return {
      id: 'builtin:' + name,
      name,
      builtin: true,
      doc: { type: 'root', children: windows.length ? windows : [win(name, [])] },
    };
  });
}

let templates = [];

function saveTemplates() {
  try {
    const mine = templates.filter(t => !t.builtin);
    localStorage.setItem(TEMPLATES_KEY, JSON.stringify({ v: 1, templates: mine }));
  } catch (e) {}
}

function loadTemplates() {
  let saved = [];
  try {
    const s = JSON.parse(localStorage.getItem(TEMPLATES_KEY) || 'null');
    if (s && Array.isArray(s.templates)) saved = s.templates.filter(t => t && t.doc);
  } catch (e) {}
  templates = builtinTemplates().concat(saved);
}

function applyTemplate(t, asNew) {
  const run = () => {
    if (asNew) { addProject(t.name, t.doc); saveProjects(); return; }
    applyDocData(JSON.parse(JSON.stringify(t.doc)), 100);
    refresh();
  };
  const n = countNodes(doc.children);
  if (!asNew && n > 0) {
    askConfirm(`Replace this document with the "${t.name}" template? `
      + `${n} widget${n > 1 ? 's' : ''} will be discarded. Ctrl+Z undoes it.`, run);
  } else run();
}

// A template is a bundle of widgets, so inserting one means inserting its
// contents at the drop point rather than replacing the document. Applying it as
// a whole document is still there, under the + button.
function templateWidgets(t) {
  const wins = (t.doc && t.doc.children) || [];
  const src = wins.length && wins[0].type === 'window' ? wins[0].children : wins;
  const ids = new Set();
  return sanitize(JSON.parse(JSON.stringify(src || [])), ids, false);
}

// Every window a template carries. An example about showing and hiding windows
// is only an example if all of them come along.
function templateWindows(t) {
  const wins = ((t.doc && t.doc.children) || []).filter(w => w && w.type === 'window');
  const ids = new Set();
  // atRoot, because sanitize drops a window node anywhere else and these are
  // going to the document root. Passing false returned an empty list, so the
  // multi-window branch never ran and only the first window's widgets landed.
  return sanitize(JSON.parse(JSON.stringify(wins)), ids, true);
}

function insertTemplateAt(t, drop) {
  const kids = templateWidgets(t);
  // A template holding an empty window has no widgets to insert. Saying so beats
  // a click that looks broken; opening it as a project is what it is for.
  if (!kids.length) {
    flashStatus(`"${titleCase(t.name)}" has no widgets to insert. `
      + 'Right-click it to open it as its own project.');
    return;
  }
  // A template built around several windows brings all of them, as windows. Its
  // buttons refer to the others by title, so folding it into one container would
  // leave the example pointing at nothing.
  //
  // The same path covers a document with no window at all: a template carries its
  // own, so inserting one can just add it rather than refusing. Before this the
  // insert failed silently, since there was no container to put anything in.
  const wins = templateWindows(t);
  const noWindow = !doc.children.some(n => n.type === 'window');
  if (wins.length > 1 || noWindow) {
    for (const w of wins) doc.children.push(w);
    selectId(wins[0].id);
    refresh();
    flashStatus(wins.length > 1
      ? `Added ${wins.length} windows from "${titleCase(t.name)}".`
      : `Added the window from "${titleCase(t.name)}".`);
    return;
  }
  // Otherwise it lands in a Function container, so the generated code calls it
  // rather than inlining a wall of widgets. It draws nothing of its own, so the
  // canvas looks the same either way, and it can be ungrouped like any other.
  const wrap = Object.assign(makeNode('section'), {
    label: titleCase(t.name), children: kids,
  });
  if (!insertAt(wrap, drop)) return;
  selectId(wrap.id);
  refresh();
}

function insertTemplate(t) {
  insertTemplateAt(t, dropSiblingAfterSelection());
}

// Into the nearest container that can hold it, walking up from the selection the
// same way the palette does, rather than as a sibling of whatever is selected.
function insertTemplateInHost(t) {
  const host = insertHost('section');
  // No host means no window yet, which insertTemplateAt handles by adding the
  // template's own. Returning here instead made the click do nothing at all.
  insertTemplateAt(t, host ? { parentId: host.id, index: (host.children || []).length } : null);
}

function renderTemplates() {
  const host = document.getElementById('tpllist');
  host.innerHTML = '';
  for (const t of templates) {
    const row = document.createElement('div');
    row.className = 'tplrow';
    const n = document.createElement('span');
    n.className = 'tplname';
    n.textContent = titleCase(t.name);
    n.title = (t.builtin ? 'Built in. ' : '')
      + 'Click to insert it into the nearest container of the selection. '
      + 'Drag it onto the canvas to place it, or up and down this list to reorder. '
      + 'Right-click to open it as its own project.';
    n.onclick = () => insertTemplateInHost(t);
    row.appendChild(n);
    const count = document.createElement('span');
    count.className = 'tplcount';
    count.textContent = countNodes(t.doc.children);
    row.appendChild(count);
    const add = document.createElement('button');
    add.textContent = '＋';
    add.title = 'Insert into the nearest container of the selection';
    add.onclick = e => { e.stopPropagation(); insertTemplateInHost(t); };
    row.appendChild(add);
    if (!t.builtin) {
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Delete this template';
      del.onclick = e => {
        e.stopPropagation();
        askConfirm(`Delete the template "${t.name}"?`, () => {
          templates = templates.filter(x => x !== t);
          saveTemplates();
          renderTemplates();
        });
      };
      row.appendChild(del);
    }
    row.dataset.index = String(templates.indexOf(t));
    row.addEventListener('mousedown', e => startTemplateDrag(e, templates.indexOf(t), t));
    row.oncontextmenu = e => {
      e.preventDefault();
      openContextMenu(e, [
        { group: '1', order: 0, label: 'Apply Here', run: () => applyTemplate(t, false) },
        { group: '1', order: 1, label: 'Open as Project', run: () => applyTemplate(t, true) },
        { group: '2', order: 0, label: 'Export Template', run: () => exportTemplates([t]) },
        t.builtin ? null : { group: '9z', order: 0, label: 'Delete', danger: true,
          run: () => { templates = templates.filter(x => x !== t); saveTemplates(); renderTemplates(); } },
      ]);
    };
    host.appendChild(row);
  }
}

function saveCurrentAsTemplate() {
  const firstWin = doc.children.find(n => n.type === 'window');
  const base = ((firstWin && firstWin.label) || 'Template').trim();
  let name = base;
  let i = 2;
  while (templates.some(t => t.name === name)) name = base + ' ' + (i++);
  templates.push({ id: 't' + templates.length + '-' + name, name, doc: JSON.parse(JSON.stringify(doc)) });
  saveTemplates();
  renderTemplates();
}

// ---------- import and export ----------

function downloadJson(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportProject() {
  downloadJson('imguistudio-panel.json', { v: 2, kind: 'project', doc });
}

// Templates get their own file kind so importing one can't be mistaken for
// opening a document, which is why these buttons are separate from Export JSON.
function exportTemplates(list) {
  const mine = (list || templates).filter(t => !t.builtin || list);
  downloadJson('imguistudio-templates.json',
    { v: 1, kind: 'templates', templates: mine.map(t => ({ name: t.name, doc: t.doc })) });
}

function exportEverything() {
  snapshotActive();
  downloadJson('imguistudio-everything.json', {
    v: 1,
    kind: 'everything',
    projects: projects.map(p => ({ name: p.name, doc: p.doc, nextId: p.nextId })),
    templates: templates.filter(t => !t.builtin).map(t => ({ name: t.name, doc: t.doc })),
    layout,
    binds: bindOverrides,
    theme: currentTheme,
  });
}

// One reader for every file kind, so dropping the wrong file tells you what it
// was instead of silently doing nothing.
function importPayload(s) {
  if (!s || typeof s !== 'object') throw new Error('not an ImGuiStudio file');
  if (s.kind === 'templates' || (Array.isArray(s.templates) && !s.projects && !s.doc)) {
    const add = (s.templates || []).filter(t => t && t.doc);
    if (!add.length) throw new Error('no templates in that file');
    for (const t of add) {
      let name = t.name || 'Imported';
      let i = 2;
      while (templates.some(x => x.name === name)) name = (t.name || 'Imported') + ' ' + (i++);
      templates.push({ id: 'ti' + templates.length, name, doc: t.doc });
    }
    saveTemplates();
    renderTemplates();
    return `imported ${add.length} template${add.length > 1 ? 's' : ''}`;
  }
  if (s.kind === 'everything') {
    for (const p of (s.projects || [])) {
      if (p && p.doc) addProject(p.name, p.doc);
    }
    for (const t of (s.templates || [])) {
      if (t && t.doc) templates.push({ id: 'ti' + templates.length, name: t.name || 'Imported', doc: t.doc });
    }
    if (s.binds) { bindOverrides = s.binds; for (const b of KEYMAP) Object.assign(b, b.def, bindOverrides[b.id] || {}); }
    saveTemplates();
    saveProjects();
    renderTemplates();
    return 'imported everything';
  }
  const d = s.doc || s;
  if (!d || (d.type !== 'root' && d.type !== 'window')) throw new Error('not an ImGuiStudio document');
  addProject(d.label || 'Imported', d);
  saveProjects();
  return 'opened as a new project';
}

// ---------- share links ----------
// The document rides in the URL fragment, which never reaches a server. Deflate
// keeps a real panel inside what browsers and chat apps will carry.

function b64urlEncode(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

async function encodeShare(payload) {
  const json = JSON.stringify(payload);
  const raw = new TextEncoder().encode(json);
  if (typeof CompressionStream !== 'function') return 'u' + b64urlEncode(raw);
  const cs = new CompressionStream('deflate-raw');
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();
  return 'z' + b64urlEncode(new Uint8Array(buf));
}

async function decodeShare(code) {
  const bytes = b64urlDecode(code.slice(1));
  if (code[0] === 'u') return JSON.parse(new TextDecoder().decode(bytes));
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}

async function buildShareLink() {
  const code = await encodeShare({ v: 1, doc });
  return location.origin + location.pathname + '#d=' + code;
}

async function copyShareLink() {
  try {
    const url = await buildShareLink();
    await navigator.clipboard.writeText(url);
    flashStatus(url.length > 1800
      ? `Link copied (${url.length} characters, which some chat apps will truncate).`
      : 'Share link copied to the clipboard.');
  } catch (e) {
    flashStatus('Could not build a share link: ' + e.message);
  }
}

// Reads a shared document out of the fragment and opens it as its own project,
// so following a link never overwrites what you were working on.
async function loadSharedFromUrl() {
  const m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m) return false;
  try {
    const payload = await decodeShare(m[1]);
    if (!payload || !payload.doc || (payload.doc.type !== 'root' && payload.doc.type !== 'window')) return false;
    addProject(payload.doc.label || 'Shared', payload.doc);
    saveProjects();
    history.replaceState(null, '', location.pathname + location.search);
    flashStatus('Opened a shared document as a new project.');
    return true;
  } catch (e) {
    flashStatus('That share link could not be read.');
    return false;
  }
}

let flashTimer = null;
function flashStatus(msg) {
  hoverInfoEl.innerHTML = esc(msg);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => updateHoverStatus(null), 6000);
}

// ---------- settings ----------
// The ? overlay lists shortcuts in context and is the fast path. This is the
// deliberate one: every binding at once, plus the view and data switches, in a
// place you'd think to look for them.
const settingsOv = document.getElementById('settingsov');
const settingsBody = document.getElementById('settingsBody');
let settingsTab = 'theme';
let settingsCapture = null;
let captureWas = null;   // the combo in force before listening started

function openSettings(tab) {
  settingsTab = tab || settingsTab;
  settingsOv.hidden = false;
  renderSettings();
}

function closeSettings() {
  // Clearing comes first and is unconditional: any path that hid the panel
  // without going through here used to leave a row armed, and reopening showed
  // it still waiting for a key.
  if (settingsCapture && captureWas) Object.assign(settingsCapture, captureWas);
  settingsCapture = null;
  captureWas = null;
  settingsOv.hidden = true;
}

function setRow(label, controlEl) {
  const row = document.createElement('div');
  row.className = 'set-row';
  const l = document.createElement('span');
  l.textContent = label;
  row.appendChild(l);
  const sp = document.createElement('span');
  sp.className = 'spacer';
  row.appendChild(sp);
  row.appendChild(controlEl);
  return row;
}

function settingsButton(text, onClick) {
  const b = document.createElement('button');
  b.className = 'k';
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

function renderSettings() {
  for (const b of settingsOv.querySelectorAll('.settings-tabs button')) {
    b.classList.toggle('on', b.dataset.tab === settingsTab);
  }
  settingsBody.innerHTML = '';
  if (settingsTab === 'theme') return renderThemeSettings();
  if (settingsTab === 'keys') return renderKeySettings();
  if (settingsTab === 'view') return renderViewSettings();
  return renderDataSettings();
}

// A swatch strip per theme, because a name tells you nothing and these are
// chosen by eye. Clicking a row applies it immediately.
function themeSwatch(t) {
  const s = document.createElement('span');
  s.className = 'swatches';
  for (const slot of ['bg', 'surface', 'green', 'cyan', 'purple', 'pink', 'orange']) {
    const d = document.createElement('i');
    d.style.background = t[slot];
    s.appendChild(d);
  }
  return s;
}

function renderThemeSettings() {
  const hint = document.createElement('div');
  hint.className = 'ov-cat';
  hint.textContent = 'the editor';
  settingsBody.appendChild(hint);

  for (const [key, t] of Object.entries(UI_THEMES)) {
    const row = document.createElement('div');
    row.className = 'set-row themerow' + (key === currentUiTheme ? ' on' : '');
    const l = document.createElement('span');
    l.textContent = t.name;
    row.appendChild(l);
    const sp = document.createElement('span');
    sp.className = 'spacer';
    row.appendChild(sp);
    row.appendChild(themeSwatch(t));
    row.onclick = () => { applyUiTheme(key); renderSettings(); };
    settingsBody.appendChild(row);
  }

  const hint2 = document.createElement('div');
  hint2.className = 'ov-cat';
  hint2.textContent = 'the generated C++';
  settingsBody.appendChild(hint2);
  const sel = document.createElement('select');
  sel.className = 'k';
  for (const [key, t] of Object.entries(THEMES)) {
    const o = document.createElement('option');
    o.value = key;
    o.textContent = t.name;
    sel.appendChild(o);
  }
  sel.value = currentTheme;
  sel.onchange = () => { themeSel.value = sel.value; themeSel.onchange(); };
  settingsBody.appendChild(setRow(titleCase('Syntax theme'), sel));
  const note = document.createElement('div');
  note.className = 'ov-cat';
  note.style.textTransform = 'none';
  note.style.letterSpacing = '0';
  note.textContent = 'The preview keeps ImGui’s own dark style on purpose: '
    + 'it shows what your panel will look like, not what this editor looks like.';
  settingsBody.appendChild(note);
}

// A revert control, shown only where the value has actually been changed.
function revertButton(title, run) {
  const b = document.createElement('button');
  b.className = 'revert';
  b.textContent = '⟲';
  b.title = title;
  b.onclick = e => { e.stopPropagation(); run(); renderSettings(); };
  return b;
}

function renderKeySettings() {
  const hint = document.createElement('div');
  hint.className = 'ov-cat' + (settingsCapture ? ' listening' : '');
  hint.textContent = settingsCapture
    ? 'listening for a key — ' + settingsCapture.help + '  ·  Esc cancels'
    : 'click a shortcut to rebind it';
  settingsBody.appendChild(hint);

  let lastCat = '';
  for (const b of KEYMAP) {
    if (b.cat !== lastCat) {
      lastCat = b.cat;
      const c = document.createElement('div');
      c.className = 'ov-cat';
      c.textContent = b.cat;
      settingsBody.appendChild(c);
    }
    const capturing = settingsCapture === b;
    const k = settingsButton(capturing ? 'press a key' : comboLabel(b), () => {
      startCapture(b);
    });
    if (bindOverrides[b.id]) k.classList.add('custom');
    if (capturing) k.classList.add('capturing');
    const row = setRow(b.help, k);
    row.classList.add('rebindable');
    row.onclick = e => { if (!e.target.closest('.revert')) startCapture(b); };
    if (capturing) row.classList.add('listening');
    // only where it differs from the shipped default
    if (bindOverrides[b.id]) {
      row.insertBefore(revertButton('Restore ' + comboLabel({ ...b, ...b.def }), () => {
        delete bindOverrides[b.id];
        Object.assign(b, { ctrl: false, alt: false, shift: undefined }, b.def);
        try { localStorage.setItem(BINDS_KEY, JSON.stringify(bindOverrides)); } catch (e) {}
      }), k);
    }
    settingsBody.appendChild(row);
  }
  settingsBody.appendChild(setRow('Restore every default',
    settingsButton('reset all', () => { resetBinds(); renderSettings(); })));
}

// Remember what the key was before listening started, so cancelling puts it
// back rather than leaving whatever the row happened to show.
function startCapture(entry) {
  settingsCapture = entry;
  captureWas = { key: entry.key, ctrl: entry.ctrl, alt: entry.alt, shift: entry.shift };
  renderSettings();
}

function cancelCapture() {
  if (!settingsCapture) return;
  if (captureWas) Object.assign(settingsCapture, captureWas);
  settingsCapture = null;
  captureWas = null;
  renderSettings();
}

function renderViewSettings() {
  // each row carries a revert only when it is off its default
  const row = (label, control, changed, restore) => {
    const r = setRow(label, control);
    if (changed) r.insertBefore(revertButton('Restore the default', restore), control);
    settingsBody.appendChild(r);
  };
  row(titleCase('Background grid'),
    settingsButton(showGrid ? 'On' : 'Off', () => { setGrid(!showGrid); renderSettings(); }),
    !showGrid, () => setGrid(true));
  row(titleCase('Rulers and guides'),
    settingsButton(showRulers ? 'On' : 'Off', () => { setRulers(!showRulers); renderSettings(); }),
    !showRulers, () => setRulers(true));
  settingsBody.appendChild(setRow(titleCase('Panel layout'),
    settingsButton('Reset', () => { resetPanelLayout(); renderSettings(); })));
  settingsBody.appendChild(setRow(titleCase('View position'),
    settingsButton('Recentre', () => { resetPan(); })));
  const sel = document.createElement('select');
  sel.className = 'k';
  for (const [key, t] of Object.entries(THEMES)) {
    const o = document.createElement('option');
    o.value = key;
    o.textContent = t.name;
    sel.appendChild(o);
  }
  sel.value = currentTheme;
  sel.onchange = () => { themeSel.value = sel.value; themeSel.onchange(); };
  settingsBody.appendChild(setRow(titleCase('Code syntax theme'), sel));
  settingsBody.appendChild(setRow(titleCase('Editor theme'),
    settingsButton('see Themes', () => { settingsTab = 'theme'; renderSettings(); })));
}

function renderDataSettings() {
  settingsBody.appendChild(setRow(titleCase('This project as JSON'),
    settingsButton('export', () => exportProject())));
  settingsBody.appendChild(setRow(titleCase('Every project and template'),
    settingsButton('export all', () => exportEverything())));
  settingsBody.appendChild(setRow(titleCase('Import a project file'),
    settingsButton('import', () => document.getElementById('importFile').click())));
  settingsBody.appendChild(setRow(titleCase('Shareable link for this document'),
    settingsButton('copy link', () => copyShareLink())));
}

document.getElementById('settingsClose').onclick = closeSettings;
for (const b of settingsOv.querySelectorAll('.settings-tabs button')) {
  b.onclick = () => { settingsTab = b.dataset.tab; renderSettings(); };
}
settingsOv.addEventListener('mousedown', e => {
  if (e.target === settingsOv) {
    // an armed row is the thing you most likely meant to back out of
    if (settingsCapture) cancelCapture();
    else closeSettings();
    return;
  }
  // clicking off a row while listening abandons the capture rather than
  // leaving it armed for the next keystroke
  if (settingsCapture && !e.target.closest('.set-row.listening')) cancelCapture();
});

// While a shortcut row is armed the next key becomes the binding. This listener
// is capture-phase and ahead of the dispatcher so the key can't also fire.
window.addEventListener('keydown', e => {
  if (!settingsCapture) return;
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { cancelCapture(); return; }
  const cand = {
    key: e.key.length === 1 ? e.key.toUpperCase() : e.key,
    ctrl: e.ctrlKey || e.metaKey, alt: e.altKey, shift: e.shiftKey,
  };
  const clash = rebind(settingsCapture, cand);
  settingsCapture = null;
  captureWas = null;
  renderSettings();
  if (clash) {
    const hint = settingsBody.firstChild;
    hint.textContent = comboLabel(cand) + ' is already "' + clash.help + '" under '
      + clash.cat + '. Keys can only be shared inside one group.';
    hint.style.color = 'var(--mk-pink)';
  }
}, true);

// An in-app confirm rather than window.confirm: the native one blocks the whole
// page, which also means it can't be driven by the self-test.
const confirmOv = document.getElementById('confirmov');
const confirmMsg = document.getElementById('confirmMsg');
let confirmAction = null;

function askConfirm(message, onYes) {
  confirmMsg.textContent = message;
  confirmAction = onYes;
  confirmOv.hidden = false;
  document.getElementById('confirmYes').focus();
}

function closeConfirm() { confirmOv.hidden = true; confirmAction = null; }
document.getElementById('confirmNo').onclick = closeConfirm;
document.getElementById('confirmYes').onclick = () => {
  const run = confirmAction;
  closeConfirm();
  if (run) run();
};
confirmOv.addEventListener('mousedown', e => { if (e.target === confirmOv) closeConfirm(); });

function resetDocument() {
  applyDocData(JSON.parse(JSON.stringify(DEFAULT_DOC)), 100);
  // refresh() pushes a history entry, so the reset itself is one Ctrl+Z away
  refresh();
}

document.getElementById('resetBtn').onclick = () => {
  const n = countNodes(doc.children);
  if (!n) { resetDocument(); return; }
  askConfirm(`Replace this document with the sample layout? ${n} widget`
    + `${n > 1 ? 's' : ''} will be discarded. Ctrl+Z undoes it.`, resetDocument);
};

document.getElementById('shareTopBtn').onclick = () => copyShareLink();
document.getElementById('resetViewBtn').onclick = () => resetPan();
zoomLabel = document.getElementById('zoomPctBtn');
document.getElementById('zoomInBtn').onclick = () => zoomStep(1);
document.getElementById('zoomOutBtn').onclick = () => zoomStep(-1);
zoomLabel.onclick = () => zoomTo(1);
zoomLabel.textContent = Math.round(zoom * 100) + '%';

// Ctrl+wheel zooms at the cursor, which is what every canvas tool does. A bare
// wheel pans instead of scrolling the page, since there is nothing to scroll and
// a trapped wheel over the canvas is worse than a useful one.
canvasHost.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zoomStep(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
    return;
  }
  if (e.shiftKey) { e.preventDefault(); panBy(-e.deltaY, 0); return; }
  if (Math.abs(e.deltaY) > 0 || Math.abs(e.deltaX) > 0) {
    e.preventDefault();
    panBy(-e.deltaX, -e.deltaY);
  }
}, { passive: false });
document.getElementById('exportBtn').onclick = () => exportProject();
document.getElementById('shareBtn').onclick = () => copyShareLink();
document.getElementById('settingsBtn').onclick = () => openSettings('keys');

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFile.click();
importFile.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    flashStatus(importPayload(JSON.parse(await file.text())));
  } catch (err) {
    flashStatus('Import failed: ' + err.message);
  }
  e.target.value = '';
};

// Templates get their own pair of buttons. Mixing them with Export JSON meant
// you could not tell from the file whether you were about to open a document
// or add starting points.
document.getElementById('tplSaveBtn').onclick = () => saveCurrentAsTemplate();
document.getElementById('tplExportBtn').onclick = () => exportTemplates();
const importTplFile = document.getElementById('importTplFile');
document.getElementById('tplImportBtn').onclick = () => importTplFile.click();
importTplFile.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    flashStatus(importPayload(JSON.parse(await file.text())));
  } catch (err) {
    flashStatus('Import failed: ' + err.message);
  }
  e.target.value = '';
};

// hooks for the automated self-test (app/main.js --selftest)
window.__test = {
  rects: () => latestRects,
  doc: () => doc,
  // the widgets of the first window: what "the document" used to mean
  widgets: () => (doc.children.find(n => n.type === 'window') || { children: [] }).children,
  windows: () => doc.children.filter(n => n.type === 'window'),
  addWindow: label => {
    const w = Object.assign(makeNode('window'), { label: label || 'Window' });
    doc.children.push(w);
    refresh();
    return w.id;
  },
  setWidgetsIn: (i, kids) => {
    const wins = doc.children.filter(n => n.type === 'window');
    if (wins[i]) { wins[i].children = kids; refresh(); }
  },
  paletteBlocked: type => blockedReason(type),
  resetPanelLayout: () => resetPanelLayout(),
  setWidgets: kids => {
    let win = doc.children.find(n => n.type === 'window');
    if (!win) { win = makeNode('window'); doc.children.push(win); }
    win.children = kids;
    refresh();
  },
  selected: () => selectedId,
  select: id => selectId(id),
  selection: () => [...selection],
  hotbar: () => hotbar.slice(),
  layout: () => JSON.parse(JSON.stringify(layout)),
  guides: () => guides.slice(),
  canvasSize: () => ({ w: canvas.width, h: canvas.height }),
  inlineEditing: () => inlineId !== null,
  ctxOpen: () => document.getElementById('ctxmenu').style.display === 'block',
  handlePos: axis => {
    const h = document.querySelector('#selbox .rh-' + axis)
      || document.querySelector('#selbox .rh[data-axis="' + axis + '"]');
    if (!h || !h.offsetParent) return null;
    const r = h.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  },
  hidePanel: k => { layout.panels[k].hidden = true; applyLayout(); },
  showPanel: k => { layout.panels[k].hidden = false; applyLayout(); },
  // hidden panels are detached from the dock, not just display:none
  panelVisible: k => {
    const el = document.querySelector('.panel[data-panel="' + k + '"]');
    return !!(el && el.offsetParent);
  },
  ctxItems: () => [...document.querySelectorAll('#ctxmenu .mi')].map(x => x.firstChild.textContent),
  docsUrl: type => docsUrlFor(type),
  key: (k, mods = {}) => window.dispatchEvent(new KeyboardEvent('keydown', {
    key: k, ctrlKey: !!mods.ctrl, shiftKey: !!mods.shift, altKey: !!mods.alt, cancelable: true,
  })),
  keyUp: k => window.dispatchEvent(new KeyboardEvent('keyup', { key: k })),
  armed: () => armedType(),
  isLive: () => !editMode,
  histLen: () => history.length,
  overlayOpen: () => !cmdkEl.hidden || !helpEl.hidden,
  widgetTypes: () => Object.keys(WIDGETS).filter(k => !WIDGETS[k].hidden),
  generate: () => generateCode(),
  refresh: () => refresh(),
  selectMany: ids => selectMany(ids),
  // Reset asks first now, so the test drives the dialog the way a user does
  resetDoc: () => {
    document.getElementById('resetBtn').onclick();
    if (!confirmOv.hidden) document.getElementById('confirmYes').click();
  },
  confirmOpen: () => !confirmOv.hidden,
  projects: () => projects.map(p => ({ id: p.id, name: p.name, active: p.id === activeProject })),
  addProject: (name, d) => addProject(name, d).id,
  switchProject: id => switchProject(id),
  // n counts every node including the window; insertable is what a click would
  // actually add, which is the window's children and can be zero
  templates: () => templates.map(t => ({
    name: t.name, builtin: !!t.builtin, n: countNodes(t.doc.children),
    insertable: templateWidgets(t).length,
  })),
  applyTemplate: name => applyTemplate(templates.find(t => t.name === name), false),
  saveTemplate: () => saveCurrentAsTemplate(),
  // the path the UI uses: into the nearest container of the selection
  insertTemplate: name => insertTemplateInHost(
    templates.find(t => t.name.toLowerCase() === String(name).toLowerCase())),
  shareLink: () => buildShareLink(),
  loadShare: async url => {
    const m = /[#&]d=([A-Za-z0-9_-]+)/.exec(url);
    return m ? (await decodeShare(m[1])) : null;
  },
  // reads the live value out of the engine, so live-mode interaction can be
  // asserted rather than eyeballed
  // ImGui works in surface pixels; reported in world units so it can be compared
  // with a document coordinate
  imguiMouse: () => (engineReady ? {
    x: Module.ccall('engine_mouse_x', 'number', [], []) + origin.x,
    y: Module.ccall('engine_mouse_y', 'number', [], []) + origin.y,
    w: Module.ccall('engine_display_w', 'number', [], []),
    h: Module.ccall('engine_display_h', 'number', [], []),
  } : null),
  popupDepth: () => (engineReady ? Module.ccall('engine_popup_depth', 'number', [], []) : -1),
  // the top-left-most vertex the engine drew last frame: negative means part of
  // a window was drawn off the surface, which is what clipping looks like
  minDraw: () => (engineReady ? {
    x: Module.ccall('engine_min_draw_x', 'number', [], []),
    y: Module.ccall('engine_min_draw_y', 'number', [], []),
  } : null),
  widgetFloat: id => (engineReady
    ? Module.ccall('engine_get_float', 'number', ['string'], [id]) : null),
  widgetBool: id => (engineReady
    ? Module.ccall('engine_get_bool', 'number', ['string'], [id]) === 1 : null),
  addGuideAt: (axis, pos) => { guides.push({ axis, pos }); renderGuides(); },
  clearGuides: () => { guides.length = 0; renderGuides(); saveGuides(); },
  // the whole keymap, and a rebind through the same path the settings rows use
  keymap: () => KEYMAP.map(b => ({ id: b.id, ctx: b.ctx, cat: b.cat, help: b.help,
    key: b.key, ctrl: !!b.ctrl, alt: !!b.alt, shift: !!b.shift })),
  rebindById: (id, cand) => {
    const entry = KEYMAP.find(b => b.id === id);
    if (!entry) return 'no such binding';
    const clash = rebind(entry, cand);
    return clash ? (clash.help || 'refused') : null;
  },
  resetBinds: () => { resetBinds(); },
  origin: () => ({ ...origin }),
  bounds: () => contentBounds(),
  snapStep: () => GRID_MINOR,
  // what a click at a world point would select, so z-order can be asserted
  hitAt: (x, y) => { const h = hitTest({ x, y }); return h ? h.id : null; },
  dragState: () => (drag ? { kind: drag.kind, type: drag.type || null,
    started: !!drag.started, drop: drag.drop || null } : null),
  zoom: () => zoom,
  setZoom: z => zoomTo(z),
  zoomAt: (z, x, y) => zoomTo(z, x, y),
  zoomStep: d => zoomStep(d),
  zoomFit: () => zoomToFit(),
  pan: () => ({ ...pan }),
  // a screen point in world coordinates, the conversion every gesture uses
  pointAt: (x, y) => canvasPoint({ clientX: x, clientY: y }),
  gridOn: () => showGrid,
  rulersOn: () => showRulers,
  menu: name => renderMenu(name),
  closeMenu: () => closeMenu(),
  uiThemes: () => Object.keys(UI_THEMES),
  uiTheme: k => UI_THEMES[k],
  setUiTheme: k => applyUiTheme(k),
  currentUiTheme: () => currentUiTheme,
  settingsOpen: () => !settingsOv.hidden,
  openSettings: tab => openSettings(tab),
  treeRows: () => document.querySelectorAll('#tree .row').length,
  setTreeFilter: v => { treeFilterEl.value = v; renderTree(); },
  setFilter: v => { const f = document.getElementById('filter'); f.value = v; renderPalette(); },
  pan: () => ({ ...pan }),
  focusSel: () => focusSelection(),
  hoverText: () => hoverInfoEl.textContent,
  resizing: () => !!resizing,
  dragActive: () => !!drag,
  marqueeActive: () => !!marquee,
  panelDragging: () => !!panelDrag,
  pin: (type, slot) => pinToHotbar(type, slot),
  reorder: d => reorderSelection(d, false),
  wrap: () => wrapSelection(),
  insert: type => insertNodeAt(type, { parentId: 'root', index: doc.children.length }),
  remove: id => removeNode(id),
  helpRowCount: () => {
    const wasOpen = !helpEl.hidden;
    if (!wasOpen) toggleHelp();
    const n = helpList.querySelectorAll('.ov-item').length;
    if (!wasOpen) toggleHelp();
    return n;
  },
  bindableCount: () => KEYMAP.filter(b => b.ctx === 'global' || b.ctx === 'edit').length,
  codeEditorWarning: () => {
    setCodeEditing(true);
    const t = codeStatus.textContent;
    setCodeEditing(false);
    return t;
  },
  rebindTest: (help, cand) => {
    const b = KEYMAP.find(x => x.help === help);
    if (!b) return 'missing';
    const clash = rebind(b, cand);
    return clash ? 'conflict:' + clash.cat : comboLabel(b);
  },
  resetBinds: () => resetBinds(),
  applyCpp: text => {
    setCodeEditing(true);
    codeEdit.value = text;
    paintCodeEditor();
    applyBtn.onclick();
    return document.getElementById('codeStatus').textContent;
  },
  roundTrip: () => {
    const before = generateCode();
    setCodeEditing(true);
    codeEdit.value = before;
    paintCodeEditor();
    applyBtn.onclick();
    return { same: generateCode() === before, before, after: generateCode() };
  },
  addAll: () => {
    // one of every widget type, containers nested so the tree is exercised
    const win = doc.children.find(n => n.type === 'window')
      || doc.children[doc.children.push(makeNode('window')) - 1];
    for (const [type, spec] of Object.entries(WIDGETS)) {
      if (spec.hidden || spec.rootOnly) continue;
      const node = makeNode(type);
      win.children.push(node);
      if (spec.container) node.children.push(makeNode('text'));
    }
    refresh();
    return win.children.length;
  },
  // Arrangements ImGui asserts on. The engine must survive all of these,
  // because an assert aborts the wasm module and kills the preview outright.
  stress: () => {
    const nested = makeNode('menubar');
    nested.children.push(makeNode('menubar'));      // BeginMenuBar inside BeginMenuBar
    const grp = makeNode('group');
    grp.children.push(makeNode('menubar'));         // menu bar off the window root
    const ab = makeNode('arrowbutton'); ab.dir = 99;   // past ImGuiDir_COUNT
    const ab2 = makeNode('arrowbutton'); ab2.dir = -5; // below ImGuiDir_None
    const tbl = makeNode('table'); tbl.cols = 0;    // BeginTable asserts on < 1
    const tbl2 = makeNode('table'); tbl2.cols = 9999;
    const ti = makeNode('tabitem');                 // tab item with no tab bar
    const win = doc.children.find(n => n.type === 'window')
      || doc.children[doc.children.push(makeNode('window')) - 1];
    win.children.push(nested, grp, ab, ab2, tbl, tbl2, ti);
    refresh();
    return win.children.length;
  },
  canvasOrigin: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left, y: r.top };
  },
  // World coordinates to screen, live. The surface starts at `origin` in world
  // terms and the canvas element moves with it, so a caller that adds the canvas
  // rect to a world coordinate is wrong by exactly that offset.
  screenAt: (wx, wy) => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left + (wx - origin.x) * zoom, y: r.top + (wy - origin.y) * zoom };
  },
  screenRect: id => {
    const w = latestRects.find(r => r.id === id);
    if (!w) return null;
    const r = canvas.getBoundingClientRect();
    return { x: r.left + (w.x - origin.x) * zoom, y: r.top + (w.y - origin.y) * zoom,
      w: w.w * zoom, h: w.h * zoom };
  },
  paletteButtonPos: text => {
    for (const b of document.querySelectorAll('#palette button')) {
      // the badge span is part of textContent, so match on the widget name
      if (b.dataset.type && WIDGETS[b.dataset.type].name === text) {
        const r = b.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
    }
    return null;
  },
};

// ---------- init ----------

loadLayout();
buildPanels();
try {
  const hb = JSON.parse(localStorage.getItem(HOTBAR_KEY) || 'null');
  if (Array.isArray(hb)) hb.forEach((t, i) => { if (i < hotbar.length) hotbar[i] = t; });
} catch (e) {}
// a bar that starts empty never gets discovered, so seed it with common widgets
if (!hotbar.some(Boolean)) {
  ['button', 'text', 'checkbox', 'sliderfloat', 'inputtext', 'separator', 'group']
    .forEach((t, i) => { hotbar[i] = t; });
  saveHotbar();
}
try {
  const g = JSON.parse(localStorage.getItem('imguistudio.guides') || '[]');
  if (Array.isArray(g)) guides = g;
} catch (e) {}
renderGuides();
setRulers(localStorage.getItem('imguistudio.rulers') !== '0');
setGrid(localStorage.getItem('imguistudio.grid') !== '0');

renderPalette();
loadProjects();      // adopts the old single-document save on first run
loadTemplates();
renderTemplates();
renderProjectTabs();
refresh();
// the loaded document is the undo floor
pushHistory();
syncCanvasSize();
applyPan();
// a #d= fragment opens as its own project, so a link never eats your work
loadSharedFromUrl();

document.getElementById('filter').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; renderPalette(); e.target.blur(); }
});
</script>
