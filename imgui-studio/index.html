      run: () => { clearSelection(); refresh(); } },
    { group: '4_view', order: 0, label: (showGrid ? 'Hide' : 'Show') + ' grid',
      run: () => setGrid(!showGrid) },
    { group: '4_view', order: 1, label: (showRulers ? 'Hide' : 'Show') + ' rulers',
      run: () => setRulers(!showRulers) },
    { group: '4_view', order: 2, label: 'Clear guides',
      disabled: !guides.length, run: () => { guides = []; renderGuides(); saveGuides(); } },
    { group: '6_code', order: 0, label: 'Copy All C++',
      run: () => navigator.clipboard.writeText(generateCode()) },
    { group: '8_more', order: 0, label: 'All Commands…', key: 'Ctrl+K',
      run: () => openCmdk('all') },
  ];
}

// remove a container but keep its children, the "Delete (keep children)" case
function unwrapThenDelete(id) {
  const node = findNode(id);
  if (!node) return;
  const parent = findParent(id);
  const idx = parent.children.indexOf(node);
  const kids = node.children || [];
  if (node.sameline && kids[0]) kids[0].sameline = true;
  parent.children.splice(idx, 1, ...kids);
  selectId(kids[0] ? kids[0].id : parent.id);
}

// Same highlighting, but each line is wrapped and tagged with the widget that
// produced it. Highlighting runs per line so a tag can never split a span.
function highlightOwned(src, owners) {
  return src.split('\n').map((line, i) => {
    const id = owners && owners[i];
    const html = highlightCpp(line);
    return id ? `<span class="cline" data-node="${id}">${html}</span>` : html;
  }).join('\n');
}

function revealInCode(id) {
  const pre = document.getElementById('code');
  for (const m of pre.querySelectorAll('.cline.hl')) m.classList.remove('hl');
  const mine = [...pre.querySelectorAll('[data-node]')].filter(m => m.dataset.node === id);
  if (!mine.length) { pre.scrollIntoView({ block: 'nearest' }); return; }
  for (const m of mine) m.classList.add('hl');
  mine[0].scrollIntoView({ block: 'center' });
}

// Containers the user has folded shut. Absent means open, so a new document
// starts fully expanded and nothing has to be seeded.
const treeCollapsed = new Set();
const treeFilterEl = document.getElementById('treeFilter');

function treeRowMatches(node, term) {
  return (node.type + ' ' + (node.label || '')).toLowerCase().includes(term);
}

// A row survives the filter if it matches or anything under it does, so the
// path down to a match stays visible instead of the match appearing orphaned.
function treeSubtreeMatches(node, term) {
  return treeRowMatches(node, term)
    || (node.children || []).some(c => treeSubtreeMatches(c, term));
}

// ---------- reordering by drag, in the hierarchy and the templates list ----------
// Both lists share the same shape: press a row, and once the pointer has moved
// far enough an insertion line follows it. The threshold is what lets a plain
// click still mean "select".
const LIST_DRAG_SLOP = 5;
let listDrag = null;
let listDragMoved = false;

function listIndicator() {
  let el = document.getElementById('listline');
  if (!el) {
    el = document.createElement('div');
    el.id = 'listline';
    document.body.appendChild(el);
  }
  return el;
}

function hideListIndicator() {
  const el = document.getElementById('listline');
  if (el) el.style.display = 'none';
}

// Which row the pointer is over, and whether it means before, after, or inside.
function listTargetAt(host, y, selector) {
  const rows = [...host.querySelectorAll(selector)].filter(r => r.offsetParent);
  for (const row of rows) {
    const r = row.getBoundingClientRect();
    if (y < r.top || y > r.bottom) continue;
    const third = r.height / 3;
    const where = y < r.top + third ? 'before' : (y > r.bottom - third ? 'after' : 'into');
    return { row, rect: r, where };
  }
  const last = rows[rows.length - 1];
  return last ? { row: last, rect: last.getBoundingClientRect(), where: 'after' } : null;
}

function showListIndicator(t, indent) {
  const el = listIndicator();
  el.style.display = 'block';
  el.style.left = (t.rect.left + (indent || 0)) + 'px';
  el.style.width = (t.rect.width - (indent || 0)) + 'px';
  if (t.where === 'into') {
    el.classList.add('into');
    el.style.top = t.rect.top + 'px';
    el.style.height = t.rect.height + 'px';
  } else {
    el.classList.remove('into');
    el.style.top = ((t.where === 'before' ? t.rect.top : t.rect.bottom) - 1) + 'px';
    el.style.height = '2px';
  }
}

function startTreeDrag(e, id) {
  if (e.button !== 0 || e.target.tagName === 'BUTTON' || e.target.classList.contains('box')) return;
  listDrag = { kind: 'tree', id, startX: e.clientX, startY: e.clientY };
  listDragMoved = false;
}

function startTemplateDrag(e, index, tpl) {
  if (e.button !== 0 || e.target.tagName === 'BUTTON') return;
  // One gesture, one owner. Arming a canvas drag here as well meant a drag onto
  // the canvas ran both: the ghost and the insertion line showed together, and
  // on release the list reordered and nothing was inserted. This starts as a
  // reorder and is promoted to a canvas drop the moment the pointer leaves the
  // list, which is also the only way to tell the two apart.
  listDrag = { kind: 'template', index, tpl, startX: e.clientX, startY: e.clientY };
  listDragMoved = false;
}

document.addEventListener('mousemove', e => {
  if (!listDrag) return;
  if (!listDragMoved) {
    if (Math.abs(e.clientX - listDrag.startX) + Math.abs(e.clientY - listDrag.startY) < LIST_DRAG_SLOP) return;
    listDragMoved = true;
  }
  if (listDrag.kind === 'tree') {
    const t = listTargetAt(document.getElementById('tree'), e.clientY, '.row');
    listDrag.target = t;
    if (t) showListIndicator(t, t.where === 'into' ? 0 : parseFloat(t.row.style.paddingLeft) || 0);
    else hideListIndicator();
  } else {
    const host = document.getElementById('tpllist');
    const r = host.getBoundingClientRect();
    const outside = e.clientX < r.left || e.clientX > r.right
      || e.clientY < r.top - 8 || e.clientY > r.bottom + 8;
    if (outside) {
      // hand the gesture to the canvas drop path and stop being a reorder
      const tpl = listDrag.tpl;
      hideListIndicator();
      listDrag = null;
      listDragMoved = false;
      if (tpl) {
        drag = { kind: 'template', tpl, started: false,
          startX: e.clientX, startY: e.clientY, drop: null };
      }
      return;
    }
    const t = listTargetAt(host, e.clientY, '.tplrow');
    // a template list is flat, so there is no "inside"
    if (t && t.where === 'into') t.where = e.clientY < t.rect.top + t.rect.height / 2 ? 'before' : 'after';
    listDrag.target = t;
    if (t) showListIndicator(t, 0);
    else hideListIndicator();
  }
});

document.addEventListener('mouseup', () => {
  if (!listDrag) return;
  const d = listDrag;
  listDrag = null;
  hideListIndicator();
  if (!listDragMoved || !d.target) { setTimeout(() => { listDragMoved = false; }, 0); return; }
  if (d.kind === 'tree') {
    const overId = d.target.row.dataset.id;
    const over = overId && findNode(overId);
    if (over && over.id !== d.id && !isAncestor(d.id, over.id)) {
      if (d.target.where === 'into' && isContainer(over)) {
        moveSelectionTo(d.id, { parentId: over.id, index: (over.children || []).length });
      } else {
        const parent = findParent(over.id);
        if (parent) {
          const at = parent.children.indexOf(over) + (d.target.where === 'after' ? 1 : 0);
          moveSelectionTo(d.id, { parentId: parent.id, index: at });
        }
      }
    }
  } else {
    const rows = [...document.querySelectorAll('#tpllist .tplrow')];
    const to = rows.indexOf(d.target.row) + (d.target.where === 'after' ? 1 : 0);
    reorderTemplate(d.index, to);
  }
  // clears after the click event that follows this mouseup
  setTimeout(() => { listDragMoved = false; }, 0);
});

function reorderTemplate(from, to) {
  if (from === to || from + 1 === to) return;
  const [moved] = templates.splice(from, 1);
  templates.splice(to > from ? to - 1 : to, 0, moved);
  saveTemplates();
  renderTemplates();
}

function renderTree() {
  const host = document.getElementById('tree');
  const term = treeFilterEl.value.trim().toLowerCase();
  host.innerHTML = '';
  const emit = (node, parent, index, depth) => {
    if (term && !treeSubtreeMatches(node, term)) return;
    const spec = WIDGETS[node.type] || {};
    const isContainerRow = !!spec.container || node === doc;
    // a filter force-opens containers, the same way it does in the palette
    const open = term ? true : !treeCollapsed.has(node.id);
    const row = document.createElement('div');
    row.className = 'row' + (selection.has(node.id) || node.id === selectedId ? ' selected' : '');
    row.style.paddingLeft = (6 + depth * 12) + 'px';
    row.dataset.id = node.id;
    row.onclick = e => {
      // a drag that moved is not a click
      if (listDragMoved) return;
      if (e.shiftKey || e.ctrlKey || e.metaKey) toggleSelected(node.id);
      else selectId(node.id);
    };
    if (parent) row.addEventListener('mousedown', e => startTreeDrag(e, node.id));
    row.oncontextmenu = e => {
      e.preventDefault();
      if (!selection.has(node.id)) selectId(node.id);
      openContextMenu(e, node === doc ? backgroundMenu() : widgetMenu(node, true));
    };

    if (isContainerRow) {
      const c = document.createElement('span');
      c.className = 'box';
      c.textContent = (node.children || []).length ? (open ? '▾' : '▸') : '·';
      c.title = 'Collapse or expand';
      c.onclick = e => {
        e.stopPropagation();
        if (treeCollapsed.has(node.id)) treeCollapsed.delete(node.id);
        else treeCollapsed.add(node.id);
        renderTree();
      };
      row.appendChild(c);
    }

    const t = document.createElement('span');
    t.className = 'wtype';
    // PascalCase, so the tree reads like the ImGui calls it stands for
    t.textContent = pascalType(node.type);
    t.title = node.type;
    row.appendChild(t);

    const l = document.createElement('span');
    l.className = 'wlabel';
    l.textContent = titleCase(node.label || '');
    row.appendChild(l);

    if (node.sameline && index > 0) {
      const j = document.createElement('span');
      j.className = 'join';
      j.textContent = '⤷';
      j.title = 'joined to previous line (SameLine)';
      row.appendChild(j);
    }

    if (parent) {
      for (const [txt, fn] of [['↑', () => moveNode(node.id, -1)], ['↓', () => moveNode(node.id, 1)], ['✕', () => removeNode(node.id)]]) {
        const b = document.createElement('button');
        b.textContent = txt;
        b.onclick = e => { e.stopPropagation(); fn(); };
        row.appendChild(b);
      }
    }
    host.appendChild(row);
    if (isContainerRow && open) {
      (node.children || []).forEach((c, i) => emit(c, node, i, depth + 1));
    }
  };
  emit(doc, null, 0, 0);
  const sel = host.querySelector('.row.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  // a container with no children has nothing to fold, so it doesn't count
  let foldable = 0;
  walk(doc, n => { if ((n.children || []).length) foldable++; });
  treeCollapseAll.disabled = foldable === 0 || treeCollapsed.size >= foldable;
  treeExpandAll.disabled = treeCollapsed.size === 0;
  syncFilterClear('treeFilter');
}

const treeCollapseAll = document.getElementById('treeCollapseAll');
const treeExpandAll = document.getElementById('treeExpandAll');
treeCollapseAll.onclick = () => {
  walk(doc, n => { if ((n.children || []).length) treeCollapsed.add(n.id); });
  renderTree();
};
treeExpandAll.onclick = () => { treeCollapsed.clear(); renderTree(); };
treeFilterEl.addEventListener('input', renderTree);
treeFilterEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; renderTree(); e.target.blur(); }
  e.stopPropagation();
});

// "Text colored" -> "Text Colored". Small words stay lowercase the way a title
// normally would, except when they lead.
const TITLE_MINOR = new Set(['a', 'an', 'and', 'as', 'at', 'by', 'for', 'in',
  'of', 'on', 'or', 'the', 'to', 'with']);

function titleCase(s) {
  return String(s).split(/\s+/).map((w, i) => {
    if (!w) return w;
    const low = w.toLowerCase();
    if (i > 0 && TITLE_MINOR.has(low)) return low;
    // leave things that are already shouting alone: V-Slider, C++, RGB
    if (w.length > 1 && w === w.toUpperCase()) return w;
    return w[0].toUpperCase() + w.slice(1);
  }).join(' ');
}

// A few keys are abbreviations that don't expand into anything readable.
const LABEL_NAMES = {
  itemw: 'Width', n: 'Components', w: 'W', h: 'H',
  args: 'Arguments', fmt: 'Format', r: 'R', g: 'G', b: 'B',
  // a Function container's label names the generated function, not a caption
  'section.label': 'Name',
};

// "sliderfloat" -> "SliderFloat", from the spec's own name so it matches the
// ImGui function rather than guessing at word boundaries.
function pascalType(type) {
  const spec = WIDGETS[type];
  if (!spec) return type;
  return titleCase(spec.name).replace(/[\s-]+/g, '');
}

// Property keys are camelCase identifiers; the panel shows them as words.
// A property can mean something different on one widget than everywhere else,
// so a type-scoped entry wins over the shared one.
function helpFor(type, key) {
  return PROP_HELP[type + '.' + key] || PROP_HELP[key];
}

function labelFor(key, type) {
  if (type && LABEL_NAMES[type + '.' + key]) return LABEL_NAMES[type + '.' + key];
  if (LABEL_NAMES[key]) return LABEL_NAMES[key];
  if (key.length <= 2) return key.toUpperCase();       // w, h, n
  return titleCase(String(key).replace(/([a-z0-9])([A-Z])/g, '$1 $2'));
}

function renderProps() {
  const host = document.getElementById('propbody');
  host.innerHTML = '';
  const node = selectedId ? findNode(selectedId) : null;
  if (!node) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Select a widget in the hierarchy or canvas.';
    host.appendChild(d);
    return;
  }
  const spec = WIDGETS[node.type] || { props: [] };
  const propDefsAll = spec.props || [];

  // Unreal puts a small revert arrow beside anything that differs from its
  // default. It reads as "this one was touched" without needing a second
  // colour, and it undoes exactly that property rather than the last action.
  const addField = (labelText, input, isSet, restore, help) => {
    const l = document.createElement('label');
    l.textContent = labelText;
    // the name itself when there is nothing better, so an ellipsised label is
    // still readable on hover
    l.title = help || labelText;
    if (help && (input.title === undefined || !input.title)) input.title = help;
    if (isSet) l.className = 'set';
    host.appendChild(l);
    if (restore) {
      const wrap = document.createElement('span');
      wrap.className = 'fieldwrap';
      wrap.appendChild(input);
      const rv = document.createElement('button');
      rv.className = 'revert';
      rv.textContent = '⟲';
      rv.title = 'Reset to the default';
      rv.onclick = () => { restore(); refresh(); };
      wrap.appendChild(rv);
      host.appendChild(wrap);
      return;
    }
    host.appendChild(input);
  };

  // A property counts as changed when it differs from the spec's default.
  const defaultOf = key => (propDefsAll.find(p => p[0] === key) || [])[2];
  const changed = key => {
    const d = defaultOf(key);
    return d !== undefined && String(node[key]) !== String(d);
  };
  const restoreFn = key => () => { node[key] = defaultOf(key); };

  const addHead = text => {
    const h = document.createElement('div');
    h.className = 'prophead';
    h.textContent = text;
    host.appendChild(h);
  };

  // what is selected, said plainly, so the panel is self-explanatory
  const ident = document.createElement('div');
  ident.className = 'propident';
  const nb = document.createElement('b');
  nb.textContent = node === doc ? 'Document' : (node.label || spec.name || node.type);
  ident.appendChild(nb);
  const ns = document.createElement('span');
  ns.textContent = spec.name || node.type;
  ident.appendChild(ns);
  host.appendChild(ident);

  const propDefs = spec.props || [];
  // A widget with no properties of its own (Separator, Spacing, Bullet) had a
  // PROPERTIES heading over nothing at all. Say so instead of ruling off an
  // empty space, and keep the heading only when there is something under it.
  if (propDefs.length) {
    addHead(node === doc ? titleCase('document') : titleCase('properties'));
  } else {
    const none = document.createElement('div');
    none.className = 'empty';
    none.textContent = 'No properties. ' + (spec.name || node.type)
      + ' takes no arguments, so there is nothing to set.';
    host.appendChild(none);
  }
  const byKey = Object.fromEntries(propDefs.map(p => [p[0], p]));

  // One editor for one property. Numeric ones honour the range and unit their
  // spec declares, so a width can't go negative and a duration says "s".
  const editorFor = ([key, type, , opts]) => {
    if (type === 'bool') {
      const inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!node[key];
      inp.onchange = () => { node[key] = inp.checked; refresh(false); };
      return inp;
    }
    if (type === 'enum') {
      const inp = document.createElement('select');
      for (const o of opts || []) {
        const [text, val] = Array.isArray(o) ? o : [String(o), o];
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = titleCase(text);
        inp.appendChild(opt);
      }
      inp.value = node[key];
      inp.onchange = () => { node[key] = Number(inp.value); refresh(false); };
      return inp;
    }
    if (type === 'int' || type === 'float') {
      const meta = (opts && typeof opts === 'object' && !Array.isArray(opts)) ? opts : {};
      const wrap = document.createElement('span');
      wrap.className = 'numwrap';
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = meta.step !== undefined ? meta.step : (type === 'int' ? '1' : 'any');
      if (meta.min !== undefined) inp.min = meta.min;
      if (meta.max !== undefined) inp.max = meta.max;
      inp.value = node[key];
      inp.oninput = () => {
        // int props truncate here too, so the preview and the emitted literal
        // can't disagree about a fractional entry
        let v = Number(inp.value);
        if (!Number.isFinite(v)) v = 0;
        if (type === 'int') v = Math.trunc(v);
        // clamp on the way into the model, not on the way out, so what the
        // preview draws and what the C++ says are the same number
        if (meta.min !== undefined) v = Math.max(meta.min, v);
        if (meta.max !== undefined) v = Math.min(meta.max, v);
        node[key] = v;
        refresh(false);
      };
      inp.onblur = () => { if (String(node[key]) !== inp.value) inp.value = node[key]; };
      wrap.appendChild(inp);
      if (meta.unit) {
        const u = document.createElement('span');
        u.className = 'unit';
        u.textContent = meta.unit;
        wrap.appendChild(u);
      }
      return wrap;
    }
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 200;
    inp.value = node[key] ?? '';
    inp.placeholder = (opts && opts.placeholder) || '';
    inp.oninput = () => { node[key] = inp.value; refresh(false); };
    return inp;
  };

  // Properties that describe one thing sit on one row, the way a vector reads.
  const PAIRS = [['w', 'h'], ['min', 'max']];
  const paired = new Set();
  for (const [a, b] of PAIRS) {
    if (byKey[a] && byKey[b]) { paired.add(a); paired.add(b); }
  }

  for (const def of propDefs) {
    const key = def[0];
    if (paired.has(key)) continue;
    addField(labelFor(key, node.type), editorFor(def), changed(key),
      changed(key) ? restoreFn(key) : null, helpFor(node.type, key));
  }
  for (const [a, b] of PAIRS) {
    if (!byKey[a] || !byKey[b]) continue;
    const row = document.createElement('div');
    row.className = 'vecrow';
    for (const k of [a, b]) {
      const cell = document.createElement('span');
      cell.className = 'veccell';
      const tag = document.createElement('span');
      tag.className = 'vectag';
      tag.textContent = labelFor(k);
      cell.appendChild(tag);
      cell.appendChild(editorFor(byKey[k]));
      row.appendChild(cell);
    }
    const pairChanged = changed(a) || changed(b);
    addField(a === 'w' ? 'Size' : 'Range', row, pairChanged,
      pairChanged ? () => { node[a] = defaultOf(a); node[b] = defaultOf(b); } : null,
      a === 'w' ? PROP_HELP.w : 'The range the control is allowed to produce.');
  }

  if (node !== doc) {
    addHead('layout');
    const parent = findParent(node.id);
    const first = parent && parent.children.indexOf(node) === 0;
    const t = document.createElement('div');
    t.className = 'toggle' + (node.sameline && !first ? ' on' : '');
    t.innerHTML = '<span class="track"></span><span class="lb"></span>';
    t.querySelector('.lb').textContent = first
      ? 'nothing to join to'
      : (node.sameline ? 'joined to the line above' : 'starts a new line');
    t.title = first
      ? 'The first widget in a container has no previous line to join'
      : 'ImGui::SameLine() puts this widget on the same row as the one before it (J)';
    if (first) t.style.opacity = '0.5';
    // full refresh: normalizeDoc may drop the flag on a first child, and the
    // control has to stop showing it as set
    else t.onclick = () => { node.sameline = !node.sameline; refresh(); };
    addField('SameLine', t, !!node.sameline && !first,
      node.sameline && !first ? () => { delete node.sameline; } : null,
      'Puts this widget on the same row as the one before it, via ImGui::SameLine().');
  }

  // ---- colour overrides ----
  const slots = colorSlots(node.type);
  if (!slots.length) return;
  const overridden = slots.filter(s => node.colors && node.colors[s]).length;
  addHead('colors' + (overridden ? ' (' + overridden + ' overridden)' : ''));

  for (const slot of slots) {
    const cur = node.colors && node.colors[slot];
    const row = document.createElement('div');
    row.className = 'colorrow';

    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = cur ? rgbToHex(cur) : defaultHexFor(slot);
    inp.title = 'ImGuiCol_' + slot;
    inp.oninput = () => {
      if (!node.colors) node.colors = {};
      node.colors[slot] = hexToRgb(inp.value);
      refresh(false);
    };
    row.appendChild(inp);

    // the value in the same notation the generated C++ uses
    const hex = document.createElement('span');
    hex.className = 'hex';
    hex.textContent = cur ? rgbToHex(cur).toUpperCase() : 'default';
    row.appendChild(hex);

    if (cur) {
      const clr = document.createElement('button');
      clr.className = 'unset';
      clr.textContent = 'unset';
      clr.title = 'Stop overriding this colour';
      clr.onclick = () => {
        delete node.colors[slot];
        if (!Object.keys(node.colors).length) delete node.colors;
        refresh();
      };
      row.appendChild(clr);
    }

    // an overridden value is marked, so "changed here" is visible at a glance
    addField(slot, row, !!cur, cur ? () => { delete node.colors[slot]; } : null,
      'Overrides ImGuiCol_' + slot + ' for this widget only, as a PushStyleColor/PopStyleColor pair.');
  }
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
}

function rgbToHex(c) {
  const h = x => Math.round(Math.max(0, Math.min(1, x)) * 255).toString(16).padStart(2, '0');
  return '#' + h(c[0]) + h(c[1]) + h(c[2]);
}

function renderCode() {
  // while the code pane is being edited it owns the document; regenerating
  // under the user's cursor is the two-writer race the research warns about
  if (codeEditing) return;
  document.getElementById('code').innerHTML = highlightOwned(generateCode(), generateCode.owners);
  // the selection is the same thing in three panes, so the code pane marks it too
  for (const m of document.querySelectorAll('#code .cline')) {
    if (selection.has(m.dataset.node)) m.classList.add('sel');
  }
}

// ---------- editing the generated C++ ----------

let codeEditing = false;
const parseCpp = createParser(WIDGETS, makeNode, colorSlots);
const codeEl = document.getElementById('code');
const codeEdit = document.getElementById('codeEdit');
const codeStatus = document.getElementById('codeStatus');
const editBtn = document.getElementById('editCodeBtn');
const applyBtn = document.getElementById('applyCodeBtn');
const cancelBtn = document.getElementById('cancelCodeBtn');
const reloadBtn = document.getElementById('reloadCodeBtn');

function setCodeEditing(on) {
  codeEditing = on;
  codeEl.hidden = on;
  document.getElementById('codeEditWrap').hidden = !on;
  codeStatus.hidden = !on;
  editBtn.hidden = on;
  applyBtn.hidden = !on;
  cancelBtn.hidden = !on;
  reloadBtn.hidden = true;   // only offered once the document actually moves on
  if (on) {
    codeEdit.value = generateCode();
    paintCodeEditor();
    const gone = generateCode.skipped || [];
    const lost = gone.reduce((n, s) => n + 1 + s.lost, 0);
    codeStatus.className = gone.length ? 'err' : '';
    codeStatus.textContent = 'Editing the C++. Apply parses it back into the document; '
      + 'anything not recognised as a widget is preserved verbatim and shown as a '
      + 'placeholder. Formatting inside generated blocks is normalised on the way back.'
      + (gone.length
        ? `\nHeads up: ${lost} widget${lost > 1 ? 's' : ''} have no valid C++ form `
          + `(${gone.map(s => s.type + ' — ' + s.reason).join('; ')}). `
          + 'They are only comments here, so applying will remove them.'
        : '');
    codeEdit.focus();
    runCodeIntel();
  } else {
    hideCompletions();
    lintEl.hidden = true;
    sigEl.hidden = true;
    renderCode();
  }
}

// Shown when the canvas moved on while the pane was open. Reloading is offered
// because the alternative — silently overwriting the text — loses C++ edits.
function markCodeStale() {
  if (!codeEditing || codeEdit.value === generateCode()) return;
  codeStatus.className = 'err';
  codeStatus.textContent = 'The document changed on the canvas after this C++ was '
    + 'generated. Applying replaces those changes with the text below. '
    + 'Press Reload to pull the newer document in instead.';
  reloadBtn.hidden = false;
}

editBtn.onclick = () => setCodeEditing(true);
reloadBtn.onclick = () => { setCodeEditing(false); setCodeEditing(true); };
cancelBtn.onclick = () => setCodeEditing(false);

applyBtn.onclick = () => {
  let result;
  try {
    result = parseCpp(codeEdit.value, nextId);
  } catch (err) {
    // never blank the canvas on a parse failure: keep the last good document
    codeStatus.className = 'err';
    codeStatus.textContent = 'Could not parse: ' + err.message
      + '\nThe document is unchanged.';
    return;
  }
  const before = countNodes(doc.children);
  const ids = new Set(['root']);
  nextId = Math.max(nextId, result.nextId);
  const cleaned = sanitize(result.windows, ids, true);
  const after = countNodes(cleaned);
  const raws = countType(cleaned, 'rawcode');

  doc.children = cleaned;
  // code the user wrote around the windows, kept so Apply never eats it
  if (result.pre) doc.pre = result.pre; else delete doc.pre;
  if (result.post) doc.post = result.post; else delete doc.post;
  clearSelection();
  refresh();

  const notes = result.errors.map(e => '· ' + e.msg);
  codeStatus.className = raws ? '' : 'ok';
  codeStatus.textContent = `Applied. ${before} widgets before, ${after} after`
    + (raws ? `, ${raws} block${raws > 1 ? 's' : ''} kept as raw C++ (preserved, not executed).` : '.')
    + (notes.length ? '\n' + notes.join('\n') : '');
  setCodeEditing(false);
};

function countNodes(list) {
  let n = 0;
  for (const c of list || []) n += 1 + countNodes(c.children);
  return n;
}

function countType(list, type) {
  let n = 0;
  for (const c of list || []) n += (c.type === type ? 1 : 0) + countType(c.children, type);
  return n;
}

// ---------- the C++ editor ----------
// Enough of an IDE to be usable: highlighting under the caret, Tab that
// indents instead of leaving the field, and indentation that follows braces.

const codeEditHl = document.getElementById('codeEditHl');
const codeEditWrap = document.getElementById('codeEditWrap');
const INDENT = '    ';

function paintCodeEditor() {
  // trailing newline keeps the last line's box alive so the two layers agree
  codeEditHl.innerHTML = highlightCpp(codeEdit.value) + '\n';
  codeEditHl.scrollTop = codeEdit.scrollTop;
  codeEditHl.scrollLeft = codeEdit.scrollLeft;
}

codeEdit.addEventListener('input', () => { paintCodeEditor(); scheduleCodeIntel(); });
codeEdit.addEventListener('scroll', () => {
  codeEditHl.scrollTop = codeEdit.scrollTop;
  codeEditHl.scrollLeft = codeEdit.scrollLeft;
  if (!complEl.hidden) placeCompletions();
});

// ---------- lint, signature hint and completion ----------
// The point of all three is that this pane is where you hand-write C++ that has
// to survive Apply. Everything unrecognised is preserved, so these read as
// advice rather than as gates: nothing here blocks applying.

const lintEl = document.getElementById('codeLint');
const sigEl = document.getElementById('codeSig');
const complEl = document.getElementById('codeCompl');
const IMGUI_NAMES = Object.keys(IMGUI_DOC_LINES);
let lintDiags = [];
let intelTimer = null;
let compl = null;          // { from, to, items, index }

// Every ImGui call the parser turns into a widget, so the lint can say which
// ones it will instead keep verbatim.
const modelledCalls = new Set(Object.keys(parseCpp.schema || {}));

function scheduleCodeIntel() {
  clearTimeout(intelTimer);
  intelTimer = setTimeout(runCodeIntel, 200);
  updateCompletions();
}

function runCodeIntel() {
  if (!codeEditing) return;
  lintDiags = lintCpp(codeEdit.value, {
    sigs: IMGUI_SIGS, names: IMGUI_NAMES, modelled: modelledCalls,
  });
  renderLint();
  renderSignature();
}

function renderLint() {
  lintEl.innerHTML = '';
  lintEl.hidden = !codeEditing;
  const errs = lintDiags.filter(d => d.level === 'error').length;
  const warns = lintDiags.filter(d => d.level === 'warn').length;
  applyBtn.textContent = errs ? `Apply (${errs} error${errs > 1 ? 's' : ''})` : 'Apply';
  applyBtn.title = errs
    ? 'Applies anyway: anything that cannot be read as a widget is kept verbatim.'
    : 'Parse this C++ back into the document';
  if (!lintDiags.length) {
    const ok = document.createElement('div');
    ok.className = 'lclean';
    ok.textContent = 'No problems found.';
    lintEl.appendChild(ok);
    return;
  }
  const ICON = { error: '✕', warn: '!', info: 'i' };
  for (const d of lintDiags) {
    const row = document.createElement('div');
    row.className = 'ld ' + d.level;
    row.onclick = () => jumpToCodeLine(d.line);
    const ic = document.createElement('span');
    ic.className = 'lic';
    ic.textContent = ICON[d.level];
    const at = document.createElement('span');
    at.className = 'lat';
    at.textContent = d.line + ':' + d.col;
    const msg = document.createElement('span');
    msg.className = 'lmsg';
    msg.textContent = d.msg;
    row.append(ic, at, msg);
    if (d.fix) {
      const fix = document.createElement('button');
      fix.className = 'lfix';
      fix.textContent = d.fix.label;
      fix.onclick = e => { e.stopPropagation(); applyLintFix(d.fix); };
      row.appendChild(fix);
    }
    lintEl.appendChild(row);
  }
  if (lintDiags.more > 0) {
    const more = document.createElement('div');
    more.className = 'lclean';
    more.textContent = `…and ${lintDiags.more} more.`;
    lintEl.appendChild(more);
  }
}

function applyLintFix(fix) {
  codeEdit.focus();
  replaceRange(fix.from, fix.to, fix.text, fix.from + fix.text.length);
  runCodeIntel();
}

function jumpToCodeLine(line) {
  const v = codeEdit.value;
  let at = 0;
  for (let i = 1; i < line; i++) {
    const nl = v.indexOf('\n', at);
    if (nl < 0) break;
    at = nl + 1;
  }
  const end = v.indexOf('\n', at);
  codeEdit.focus();
  codeEdit.setSelectionRange(at, end < 0 ? v.length : end);
  // centre the line rather than leaving it against an edge
  const lh = lineHeightOf();
  codeEdit.scrollTop = Math.max(0, (line - 1) * lh - codeEdit.clientHeight / 2);
  paintCodeEditor();
  renderSignature();
}

let metrics = null;
function editorMetrics() {
  if (metrics) return metrics;
  const probe = document.createElement('span');
  probe.textContent = '0'.repeat(40);
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:13px/1.5 var(--font)';
  document.body.appendChild(probe);
  const r = probe.getBoundingClientRect();
  metrics = { charW: r.width / 40, lineH: r.height };
  probe.remove();
  return metrics;
}
const lineHeightOf = () => editorMetrics().lineH;

function renderSignature() {
  const hit = codeEditing
    ? signatureAt(codeEdit.value, codeEdit.selectionStart, IMGUI_SIGS) : null;
  sigEl.hidden = !hit;
  if (!hit) return;
  // underline the argument the caret is on, so a long list stays readable
  const open = hit.sig.indexOf('(');
  const head = hit.sig.slice(0, open + 1);
  const args = splitSigArgs(hit.sig.slice(open + 1, hit.sig.lastIndexOf(')')));
  sigEl.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = head;
  sigEl.appendChild(b);
  args.forEach((a, i) => {
    const span = document.createElement('span');
    if (i === hit.arg) span.className = 'arg';
    span.textContent = a + (i < args.length - 1 ? ', ' : '');
    sigEl.appendChild(span);
  });
  sigEl.appendChild(document.createTextNode(')' + (hit.note ? '   // ' + hit.note : '')));
}

function splitSigArgs(text) {
  const out = [];
  let d = 0, start = 0;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if ('([{'.includes(c)) d++;
    else if (')]}'.includes(c)) d--;
    else if (c === ',' && !d) { out.push(text.slice(start, i).trim()); start = i + 1; }
  }
  const last = text.slice(start).trim();
  if (last) out.push(last);
  return out;
}

function updateCompletions() {
  if (!codeEditing) return hideCompletions();
  // Only after `ImGui::` or `state.` while typing. Offering something for every
  // three-letter word would put a popup over the code constantly; Ctrl+Space is
  // there for when you do want it on a bare word.
  const hit = completionAt(codeEdit.value, codeEdit.selectionStart,
    { sigs: IMGUI_SIGS, bare: false });
  if (!hit) return hideCompletions();
  // A caret event re-runs this, so the highlighted row has to survive it.
  // Narrowing the word changes the span or the list, and then the top item wins.
  const same = compl && compl.from === hit.from && compl.to === hit.to
    && compl.items.length === hit.items.length;
  compl = { ...hit, index: same ? compl.index : 0 };
  renderCompletions();
}

function renderCompletions() {
  complEl.innerHTML = '';
  complEl.hidden = false;
  compl.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'ci' + (i === compl.index ? ' on' : '');
    const n = document.createElement('span');
    n.className = 'cname';
    n.textContent = it.name;
    row.appendChild(n);
    const sig = document.createElement('span');
    sig.className = 'csig';
    sig.textContent = it.note || it.sig;
    row.appendChild(sig);
    // mousedown, not click: the editor must not lose the caret first
    row.addEventListener('mousedown', e => { e.preventDefault(); compl.index = i; acceptCompletion(); });
    complEl.appendChild(row);
  });
  placeCompletions();
}

function placeCompletions() {
  const { charW, lineH } = editorMetrics();
  const v = codeEdit.value;
  const upto = v.slice(0, compl.from);
  const line = upto.split('\n').length;
  const col = compl.from - (upto.lastIndexOf('\n') + 1);
  const pad = 12;
  let x = pad + col * charW - codeEdit.scrollLeft;
  let y = pad + line * lineH - codeEdit.scrollTop;
  const wrapH = codeEditWrap.clientHeight;
  complEl.style.left = Math.max(0, Math.min(x, codeEditWrap.clientWidth - 240)) + 'px';
  // flip above the caret when there is no room below
  if (y + complEl.offsetHeight > wrapH && y - lineH - complEl.offsetHeight > 0) {
    complEl.style.top = (y - lineH - complEl.offsetHeight) + 'px';
  } else {
    complEl.style.top = Math.max(0, Math.min(y, wrapH - 40)) + 'px';
  }
}

function hideCompletions() {
  compl = null;
  complEl.hidden = true;
}

function moveCompletion(delta) {
  compl.index = (compl.index + delta + compl.items.length) % compl.items.length;
  renderCompletions();
  const on = complEl.querySelector('.ci.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function acceptCompletion() {
  const it = compl.items[compl.index];
  const { from, to, kind, withPrefix } = compl;
  hideCompletions();
  // a function gets its parentheses too, with the caret between them
  const text = kind === 'fn'
    ? (withPrefix ? 'ImGui::' : '') + it.name + '()'
    : it.name;
  const caret = kind === 'fn' ? from + text.length - 1 : from + text.length;
  replaceRange(from, to, text, caret);
  renderSignature();
}

// the caret can also move without an input event
for (const ev of ['keyup', 'click', 'focus']) {
  codeEdit.addEventListener(ev, () => {
    renderSignature();
    if (compl) updateCompletions();
  });
}
codeEdit.addEventListener('blur', hideCompletions);

// insertText keeps the browser's own undo stack intact, which setRangeText
// throws away. It quietly does nothing when the field isn't really focused,
// so the result is checked rather than the return value trusted.
function replaceRange(from, to, text, selStart, selEnd) {
  const was = codeEdit.value;
  codeEdit.setSelectionRange(from, to);
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok || codeEdit.value === was) codeEdit.setRangeText(text, from, to, 'end');
  if (selStart !== undefined) codeEdit.setSelectionRange(selStart, selEnd === undefined ? selStart : selEnd);
  paintCodeEditor();
}

const lineStartAt = (v, i) => v.lastIndexOf('\n', i - 1) + 1;
const indentOf = line => (line.match(/^[ \t]*/) || [''])[0];

// Returns true when it took the key, which is the signal to stop it going any
// further. Anything it doesn't claim types normally.
function handleCodeEditorKey(e) {
  // Ctrl+Space asks for the picker where typing alone would not have offered it
  if ((e.ctrlKey || e.metaKey) && e.key === ' ') {
    e.preventDefault();
    const hit = completionAt(codeEdit.value, codeEdit.selectionStart,
      { sigs: IMGUI_SIGS, bare: true });
    if (hit) { compl = { ...hit, index: 0 }; renderCompletions(); }
    return true;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return false;

  // While the picker is open it owns the arrows, Enter, Tab and Escape. Escape
  // closes the picker only: the editor stays open, which is what you want when
  // the picker appeared while you were mid-word.
  if (compl) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveCompletion(1); return true; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveCompletion(-1); return true; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); acceptCompletion(); return true; }
    if (e.key === 'Escape') { e.preventDefault(); hideCompletions(); return true; }
  }

  if (e.key === 'Escape') { setCodeEditing(false); e.preventDefault(); return true; }
  const v = codeEdit.value;
  const s = codeEdit.selectionStart, t = codeEdit.selectionEnd;

  if (e.key === 'Tab') {
    e.preventDefault();
    const multi = v.slice(s, t).includes('\n');
    if (!multi && !e.shiftKey) { replaceRange(s, t, INDENT, s + INDENT.length); return true; }
    // block indent or outdent, keeping the whole span selected afterwards
    const from = lineStartAt(v, s);
    const to = v.indexOf('\n', t) === -1 ? v.length : v.indexOf('\n', t);
    const lines = v.slice(from, to).split('\n');
    const out = lines.map(l => {
      if (!e.shiftKey) return INDENT + l;
      if (l.startsWith(INDENT)) return l.slice(INDENT.length);
      return l.replace(/^[ \t]{1,4}/, '');
    });
    const text = out.join('\n');
    replaceRange(from, to, text, from, from + text.length);
    return true;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const ls = lineStartAt(v, s);
    const line = v.slice(ls, s);
    let ind = indentOf(line);
    // opening a block indents the next line, and a closing brace already
    // waiting on the right gets pushed onto its own line below
    const opens = /[{(]\s*$/.test(line.trimEnd());
    const closesNext = /^\s*[}\)]/.test(v.slice(t));
    if (opens) {
      const inner = ind + INDENT;
      if (closesNext) {
        const text = '\n' + inner + '\n' + ind;
        replaceRange(s, t, text, s + 1 + inner.length);
      } else {
        replaceRange(s, t, '\n' + inner, s + 1 + inner.length);
      }
      return true;
    }
    replaceRange(s, t, '\n' + ind, s + 1 + ind.length);
    return true;
  }

  // typing a closing brace pulls its line back out one level
  if (e.key === '}' && s === t) {
    const ls = lineStartAt(v, s);
    const before = v.slice(ls, s);
    if (/^[ \t]+$/.test(before) && before.length >= INDENT.length) {
      e.preventDefault();
      const ind = before.slice(0, before.length - INDENT.length);
      replaceRange(ls, s, ind + '}', ls + ind.length + 1);
      return true;
    }
    return false;
  }

  // Backspace at the head of a line eats a whole indent level
  if (e.key === 'Backspace' && s === t) {
    const ls = lineStartAt(v, s);
    const before = v.slice(ls, s);
    if (before.length && /^[ \t]+$/.test(before) && before.length % INDENT.length === 0) {
      e.preventDefault();
      replaceRange(s - INDENT.length, s, '', s - INDENT.length);
      return true;
    }
  }
  return false;
}

// A sameline flag on a first child is suppressed at render and emit time
// rather than deleted from the model: deleting it meant a transient reorder
// through index 0 silently destroyed the join.

// rebuildProps=false keeps focus in the inspector while typing, and doubles
// as the history coalescing signal: bursty property edits merge into one
// undo step, discrete operations each get their own.
function refresh(rebuildProps = true) {
  renderTree();
  if (rebuildProps) renderProps();
  renderCode();
  pushDoc();
  saveLocal();
  pushHistory(!rebuildProps);
  // The pane holds a snapshot taken when editing started. If the document moves
  // on underneath it, say so: Apply reads the text, so it would otherwise throw
  // away the newer canvas edits without a word.
  if (codeEditing) markCodeStale();
}

document.getElementById('filter').oninput = renderPalette;


document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(generateCode());
};

// ---------- templates ----------
// Starting points, kept apart from projects: a template is a shape you stamp
// out repeatedly, a project is a thing you are working on.

const TEMPLATES_KEY = 'imguistudio.templates.v1';
const tn = (type, extra) => Object.assign(makeNode(type), extra || {});

function builtinTemplates() {

  // turn up in at least one of these, since a template is where people look to
  // find out what it can do.
  const win = (label, kids, extra) => Object.assign(
    makeNode('window'), { label, children: kids }, extra || {});
  const sec = (label, kids) => Object.assign(tn('section', { label }), { children: kids });
  const kids = (node, list) => Object.assign(node, { children: list });

  const defs = [
    ['Blank window', () => []],

    // Function containers, units, per-widget width, a colour override, a modal

      sec('Display', [
        tn('checkbox', { label: 'Fullscreen' }),

      ]),

        tn('sliderint', { label: 'Latency', min: 0, max: 200, unit: 'ms', itemw: 160 }),

      tn('button', { label: 'Apply', colors: { Button: [0.15, 0.55, 0.55, 1] } }),

        tn('button', { label: 'Discard' }),
        tn('button', { label: 'Keep editing', sameline: true }),
      ]),
    ]],

    // A SameLine run, a context popup, and Text with format arguments
    ['Toolbar and list', () => [
      tn('button', { label: 'New' }),
      tn('button', { label: 'Open', sameline: true }),
      tn('button', { label: 'Save', sameline: true }),
      kids(tn('popup', { label: 'More', sameline: true }), [

    ['Property inspector', () => [
      kids(tn('table', { label: 'props', cols: 2 }), [

        tn('text', { label: 'Scale' }), tn('sliderfloat', { label: '##scale', min: 0.1, max: 4 }),
        tn('text', { label: 'Tint' }), tn('coloredit', { label: '##tint' }),

        tn('inputint', { label: 'LOD bias' }),
