<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ImGuiStudio</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; display: flex;
    font: 13px "Segoe UI", sans-serif; background: #1b1d21; color: #d6d6d6;
  }
  h3 {
    margin: 0; padding: 8px 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.06em; color: #8a8f98; background: #22252a;
  }
  #left  { width: 260px; min-width: 260px; border-right: 1px solid #2e3238; display: flex; flex-direction: column; }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #right { width: 460px; min-width: 320px; border-left: 1px solid #2e3238; display: flex; flex-direction: column; }

  #palette { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #palette button {
    background: #2a2e35; color: #d6d6d6; border: 1px solid #3a3f47; border-radius: 4px;
    padding: 6px 4px; cursor: grab; font-size: 12px; user-select: none;
  }
  #palette button:hover { background: #34506e; border-color: #4a7bb0; }

  #tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  .row { display: flex; align-items: center; padding: 3px 8px; cursor: pointer; gap: 6px; }
  .row:hover { background: #23262b; }
  .row.selected { background: #2d4a68; }
  .row .wtype { color: #7d94ad; font-size: 11px; min-width: 68px; }
  .row .wlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .join { color: #c8a24a; font-size: 11px; }
  .row button {
    background: none; border: none; color: #8a8f98; cursor: pointer; padding: 0 2px; font-size: 12px;
  }
  .row button:hover { color: #fff; }

  #props { border-top: 1px solid #2e3238; }
  #propbody { padding: 8px 10px; display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; }
  #propbody label { color: #8a8f98; font-size: 12px; }
  #propbody input[type=text], #propbody input[type=number] {
    background: #14161a; color: #d6d6d6; border: 1px solid #3a3f47; border-radius: 3px; padding: 4px 6px; width: 100%;
  }
  #propbody .empty { grid-column: 1 / 3; color: #666c75; padding: 6px 0; }

  #toolbar {
    padding: 8px 12px; background: #22252a; border-bottom: 1px solid #2e3238;
    display: flex; gap: 16px; align-items: center;
  }
  #toolbar .spacer { flex: 1; }
  #toolbar button {
    background: #2a2e35; color: #d6d6d6; border: 1px solid #3a3f47; border-radius: 4px;
    padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: #34506e; border-color: #4a7bb0; }
  #canvashost { flex: 1; overflow: auto; display: flex; }
  /* margin auto centers when there's room and aligns start when overflowing,
     unlike justify-content center which clips the left edge */
  #canvaswrap { position: relative; margin: auto; }
  canvas { background: #101215; outline: none; display: block; }

  #selbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid #5aa2e0; box-shadow: 0 0 0 1px rgba(90, 162, 224, 0.35);
  }
  #dropline {
    position: absolute; display: none; pointer-events: none;
    background: #e0b45a;
  }
  #ghost {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: #34506e; border: 1px solid #4a7bb0; border-radius: 3px;
    padding: 3px 8px; font-size: 12px; color: #e6edf3;
  }

  #codehead { display: flex; align-items: center; }
  #codehead h3 { flex: 1; }
  #codehead button {
    margin: 4px 8px; background: #2a2e35; color: #d6d6d6; border: 1px solid #3a3f47;
    border-radius: 4px; padding: 4px 12px; cursor: pointer;
  }
  #code {
    flex: 1; margin: 0; padding: 12px; overflow: auto; font: 12px Consolas, monospace;
    color: #c9d4e0; white-space: pre; user-select: text;
  }
  #status { padding: 4px 10px; font-size: 11px; color: #6d737c; border-top: 1px solid #2e3238; }
</style>
</head>
<body>
  <div id="left">
    <h3>Palette</h3>
    <div id="palette"></div>
    <h3>Hierarchy</h3>
    <div id="tree"></div>
    <div id="props">
      <h3>Properties</h3>
      <div id="propbody"></div>
    </div>
  </div>

  <div id="center">
    <div id="toolbar">
      <strong>Preview</strong>
      <label><input type="checkbox" id="liveToggle"> Live mode (widgets respond)</label>
      <label><input type="checkbox" id="demoToggle" checked> Show ImGui demo (live mode only)</label>
      <span class="spacer"></span>
      <button id="resetBtn" title="Restore the sample layout">Reset</button>
      <button id="exportBtn">Export JSON</button>
      <button id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
    <div id="canvashost">
      <div id="canvaswrap">
        <canvas id="canvas" tabindex="-1"></canvas>
        <div id="selbox"></div>
        <div id="dropline"></div>
      </div>
    </div>
    <div id="status">engine: loading...</div>
  </div>

  <div id="right">
    <div id="codehead">
      <h3>Generated C++</h3>
      <button id="copyBtn">Copy</button>
    </div>
    <pre id="code"></pre>
  </div>

  <div id="ghost"></div>

<script>
// ---------- document model ----------

const WIDGETS = {
  text:        { name: 'Text',         defLabel: 'Some text' },
  button:      { name: 'Button',       defLabel: 'Click me' },
  checkbox:    { name: 'Checkbox',     defLabel: 'Enable thing' },
  sliderfloat: { name: 'Slider',       defLabel: 'Value', extra: { min: 0, max: 1 } },
  inputtext:   { name: 'Input text',   defLabel: 'Name' },
  coloredit:   { name: 'Color edit',   defLabel: 'Color' },
  separator:   { name: 'Separator',    defLabel: '' },
  progressbar: { name: 'Progress bar', defLabel: 'Progress' },
};

let nextId = 100;
let selectedId = null;

const doc = {
  type: 'window', id: 'root', label: 'My Panel',
  children: [
    { type: 'text',        id: 'n1', label: 'Engine settings' },
    { type: 'separator',   id: 'n2', label: '' },
    { type: 'checkbox',    id: 'n3', label: 'Enable turbo' },
    { type: 'button',      id: 'n4', label: 'Reset', sameline: true },
    { type: 'sliderfloat', id: 'n5', label: 'Speed', min: 0, max: 10 },
    { type: 'inputtext',   id: 'n6', label: 'Preset name' },
    { type: 'coloredit',   id: 'n7', label: 'Tint' },
    { type: 'progressbar', id: 'n8', label: 'Progress' },
  ],
};

const DEFAULT_DOC = JSON.parse(JSON.stringify(doc));
const SAVE_KEY = 'imguistudio.doc.v1';

function saveLocal() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, nextId, doc })); } catch (e) {}
}

function computeNextId() {
  let m = 100;
  for (const n of doc.children) {
    const num = parseInt(String(n.id).replace(/^n/, ''), 10);
    if (!isNaN(num) && num >= m) m = num + 1;
  }
  return m;
}

// Imported documents are untrusted: wrong types or duplicate ids would feed
// the engine json it can't safely read (exceptions are disabled in the wasm).
function sanitizeChildren(arr) {
  if (!Array.isArray(arr)) return [];
  const out = [];
  const ids = new Set();
  for (const n of arr) {
    if (!n || typeof n !== 'object' || typeof n.type !== 'string') continue;
    const c = {
      type: n.type,
      id: typeof n.id === 'string' && n.id && !ids.has(n.id) ? n.id : 'n' + (nextId++),
      label: typeof n.label === 'string' ? n.label.slice(0, 200) : '',
    };
    ids.add(c.id);
    if (n.sameline === true) c.sameline = true;
    for (const k of ['min', 'max']) {
      const v = Number(n[k]);
      if (n[k] !== undefined && Number.isFinite(v)) c[k] = v;
    }
    out.push(c);
  }
  return out;
}

// Replaces the working document in place so existing references stay valid.
function applyDocData(d, savedNextId) {
  doc.label = typeof d.label === 'string' ? d.label.slice(0, 200) : 'My Panel';
  doc.children = sanitizeChildren(d.children);
  nextId = savedNextId || computeNextId();
  selectedId = null;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1 || !s.doc || s.doc.type !== 'window') return false;
    applyDocData(s.doc, s.nextId);
    return true;
  } catch (e) { return false; }
}

function findNode(id) {
  if (id === doc.id) return doc;
  return doc.children.find(n => n.id === id) || null;
}

function makeNode(type) {
  const def = WIDGETS[type];
  return { type, id: 'n' + (nextId++), label: def.defLabel, ...(def.extra || {}) };
}

function addNode(type) {
  const node = makeNode(type);
  doc.children.push(node);
  selectedId = node.id;
  refresh();
}

// drop = { beforeId } | { afterId, sameline: true } | { beforeId: null } (append)
function insertNodeAt(type, drop) {
  const node = makeNode(type);
  applyDrop(node, drop, doc.children.length);
  selectedId = node.id;
  refresh();
}

function moveNodeTo(id, drop) {
  if (drop.beforeId === id || drop.afterId === id) return;
  const i = doc.children.findIndex(n => n.id === id);
  if (i < 0) return;
  const [node] = doc.children.splice(i, 1);
  applyDrop(node, drop, doc.children.length);
  selectedId = id;
  refresh();
}

// Inserts node into doc.children per the drop descriptor. Assumes the node is
// not currently in the array.
function applyDrop(node, drop, fallbackIndex) {
  let index = fallbackIndex;
  let sameline = false;
  if (drop.sameline && drop.afterId) {
    const i = doc.children.findIndex(n => n.id === drop.afterId);
    index = i < 0 ? fallbackIndex : i + 1;
    sameline = true;
  } else if (drop.beforeId) {
    const i = doc.children.findIndex(n => n.id === drop.beforeId);
    index = i < 0 ? fallbackIndex : i;
  }
  if (sameline) node.sameline = true;
  else delete node.sameline;
  doc.children.splice(index, 0, node);
}

function removeNode(id) {
  doc.children = doc.children.filter(n => n.id !== id);
  if (selectedId === id) selectedId = null;
  refresh();
}

function moveNode(id, delta) {
  const i = doc.children.findIndex(n => n.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= doc.children.length) return;
  [doc.children[i], doc.children[j]] = [doc.children[j], doc.children[i]];
  refresh();
}

// ---------- engine bridge ----------

let engineReady = false;
let editMode = true;
let latestRects = [];

function pushDoc() {
  if (!engineReady) return;
  Module.ccall('engine_set_document', null, ['string'], [JSON.stringify(doc)]);
}

var Module = {
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized: () => {
    engineReady = true;
    document.getElementById('status').textContent = 'engine: running (real Dear ImGui via wasm)';
    Module.ccall('engine_show_demo', null, ['number'], [document.getElementById('demoToggle').checked ? 1 : 0]);
    Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
    pushDoc();
  },
};

// ---------- canvas editing ----------

const canvas = document.getElementById('canvas');
const selbox = document.getElementById('selbox');
const dropline = document.getElementById('dropline');
const ghost = document.getElementById('ghost');

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top,
    inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
  };
}

function rectFor(id) {
  return latestRects.find(r => r.id === id);
}

// Later entries are drawn on top, so scan back to front.
function hitTest(p) {
  for (let i = latestRects.length - 1; i >= 0; i--) {
    const r = latestRects[i];
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r;
  }
  return null;
}

function updateSelectionOverlay() {
  const r = editMode && selectedId ? rectFor(selectedId) : null;
  if (!r) { selbox.style.display = 'none'; return; }
  selbox.style.display = 'block';
  selbox.style.left = (r.x - 2) + 'px';
  selbox.style.top = (r.y - 2) + 'px';
  selbox.style.width = (r.w + 4) + 'px';
  selbox.style.height = (r.h + 4) + 'px';
}

function tick() {
  if (engineReady) {
    const raw = Module.ccall('engine_get_rects', 'string', [], []);
    try {
      const payload = JSON.parse(raw);
      latestRects = payload.rects || [];
      // mirror engine state: the demo can be closed via its own titlebar X
      const demoToggle = document.getElementById('demoToggle');
      if (typeof payload.showDemo === 'boolean' && demoToggle.checked !== payload.showDemo) {
        demoToggle.checked = payload.showDemo;
      }
    } catch (e) { latestRects = []; }
    updateSelectionOverlay();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// drag = { kind: 'palette'|'move', type?, nodeId?, started, startX, startY, drop }
let drag = null;

function computeDropTarget(p) {
  if (!p.inside) return null;
  // right-half zone joins onto that widget's line
  for (const n of doc.children) {
    if (drag.kind === 'move' && n.id === drag.nodeId) continue;
    const r = rectFor(n.id);
    if (!r) continue;
    if (p.x >= r.x + r.w * 0.55 && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      return { afterId: n.id, sameline: true };
    }
  }
  for (const n of doc.children) {
    if (drag.kind === 'move' && n.id === drag.nodeId) continue;
    const r = rectFor(n.id);
    if (!r) continue;
    if (p.y < r.y + r.h / 2) return { beforeId: n.id };
  }
  return { beforeId: null }; // append
}

function updateDropIndicator() {
  const drop = drag && drag.drop;
  if (!drop) { dropline.style.display = 'none'; return; }
  const wr = latestRects.find(r => r.window);
  if (!wr) { dropline.style.display = 'none'; return; }
  dropline.style.display = 'block';
  if (drop.sameline) {
    const r = rectFor(drop.afterId);
    dropline.style.left = (r.x + r.w + 2) + 'px';
    dropline.style.top = r.y + 'px';
    dropline.style.width = '2px';
    dropline.style.height = r.h + 'px';
    return;
  }
  let y;
  if (drop.beforeId) {
    y = rectFor(drop.beforeId).y - 2;
  } else {
    let last = null;
    for (const n of doc.children) {
      if (drag.kind === 'move' && n.id === drag.nodeId) continue;
      last = rectFor(n.id) || last;
    }
    y = last ? last.y + last.h + 2 : wr.y + 34;
  }
  dropline.style.left = (wr.x + 8) + 'px';
  dropline.style.top = y + 'px';
  dropline.style.width = (wr.w - 16) + 'px';
  dropline.style.height = '2px';
}

canvas.addEventListener('mousedown', e => {
  if (!editMode || e.button !== 0) return;
  const hit = hitTest(canvasPoint(e));
  if (hit) {
    selectedId = hit.id;
    refresh();
    if (!hit.window) {
      drag = { kind: 'move', nodeId: hit.id, started: false, startX: e.clientX, startY: e.clientY, drop: null };
    }
  } else {
    selectedId = null;
    refresh();
  }
});

function cancelDrag() {
  drag = null;
  ghost.style.display = 'none';
  dropline.style.display = 'none';
}

document.addEventListener('mousemove', e => {
  if (!drag) return;
  // A mouseup lost to focus stealing would leave a started drag armed forever.
  // Synthetic click sequences (test drivers, extensions) can emit buttons=0
  // moves between down and up, so only started drags cancel here; blur and
  // Escape cover the un-started case.
  if (drag.started && e.buttons === 0) { cancelDrag(); return; }
  if (!drag.started) {
    if (Math.abs(e.clientX - drag.startX) + Math.abs(e.clientY - drag.startY) < 5) return;
    drag.started = true;
    const label = drag.kind === 'palette' ? WIDGETS[drag.type].name : (findNode(drag.nodeId)?.label || drag.nodeId);
    ghost.textContent = label;
    ghost.style.display = 'block';
  }
  ghost.style.left = (e.clientX + 14) + 'px';
  ghost.style.top = (e.clientY + 14) + 'px';
  drag.drop = computeDropTarget(canvasPoint(e));
  updateDropIndicator();
});

document.addEventListener('mouseup', e => {
  if (!drag) return;
  if (e.button !== 0) { cancelDrag(); return; }
  const d = drag;
  cancelDrag();
  if (!d.started) {
    if (d.kind === 'palette') addNode(d.type);
    return;
  }
  if (!d.drop) return;
  if (d.kind === 'palette') insertNodeAt(d.type, d.drop);
  else moveNodeTo(d.nodeId, d.drop);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drag) cancelDrag();
});

window.addEventListener('blur', () => {
  if (drag) cancelDrag();
});

// ---------- code generation ----------

function pascal(s, fallback) {
  const words = (s || '').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!words.length || /^[0-9]/.test(words[0])) return fallback;
  return words.map(w => w[0].toUpperCase() + w.slice(1)).join('');
}

function camel(s, fallback) {
  const p = pascal(s, fallback);
  return p[0].toLowerCase() + p.slice(1);
}

function cstr(s) {
  return '"' + (s || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
}

function ffmt(x) {
  const n = Number(x) || 0;
  return Number.isInteger(n) ? n + '.0f' : n + 'f';
}

const CPP_KEYWORDS = new Set([
  'alignas', 'alignof', 'and', 'asm', 'auto', 'bool', 'break', 'case', 'catch', 'char',
  'class', 'const', 'constexpr', 'continue', 'decltype', 'default', 'delete', 'do',
  'double', 'else', 'enum', 'explicit', 'export', 'extern', 'false', 'float', 'for',
  'friend', 'goto', 'if', 'inline', 'int', 'long', 'mutable', 'namespace', 'new',
  'noexcept', 'not', 'nullptr', 'operator', 'or', 'private', 'protected', 'public',
  'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch',
  'template', 'this', 'throw', 'true', 'try', 'typedef', 'typeid', 'typename',
  'union', 'unsigned', 'using', 'virtual', 'void', 'volatile', 'while', 'xor',
]);

function generateCode() {
  const used = new Map();
  const uniq = base => {
    const count = used.get(base) || 0;
    used.set(base, count + 1);
    return count === 0 ? base : base + count;
  };

  // Duplicate on-screen labels need distinct ImGui IDs. ## hides the suffix,
  // matching the preview's ###id behavior.
  const seenLabels = new Set();
  const imguiId = (label, name) => {
    if (seenLabels.has(label)) return label + '##' + name;
    seenLabels.add(label);
    return label;
  };

  const fields = [];
  const lines = [];
  for (const [i, n] of doc.children.entries()) {
    let base = camel(n.label, n.type);
    if (CPP_KEYWORDS.has(base)) base += 'Value';
    const name = uniq(base);
    const handler = name[0].toUpperCase() + name.slice(1);
    if (n.sameline && i > 0) lines.push('ImGui::SameLine();');
    switch (n.type) {
      case 'text':
        lines.push(`ImGui::TextUnformatted(${cstr(n.label)});`);
        break;
      case 'button':
        lines.push(`if (ImGui::Button(${cstr(imguiId(n.label, name))})) { /* TODO: On${handler} */ }`);
        break;
      case 'checkbox':
        fields.push(`bool ${name} = false;`);
        lines.push(`ImGui::Checkbox(${cstr(imguiId(n.label, name))}, &state.${name});`);
        break;
      case 'sliderfloat':
        fields.push(`float ${name} = ${ffmt(n.min)};`);
        lines.push(`ImGui::SliderFloat(${cstr(imguiId(n.label, name))}, &state.${name}, ${ffmt(n.min)}, ${ffmt(n.max)});`);
        break;
      case 'inputtext':
        fields.push(`char ${name}[128] = "";`);
        lines.push(`ImGui::InputText(${cstr(imguiId(n.label, name))}, state.${name}, IM_ARRAYSIZE(state.${name}));`);
        break;
      case 'coloredit':
        fields.push(`float ${name}[3] = { 1.0f, 1.0f, 1.0f };`);
        lines.push(`ImGui::ColorEdit3(${cstr(imguiId(n.label, name))}, state.${name});`);
        break;
      case 'separator':
        lines.push('ImGui::Separator();');
        break;
      case 'progressbar':
        fields.push(`float ${name} = 0.0f;`);
        lines.push(`ImGui::ProgressBar(state.${name}, ImVec2(-1.0f, 0.0f));`);
        break;
    }
  }

  const base = pascal(doc.label, 'MyPanel');
  const out = [];
  out.push('// Generated by ImGuiStudio (prototype)');
  out.push('');
  out.push(`struct ${base}State`);
  out.push('{');
  for (const f of fields) out.push('    ' + f);
  out.push('};');
  out.push('');
  out.push(`void Draw${base}(${base}State& state)`);
  out.push('{');
  out.push(`    ImGui::Begin(${cstr(doc.label || 'My Panel')});`);
  for (const l of lines) out.push('    ' + l);
  out.push('    ImGui::End();');
  out.push('}');
  return out.join('\n');
}

// ---------- ui rendering ----------

function renderPalette() {
  const host = document.getElementById('palette');
  for (const [type, def] of Object.entries(WIDGETS)) {
    const b = document.createElement('button');
    b.textContent = '+ ' + def.name;
    b.title = 'Click to append, or drag onto the canvas';
    b.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      drag = { kind: 'palette', type, started: false, startX: e.clientX, startY: e.clientY, drop: null };
    });
    host.appendChild(b);
  }
}

function renderTree() {
  const host = document.getElementById('tree');
  host.innerHTML = '';
  const mkRow = (node, isRoot) => {
    const row = document.createElement('div');
    row.className = 'row' + (node.id === selectedId ? ' selected' : '');
    row.onclick = () => { selectedId = node.id; refresh(); };

    const t = document.createElement('span');
    t.className = 'wtype';
    t.textContent = isRoot ? 'window' : node.type;
    row.appendChild(t);

    const l = document.createElement('span');
    l.className = 'wlabel';
    l.textContent = node.label || '(no label)';
    row.appendChild(l);

    if (node.sameline) {
      const j = document.createElement('span');
      j.className = 'join';
      j.textContent = '⤷';
      j.title = 'joined to previous line (SameLine)';
      row.appendChild(j);
    }

    if (!isRoot) {
      for (const [txt, fn] of [['↑', () => moveNode(node.id, -1)], ['↓', () => moveNode(node.id, 1)], ['✕', () => removeNode(node.id)]]) {
        const b = document.createElement('button');
        b.textContent = txt;
        b.onclick = e => { e.stopPropagation(); fn(); };
        row.appendChild(b);
      }
    }
    host.appendChild(row);
  };
  mkRow(doc, true);
  for (const n of doc.children) mkRow(n, false);
}

function renderProps() {
  const host = document.getElementById('propbody');
  host.innerHTML = '';
  const node = selectedId ? findNode(selectedId) : null;
  if (!node) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Select a widget in the hierarchy or canvas.';
    host.appendChild(d);
    return;
  }

  const addField = (labelText, input) => {
    const l = document.createElement('label');
    l.textContent = labelText;
    host.appendChild(l);
    host.appendChild(input);
  };

  const label = document.createElement('input');
  label.type = 'text';
  label.maxLength = 200;
  label.value = node.label || '';
  label.oninput = () => { node.label = label.value; refresh(false); };
  addField('Label', label);

  if (node !== doc) {
    const same = document.createElement('input');
    same.type = 'checkbox';
    same.checked = !!node.sameline;
    same.onchange = () => { node.sameline = same.checked; refresh(false); };
    addField('SameLine', same);
  }

  if (node.type === 'sliderfloat') {
    for (const key of ['min', 'max']) {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = 'any';
      inp.value = node[key];
      inp.oninput = () => {
        const v = Number(inp.value);
        node[key] = Number.isFinite(v) ? v : 0;
        refresh(false);
      };
      addField(key, inp);
    }
  }
}

function renderCode() {
  document.getElementById('code').textContent = generateCode();
}

// a sameline flag on the first child would join it to a line that doesn't exist
function normalizeDoc() {
  if (doc.children.length && doc.children[0].sameline) delete doc.children[0].sameline;
}

// rebuildProps=false keeps focus in the inspector while typing
function refresh(rebuildProps = true) {
  normalizeDoc();
  renderTree();
  if (rebuildProps) renderProps();
  renderCode();
  pushDoc();
  saveLocal();
}

document.getElementById('demoToggle').onchange = e => {
  if (engineReady) Module.ccall('engine_show_demo', null, ['number'], [e.target.checked ? 1 : 0]);
};

document.getElementById('liveToggle').onchange = e => {
  editMode = !e.target.checked;
  if (engineReady) Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
  updateSelectionOverlay();
};

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(generateCode());
};

document.getElementById('resetBtn').onclick = () => {
  applyDocData(JSON.parse(JSON.stringify(DEFAULT_DOC)), 100);
  refresh();
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ v: 1, doc }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'imguistudio-panel.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFile.click();
importFile.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    const d = s && s.v === 1 && s.doc ? s.doc : s;
    if (!d || d.type !== 'window') throw new Error('not a panel document');
    applyDocData(d, 0);
    refresh();
  } catch (err) {
    console.warn('[import] failed:', err);
  }
  e.target.value = '';
};

// hooks for the automated self-test (app/main.js --selftest)
window.__test = {
  rects: () => latestRects,
  doc: () => doc,
  selected: () => selectedId,
  canvasOrigin: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left, y: r.top };
  },
  paletteButtonPos: text => {
    for (const b of document.querySelectorAll('#palette button')) {
      if (b.textContent === text) {
        const r = b.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
    }
    return null;
  },
};

renderPalette();
loadLocal();
refresh();
</script>
<script src="engine.js"></script>
</body>
</html>
