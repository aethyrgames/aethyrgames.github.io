      tn('sliderfloat', { label: 'Master' }),
      tn('sliderfloat', { label: 'Music' }),
      tn('separator'),
      tn('button', { label: 'Apply' }),
      tn('button', { label: 'Cancel', sameline: true }),
    ]],
    ['Toolbar and list', () => [
      tn('button', { label: 'New' }),
      tn('button', { label: 'Open', sameline: true }),
      tn('button', { label: 'Save', sameline: true }),
      tn('separator'),
      tn('inputtextwithhint', { label: 'Search' }),
      tn('listbox', { label: 'Items', items: 'First, Second, Third' }),
    ]],
    ['Property inspector', () => [
      tn('inputtext', { label: 'Name' }),
      tn('dragfloat', { label: 'Position X' }),
      tn('dragfloat', { label: 'Position Y' }),
      tn('sliderfloat', { label: 'Scale' }),
      tn('coloredit', { label: 'Tint' }),
      tn('checkbox', { label: 'Visible' }),
    ]],
    ['Debug overlay', () => [
      tn('text', { label: 'Frame stats' }),
      tn('plotlines', { label: 'Frame time' }),
      tn('separator'),
      tn('checkbox', { label: 'Show colliders' }),
      tn('checkbox', { label: 'Show wireframe' }),
      tn('collapsingheader', { label: 'Counters' }),
    ]],
    ['Tabbed panel', () => {
      const bar = tn('tabbar', { label: 'Tabs' });
      const one = tn('tabitem', { label: 'General' });
      one.children = [tn('checkbox', { label: 'Enabled' })];
      const two = tn('tabitem', { label: 'Advanced' });
      two.children = [tn('inputint', { label: 'Threads' })];
      bar.children = [one, two];
      return [bar];
    }],
  ];
  return defs.map(([name, build]) => {
    // built from a function so one bad widget type can't take the whole list
    // down at load time
    let kids = [];
    try { kids = build().filter(n => n && WIDGETS[n.type]); } catch (e) { kids = []; }
    return {
      id: 'builtin:' + name,
      name,
      builtin: true,
      doc: Object.assign(JSON.parse(JSON.stringify(DEFAULT_DOC)), { label: name, children: kids }),
    };
  });
}

let templates = [];

function saveTemplates() {
  try {
    const mine = templates.filter(t => !t.builtin);
    localStorage.setItem(TEMPLATES_KEY, JSON.stringify({ v: 1, templates: mine }));
  } catch (e) {}
}

function loadTemplates() {
  let saved = [];
  try {
    const s = JSON.parse(localStorage.getItem(TEMPLATES_KEY) || 'null');
    if (s && Array.isArray(s.templates)) saved = s.templates.filter(t => t && t.doc);
  } catch (e) {}
  templates = builtinTemplates().concat(saved);
}

function applyTemplate(t, asNew) {
  const run = () => {
    if (asNew) { addProject(t.name, t.doc); saveProjects(); return; }
    applyDocData(JSON.parse(JSON.stringify(t.doc)), 100);
    refresh();
  };
  const n = countNodes(doc.children);
  if (!asNew && n > 0) {
    askConfirm(`Replace this document with the "${t.name}" template? `
      + `${n} widget${n > 1 ? 's' : ''} will be discarded. Ctrl+Z undoes it.`, run);
  } else run();
}

function renderTemplates() {
  const host = document.getElementById('tpllist');
  host.innerHTML = '';
  for (const t of templates) {
    const row = document.createElement('div');
    row.className = 'tplrow';
    const n = document.createElement('span');
    n.className = 'tplname';
    n.textContent = t.name;
    n.title = (t.builtin ? 'Built in. ' : '') + 'Click to apply here, or use the ＋ to open it as a new project';
    n.onclick = () => applyTemplate(t, false);
    row.appendChild(n);
    const count = document.createElement('span');
    count.className = 'tplcount';
    count.textContent = countNodes(t.doc.children);
    row.appendChild(count);
    const asNew = document.createElement('button');
    asNew.textContent = '＋';
    asNew.title = 'Open as a new project';
    asNew.onclick = e => { e.stopPropagation(); applyTemplate(t, true); };
    row.appendChild(asNew);
    if (!t.builtin) {
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'Delete this template';
      del.onclick = e => {
        e.stopPropagation();
        askConfirm(`Delete the template "${t.name}"?`, () => {
          templates = templates.filter(x => x !== t);
          saveTemplates();
          renderTemplates();
        });
      };
      row.appendChild(del);
    }
    row.oncontextmenu = e => {
      e.preventDefault();
      openContextMenu(e, [
        { group: '1', order: 0, label: 'Apply to this document', run: () => applyTemplate(t, false) },
        { group: '1', order: 1, label: 'Open as a new project', run: () => applyTemplate(t, true) },
        { group: '2', order: 0, label: 'Export this template', run: () => exportTemplates([t]) },
        t.builtin ? null : { group: '9z', order: 0, label: 'Delete', danger: true,
          run: () => { templates = templates.filter(x => x !== t); saveTemplates(); renderTemplates(); } },
      ]);
    };
    host.appendChild(row);
  }
}

function saveCurrentAsTemplate() {
  const base = (doc.label || 'Template').trim();
  let name = base;
  let i = 2;
  while (templates.some(t => t.name === name)) name = base + ' ' + (i++);
  templates.push({ id: 't' + templates.length + '-' + name, name, doc: JSON.parse(JSON.stringify(doc)) });
  saveTemplates();
  renderTemplates();
}

// ---------- import and export ----------

function downloadJson(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportProject() {
  downloadJson('imguistudio-panel.json', { v: 2, kind: 'project', doc });
}

// Templates get their own file kind so importing one can't be mistaken for
// opening a document, which is why these buttons are separate from Export JSON.
function exportTemplates(list) {
  const mine = (list || templates).filter(t => !t.builtin || list);
  downloadJson('imguistudio-templates.json',
    { v: 1, kind: 'templates', templates: mine.map(t => ({ name: t.name, doc: t.doc })) });
}

function exportEverything() {
  snapshotActive();
  downloadJson('imguistudio-everything.json', {
    v: 1,
    kind: 'everything',
    projects: projects.map(p => ({ name: p.name, doc: p.doc, nextId: p.nextId })),
    templates: templates.filter(t => !t.builtin).map(t => ({ name: t.name, doc: t.doc })),
    layout,
    binds: bindOverrides,
    theme: currentTheme,
  });
}

// One reader for every file kind, so dropping the wrong file tells you what it
// was instead of silently doing nothing.
function importPayload(s) {
  if (!s || typeof s !== 'object') throw new Error('not an ImGuiStudio file');
  if (s.kind === 'templates' || (Array.isArray(s.templates) && !s.projects && !s.doc)) {
    const add = (s.templates || []).filter(t => t && t.doc);
    if (!add.length) throw new Error('no templates in that file');
    for (const t of add) {
      let name = t.name || 'Imported';
      let i = 2;
      while (templates.some(x => x.name === name)) name = (t.name || 'Imported') + ' ' + (i++);
      templates.push({ id: 'ti' + templates.length, name, doc: t.doc });
    }
    saveTemplates();
    renderTemplates();
    return `imported ${add.length} template${add.length > 1 ? 's' : ''}`;
  }
  if (s.kind === 'everything') {
    for (const p of (s.projects || [])) {
      if (p && p.doc) addProject(p.name, p.doc);
    }
    for (const t of (s.templates || [])) {
      if (t && t.doc) templates.push({ id: 'ti' + templates.length, name: t.name || 'Imported', doc: t.doc });
    }
    if (s.binds) { bindOverrides = s.binds; for (const b of KEYMAP) Object.assign(b, b.def, bindOverrides[b.id] || {}); }
    saveTemplates();
    saveProjects();
    renderTemplates();
    return 'imported everything';
  }
  const d = s.doc || s;
  if (!d || d.type !== 'window') throw new Error('no window document in that file');
  addProject(d.label || 'Imported', d);
  saveProjects();
  return 'opened as a new project';
}

// ---------- share links ----------
// The document rides in the URL fragment, which never reaches a server. Deflate
// keeps a real panel inside what browsers and chat apps will carry.

function b64urlEncode(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlDecode(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

async function encodeShare(payload) {
  const json = JSON.stringify(payload);
  const raw = new TextEncoder().encode(json);
  if (typeof CompressionStream !== 'function') return 'u' + b64urlEncode(raw);
  const cs = new CompressionStream('deflate-raw');
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();
  return 'z' + b64urlEncode(new Uint8Array(buf));
}

async function decodeShare(code) {
  const bytes = b64urlDecode(code.slice(1));
  if (code[0] === 'u') return JSON.parse(new TextDecoder().decode(bytes));
  const ds = new DecompressionStream('deflate-raw');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}

async function buildShareLink() {
  const code = await encodeShare({ v: 1, doc });
  return location.origin + location.pathname + '#d=' + code;
}

async function copyShareLink() {
  try {
    const url = await buildShareLink();
    await navigator.clipboard.writeText(url);
    flashStatus(url.length > 1800
      ? `Link copied (${url.length} characters, which some chat apps will truncate).`
      : 'Share link copied to the clipboard.');
  } catch (e) {
    flashStatus('Could not build a share link: ' + e.message);
  }
}

// Reads a shared document out of the fragment and opens it as its own project,
// so following a link never overwrites what you were working on.
async function loadSharedFromUrl() {
  const m = /[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m) return false;
  try {
    const payload = await decodeShare(m[1]);
    if (!payload || !payload.doc || payload.doc.type !== 'window') return false;
    addProject(payload.doc.label || 'Shared', payload.doc);
    saveProjects();
    history.replaceState(null, '', location.pathname + location.search);
    flashStatus('Opened a shared document as a new project.');
    return true;
  } catch (e) {
    flashStatus('That share link could not be read.');
    return false;
  }
}

let flashTimer = null;
function flashStatus(msg) {
  hoverInfoEl.innerHTML = esc(msg);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => updateHoverStatus(null), 6000);
}

// ---------- settings ----------
// The ? overlay lists shortcuts in context and is the fast path. This is the
// deliberate one: every binding at once, plus the view and data switches, in a
// place you'd think to look for them.
const settingsOv = document.getElementById('settingsov');
const settingsBody = document.getElementById('settingsBody');
let settingsTab = 'keys';
let settingsCapture = null;

function openSettings(tab) {
  settingsTab = tab || settingsTab;
  settingsOv.hidden = false;
  renderSettings();
}

function closeSettings() {
  if (settingsOv.hidden) return;
  settingsOv.hidden = true;
  settingsCapture = null;
}

function setRow(label, controlEl) {
  const row = document.createElement('div');
  row.className = 'set-row';
  const l = document.createElement('span');
  l.textContent = label;
  row.appendChild(l);
  const sp = document.createElement('span');
  sp.className = 'spacer';
  row.appendChild(sp);
  row.appendChild(controlEl);
  return row;
}

function settingsButton(text, onClick) {
  const b = document.createElement('button');
  b.className = 'k';
  b.textContent = text;
  b.onclick = onClick;
  return b;
}

function renderSettings() {
  for (const b of settingsOv.querySelectorAll('.settings-tabs button')) {
    b.classList.toggle('on', b.dataset.tab === settingsTab);
  }
  settingsBody.innerHTML = '';
  if (settingsTab === 'keys') return renderKeySettings();
  if (settingsTab === 'view') return renderViewSettings();
  return renderDataSettings();
}

function renderKeySettings() {
  const hint = document.createElement('div');
  hint.className = 'ov-cat';
  hint.textContent = settingsCapture
    ? 'press a key for: ' + settingsCapture.help + '   (Esc cancels)'
    : 'click a shortcut to rebind it';
  hint.style.color = settingsCapture ? 'var(--mk-green)' : 'var(--mk-comment)';
  settingsBody.appendChild(hint);

  let lastCat = '';
  for (const b of KEYMAP) {
    if (b.cat !== lastCat) {
      lastCat = b.cat;
      const c = document.createElement('div');
      c.className = 'ov-cat';
      c.textContent = b.cat;
      settingsBody.appendChild(c);
    }
    const k = settingsButton(settingsCapture === b ? '…press a key' : comboLabel(b), () => {
      settingsCapture = b;
      renderSettings();
    });
    if (bindOverrides[b.id]) k.classList.add('custom');
    if (settingsCapture === b) k.classList.add('capturing');
    settingsBody.appendChild(setRow(b.help, k));
  }
  settingsBody.appendChild(setRow('Restore every default',
    settingsButton('reset all', () => { resetBinds(); renderSettings(); })));
}

function renderViewSettings() {
  settingsBody.appendChild(setRow('Background grid',
    settingsButton(showGrid ? 'on' : 'off', () => { setGrid(!showGrid); renderSettings(); })));
  settingsBody.appendChild(setRow('Rulers and guides',
    settingsButton(showRulers ? 'on' : 'off', () => { setRulers(!showRulers); renderSettings(); })));
  settingsBody.appendChild(setRow('Panel layout',
    settingsButton('reset', () => { resetPanelLayout(); renderSettings(); })));
  settingsBody.appendChild(setRow('View position',
    settingsButton('recentre', () => { resetPan(); })));
  const sel = document.createElement('select');
  sel.className = 'k';
  for (const [key, t] of Object.entries(THEMES)) {
    const o = document.createElement('option');
    o.value = key;
    o.textContent = t.name;
    sel.appendChild(o);
  }
  sel.value = currentTheme;
  sel.onchange = () => { themeSel.value = sel.value; themeSel.onchange(); };
  settingsBody.appendChild(setRow('Code syntax theme', sel));
}

function renderDataSettings() {
  settingsBody.appendChild(setRow('This project as JSON',
    settingsButton('export', () => exportProject())));
  settingsBody.appendChild(setRow('Every project and template',
    settingsButton('export all', () => exportEverything())));
  settingsBody.appendChild(setRow('Import a project file',
    settingsButton('import', () => document.getElementById('importFile').click())));
  settingsBody.appendChild(setRow('Shareable link for this document',
    settingsButton('copy link', () => copyShareLink())));
}

document.getElementById('settingsClose').onclick = closeSettings;
for (const b of settingsOv.querySelectorAll('.settings-tabs button')) {
  b.onclick = () => { settingsTab = b.dataset.tab; renderSettings(); };
}
settingsOv.addEventListener('mousedown', e => { if (e.target === settingsOv) closeSettings(); });

// While a shortcut row is armed the next key becomes the binding. This listener
// is capture-phase and ahead of the dispatcher so the key can't also fire.
window.addEventListener('keydown', e => {
  if (!settingsCapture) return;
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { settingsCapture = null; renderSettings(); return; }
  const cand = {
    key: e.key.length === 1 ? e.key.toUpperCase() : e.key,
    ctrl: e.ctrlKey || e.metaKey, alt: e.altKey, shift: e.shiftKey,
  };
  const clash = rebind(settingsCapture, cand);
  settingsCapture = null;
  renderSettings();
  if (clash) {
    const hint = settingsBody.firstChild;
    hint.textContent = comboLabel(cand) + ' is already "' + clash.help + '" under '
      + clash.cat + '. Keys can only be shared inside one group.';
    hint.style.color = 'var(--mk-pink)';
  }
}, true);

// An in-app confirm rather than window.confirm: the native one blocks the whole
// page, which also means it can't be driven by the self-test.
const confirmOv = document.getElementById('confirmov');
const confirmMsg = document.getElementById('confirmMsg');
let confirmAction = null;

function askConfirm(message, onYes) {
  confirmMsg.textContent = message;
  confirmAction = onYes;
  confirmOv.hidden = false;
  document.getElementById('confirmYes').focus();
}

function closeConfirm() { confirmOv.hidden = true; confirmAction = null; }
document.getElementById('confirmNo').onclick = closeConfirm;
document.getElementById('confirmYes').onclick = () => {
  const run = confirmAction;
  closeConfirm();
  if (run) run();
};
confirmOv.addEventListener('mousedown', e => { if (e.target === confirmOv) closeConfirm(); });

function resetDocument() {
  applyDocData(JSON.parse(JSON.stringify(DEFAULT_DOC)), 100);
  // refresh() pushes a history entry, so the reset itself is one Ctrl+Z away
  refresh();
}

document.getElementById('resetBtn').onclick = () => {
  const n = countNodes(doc.children);
  if (!n) { resetDocument(); return; }
  askConfirm(`Replace this document with the sample layout? ${n} widget`
    + `${n > 1 ? 's' : ''} will be discarded. Ctrl+Z undoes it.`, resetDocument);
};

document.getElementById('exportBtn').onclick = () => exportProject();
document.getElementById('shareBtn').onclick = () => copyShareLink();
document.getElementById('settingsBtn').onclick = () => openSettings('keys');

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFile.click();
importFile.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    flashStatus(importPayload(JSON.parse(await file.text())));
  } catch (err) {
    flashStatus('Import failed: ' + err.message);
  }
  e.target.value = '';
};

// Templates get their own pair of buttons. Mixing them with Export JSON meant
// you could not tell from the file whether you were about to open a document
// or add starting points.
document.getElementById('tplSaveBtn').onclick = () => saveCurrentAsTemplate();
document.getElementById('tplExportBtn').onclick = () => exportTemplates();
const importTplFile = document.getElementById('importTplFile');
document.getElementById('tplImportBtn').onclick = () => importTplFile.click();
importTplFile.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    flashStatus(importPayload(JSON.parse(await file.text())));
  } catch (err) {
    flashStatus('Import failed: ' + err.message);
  }
  e.target.value = '';
};

// hooks for the automated self-test (app/main.js --selftest)
window.__test = {
  rects: () => latestRects,
  doc: () => doc,
  selected: () => selectedId,
  select: id => selectId(id),
  selection: () => [...selection],
  hotbar: () => hotbar.slice(),
  layout: () => JSON.parse(JSON.stringify(layout)),
  guides: () => guides.slice(),
  canvasSize: () => ({ w: canvas.width, h: canvas.height }),
  inlineEditing: () => inlineId !== null,
  ctxOpen: () => document.getElementById('ctxmenu').style.display === 'block',
  handlePos: axis => {
    const h = document.querySelector('#selbox .rh-' + axis);
    if (!h || !h.offsetParent) return null;
    const r = h.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  },
  hidePanel: k => { layout.panels[k].hidden = true; applyLayout(); },
  showPanel: k => { layout.panels[k].hidden = false; applyLayout(); },
  // hidden panels are detached from the dock, not just display:none
  panelVisible: k => {
    const el = document.querySelector('.panel[data-panel="' + k + '"]');
    return !!(el && el.offsetParent);
  },
  ctxItems: () => [...document.querySelectorAll('#ctxmenu .mi')].map(x => x.firstChild.textContent),
  docsUrl: type => docsUrlFor(type),
  key: (k, mods = {}) => window.dispatchEvent(new KeyboardEvent('keydown', {
    key: k, ctrlKey: !!mods.ctrl, shiftKey: !!mods.shift, altKey: !!mods.alt, cancelable: true,
  })),
  keyUp: k => window.dispatchEvent(new KeyboardEvent('keyup', { key: k })),
  armed: () => armedType(),
  isLive: () => !editMode,
  histLen: () => history.length,
  overlayOpen: () => !cmdkEl.hidden || !helpEl.hidden,
  widgetTypes: () => Object.keys(WIDGETS).filter(k => !WIDGETS[k].hidden),
  generate: () => generateCode(),
  refresh: () => refresh(),
  selectMany: ids => selectMany(ids),
  // Reset asks first now, so the test drives the dialog the way a user does
  resetDoc: () => {
    document.getElementById('resetBtn').onclick();
    if (!confirmOv.hidden) document.getElementById('confirmYes').click();
  },
  confirmOpen: () => !confirmOv.hidden,
  projects: () => projects.map(p => ({ id: p.id, name: p.name, active: p.id === activeProject })),
  addProject: (name, d) => addProject(name, d).id,
  switchProject: id => switchProject(id),
  templates: () => templates.map(t => ({ name: t.name, builtin: !!t.builtin, n: countNodes(t.doc.children) })),
  applyTemplate: name => applyTemplate(templates.find(t => t.name === name), false),
  saveTemplate: () => saveCurrentAsTemplate(),
  shareLink: () => buildShareLink(),
  loadShare: async url => {
    const m = /[#&]d=([A-Za-z0-9_-]+)/.exec(url);
    return m ? (await decodeShare(m[1])) : null;
  },
  settingsOpen: () => !settingsOv.hidden,
  openSettings: tab => openSettings(tab),
  treeRows: () => document.querySelectorAll('#tree .row').length,
  setTreeFilter: v => { treeFilterEl.value = v; renderTree(); },
  pan: () => ({ ...pan }),
  focusSel: () => focusSelection(),
  hoverText: () => hoverInfoEl.textContent,
  resizing: () => !!resizing,
  panelDragging: () => !!panelDrag,
  pin: (type, slot) => pinToHotbar(type, slot),
  reorder: d => reorderSelection(d, false),
  wrap: () => wrapSelection(),
  insert: type => insertNodeAt(type, { parentId: 'root', index: doc.children.length }),
  remove: id => removeNode(id),
  helpRowCount: () => {
    const wasOpen = !helpEl.hidden;
    if (!wasOpen) toggleHelp();
    const n = helpList.querySelectorAll('.ov-item').length;
    if (!wasOpen) toggleHelp();
    return n;
  },
  bindableCount: () => KEYMAP.filter(b => b.ctx === 'global' || b.ctx === 'edit').length,
  codeEditorWarning: () => {
    setCodeEditing(true);
    const t = codeStatus.textContent;
    setCodeEditing(false);
    return t;
  },
  rebindTest: (help, cand) => {
    const b = KEYMAP.find(x => x.help === help);
    if (!b) return 'missing';
    const clash = rebind(b, cand);
    return clash ? 'conflict:' + clash.cat : comboLabel(b);
  },
  resetBinds: () => resetBinds(),
  applyCpp: text => {
    setCodeEditing(true);
    codeEdit.value = text;
    paintCodeEditor();
    applyBtn.onclick();
    return document.getElementById('codeStatus').textContent;
  },
  roundTrip: () => {
    const before = generateCode();
    setCodeEditing(true);
    codeEdit.value = before;
    paintCodeEditor();
    applyBtn.onclick();
    return { same: generateCode() === before, before, after: generateCode() };
  },
  addAll: () => {
    // one of every widget type, containers nested so the tree is exercised
    for (const [type, spec] of Object.entries(WIDGETS)) {
      if (spec.hidden) continue;
      const node = makeNode(type);
      doc.children.push(node);
      if (spec.container) node.children.push(makeNode('text'));
    }
    refresh();
    return doc.children.length;
  },
  // Arrangements ImGui asserts on. The engine must survive all of these,
  // because an assert aborts the wasm module and kills the preview outright.
  stress: () => {
    const nested = makeNode('menubar');
    nested.children.push(makeNode('menubar'));      // BeginMenuBar inside BeginMenuBar
    const grp = makeNode('group');
    grp.children.push(makeNode('menubar'));         // menu bar off the window root
    const ab = makeNode('arrowbutton'); ab.dir = 99;   // past ImGuiDir_COUNT
    const ab2 = makeNode('arrowbutton'); ab2.dir = -5; // below ImGuiDir_None
    const tbl = makeNode('table'); tbl.cols = 0;    // BeginTable asserts on < 1
    const tbl2 = makeNode('table'); tbl2.cols = 9999;
    const ti = makeNode('tabitem');                 // tab item with no tab bar
    doc.children.push(nested, grp, ab, ab2, tbl, tbl2, ti);
    refresh();
    return doc.children.length;
  },
  canvasOrigin: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left, y: r.top };
  },
  paletteButtonPos: text => {
    for (const b of document.querySelectorAll('#palette button')) {
      // the badge span is part of textContent, so match on the widget name
      if (b.dataset.type && WIDGETS[b.dataset.type].name === text) {
        const r = b.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
    }
    return null;
  },
};

// ---------- init ----------

loadLayout();
buildPanels();
try {
  const hb = JSON.parse(localStorage.getItem(HOTBAR_KEY) || 'null');
  if (Array.isArray(hb)) hb.forEach((t, i) => { if (i < hotbar.length) hotbar[i] = t; });
} catch (e) {}
// a bar that starts empty never gets discovered, so seed it with common widgets
if (!hotbar.some(Boolean)) {
  ['button', 'text', 'checkbox', 'sliderfloat', 'inputtext', 'separator', 'group']
    .forEach((t, i) => { hotbar[i] = t; });
  saveHotbar();
}
try {
  const g = JSON.parse(localStorage.getItem('imguistudio.guides') || '[]');
  if (Array.isArray(g)) guides = g;
} catch (e) {}
renderGuides();
setRulers(localStorage.getItem('imguistudio.rulers') !== '0');
setGrid(localStorage.getItem('imguistudio.grid') !== '0');

renderPalette();
loadProjects();      // adopts the old single-document save on first run
loadTemplates();
renderTemplates();
renderProjectTabs();
refresh();
// the loaded document is the undo floor
pushHistory();
syncCanvasSize();
applyPan();
// a #d= fragment opens as its own project, so a link never eats your work
loadSharedFromUrl();

document.getElementById('filter').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.target.value = ''; renderPalette(); e.target.blur(); }
});
</script>
