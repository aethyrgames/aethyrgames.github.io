<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImGuiStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Monokai theme, ported from dougfessler.com */
  :root {
    --mk-bg:      #1e1e1e;
    --mk-surface: #2d2d2d;
    --mk-gutter:  #141414;
    --mk-fg:      #F8F8F2;
    --mk-comment: #75715E;
    --mk-pink:    #F92672;
    --mk-orange:  #FD971F;
    --mk-yellow:  #E6DB74;
    --mk-green:   #A6E22E;
    --mk-cyan:    #66D9EF;
    --mk-purple:  #AE81FF;
    --mk-border:  #49483E;

    --font:   'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --radius: 3px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --glow-chroma:
      0.03em 0 0 rgba(249, 38, 114, 0.35),
      -0.03em 0 0 rgba(102, 217, 239, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    font: 13px/1.5 var(--font); background: var(--mk-bg); color: var(--mk-fg);
  }

  /* Scanlines live only on the header chrome, and as a background layer so
     they paint behind the text rather than over it. The workspace and the
     preview canvas stay completely clean. */
  #apphead {
    height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--mk-border);
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.30) 3px,
        rgba(0,0,0,0.30) 4px
      ),
      var(--mk-gutter);
  }
  .brand {
    color: var(--mk-green); font-weight: 700; font-size: 14px;
    text-shadow: var(--glow-chroma); white-space: nowrap;
  }
  .brand::before { content: '> '; color: var(--mk-comment); }
  .tagline { color: var(--mk-comment); font-size: 12px; }
  #apphead .spacer { flex: 1; }
  .sitelink {
    color: var(--mk-comment); font-size: 12px; text-decoration: none;
    padding: 3px 9px; border: 1px solid var(--mk-border); border-radius: var(--radius);
    transition: color 0.1s, border-color 0.1s;
  }
  .sitelink:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  /* opaque, so nothing from behind can bleed into the panes */
  #workspace {
    display: flex; flex-direction: column; flex: 1;
    min-height: 0; min-width: 0; overflow: hidden; background: var(--mk-bg);
  }
  #midrow { display: flex; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }

  h3 {
    margin: 0; padding: 9px 10px 6px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--mk-green);
    border-bottom: 1px solid var(--mk-border); flex-shrink: 0;
  }
  h3::before { content: '/* '; color: var(--mk-comment); text-transform: none; }
  h3::after  { content: ' */'; color: var(--mk-comment); }

  /* ---- dockable panels ---- */
  .dock { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; flex-shrink: 0; }
  #dockLeft { width: 280px; border-right: 1px solid var(--mk-border); }
  #dockRight { width: 470px; border-left: 1px solid var(--mk-border); }
  /* the top and bottom docks are wide and short, so their panels sit side by
     side rather than stacking */
  #dockTop, #dockBottom { flex-direction: row; height: 200px; }
  #dockTop { border-bottom: 1px solid var(--mk-border); }
  #dockBottom { border-top: 1px solid var(--mk-border); }
  #dockTop > .panel, #dockBottom > .panel {
    border-bottom: none; border-right: 1px solid var(--mk-border); min-width: 0;
  }
  #dockTop > .panel.collapsed, #dockBottom > .panel.collapsed { flex: 0 0 auto; }
  .dock:empty { display: none; }
  .dock:empty + .dockresize, .dockresize:has(+ .dock:empty) { display: none; }
  /* hidden panels stay in the DOM so their render targets keep resolving, so a
     dock counts as empty when every panel in it is hidden */
  .panel.gone { display: none; }
  .dock:not(:has(.panel:not(.gone))) { display: none; }
  .dock:not(:has(.panel:not(.gone))) + .dockresize,
  .dockresize:has(+ .dock:not(:has(.panel:not(.gone)))) { display: none; }
  .dockresize {
    width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent;
  }
  .dockresize.horiz { width: auto; height: 5px; cursor: row-resize; }
  .dockresize:hover, .dockresize.dragging { background: var(--mk-cyan); opacity: 0.5; }

  /* share the dock's height by weight rather than by content size, or the
     palette's long list starves the panels under it */
  .panel {
    display: flex; flex-direction: column; min-height: 0; flex: 1 1 0;
    border-bottom: 1px solid var(--mk-border);
  }
  .panel[data-panel="palette"] { flex-grow: 2.2; }
  .panel[data-panel="hierarchy"] { flex-grow: 1.4; }
  .panel.collapsed { flex: 0 0 auto; }
  .panel.collapsed .panel-body { display: none; }
  .panel-head {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px 6px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--mk-green);
    border-bottom: 1px solid var(--mk-border); cursor: grab; user-select: none;
    flex-shrink: 0; background: var(--mk-gutter);
  }
  .panel-head:active { cursor: grabbing; }
  .panel-head .tw { color: var(--mk-comment); font-size: 14px; width: 12px; line-height: 1; }
  .panel-head .ttl { flex: 1; }
  .panel-head .ttl::before { content: '/* '; color: var(--mk-comment); text-transform: none; }
  .panel-head .ttl::after { content: ' */'; color: var(--mk-comment); }
  .panel-head button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    font-family: var(--font); font-size: 13px; padding: 0 3px; line-height: 1;
  }
  .panel-head button:hover { color: var(--mk-fg); }
  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel.dragging { opacity: 0.4; }

  #dropzone {
    position: fixed; display: none; pointer-events: none; z-index: 30;
    background: rgba(102, 217, 239, 0.10); border: 2px solid var(--mk-cyan);
    flex-direction: column; gap: 2px; padding: 2px;
  }
  /* one slot per panel that will share the dock, so the preview shows the size
     each one ends up with instead of just naming an edge */
  .dzslot {
    flex: 1 1 0; min-width: 0; min-height: 0; display: flex;
    align-items: center; justify-content: center; text-align: center;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--mk-comment); border: 1px dashed var(--mk-border);
    background: rgba(0, 0, 0, 0.35); overflow: hidden;
  }
  /* ---- project tabs ---- */
  #projtabs {
    display: flex; align-items: stretch; gap: 2px; padding: 4px 6px 0;
    background: var(--mk-gutter); border-bottom: 1px solid var(--mk-border);
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  #projtabs::-webkit-scrollbar { display: none; }
  .ptab {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    border: 1px solid var(--mk-border); border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    color: var(--mk-comment); font-size: 11px; cursor: pointer; white-space: nowrap;
    background: transparent; max-width: 220px;
  }
  .ptab:hover { color: var(--mk-fg); }
  .ptab.on { color: var(--mk-green); border-color: var(--mk-green); background: var(--mk-bg); }
  .ptab .pname { overflow: hidden; text-overflow: ellipsis; }
  .ptab button {
    background: transparent; border: none; color: var(--mk-comment);
    cursor: pointer; font-family: var(--font); font-size: 10px; padding: 0 2px;
  }
  .ptab button:hover { color: var(--mk-pink); }
  .prename {
    background: var(--mk-bg); color: var(--mk-fg); border: 1px solid var(--mk-cyan);
    border-radius: var(--radius); font-family: var(--font); font-size: 11px;
    padding: 1px 4px; width: 120px;
  }
  .prename:focus { outline: none; }
  .padd {
    background: transparent; border: 1px solid var(--mk-border); color: var(--mk-comment);
    border-radius: var(--radius) var(--radius) 0 0; cursor: pointer;
    font-family: var(--font); font-size: 12px; padding: 0 9px;
  }
  .padd:hover { color: var(--mk-green); border-color: var(--mk-green); }

  /* ---- templates ---- */
  #tpllist { overflow-y: auto; }
  .tplrow {
    display: flex; align-items: center; gap: 6px; padding: 5px 9px;
    border-bottom: 1px solid rgba(73, 72, 62, 0.4); font-size: 12px;
  }
  .tplrow:hover { background: rgba(255, 255, 255, 0.04); }
  .tplname { flex: 1; min-width: 0; color: var(--mk-fg); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tplname:hover { color: var(--mk-cyan); }
  .tplcount { color: var(--mk-comment); font-size: 10px; }
  .tplrow button {
    background: transparent; border: none; color: var(--mk-comment);
    cursor: pointer; font-family: var(--font); font-size: 11px; padding: 0 3px;
  }
  .tplrow button:hover { color: var(--mk-green); }

  .settings-box { max-width: 620px; width: 92vw; }
  .settings-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;
    border-bottom: 1px solid var(--mk-border); color: var(--mk-green);
    text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
  }
  .settings-head .spacer { flex: 1; }
  .settings-head button, .settings-tabs button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 10px; cursor: pointer;
    font-family: var(--font); font-size: 11px;
  }
  .settings-head button:hover, .settings-tabs button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  .settings-tabs { display: flex; gap: 6px; padding: 10px 14px; }
  .settings-tabs button.on { color: var(--mk-green); border-color: var(--mk-green); }
  .set-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 14px;
    color: var(--mk-fg); font-size: 12px;
  }
  .set-row .spacer { flex: 1; }
  .set-row .k {
    color: var(--mk-comment); font-size: 11px; border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 1px 7px; cursor: pointer; white-space: nowrap;
  }
  .set-row .k:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  .set-row .k.capturing { color: var(--mk-green); border-color: var(--mk-green); }
  .set-row .k.custom { color: var(--mk-green); }
  .confirm-box { max-width: 420px; padding: 16px; }
  #confirmMsg { color: var(--mk-fg); line-height: 1.5; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .confirm-actions button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 5px 12px; cursor: pointer;
    font-family: var(--font); font-size: 12px;
  }
  .confirm-actions button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  .confirm-actions button.danger:hover { color: var(--mk-pink); border-color: var(--mk-pink); }
  .dzslot.me {
    color: var(--mk-bg); background: var(--mk-cyan);
    border: 1px solid var(--mk-cyan); font-weight: 700;
  }

  /* panels the user hid are relaunchable from here */
  #apphead .panelbtn {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); font-family: var(--font); font-size: 11px;
    padding: 2px 7px; cursor: pointer;
  }
  #apphead .panelbtn:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  #apphead .panelbtn.on { color: var(--mk-green); border-color: var(--mk-green); }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #palette {
    padding: 0 8px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
    overflow-y: auto; flex: 1; min-height: 0; align-content: start;
  }
  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  #propbody {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    display: grid; grid-template-columns: 78px 1fr; gap: 5px; align-content: start;
    align-items: center;
  }
  .paltools { display: flex; align-items: center; gap: 6px; margin: 6px 8px; flex-shrink: 0; }
  .paltools input {
    flex: 1; min-width: 0; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    padding: 4px 6px; font-family: var(--font); font-size: 12px;
  }
  .paltools input:focus { outline: none; border-color: var(--mk-cyan); }
  .paltools button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 4px 7px; cursor: pointer;
    font-family: var(--font); font-size: 11px; white-space: nowrap;
  }
  .paltools button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }
  /* The ellipsis lives on an inner span, not the button: Chrome collapses a
     <button>'s content box to zero height when overflow:hidden is set on the
     button itself, which silently squashes the whole palette. */
  #palette button {
    background: var(--mk-surface); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 6px 4px; cursor: grab; font-size: 12px;
    line-height: 1.4; font-family: var(--font); user-select: none; text-align: center;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  #palette button .lbl {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #palette button:hover {
    background: #3a4a55; color: var(--mk-cyan); border-color: var(--mk-cyan);
  }
  #palette button:active { background: var(--mk-gutter); }

  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  .row {
    display: flex; align-items: center; padding: 2px 8px 2px 6px; cursor: pointer; gap: 5px;
    border-left: 2px solid transparent;
  }
  .row:hover { background: rgba(255,255,255,0.04); }
  .row.selected { background: var(--mk-surface); border-left-color: var(--mk-pink); }
  .row.selected .wlabel { color: var(--mk-pink); }
  .row .wtype { color: var(--mk-cyan); font-size: 11px; opacity: 0.8; flex-shrink: 0; }
  .row .wlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
  .row .join { color: var(--mk-yellow); font-size: 12px; }
  .row .box { color: var(--mk-purple); font-size: 11px; }
  .row button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    padding: 0 2px; font-size: 12px; font-family: var(--font);
  }
  .row button:hover { color: var(--mk-fg); }

  #propbody label { color: var(--mk-comment); font-size: 12px; }
  #propbody input[type=text], #propbody input[type=number], #propbody select {
    background: var(--mk-gutter); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 6px; width: 100%; font-family: var(--font); font-size: 12px;
  }
  #propbody input:focus, #propbody select:focus { outline: none; border-color: var(--mk-cyan); }
  #propbody .empty { grid-column: 1 / 3; color: var(--mk-comment); padding: 6px 0; }
  #propbody .empty::before { content: '// '; }

  /* ---- properties: sections, a real toggle, readable colour rows ---- */
  .prophead {
    grid-column: 1 / 3; display: flex; align-items: center; gap: 6px;
    margin: 10px 0 2px; color: var(--mk-green); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .prophead:first-child { margin-top: 0; }
  .prophead::after { content: ''; flex: 1; height: 1px; background: var(--mk-border); }
  .propident {
    grid-column: 1 / 3; display: flex; align-items: baseline; gap: 7px;
    padding-bottom: 4px; border-bottom: 1px solid var(--mk-border); margin-bottom: 2px;
  }
  .propident b { color: var(--mk-cyan); font-size: 13px; font-weight: 600; }
  .propident span { color: var(--mk-comment); font-size: 11px; }
  /* a switch rather than a bare checkbox: SameLine is the one flag people
     reach for constantly, so it gets a control you can hit */
  .toggle {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    color: var(--mk-comment); font-size: 11px; user-select: none;
  }
  .toggle .track {
    width: 30px; height: 16px; border-radius: 9px; background: var(--mk-gutter);
    border: 1px solid var(--mk-border); position: relative; transition: all 0.12s;
    flex-shrink: 0;
  }
  .toggle .track::after {
    content: ''; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--mk-comment); transition: all 0.12s;
  }
  .toggle.on .track { border-color: var(--mk-green); background: rgba(166, 226, 46, 0.18); }
  .toggle.on .track::after { left: 15px; background: var(--mk-green); }
  .toggle.on { color: var(--mk-green); }
  .colorrow { display: flex; align-items: center; gap: 6px; }
  .colorrow input[type=color] {
    width: 26px; height: 20px; padding: 0; border: 1px solid var(--mk-border);
    border-radius: var(--radius); background: var(--mk-gutter); cursor: pointer;
  }
  .colorrow .hex { color: var(--mk-comment); font-size: 10px; letter-spacing: 0.02em; }
  .colorrow .unset {
    margin-left: auto; background: none; border: 1px solid var(--mk-border);
    color: var(--mk-comment); border-radius: var(--radius); font-family: var(--font);
    font-size: 10px; cursor: pointer; padding: 1px 5px;
  }
  .colorrow .unset:hover { color: var(--mk-pink); border-color: var(--mk-pink); }
  #propbody label.set { color: var(--mk-fg); font-weight: 600; }
  #propbody label.set::after { content: ' •'; color: var(--mk-green); }

  input[type=checkbox] { accent-color: var(--mk-green); }

  #toolbar {
    padding: 8px 12px; background: var(--mk-gutter); border-bottom: 1px solid var(--mk-border);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  #toolbar strong { color: var(--mk-green); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  #toolbar label { color: var(--mk-comment); font-size: 12px; }
  #modeHint { color: var(--mk-comment); font-size: 12px; }
  #modeHint b { color: var(--mk-fg); font-weight: 600; }
  #modeHint.livehint { color: var(--mk-green); }
  #modeHint.livehint b { color: var(--mk-green); }
  #toolbar .spacer { flex: 1; }
  #toolbar button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 12px;
    font-family: var(--font); transition: color 0.1s, border-color 0.1s;
  }
  #toolbar button::before { content: '$ '; color: var(--mk-comment); }
  #toolbar button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  /* Rulers frame the canvas; the canvas itself fills whatever is left, and the
     wasm surface is resized to match rather than being a fixed box. */
  /* minmax(0, 1fr), not 1fr: a bare fr track floors at its content's min-content
     width, which is the canvas's explicit pixel size, so shrinking the window
     after growing it left the canvas sticking out over the right dock. */
  #canvasarea {
    flex: 1; min-height: 0; min-width: 0; display: grid;
    grid-template-columns: 20px minmax(0, 1fr) 20px;
    grid-template-rows: 20px minmax(0, 1fr) 20px;
    background: var(--mk-gutter);
  }
  #canvasarea.norulers {
    grid-template-columns: 0 minmax(0, 1fr) 0;
    grid-template-rows: 0 minmax(0, 1fr) 0;
  }
  #canvasarea.norulers .ruler, #canvasarea.norulers .rulercorner { display: none; }
  .rulercorner { background: var(--mk-gutter); }
  .ruler { display: block; background: var(--mk-gutter); }
  #rulerCorner { border-right: 1px solid var(--mk-border); border-bottom: 1px solid var(--mk-border); }
  #rulerTop { border-bottom: 1px solid var(--mk-border); cursor: ns-resize; }
  #rulerLeft { border-right: 1px solid var(--mk-border); cursor: ew-resize; }
  #rulerBottom { border-top: 1px solid var(--mk-border); cursor: ns-resize; }
  #rulerRight { border-left: 1px solid var(--mk-border); cursor: ew-resize; }
  #canvashost { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  #viewport { position: absolute; inset: 0; will-change: transform; }
  #canvas { background: var(--mk-gutter); outline: none; display: block; }
  #canvashost.panning { cursor: grabbing; }
  /* live readout pinned near the cursor, the other half of a ruler */
  #coordtip {
    position: absolute; display: none; pointer-events: none; z-index: 6;
    background: var(--mk-bg); border: 1px solid var(--mk-border); border-radius: var(--radius);
    color: var(--mk-cyan); font-size: 11px; padding: 1px 5px; white-space: nowrap;
  }

  #guides { position: absolute; inset: 0; pointer-events: none; }
  .guide { position: absolute; background: var(--mk-cyan); pointer-events: auto; }
  .guide.gx { top: 0; bottom: 0; width: 1px; cursor: ew-resize; }
  .guide.gy { left: 0; right: 0; height: 1px; cursor: ns-resize; }
  .guide::after {
    content: ''; position: absolute; inset: -3px;
  }
  #marquee {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan); background: rgba(102, 217, 239, 0.10);
  }

  /* ---- hotbar ---- */

  /* ---- collapsible palette sections ---- */
  .cat {
    color: var(--mk-comment); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 4px 3px; cursor: pointer;
    grid-column: 1 / 3; display: flex; align-items: center; gap: 5px;

<script>
// ---------- document model ----------

let nextId = 100;
let selectedId = null;

// Declared up here because the keymap binds these keys well before the hotbar's
// rendering code appears further down the file.
const HOTBAR_KEYS = '0123456789-='.split('');
const HOTBAR_KEY = 'imguistudio.hotbar';
const hotbar = new Array(HOTBAR_KEYS.length).fill(null);

const doc = {
  type: 'window', id: 'root', label: 'My Panel', w: 380, h: 460,
  children: [
    { type: 'text',        id: 'n1', label: 'Engine settings' },
    { type: 'separator',   id: 'n2', label: '' },
    { type: 'checkbox',    id: 'n3', label: 'Enable turbo' },
    { type: 'button',      id: 'n4', label: 'Reset', sameline: true },
    { type: 'sliderfloat', id: 'n5', label: 'Speed', n: 1, min: 0, max: 10 },
    { type: 'inputtext',   id: 'n6', label: 'Preset name' },
    { type: 'coloredit',   id: 'n7', label: 'Tint', n: 3 },
    { type: 'progressbar', id: 'n8', label: '', fraction: 0.4 },
  ],
};

const DEFAULT_DOC = JSON.parse(JSON.stringify(doc));
const SAVE_KEY = 'imguistudio.doc.v1';

const isContainer = node => !!(WIDGETS[node.type] && WIDGETS[node.type].container);

// depth-first walk yielding {node, parent, index}
function walk(node, fn, parent = null, index = 0, depth = 0) {
  if (fn(node, parent, index, depth) === false) return false;
  const kids = node.children || [];
  for (let i = 0; i < kids.length; i++) {
    if (walk(kids[i], fn, node, i, depth + 1) === false) return false;
  }
  return true;
}

function findNode(id) {
  let found = null;
  walk(doc, n => { if (n.id === id) { found = n; return false; } });
  return found;
}

function findParent(id) {
  let found = null;
  walk(doc, (n, p) => { if (n.id === id) { found = p; return false; } });
  return found;
}

function isAncestor(ancestorId, nodeId) {
  const a = findNode(ancestorId);
  if (!a) return false;
  let hit = false;
  walk(a, n => { if (n.id === nodeId && n.id !== ancestorId) { hit = true; return false; } });
  return hit;
}

function makeNode(type) {
  const spec = WIDGETS[type];
  const node = { type, id: 'n' + (nextId++) };
  for (const [k, , d] of spec.props || []) node[k] = d;
  if (spec.container) node.children = [];
  return node;
}

function detach(id) {
  const parent = findParent(id);
  if (!parent) return null;
  const i = parent.children.indexOf(findNode(id));
  if (i < 0) return null;
  return parent.children.splice(i, 1)[0];
}

// drop = { parentId, index, sameline? }
function insertAt(node, drop) {
  const parent = findNode(drop.parentId) || doc;
  if (!parent.children) parent.children = [];
  const i = Math.max(0, Math.min(drop.index, parent.children.length));
  if (drop.sameline) node.sameline = true; else delete node.sameline;
  parent.children.splice(i, 0, node);
}

function addNode(type) {
  const node = makeNode(type);
  // append into the selected container, otherwise at the end of the window
  const sel = selectedId ? findNode(selectedId) : null;
  const host = sel && isContainer(sel) ? sel : doc;
  if (!host.children) host.children = [];
  host.children.push(node);
  // the new node becomes the whole selection: leaving the previous one in the
  // set would point Delete and Duplicate at widgets the user is done with
  selection.clear();
  selection.add(node.id);
  selectedId = node.id;
  lastInsertType = type;
  refresh();
}

function insertNodeAt(type, drop) {
  const node = makeNode(type);
  insertAt(node, drop);
  selection.clear();
  selection.add(node.id);
  selectedId = node.id;
  lastInsertType = type;
  refresh();
}

function moveNodeTo(id, drop) {
  if (drop.parentId === id || isAncestor(id, drop.parentId)) return; // no cycles
  const parent = findParent(id);
  const oldIndex = parent ? parent.children.indexOf(findNode(id)) : -1;
  const node = detach(id);
  if (!node) return;
  // removing from earlier in the same list shifts the target index down
  const d = { ...drop };
  if (parent && parent.id === drop.parentId && oldIndex >= 0 && oldIndex < drop.index) d.index -= 1;
  insertAt(node, d);
  selectedId = id;
  refresh();
}

// Dragging any member of a multi-selection takes the whole selection with it.
// Moving only the grabbed node made a marquee select look like it had worked
// right up until you tried to use it.
function moveSelectionTo(id, drop) {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (nodes.length < 2 || !selection.has(id)) { moveNodeTo(id, drop); return; }
  // dropping inside one of the nodes being moved would orphan the rest
  if (nodes.some(n => n.id === drop.parentId || isAncestor(n.id, drop.parentId))) return;
  const parent = findNode(drop.parentId) || doc;
  if (!parent.children) parent.children = [];
  // count how many of the moved nodes sit before the drop point in this list,
  // since detaching them shifts the target index down by that much
  const before = nodes.filter(n => {
    const i = parent.children.indexOf(n);
    return i >= 0 && i < drop.index;
  }).length;
  for (const n of nodes) detach(n.id);
  let at = Math.max(0, Math.min(drop.index - before, parent.children.length));
  for (const n of nodes) {
    if (drop.sameline && n === nodes[0]) n.sameline = true;
    parent.children.splice(at++, 0, n);
  }
  selectMany(nodes.map(n => n.id));
  refresh();
}

function removeNode(id) {
  detach(id);
  // the selection may have been a descendant of the removed subtree
  for (const s of [...selection]) if (!findNode(s)) selection.delete(s);
  if (selectedId && selectedId !== 'root' && !findNode(selectedId)) {
    selectedId = selection.size ? [...selection][selection.size - 1] : null;
  }
  refresh();
}

function moveNode(id, delta) {
  const parent = findParent(id);
  if (!parent) return;
  const i = parent.children.indexOf(findNode(id));
  const j = i + delta;
  if (i < 0 || j < 0 || j >= parent.children.length) return;
  [parent.children[i], parent.children[j]] = [parent.children[j], parent.children[i]];
  refresh();
}

// ---------- history (undo/redo) ----------

const history = []; // { docStr, sel }
let histIndex = -1;
let lastHistAt = 0;
let lastCoalescible = false;

// Only document changes create entries. Selection is carried along for restore
// but never compared, or arrow-key browsing would flood the ring and push real
// edits out of reach.
function pushHistory(coalesce) {
  const docStr = JSON.stringify({ doc, nextId });
  if (histIndex >= 0 && history[histIndex].docStr === docStr) return;
  const now = Date.now();
  history.length = histIndex + 1;
  // A burst only merges into an entry that was itself a coalescible edit.
  // Without that check, typing right after an insert would overwrite the
  // insert's snapshot and undo would delete the widget instead of the label.
  if (coalesce && lastCoalescible && histIndex > 0 && now - lastHistAt < 1000) {
    history[histIndex] = { docStr, sel: selectedId };
  } else {
    history.push({ docStr, sel: selectedId });
    histIndex = history.length - 1;
    if (history.length > 100) { history.shift(); histIndex--; }
  }
  lastCoalescible = !!coalesce;
  lastHistAt = now;
}

// Each project carries its own undo stack, so switching starts a fresh one
// rather than letting Ctrl+Z reach back into a document you left.
function resetHistory() {
  history.length = 0;
  histIndex = -1;
  lastCoalescible = false;
}

// bypasses refresh() so restoring can't push a new history entry
function restoreSnapshot(entry) {
  const s = JSON.parse(entry.docStr);
  doc.children = s.doc.children;
  for (const [k] of WIDGETS.window.props) doc[k] = s.doc[k];
  nextId = s.nextId;
  selectedId = entry.sel;
  if (selectedId && selectedId !== 'root' && !findNode(selectedId)) selectedId = null;
  renderTree();
  renderProps();
  renderCode();
  pushDoc();
  saveLocal();
}

function undo() { if (histIndex > 0) { histIndex--; restoreSnapshot(history[histIndex]); } }
function redo() { if (histIndex < history.length - 1) { histIndex++; restoreSnapshot(history[histIndex]); } }

// ---------- selection navigation and structure verbs ----------

// ---------- selection set ----------
// Invariant: no node is in the set if an ancestor is also in it. Normalizing on
// every mutation is what makes delete/copy/codegen order-independent instead of
// needing defensive checks at each call site.
const selection = new Set();

function normalizeSelection() {
  for (const id of [...selection]) {
    for (const other of selection) {
      if (other !== id && isAncestor(other, id)) { selection.delete(id); break; }
    }
  }
  if (selectedId && !selection.has(selectedId)) {
    selectedId = selection.size ? [...selection][selection.size - 1] : null;
  }
}

function selectId(id) {
  selection.clear();
  if (id) selection.add(id);
  selectedId = id;
  refresh();
}

function selectMany(ids) {
  selection.clear();
  for (const id of ids) if (id) selection.add(id);
  normalizeSelection();
  selectedId = selection.size ? [...selection][selection.size - 1] : null;
  refresh();
}

function toggleSelected(id) {
  if (selection.has(id)) {
    selection.delete(id);
    if (selectedId === id) selectedId = selection.size ? [...selection][selection.size - 1] : null;
  } else {
    selection.add(id);
    selectedId = id;
  }
  normalizeSelection();
  refresh();
}

function clearSelection() {
  selection.clear();
  selectedId = null;
}

// selection in document order, ancestors already removed
function selectedNodes() {
  const out = [];
  walk(doc, n => { if (selection.has(n.id)) out.push(n); });
  return out;
}

function selectSibling(delta) {
  if (!selectedId || selectedId === 'root') {
    if (doc.children.length) selectId(doc.children[delta < 0 ? doc.children.length - 1 : 0].id);
    return;
  }
  const parent = findParent(selectedId);
  if (!parent) return;
  const i = parent.children.findIndex(n => n.id === selectedId);
  const j = Math.max(0, Math.min(parent.children.length - 1, i + delta));
  if (j !== i) selectId(parent.children[j].id);
}

function selectEdge(last) {
  const parent = selectedId && selectedId !== 'root' ? findParent(selectedId) : doc;
  const kids = (parent || doc).children;
  if (kids.length) selectId(kids[last ? kids.length - 1 : 0].id);
}

function descend() {
  const node = selectedId ? findNode(selectedId) : doc;
  const kids = (node && node.children) || [];
  if (kids.length) selectId(kids[0].id);
}

function ascend() {
  if (!selectedId) return;
  if (selectedId === 'root') { selectId(null); return; }
  const parent = findParent(selectedId);
  selectId(parent ? parent.id : null);
}

function cloneWithNewIds(node) {
  const copy = JSON.parse(JSON.stringify(node));
  walk(copy, n => { n.id = 'n' + (nextId++); });
  return copy;
}

// where an insert lands relative to the selection: inside a selected
// container, after a selected leaf, or at the end of the window
function dropAfterSelection() {
  const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  if (node && isContainer(node)) return { parentId: node.id, index: (node.children || []).length };
  if (node) {
    const parent = findParent(node.id);
    return { parentId: parent.id, index: parent.children.indexOf(node) + 1 };
  }
  return { parentId: 'root', index: doc.children.length };
}

// The structure verbs are bound and labelled as selection verbs, so they act on
// the whole selection. Grouping by parent first keeps each list's splices
// independent, which is what lets a selection spanning containers work at all.
function byParent(nodes) {
  const groups = new Map();
  for (const n of nodes) {
    const p = findParent(n.id);
    if (!p) continue;
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(n);
  }
  return groups;
}

function reorderSelection(delta, extreme) {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (!nodes.length) return;
  for (const [parent, group] of byParent(nodes)) {
    const list = parent.children;
    // pull the block out, then reinsert it as a unit, so a multi-selection
    // keeps its internal order instead of shuffling against itself
    const idx = group.map(n => list.indexOf(n)).sort((a, b) => a - b);
    const block = idx.map(i => list[i]);
    const anchor = delta < 0 ? idx[0] : idx[idx.length - 1];
    for (let k = idx.length - 1; k >= 0; k--) list.splice(idx[k], 1);
    const before = idx.filter(i => i < anchor).length;
    let target = extreme
      ? (delta < 0 ? 0 : list.length)
      : Math.max(0, Math.min(list.length, anchor - before + delta));
    list.splice(target, 0, ...block);
  }
  refresh();
}

function wrapSelection() {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (!nodes.length) return;
  let last = null;
  for (const [parent, group] of byParent(nodes)) {
    const list = parent.children;
    const idx = group.map(n => list.indexOf(n)).sort((a, b) => a - b);
    const at = idx[0];
    const grp = makeNode('group');
    // the join belongs to whatever comes first, which is now the group
    if (group[0].sameline) { grp.sameline = true; delete group[0].sameline; }
    for (let k = idx.length - 1; k >= 0; k--) list.splice(idx[k], 1);
    grp.children.push(...group);
    list.splice(at, 0, grp);
    last = grp;
  }
  if (last) selectId(last.id);
}

function unwrapSelection() {
  const nodes = selectedNodes().filter(n => n !== doc && isContainer(n));
  if (!nodes.length) return;
  let first = null;
  for (const node of nodes) {
    const parent = findParent(node.id);
    if (!parent) continue;
    const idx = parent.children.indexOf(node);
    const kids = node.children || [];
    // the container may be carrying a join that wrapSelection moved onto it
    if (node.sameline && kids[0]) kids[0].sameline = true;
    parent.children.splice(idx, 1, ...kids);
    if (!first) first = kids[0] || parent;
  }
  selectId(first ? first.id : null);
}

function toggleJoin() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  if (node.sameline) delete node.sameline;
  else node.sameline = true;
  refresh();
}

function duplicateSelection() {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (!nodes.length) return;
  const added = [];
  for (const node of nodes) {
    const parent = findParent(node.id);
    const copy = cloneWithNewIds(node);
    insertAt(copy, {
      parentId: parent.id,
      index: parent.children.indexOf(node) + 1,
      sameline: !!node.sameline,
    });
    added.push(copy.id);
  }
  selectMany(added);
}

function duplicateTo(id, drop) {
  const node = findNode(id);
  if (!node) return;
  const copy = cloneWithNewIds(node);
  insertAt(copy, drop);
  selectId(copy.id);
}

function deleteSelection() {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (!nodes.length) return;
  const first = nodes[0];
  const parent = findParent(first.id);
  const i = parent ? parent.children.indexOf(first) : 0;
  for (const n of nodes) detach(n.id);
  clearSelection();
  const next = parent && (parent.children[i] || parent.children[i - 1]);
  selectId(next ? next.id : (parent && parent !== doc ? parent.id : null));
}

// ---------- clipboard and repeat ----------

let clipboardNode = null;
let lastInsertType = null;

function copySelection() {
  const nodes = selectedNodes().filter(n => n !== doc);
  if (!nodes.length) return false;
  clipboardNode = JSON.stringify(nodes);
  return true;
}

function cutSelection() {
  if (copySelection()) deleteSelection();
}

function pasteClipboard() {
  if (!clipboardNode) return;
  let payload = JSON.parse(clipboardNode);
  if (!Array.isArray(payload)) payload = [payload];   // pre-multiselect clipboards
  const drop = dropAfterSelection();
  const added = [];
  payload.forEach((raw, i) => {
    const node = cloneWithNewIds(raw);
    const d = { ...drop, index: drop.index + i };
    // a joined widget stays joined through cut/copy+paste, matching Ctrl+D
    if (node.sameline) d.sameline = true;
    insertAt(node, d);
    added.push(node.id);
  });
  selectMany(added);
}

// Stamping repeats want siblings: with dropAfterSelection, inserting a
// container then stamping again would nest each insert inside the previous.
function dropSiblingAfterSelection() {
  const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  if (!node) return { parentId: 'root', index: doc.children.length };
  const parent = findParent(node.id);
  return { parentId: parent.id, index: parent.children.indexOf(node) + 1 };
}

function repeatInsert() {
  if (lastInsertType) insertNodeAt(lastInsertType, dropSiblingAfterSelection());
}

function saveLocal() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, nextId, doc })); } catch (e) {}
  // the active project holds the same document, so it has to move in step
  if (typeof saveProjects === 'function' && activeProject) saveProjects();
}

function computeNextId() {
  let m = 100;
  walk(doc, n => {
    const num = parseInt(String(n.id).replace(/^n/, ''), 10);
    if (!isNaN(num) && num >= m) m = num + 1;
  });
  return m;
}

// Imported documents are untrusted. Beyond type-checking, an enum has to be
// checked against its option list: a stray `dir` reaches IM_ASSERT(0) inside
// ImGui and an out-of-range `n` would emit something like InputInt5.
function coerce(t, raw, def, opts) {
  // preserved source, never truncated
  if (t === 'longtext') return typeof raw === 'string' ? raw.slice(0, 20000) : def;
  if (t === 'text' || t === 'items') return typeof raw === 'string' ? raw.slice(0, 200) : def;
  if (t === 'bool') return raw === true;
  const num = Number(raw);
  if (t === 'enum') {
    const allowed = (opts || []).map(o => Number(Array.isArray(o) ? o[1] : o));
    return allowed.includes(num) ? num : def;
  }
  if (!Number.isFinite(num)) return def;
  return t === 'int' ? Math.trunc(num) : num;
}

// Keep only the slots this widget type actually reads, as four finite 0..1
// floats. Anything else would push a colour the engine can't map.
function sanitizeColors(type, raw) {
  if (!raw || typeof raw !== 'object') return null;
  const allowed = colorSlots(type);
  const out = {};
  for (const [slot, v] of Object.entries(raw)) {
    if (!allowed.includes(slot) || !Array.isArray(v)) continue;
    out[slot] = [0, 1, 2, 3].map(i => {
      const x = Number(v[i]);
      return Number.isFinite(x) ? Math.max(0, Math.min(1, x)) : (i === 3 ? 1 : 0);
    });
  }
  return Object.keys(out).length ? out : null;
}

function sanitize(list, ids) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const n of list) {
    if (!n || typeof n !== 'object' || typeof n.type !== 'string') continue;
    const spec = WIDGETS[n.type];
    if (!spec || n.type === 'window') continue;
    const c = { type: n.type };
    // keep looking until the id really is free, or a document full of
    // duplicates would just get more duplicates
    let cid = typeof n.id === 'string' && n.id ? n.id : '';
    if (!cid || ids.has(cid)) { do { cid = 'n' + (nextId++); } while (ids.has(cid)); }
    c.id = cid;
    ids.add(cid);
    for (const [k, t, d, opts] of spec.props || []) c[k] = coerce(t, n[k], d, opts);
    if (n.sameline === true) c.sameline = true;
    const cols = sanitizeColors(n.type, n.colors);
    if (cols) c.colors = cols;
    if (spec.container) c.children = sanitize(n.children, ids);
    out.push(c);
  }
  return out;
}

// Highest id in the raw payload, so freshly minted ids can't collide with one
// that appears later in the same document.
function maxRawId(list, cur) {
  if (!Array.isArray(list)) return cur;
  for (const n of list) {
    if (!n || typeof n !== 'object') continue;
    const num = parseInt(String(n.id ?? '').replace(/^n/, ''), 10);
    if (!isNaN(num) && num >= cur) cur = num + 1;
    cur = maxRawId(n.children, cur);
  }
  return cur;
}

// Replaces the working document in place so existing references stay valid.
function applyDocData(d, savedNextId) {
  nextId = Math.max(savedNextId || 0, 100, maxRawId(d.children, 100));
  const ids = new Set(['root']);
  doc.children = sanitize(d.children, ids);
  for (const [k, t, def, opts] of WIDGETS.window.props) doc[k] = coerce(t, d[k], def, opts);
  // the window carries colour overrides too, through the same filter
  delete doc.colors;
  const winCols = sanitizeColors('window', d.colors);
  if (winCols) doc.colors = winCols;
  // hand-written C++ around the window survives save/load like any other content
  delete doc.pre; delete doc.post;
  if (typeof d.pre === 'string' && d.pre.trim()) doc.pre = d.pre;
  if (typeof d.post === 'string' && d.post.trim()) doc.post = d.post;
  // a whole new document re-asserts its window size, even onto a window the
  // user had dragged to some other size
  if (engineReady) Module.ccall('engine_reset_window_size', null, [], []);
  clearSelection();
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.doc || s.doc.type !== 'window') return false;
    applyDocData(s.doc, s.nextId);
    return true;
  } catch (e) { return false; }
}

// ---------- projects ----------
// Several documents, each with its own undo stack, switched by the tab strip.
// The active one is still mirrored to SAVE_KEY so an older build (and the
// self-test's reload check) keeps finding what it expects.

const PROJECTS_KEY = 'imguistudio.projects.v1';
let projects = [];       // { id, name, doc, nextId }
let activeProject = null;
let projectSeq = 1;

function newProjectId() { return 'p' + (projectSeq++) + '-' + projects.length; }

function snapshotActive() {
  const p = projects.find(x => x.id === activeProject);
  if (!p) return;
  p.doc = JSON.parse(JSON.stringify(doc));
  p.nextId = nextId;
}

function saveProjects() {
  snapshotActive();
  try {
    localStorage.setItem(PROJECTS_KEY, JSON.stringify({ v: 1, projects, activeProject, projectSeq }));
  } catch (e) {}
}

function loadProjects() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(PROJECTS_KEY) || 'null'); } catch (e) {}
  if (s && Array.isArray(s.projects) && s.projects.length) {
    projects = s.projects.filter(p => p && p.doc && p.doc.type === 'window');
    projectSeq = s.projectSeq || projects.length + 1;
    activeProject = projects.some(p => p.id === s.activeProject) ? s.activeProject : projects[0].id;
  }
  if (!projects.length) {
    // first run, or an upgrade from the single-document build: adopt whatever
    // was saved rather than throwing the user's work away
    const had = loadLocal();
    projects = [{
      id: newProjectId(),
      name: had ? (doc.label || 'Untitled') : 'Untitled',
      doc: JSON.parse(JSON.stringify(doc)),
      nextId,
    }];
    activeProject = projects[0].id;
  }
  const active = projects.find(p => p.id === activeProject);
  applyDocData(active.doc, active.nextId);
}

function switchProject(id) {
  if (id === activeProject) return;
  snapshotActive();
  const p = projects.find(x => x.id === id);
  if (!p) return;
  activeProject = id;
  applyDocData(p.doc, p.nextId);
  resetHistory();
  resetPan();
  refresh();
  renderProjectTabs();
}

function addProject(name, docData) {
  snapshotActive();
  const p = {
    id: newProjectId(),
    name: name || 'Untitled ' + (projects.length + 1),
    doc: docData ? JSON.parse(JSON.stringify(docData)) : JSON.parse(JSON.stringify(DEFAULT_DOC)),
    nextId: 100,
  };
  projects.push(p);
  activeProject = p.id;
  applyDocData(p.doc, p.nextId);
  resetHistory();
  refresh();
  renderProjectTabs();
  return p;
}

function closeProject(id) {
  const i = projects.findIndex(p => p.id === id);
  if (i < 0) return;
  const go = () => {
    projects.splice(i, 1);
    if (!projects.length) {
      projects.push({ id: newProjectId(), name: 'Untitled', doc: JSON.parse(JSON.stringify(DEFAULT_DOC)), nextId: 100 });
    }
    if (activeProject === id) {
      activeProject = projects[Math.min(i, projects.length - 1)].id;
      const p = projects.find(x => x.id === activeProject);
      applyDocData(p.doc, p.nextId);
      resetHistory();
      refresh();
    }
    saveProjects();
    renderProjectTabs();
  };
  const p = projects[i];
  const n = countNodes(p.doc.children);
  if (n > 0) askConfirm(`Close "${p.name}"? Its ${n} widget${n > 1 ? 's' : ''} will be gone.`, go);
  else go();
}

const projTabsEl = document.getElementById('projtabs');

function renderProjectTabs() {
  projTabsEl.innerHTML = '';
  for (const p of projects) {
    const t = document.createElement('div');
    t.className = 'ptab' + (p.id === activeProject ? ' on' : '');
    const n = document.createElement('span');
    n.className = 'pname';
    n.textContent = p.name;
    n.title = 'Click to open, double-click to rename';
    t.appendChild(n);
    const x = document.createElement('button');
    x.textContent = '✕';
    x.title = 'Close this project';
    x.onclick = e => { e.stopPropagation(); closeProject(p.id); };
    t.appendChild(x);
    t.onclick = () => switchProject(p.id);
    n.ondblclick = e => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.className = 'prename';
      input.value = p.name;
      const commit = () => {
        p.name = input.value.trim() || p.name;
        saveProjects();
        renderProjectTabs();
      };
      input.onblur = commit;
      input.onkeydown = ev => {
        ev.stopPropagation();
        if (ev.key === 'Enter') commit();
        if (ev.key === 'Escape') renderProjectTabs();
      };
      t.replaceChild(input, n);
      input.focus();
      input.select();
    };
    projTabsEl.appendChild(t);
  }
  const add = document.createElement('button');
  add.className = 'padd';
  add.textContent = '+';
  add.title = 'New project';
  add.onclick = () => { addProject(); saveProjects(); };
  projTabsEl.appendChild(add);
}

// ---------- engine bridge ----------

let engineReady = false;
let editMode = true;
let latestRects = [];
let engineWantsText = false;

function pushDoc() {
  if (!engineReady) return;
  Module.ccall('engine_set_document', null, ['string'], [JSON.stringify(doc)]);
}

var Module = {
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized: () => {
    engineReady = true;
    statusBase = 'engine: running (real Dear ImGui via wasm) — ' + paletteCount + ' widget types';
    updateArmedUI(); // writes statusBase without clobbering an active armed line
    syncCanvasSize();
    Module.ccall('engine_set_grid', null, ['number', 'number'], [showGrid ? 1 : 0, 20]);
    Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
    pushDoc();
  },
};

// ---------- canvas editing ----------

const canvas = document.getElementById('canvas');
// declared up here because panning, focus and the hover readout all reach for
// it well before the rulers section that used to own it
const canvasHost = document.getElementById('canvashost');
const selbox = document.getElementById('selbox');
const dropline = document.getElementById('dropline');
const dropbox = document.getElementById('dropbox');
const ghost = document.getElementById('ghost');

// Panning is a transform on #viewport, and every coordinate below is read from
// the canvas's own client rect, so nothing else has to account for it.
const viewportEl = document.getElementById('viewport');
const coordTip = document.getElementById('coordtip');
let pan = { x: 0, y: 0 };

function applyPan() {
  viewportEl.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
}

function panBy(dx, dy) {
  pan.x += dx;
  pan.y += dy;
  applyPan();
}

// Centre the selection in the visible area. Only useful once the document is
// bigger than the canvas, which is exactly when you can't find things.
function focusSelection() {
  const r = selectedId && rectFor(selectedId);
  if (!r) return false;
  const host = canvasHost.getBoundingClientRect();
  pan.x = Math.round(host.width / 2 - (r.x + r.w / 2));
  pan.y = Math.round(host.height / 2 - (r.y + r.h / 2));
  applyPan();
  return true;
}

function resetPan() {
  pan = { x: 0, y: 0 };
  applyPan();
}

// The footer used to repeat the engine state, which never changes after load.
// It now reads out whatever is under the cursor, which is the thing you
// actually want while you are pointing at something.
const hoverInfoEl = document.getElementById('hoverInfo');

function updateHoverStatus(e) {
  if (!e) {
    hoverInfoEl.innerHTML = '—';
    return;
  }
  const p = canvasPoint(e);
  const hit = hitTest(p);
  const node = hit && hit.id !== 'root' ? findNode(hit.id) : (hit ? doc : null);
  const pos = `<i>${p.x}, ${p.y}</i>`;
  if (!node) { hoverInfoEl.innerHTML = pos; return; }
  const spec = WIDGETS[node.type] || {};
  const label = node === doc ? (doc.label || 'Window') : (node.label || spec.name || node.type);
  hoverInfoEl.innerHTML = `<b>${esc(label)}</b> <i>${esc(spec.name || node.type)}</i> · `
    + `${Math.round(hit.w)}x${Math.round(hit.h)} at ${Math.round(hit.x)}, ${Math.round(hit.y)} · ${pos}`;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top,
    inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
  };
}

function rectFor(id) {
  return latestRects.find(r => r.id === id);
}

// Smallest containing rect wins. Container rects are emitted at different
// points relative to their children, so area beats draw order here.
function hitTest(p) {
  let best = null;
  for (const r of latestRects) {
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      if (!best || r.w * r.h < best.w * best.h) best = r;
    }
  }
  return best;
}

const selboxes = document.getElementById('selboxes');

function updateSelectionOverlay() {
  const primary = editMode && selectedId ? rectFor(selectedId) : null;
  if (!primary) {
    selbox.style.display = 'none';
  } else {
    selbox.style.display = 'block';
    selbox.style.left = (primary.x - 2) + 'px';
    selbox.style.top = (primary.y - 2) + 'px';
    selbox.style.width = (primary.w + 4) + 'px';
    selbox.style.height = (primary.h + 4) + 'px';
    // handles only on the axes this widget's spec actually declares, and only
    // for a single selection (a sizing drag has no meaning across a set)
    const node = findNode(selectedId);
    const props = (node && WIDGETS[node.type] && WIDGETS[node.type].props) || [];
    const hasW = props.some(p => p[0] === 'w');
    const hasH = props.some(p => p[0] === 'h');
    // stays resizable mid-drag: dropping the handle the moment it is grabbed
    // takes the grip out from under the cursor
    selbox.classList.toggle('resizable', (hasW || hasH) && selection.size <= 1);
    selbox.classList.toggle('now', !hasW);
    selbox.classList.toggle('noh', !hasH);
  }
  // secondary members of the selection
  const others = [...selection].filter(id => id !== selectedId);
  if (!editMode || !others.length) { selboxes.innerHTML = ''; return; }
  selboxes.innerHTML = '';
  for (const id of others) {
    const r = rectFor(id);
    if (!r) continue;
    const d = document.createElement('div');
    d.className = 'sb';
    d.style.left = (r.x - 2) + 'px';
    d.style.top = (r.y - 2) + 'px';
    d.style.width = (r.w + 4) + 'px';
    d.style.height = (r.h + 4) + 'px';
    selboxes.appendChild(d);
  }
}

function pollEngine() {
  if (!engineReady) return;
  // emscripten runs main() after onRuntimeInitialized, so glfwCreateWindow
  // stomps whatever size we set during init. Re-assert it here so the canvas
  // converges on its container no matter how the ordering falls out.
  if (canvas.width !== canvasHost.clientWidth && canvasHost.clientWidth > 0) syncCanvasSize();
  try {
    // the ccall itself throws after a wasm abort, so it must sit inside the
    // try or one abort would kill the rAF chain and spam the interval backstop
    const raw = Module.ccall('engine_get_rects', 'string', [], []);
    const payload = JSON.parse(raw);
    latestRects = payload.rects || [];
    engineWantsText = !!payload.wantText;
  } catch (e) {
    if (!pollEngine.reported) { pollEngine.reported = true; console.warn('[tick] ' + (e && e.stack || e)); }
    latestRects = [];
  }
  updateSelectionOverlay();
}

function tick() {
  pollEngine();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// rAF stops entirely while the window is occluded (locked screen, minimized),
// so a timer backstop keeps selection and drop targeting alive regardless
setInterval(pollEngine, 100);

// drag = { kind: 'palette'|'move', type?, nodeId?, started, startX, startY, drop }
let drag = null;

// excludeId keeps a move-drag from targeting itself or its own subtree, and
// forceJoin (held Shift) turns any leaf hit into a SameLine drop.
function computeDropTarget(p, excludeId, forceJoin) {
  if (!p.inside) return null;
  const hit = hitTest(p);
  if (!hit) return null;
  const node = findNode(hit.id);
  if (!node) return null;
  // Hovering the dragged node or its own subtree has no valid answer, so the
  // drop is a no-op rather than a surprise move to the bottom of the panel.
  if (excludeId && (node.id === excludeId || isAncestor(excludeId, node.id))) {
    return null;
  }
  if (node.id === doc.id) {
    return { parentId: doc.id, index: (doc.children || []).length, anchorId: doc.id, pos: 'inside' };
  }
  const parent = findParent(node.id) || doc;
  const idx = parent.children.indexOf(node);
  if (isContainer(node) && !forceJoin) {
    // upper third inserts before the container, the rest drops inside it
    if (p.y < hit.y + hit.h / 3) {
      return { parentId: parent.id, index: idx, anchorId: node.id, pos: 'above' };
    }
    return { parentId: node.id, index: (node.children || []).length, anchorId: node.id, pos: 'inside' };
  }
  if (forceJoin || p.x >= hit.x + hit.w * 0.55) {
    return { parentId: parent.id, index: idx + 1, sameline: true, anchorId: node.id, pos: 'right' };
  }
  const above = p.y < hit.y + hit.h / 2;
  return { parentId: parent.id, index: above ? idx : idx + 1, anchorId: node.id, pos: above ? 'above' : 'below' };
}

function updateDropIndicator(drop) {
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
  if (!drop) return;
  const r = rectFor(drop.anchorId);
  if (!r) return;
  if (drop.pos === 'inside') {
    dropbox.style.display = 'block';
    dropbox.style.left = (r.x + 1) + 'px';
    dropbox.style.top = (r.y + 1) + 'px';
    dropbox.style.width = Math.max(0, r.w - 2) + 'px';
    dropbox.style.height = Math.max(0, r.h - 2) + 'px';
    return;
  }
  dropline.style.display = 'block';
  if (drop.pos === 'right') {
    dropline.style.left = (r.x + r.w + 2) + 'px';
    dropline.style.top = r.y + 'px';
    dropline.style.width = '2px';
    dropline.style.height = r.h + 'px';
    return;
  }
  dropline.style.left = r.x + 'px';
  dropline.style.top = (drop.pos === 'above' ? r.y - 2 : r.y + r.h) + 'px';
  dropline.style.width = r.w + 'px';
  dropline.style.height = '2px';
}

const marqueeEl = document.getElementById('marquee');
let marquee = null;
let resizing = null;
const MIN_DRAG_SIZE = 8;   // 0 means "auto" to ImGui, so a drag must not reach it

// A flow layout has almost no empty canvas to rubber-band from (widgets tile
// edge to edge), so Ctrl+drag starts a marquee from anywhere.
function startMarquee(e, p, additive) {
  marquee = {
    x0: p.x, y0: p.y, x1: p.x, y1: p.y,
    base: additive ? new Set(selection) : new Set(),
  };
  marqueeEl.style.display = 'block';
  updateMarquee();
}

function updateMarquee() {
  const m = marquee;
  const x = Math.min(m.x0, m.x1), y = Math.min(m.y0, m.y1);
  const w = Math.abs(m.x1 - m.x0), h = Math.abs(m.y1 - m.y0);
  marqueeEl.style.left = x + 'px';
  marqueeEl.style.top = y + 'px';
  marqueeEl.style.width = w + 'px';
  marqueeEl.style.height = h + 'px';

  const box = { x, y, w, h };
  const encloses = r => r.x >= box.x && r.y >= box.y
    && r.x + r.w <= box.x + box.w && r.y + r.h <= box.y + box.h;
  const overlaps = r => r.x < box.x + box.w && r.x + r.w > box.x
    && r.y < box.y + box.h && r.y + r.h > box.y;

  const hits = new Set(m.base);
  walk(doc, n => {
    if (n === doc) return;
    const r = rectFor(n.id);
    if (!r) return;
    // Containers only when fully enclosed; a marquee that merely clips one
    // descends into it and takes the children instead.
    if (isContainer(n)) { if (encloses(r)) hits.add(n.id); }
    else if (overlaps(r)) hits.add(n.id);
  });
  selection.clear();
  for (const id of hits) selection.add(id);
  normalizeSelection();
  selectedId = selection.size ? [...selection][selection.size - 1] : null;
  paintDuringGesture();
}

// A mousemove can fire many times per frame, and both marquee select and resize
// used to rebuild the hierarchy, the properties and the whole C++ on each one.
// Coalescing to a frame keeps the feedback without the churn.
let gestureFrame = 0;
function paintDuringGesture(withCode) {
  if (gestureFrame) return;
  gestureFrame = requestAnimationFrame(() => {
    gestureFrame = 0;
    renderTree();
    renderProps();
    if (withCode) renderCode();
  });
}

// Resize is anchored to the size captured at drag start: reading the live rect
// mid-drag reflows the row and the rect moves under the cursor a frame later.
for (const h of selbox.querySelectorAll('.rh')) {
  h.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    const node = selectedId && findNode(selectedId);
    if (!node) return;
    const r = rectFor(node.id);
    resizing = {
      id: node.id, axis: h.dataset.axis,
      startX: e.clientX, startY: e.clientY,
      w0: Number(node.w) || (r ? Math.round(r.w) : 0),
      h0: Number(node.h) || (r ? Math.round(r.h) : 0),
    };
  });
}

// Middle-drag pans. Left is taken by select/move and Ctrl+left by the marquee,
// and Space is the live-preview quasimode, so the wheel button is what's left.
canvasHost.addEventListener('mousedown', e => {
  if (e.button !== 1) return;
  e.preventDefault();
  canvasHost.classList.add('panning');
  const from = { x: e.clientX, y: e.clientY, px: pan.x, py: pan.y };
  const move = ev => {
    pan.x = from.px + (ev.clientX - from.x);
    pan.y = from.py + (ev.clientY - from.y);
    applyPan();
  };
  const up = () => {
    canvasHost.classList.remove('panning');
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});
canvasHost.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

canvas.addEventListener('mousedown', e => {
  if (!editMode || e.button !== 0) return;
  canvas.focus({ preventScroll: true });
  const p = canvasPoint(e);
  if (armed) {
    const drop = computeDropTarget(p, null, e.shiftKey);
    if (drop) stampArmed(drop);
    return;
  }
  if (e.ctrlKey || e.metaKey) { startMarquee(e, p, e.shiftKey); return; }

  const hit = hitTest(p);
  if (hit && hit.id !== doc.id) {
    if (e.shiftKey) { toggleSelected(hit.id); return; }
    if (!selection.has(hit.id)) selectId(hit.id);
    else { selectedId = hit.id; refresh(); }
    drag = {
      kind: 'move', nodeId: hit.id, dup: e.altKey, started: false,
      startX: e.clientX, startY: e.clientY, drop: null,
    };
  } else if (hit) {
    selectId(hit.id);
  } else {
    // empty space: a plain drag here is also a marquee
    clearSelection();
    refresh();
    startMarquee(e, p, false);
  }
});

canvas.addEventListener('dblclick', e => {
  if (!editMode) return;
  const hit = hitTest(canvasPoint(e));
  if (!hit || hit.id === doc.id) return;
  const node = findNode(hit.id);
  if (!node) return;
  if ((WIDGETS[node.type].props || []).some(p => p[0] === 'label')) {
    selectId(node.id);
    beginInlineEdit(node.id);
  } else if (isContainer(node)) {
    selectId(node.id);
    descend();
  }
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!editMode) return;
  const hit = hitTest(canvasPoint(e));
  const node = hit && hit.id !== doc.id ? findNode(hit.id) : null;
  if (node) {
    // right-clicking outside the selection selects first, or the menu would
    // act on something other than what the user pointed at
    if (!selection.has(node.id)) selectId(node.id);
    openContextMenu(e, widgetMenu(node, false));
  } else {
    openContextMenu(e, backgroundMenu());
  }
});

function cancelDrag() {
  drag = null;
  ghost.style.display = 'none';
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
  if (marquee) { marquee = null; marqueeEl.style.display = 'none'; }
  resizing = null;
}

// ---------- inline label editing ----------
// Double-click, Enter or F2 to enter; Enter or click-away commits; Esc reverts.
// Labels are single-line, so Enter can commit without ambiguity.
const inlineEl = document.getElementById('inlineEdit');
let inlineId = null;
let inlineOriginal = '';

function beginInlineEdit(id) {
  const node = findNode(id);
  const r = rectFor(id);
  if (!node || !r || !(WIDGETS[node.type].props || []).some(p => p[0] === 'label')) return;
  inlineId = id;
  inlineOriginal = node.label || '';
  inlineEl.value = inlineOriginal;
  inlineEl.style.display = 'block';
  inlineEl.style.left = r.x + 'px';
  inlineEl.style.top = r.y + 'px';
  inlineEl.style.width = Math.max(80, r.w) + 'px';
  inlineEl.style.height = Math.max(18, r.h) + 'px';
  inlineEl.focus();
  inlineEl.select();
}

function endInlineEdit(commit, fromBlur) {
  if (inlineId === null) return;
  const node = findNode(inlineId);
  if (node) node.label = commit ? inlineEl.value : inlineOriginal;
  inlineId = null;
  inlineEl.style.display = 'none';
  if (fromBlur) {
    // Blur fires on mousedown. Rebuilding the panels here would replace the
    // element the click started on, so the click would never complete, and
    // stealing focus back to the canvas would undo whatever it landed on.
    requestAnimationFrame(() => refresh());
    return;
  }
  inlineEl.blur();
  canvas.focus({ preventScroll: true });
  refresh();
}

inlineEl.addEventListener('input', () => {
  const node = findNode(inlineId);
  if (node) { node.label = inlineEl.value; refresh(false); }
});
inlineEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { endInlineEdit(true); e.preventDefault(); }
  else if (e.key === 'Escape') { endInlineEdit(false); e.preventDefault(); }
  e.stopPropagation();
});
inlineEl.addEventListener('blur', () => endInlineEdit(true, true));

document.addEventListener('mousemove', e => {
  if (resizing) {
    const node = findNode(resizing.id);
    if (!node) { resizing = null; return; }
    // Stop short of 0: that is ImGui's auto-size sentinel, so dragging onto it
    // makes the widget jump back to its natural size instead of getting small.
    // Zero stays reachable from the inspector, where it is labelled.
    if (resizing.axis.includes('w')) {
      node.w = Math.max(MIN_DRAG_SIZE, Math.round(resizing.w0 + (e.clientX - resizing.startX)));
    }
    if (resizing.axis.includes('h')) {
      node.h = Math.max(MIN_DRAG_SIZE, Math.round(resizing.h0 + (e.clientY - resizing.startY)));
    }
    // The engine has to see every step so the preview tracks the cursor; the
    // panels and the generated C++ can wait for the next frame, and the undo
    // entry and the save wait for mouseup.
    pushDoc();
    paintDuringGesture(true);
    return;
  }
  if (marquee) {
    const p = canvasPoint(e);
    marquee.x1 = p.x;
    marquee.y1 = p.y;
    updateMarquee();
    return;
  }
  if (drag) {
    // A mouseup lost to focus stealing would leave a started drag armed forever.
    // Synthetic click sequences (test drivers, extensions) can emit buttons=0
    // moves between down and up, so only started drags cancel here; blur and
    // Escape cover the un-started case.
    if (drag.started && e.buttons === 0) { cancelDrag(); return; }
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.startX) + Math.abs(e.clientY - drag.startY) < 5) return;
      drag.started = true;
      const label = drag.kind === 'palette'
        ? WIDGETS[drag.type].name
        : (findNode(drag.nodeId)?.label || drag.nodeId);
      ghost.textContent = (drag.dup ? '+ ' : '') + label;
      ghost.style.display = 'block';
    }
    ghost.style.left = (e.clientX + 14) + 'px';
    ghost.style.top = (e.clientY + 14) + 'px';
    // duplicating may drop next to the original, so no self-exclusion then
    drag.drop = computeDropTarget(
      canvasPoint(e),
      drag.kind === 'move' && !drag.dup ? drag.nodeId : null,
      e.shiftKey);
    updateDropIndicator(drag.drop);
    return;
  }
  if (armed && editMode) {
    const p = canvasPoint(e);
    if (p.inside) {
      ghost.textContent = WIDGETS[armedType()].name;
      ghost.style.display = 'block';
      ghost.style.left = (e.clientX + 14) + 'px';
      ghost.style.top = (e.clientY + 14) + 'px';
      updateDropIndicator(computeDropTarget(p, null, e.shiftKey));
    } else {
      ghost.style.display = 'none';
      dropline.style.display = 'none';
      dropbox.style.display = 'none';
    }
  }
});

document.addEventListener('mouseup', e => {
  if (resizing) { resizing = null; refresh(); return; }
  if (marquee) {
    marquee = null;
    marqueeEl.style.display = 'none';
    refresh();
    return;
  }
  if (!drag) return;
  if (e.button !== 0) { cancelDrag(); return; }
  const d = drag;
  cancelDrag();
  if (!d.started) {
    if (d.kind === 'palette') addNode(d.type);
    return;
  }
  if (!d.drop) return;
  if (d.kind === 'palette') insertNodeAt(d.type, d.drop);
  else if (d.dup) duplicateTo(d.nodeId, d.drop);
  else moveSelectionTo(d.nodeId, d.drop);
});

window.addEventListener('blur', () => {
  if (drag) cancelDrag();
  // A gesture interrupted by alt-tab never sees its mouseup, so it would come
  // back still following the cursor with no button held.
  if (resizing) { resizing = null; refresh(); }
  if (marquee) { marquee = null; marqueeEl.style.display = 'none'; refresh(); }
  if (panelDrag) cancelPanelDrag();
  resetTabSpring();
});

// ---------- arming (widget stamp tool) ----------

const FAMILY_OF = {};
for (const [letter, types] of Object.entries(FAMILIES)) {
  for (const t of types) FAMILY_OF[t] = letter;
}

let armed = null; // { letter, index }
let statusBase = 'engine: loading...';

// Armed either by family letter (which cycles) or by a bare type, which is how
// a hotbar slot arms a widget that belongs to no family.
function armedType() {
  if (!armed) return null;
  return armed.type || FAMILIES[armed.letter][armed.index];
}

function arm(letter, backward) {
  const fam = FAMILIES[letter];
  if (armed && armed.letter === letter) {
    armed.index = (armed.index + (backward ? fam.length - 1 : 1)) % fam.length;
  } else {
    armed = { letter, index: 0 };
  }
  updateArmedUI();
}

// Arm a specific widget type rather than a family letter.
function rearm(type) {
  if (!WIDGETS[type]) return false;
  const fam = FAMILY_OF[type];
  armed = fam ? { letter: fam, index: FAMILIES[fam].indexOf(type) } : { type };
  updateArmedUI();
  return true;
}

function disarm() {
  if (!armed) return;
  armed = null;
  ghost.style.display = 'none';
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
  updateArmedUI();
}

function updateArmedUI() {
  document.getElementById('engineInfo').textContent = statusBase;
  document.getElementById('armInfo').textContent = armed
    ? 'armed: ' + WIDGETS[armedType()].name
      + (armed.letter ? ' (' + armed.letter + ' cycles, Enter inserts, Esc exits)'
        : ' (Enter inserts, Esc exits)')
    : '';
  for (const b of document.querySelectorAll('#palette button')) {
    b.classList.toggle('armedbtn', !!armed && b.dataset.type === armedType());
  }
  // cycling the family while hovering must retag the ghost in place
  if (armed && !drag && ghost.style.display === 'block') {
    ghost.textContent = WIDGETS[armedType()].name;
  }
}

function stampArmed(drop) {
  insertNodeAt(armedType(), drop); // stays armed for repeated stamps
}

// ---------- mode switching (with spring-loaded Tab) ----------

function setLiveMode(live) {
  editMode = !live;
  const hint = document.getElementById('modeHint');
  hint.classList.toggle('livehint', live);
  hint.innerHTML = live
    ? '<b>LIVE</b> — widgets respond'
    : 'hold <b>Space</b> to test interaction';
  if (live) disarm();
  if (engineReady) Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
  updateSelectionOverlay();
}

let tabTimer = null;
let tabHeld = false;
let tabPeek = false;
const TAB_HOLD_MS = 220;

function handleTabDown(e) {
  e.preventDefault();
  if (e.repeat || tabHeld) return;
  tabHeld = true;
  tabTimer = setTimeout(() => {
    tabTimer = null;
    // held past the threshold: peek Live, revert on release
    tabPeek = true;
    setLiveMode(true);
  }, TAB_HOLD_MS);
}

function handleTabUp() {
  if (!tabHeld) return;
  tabHeld = false;
  if (tabTimer) {
    // released before the threshold: a tap, toggle the mode
    clearTimeout(tabTimer);
    tabTimer = null;
    setLiveMode(editMode);
  } else if (tabPeek) {
    tabPeek = false;
    setLiveMode(false);
  }
}

function resetTabSpring() {
  if (tabTimer) { clearTimeout(tabTimer); tabTimer = null; }
  tabHeld = false;
  if (tabPeek) { tabPeek = false; setLiveMode(false); }
  releaseSpace();
}

// Hold Space to poke the real widgets. A pure quasimode: no threshold and no
// tap meaning, so it can't get stuck in the wrong mode (releasing always
// exits). It restores whatever mode you were in, so holding Space while
// already in sustained Live mode doesn't kick you back to Edit.
let spaceHeld = false;
let spaceWasLive = false;
let spaceWasArmed = null;

function handleSpaceDown(e) {
  e.preventDefault();
  if (e.repeat || spaceHeld) return;
  spaceHeld = true;
  spaceWasLive = !editMode;
  // Live mode disarms, but a peek is meant to be free: poking a widget and
  // letting go should hand back the tool you were holding.
  spaceWasArmed = armedType();
  // guides are editing chrome, and you're holding Space to see the real thing
  guidesEl.style.display = 'none';
  if (editMode) setLiveMode(true);
}

function releaseSpace() {
  if (!spaceHeld) return;
  spaceHeld = false;
  guidesEl.style.display = '';
  setLiveMode(spaceWasLive);
  if (!spaceWasLive && spaceWasArmed) rearm(spaceWasArmed);
  spaceWasArmed = null;
}

// ---------- keymap and dispatcher ----------

// One table drives dispatch, the ? overlay, and the command palette, the same
// single-source pattern widgets.js uses. `shift: undefined` means don't care.
const KEYMAP = [];
const BINDS_KEY = 'imguistudio.binds';
let bindOverrides = {};
try { bindOverrides = JSON.parse(localStorage.getItem(BINDS_KEY) || '{}'); } catch (e) {}

function bind(ctx, show, spec, help, cat, run) {
  // id stays stable across rebinds so overrides survive a key change
  const id = cat + '|' + (help || show || '?') + '|' + spec.key;
  const entry = { id, ctx, show, help, cat, run, def: { ...spec } };
  Object.assign(entry, spec, bindOverrides[id] || {});
  KEYMAP.push(entry);
}

function comboLabel(b) {
  return (b.ctrl ? 'Ctrl+' : '') + (b.alt ? 'Alt+' : '')
    + (b.shift ? 'Shift+' : '') + (b.key === ' ' ? 'Space' : b.key);
}

function sameCombo(a, b) {
  return a.key === b.key && !!a.ctrl === !!b.ctrl
    && !!a.alt === !!b.alt && !!a.shift === !!b.shift;
}

// Space and Tab are quasimodes handled ahead of the keymap, so a binding on
// either can never fire. Accepting one would hand back a dead shortcut.
const RESERVED_KEYS = new Set([' ', 'Tab']);

// Only Edit and Live are mutually exclusive. 'global' is live in every context
// and 'drag' runs alongside whichever of Edit/Live is current, so a key bound
// in one of those really can shadow a key bound in the other.
function ctxOverlaps(a, b) {
  if (a === b) return true;
  return !((a === 'edit' && b === 'live') || (a === 'live' && b === 'edit'));
}

// Two bindings may share a key when their contexts overlap AND they sit in the
// same category — then the key cycles between them. Sharing across categories
// is refused: the same key meaning unrelated things is the confusing case.
function bindingConflict(entry, cand) {
  for (const b of KEYMAP) {
    if (b === entry || !ctxOverlaps(b.ctx, entry.ctx)) continue;
    if (sameCombo(b, cand) && b.cat !== entry.cat) return b;
  }
  return null;
}

function rebind(entry, cand) {
  if (RESERVED_KEYS.has(cand.key)) {
    return { help: 'the hold-to-peek quasimode', cat: 'reserved keys', reserved: true };
  }
  const clash = bindingConflict(entry, cand);
  if (clash) return clash;
  Object.assign(entry, { key: cand.key, ctrl: !!cand.ctrl, alt: !!cand.alt, shift: !!cand.shift });
  bindOverrides[entry.id] = { key: cand.key, ctrl: !!cand.ctrl, alt: !!cand.alt, shift: !!cand.shift };
  try { localStorage.setItem(BINDS_KEY, JSON.stringify(bindOverrides)); } catch (e) {}
  return null;
}

function resetBinds() {
  bindOverrides = {};
  try { localStorage.removeItem(BINDS_KEY); } catch (e) {}
  for (const b of KEYMAP) Object.assign(b, { key: undefined, ctrl: undefined, alt: undefined, shift: undefined }, b.def);
}

function keyMatches(e, b) {
  const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (key !== b.key) return false;
  // backing out must work whatever is held: Escape mid Alt-duplicate-drag
  // would otherwise match nothing until Alt comes back up
  if (b.key === 'Escape') return true;
  if (!!b.ctrl !== (e.ctrlKey || e.metaKey)) return false;
  if (!!b.alt !== e.altKey) return false;
  if (b.shift !== undefined && !!b.shift !== e.shiftKey) return false;
  return true;
}

function isTextEntry(t) {
  if (!t || !t.tagName) return false;
  if (t.tagName === 'TEXTAREA' || t.isContentEditable) return true;
  return t.tagName === 'INPUT'
    && t.type !== 'checkbox' && t.type !== 'radio' && t.type !== 'file' && t.type !== 'button';
}

// emscripten's GLFW handler preventDefaults Backspace and Tab page-wide, which
// would make every text field uneditable. This capture listener registers
// before engine.js loads, so it runs first and shields text-entry targets.
// Default actions (the actual typing) still happen; only later listeners stop.
window.addEventListener('keydown', e => {
  // The C++ editor wants Tab for indenting, so it gets first refusal here.
  // Its handler can't sit on the textarea: this listener would have already
  // stopped the event before it got that far down.
  if (e.target === codeEdit && handleCodeEditorKey(e)) {
    e.stopImmediatePropagation();
    return;
  }
  if ((e.key === 'Backspace' || e.key === 'Tab') && isTextEntry(e.target)) {
    e.stopImmediatePropagation();
  }
}, true);

bind('drag', 'Esc', { key: 'Escape' }, 'Cancel the drag', 'Drag', () => cancelDrag());

bind('edit', 'Up / Down', { key: 'ArrowUp', shift: false }, 'Previous sibling', 'Navigate', () => selectSibling(-1));
bind('edit', '', { key: 'ArrowDown', shift: false }, 'Next sibling', 'Navigate', () => selectSibling(1));
bind('edit', 'Home / End', { key: 'Home' }, 'First sibling', 'Navigate', () => selectEdge(false));
bind('edit', '', { key: 'End' }, 'Last sibling', 'Navigate', () => selectEdge(true));
bind('edit', 'Enter', { key: 'Enter' }, 'Descend into container (or insert the armed widget)', 'Navigate', () => {
  if (armed) { stampArmed(dropSiblingAfterSelection()); return; }
  descend();
});
bind('edit', 'Esc', { key: 'Escape' }, 'Disarm, else ascend to parent, else deselect', 'Navigate', () => {

  ascend();
});
bind('edit', 'F', { key: 'F', shift: false }, 'Focus the selection (centre it on screen)', 'Navigate',
  () => focusSelection());
bind('edit', 'Shift+F', { key: 'F', shift: true }, 'Reset the view to the origin', 'Navigate',
  () => resetPan());
bind('edit', 'F2', { key: 'F2' }, 'Rename inline on the canvas', 'Navigate', () => {
  if (selectedId) beginInlineEdit(selectedId);
});
bind('edit', 'Ctrl+A', { key: 'A', ctrl: true }, 'Select all siblings of the selection', 'Navigate', () => {
  const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  const parent = node ? findParent(node.id) : doc;

bind('edit', 'Ctrl+Up / Ctrl+Down', { key: 'ArrowUp', ctrl: true, shift: false }, 'Move up among siblings', 'Structure', () => reorderSelection(-1, false));
bind('edit', '', { key: 'ArrowDown', ctrl: true, shift: false }, 'Move down among siblings', 'Structure', () => reorderSelection(1, false));
bind('edit', 'Ctrl+Shift+Up / Down', { key: 'ArrowUp', ctrl: true, shift: true }, 'Move to first sibling', 'Structure', () => reorderSelection(-1, true));
bind('edit', '', { key: 'ArrowDown', ctrl: true, shift: true }, 'Move to last sibling', 'Structure', () => reorderSelection(1, true));
bind('edit', 'Ctrl+G', { key: 'G', ctrl: true, shift: false }, 'Wrap selection in a Group', 'Structure', () => wrapSelection());
bind('edit', 'Ctrl+Shift+G', { key: 'G', ctrl: true, shift: true }, 'Unwrap container', 'Structure', () => unwrapSelection());
bind('edit', 'J', { key: 'J', shift: false }, 'Toggle the SameLine join', 'Structure', () => toggleJoin());
bind('edit', 'Ctrl+D', { key: 'D', ctrl: true }, 'Duplicate selection', 'Structure', () => duplicateSelection());
bind('edit', 'Del', { key: 'Delete' }, 'Delete selection', 'Structure', () => deleteSelection());
bind('edit', '', { key: 'Backspace' }, 'Delete selection', 'Structure', () => deleteSelection());
bind('edit', 'Ctrl+C', { key: 'C', ctrl: true, shift: false }, 'Copy subtree', 'Structure', () => {
  // never steal a real text copy from the code pane
