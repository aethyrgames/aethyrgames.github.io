<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImGuiStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Monokai theme, ported from dougfessler.com */
  :root {
    --mk-bg:      #1e1e1e;
    --mk-surface: #2d2d2d;
    --mk-gutter:  #141414;
    --mk-fg:      #F8F8F2;
    --mk-comment: #75715E;
    --mk-pink:    #F92672;
    --mk-orange:  #FD971F;
    --mk-yellow:  #E6DB74;
    --mk-green:   #A6E22E;
    --mk-cyan:    #66D9EF;
    --mk-purple:  #AE81FF;
    --mk-border:  #49483E;

    --font:   'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    --radius: 3px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --glow-chroma:
      0.03em 0 0 rgba(249, 38, 114, 0.35),
      -0.03em 0 0 rgba(102, 217, 239, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    font: 12px/1.45 var(--font); background: var(--mk-bg); color: var(--mk-fg);
  }

  /* Scanlines live only on the header chrome, and as a background layer so
     they paint behind the text rather than over it. The workspace and the
     preview canvas stay completely clean. */
  #apphead {
    height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--mk-border);
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.30) 3px,
        rgba(0,0,0,0.30) 4px
      ),
      var(--mk-gutter);
  }
  .brand {
    color: var(--mk-green); font-weight: 700; font-size: 14px;
    text-shadow: var(--glow-chroma); white-space: nowrap;
  }
  .brand::before { content: '> '; color: var(--mk-comment); }
  .tagline { color: var(--mk-comment); font-size: 11px; }
  #apphead .spacer { flex: 1; }
  .sitelink {
    color: var(--mk-comment); font-size: 11px; text-decoration: none;
    padding: 3px 9px; border: 1px solid var(--mk-border); border-radius: var(--radius);
    transition: color 0.1s, border-color 0.1s;
  }
  .sitelink:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  /* opaque, so nothing from behind can bleed into the panes */
  #workspace { display: flex; flex: 1; min-height: 0; background: var(--mk-bg); }

  h3 {
    margin: 0; padding: 9px 10px 6px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--mk-green);
    border-bottom: 1px solid var(--mk-border); flex-shrink: 0;
  }
  h3::before { content: '/* '; color: var(--mk-comment); text-transform: none; }
  h3::after  { content: ' */'; color: var(--mk-comment); }

  #left  { width: 280px; min-width: 280px; border-right: 1px solid var(--mk-border); display: flex; flex-direction: column; }
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #right { width: 470px; min-width: 330px; border-left: 1px solid var(--mk-border); display: flex; flex-direction: column; }

  #palettewrap { flex: 1.2; min-height: 0; overflow-y: auto; }
  #filter {
    width: calc(100% - 16px); margin: 6px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    padding: 4px 6px; font-family: var(--font); font-size: 11px;
  }
  #filter:focus { outline: none; border-color: var(--mk-cyan); }
  .cat {
    color: var(--mk-comment); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 8px 3px;
  }
  .cat::before { content: '// '; }
  #palette { padding: 0 8px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #palette button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 5px 3px; cursor: grab; font-size: 10.5px;
    font-family: var(--font); user-select: none; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; transition: color 0.1s, border-color 0.1s;
  }
  #palette button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  #tree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
  .row {
    display: flex; align-items: center; padding: 2px 8px 2px 6px; cursor: pointer; gap: 5px;
    border-left: 2px solid transparent;
  }
  .row:hover { background: rgba(255,255,255,0.04); }
  .row.selected { background: var(--mk-surface); border-left-color: var(--mk-pink); }
  .row.selected .wlabel { color: var(--mk-pink); }
  .row .wtype { color: var(--mk-cyan); font-size: 10px; opacity: 0.8; flex-shrink: 0; }
  .row .wlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
  .row .join { color: var(--mk-yellow); font-size: 11px; }
  .row .box { color: var(--mk-purple); font-size: 10px; }
  .row button {
    background: none; border: none; color: var(--mk-comment); cursor: pointer;
    padding: 0 2px; font-size: 11px; font-family: var(--font);
  }
  .row button:hover { color: var(--mk-fg); }

  #props { border-top: 1px solid var(--mk-border); max-height: 40%; display: flex; flex-direction: column; }
  #propbody { padding: 8px 10px; display: grid; grid-template-columns: 78px 1fr; gap: 5px;
    align-items: center; overflow-y: auto; }
  #propbody label { color: var(--mk-comment); font-size: 11px; }
  #propbody input[type=text], #propbody input[type=number], #propbody select {
    background: var(--mk-gutter); color: var(--mk-fg); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 3px 6px; width: 100%; font-family: var(--font); font-size: 11px;
  }
  #propbody input:focus, #propbody select:focus { outline: none; border-color: var(--mk-cyan); }
  #propbody .empty { grid-column: 1 / 3; color: var(--mk-comment); padding: 6px 0; }
  #propbody .empty::before { content: '// '; }

  input[type=checkbox] { accent-color: var(--mk-green); }

  #toolbar {
    padding: 8px 12px; background: var(--mk-gutter); border-bottom: 1px solid var(--mk-border);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  #toolbar strong { color: var(--mk-green); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  #toolbar label { color: var(--mk-comment); font-size: 11px; }
  #toolbar .spacer { flex: 1; }
  #toolbar button {
    background: transparent; color: var(--mk-comment); border: 1px solid var(--mk-border);
    border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 11px;
    font-family: var(--font); transition: color 0.1s, border-color 0.1s;
  }
  #toolbar button::before { content: '$ '; color: var(--mk-comment); }
  #toolbar button:hover { color: var(--mk-cyan); border-color: var(--mk-cyan); }

  #canvashost { flex: 1; overflow: auto; display: flex; }
  /* margin auto centers when there's room and aligns start when overflowing,
     unlike justify-content center which clips the left edge */
  #canvaswrap { position: relative; margin: auto; }
  canvas { background: var(--mk-gutter); outline: none; display: block; }

  #selbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px solid var(--mk-cyan);
    box-shadow: 0 0 0 1px rgba(102, 217, 239, 0.3), 0 0 12px rgba(102, 217, 239, 0.15);
  }
  #dropline {
    position: absolute; display: none; pointer-events: none;
    background: var(--mk-yellow);
    box-shadow: 0 0 6px rgba(230, 219, 116, 0.4);
  }
  #dropbox {
    position: absolute; display: none; pointer-events: none;
    border: 1px dashed var(--mk-yellow); background: rgba(230, 219, 116, 0.07);
  }
  #ghost {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: var(--mk-surface); border: 1px solid var(--mk-cyan); border-radius: var(--radius);
    padding: 3px 8px; font-size: 11px; color: var(--mk-fg); box-shadow: var(--shadow);
  }

  #codehead { display: flex; align-items: center; border-bottom: 1px solid var(--mk-border); }
  #codehead h3 { flex: 1; border-bottom: none; }
  #codehead select {
    margin: 4px 0 4px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    font-family: var(--font); font-size: 11px; padding: 3px 6px; cursor: pointer;
  }
  #codehead select:focus { outline: none; border-color: var(--mk-cyan); }
  #codehead button {
    margin: 4px 8px; background: transparent; color: var(--mk-green);
    border: 1px solid var(--mk-green); border-radius: var(--radius);
    padding: 4px 12px; cursor: pointer; font-size: 11px; font-family: var(--font);
    transition: background 0.15s, color 0.15s;
  }
  #codehead button::before { content: '$ '; color: var(--mk-comment); }
  #codehead button:hover { background: var(--mk-green); color: var(--mk-bg); }
  #codehead button:hover::before { color: var(--mk-bg); }

  /* Structural only: colors come from the generated #themeStyle rules */
  #code {
    flex: 1; margin: 0; padding: 12px; overflow: auto; font: 12px/1.5 var(--font);
    white-space: pre; user-select: text;
  }

  #status { padding: 4px 12px; font-size: 11px; color: var(--mk-comment); border-top: 1px solid var(--mk-border); }
  #status::before { content: '// '; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mk-border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mk-comment); }

  #palette button { position: relative; }
  #palette button .kbd {
    position: absolute; top: 0; right: 4px; font-size: 9px; color: var(--mk-comment);
  }
  #palette button.armedbtn { color: var(--mk-green); border-color: var(--mk-green); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: flex-start; justify-content: center; z-index: 20;
  }
  .overlay[hidden] { display: none; }
  .overlay-box {
    margin-top: 11vh; width: 500px; max-height: 64vh; display: flex; flex-direction: column;
    background: var(--mk-surface); border: 1px solid var(--mk-border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .overlay-box input {
    margin: 8px; padding: 6px 8px; background: var(--mk-gutter); color: var(--mk-fg);
    border: 1px solid var(--mk-border); border-radius: var(--radius);
    font-family: var(--font); font-size: 12px;
  }
  .overlay-box input:focus { outline: none; border-color: var(--mk-cyan); }
  .ov-list { overflow-y: auto; padding: 0 4px 6px; }
  .ov-item {
    display: flex; gap: 8px; padding: 4px 8px; cursor: pointer;
    border-radius: var(--radius); align-items: baseline;
  }
  .ov-item.sel, .ov-item:hover { background: rgba(255, 255, 255, 0.06); }
  .ov-item .k { margin-left: auto; color: var(--mk-comment); font-size: 10px; white-space: nowrap; }
  .ov-cat {
    color: var(--mk-comment); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 7px 8px 2px;
  }
  .ov-cat::before { content: '// '; }
</style>
<style id="themeStyle"></style>

  <div id="apphead">
    <span class="brand">ImGuiStudio</span>
    <span class="tagline">// drag widgets, copy the C++</span>
    <span class="spacer"></span>

  <div id="workspace">
  <div id="left">
    <h3>Palette</h3>

  <div id="center">
    <div id="toolbar">
      <strong>Preview</strong>
      <label title="Widgets respond to input"><input type="checkbox" id="liveToggle"> Live mode</label>
      <label title="Shown in live mode only"><input type="checkbox" id="demoToggle" checked> ImGui demo</label>
      <span class="spacer"></span>
      <button id="resetBtn" title="Restore the sample layout">Reset</button>
      <button id="exportBtn">Export JSON</button>

        <canvas id="canvas" tabindex="-1"></canvas>
        <div id="selbox"></div>
        <div id="dropbox"></div>

    <div id="status">engine: loading...</div>
  </div>

  <div id="right">
    <div id="codehead">
      <h3>Generated C++</h3>
      <select id="themeSel" title="Syntax highlighting theme"></select>

  </div>
  </div>

  <div id="ghost"></div>

  <div id="cmdk" class="overlay" hidden>
    <div class="overlay-box">
      <input type="text" id="cmdkInput" placeholder="search...">
      <div id="cmdkList" class="ov-list"></div>
    </div>
  </div>
  <div id="helpov" class="overlay" hidden>
    <div class="overlay-box">
      <input type="text" id="helpInput" placeholder="filter shortcuts...">
      <div id="helpList" class="ov-list"></div>
    </div>
  </div>

<script src="widgets.js?v=3b2a5279df"></script>
<script>
// ---------- document model ----------

let nextId = 100;
let selectedId = null;

const doc = {
  type: 'window', id: 'root', label: 'My Panel', w: 380, h: 460,
  children: [
    { type: 'text',        id: 'n1', label: 'Engine settings' },
    { type: 'separator',   id: 'n2', label: '' },
    { type: 'checkbox',    id: 'n3', label: 'Enable turbo' },
    { type: 'button',      id: 'n4', label: 'Reset', sameline: true },
    { type: 'sliderfloat', id: 'n5', label: 'Speed', n: 1, min: 0, max: 10 },
    { type: 'inputtext',   id: 'n6', label: 'Preset name' },
    { type: 'coloredit',   id: 'n7', label: 'Tint', n: 3 },
    { type: 'progressbar', id: 'n8', label: '', fraction: 0.4 },
  ],
};

const DEFAULT_DOC = JSON.parse(JSON.stringify(doc));
const SAVE_KEY = 'imguistudio.doc.v1';

const isContainer = node => !!(WIDGETS[node.type] && WIDGETS[node.type].container);

// depth-first walk yielding {node, parent, index}
function walk(node, fn, parent = null, index = 0, depth = 0) {
  if (fn(node, parent, index, depth) === false) return false;
  const kids = node.children || [];
  for (let i = 0; i < kids.length; i++) {
    if (walk(kids[i], fn, node, i, depth + 1) === false) return false;
  }
  return true;
}

function findNode(id) {
  let found = null;
  walk(doc, n => { if (n.id === id) { found = n; return false; } });
  return found;
}

function findParent(id) {
  let found = null;
  walk(doc, (n, p) => { if (n.id === id) { found = p; return false; } });
  return found;
}

function isAncestor(ancestorId, nodeId) {
  const a = findNode(ancestorId);
  if (!a) return false;
  let hit = false;
  walk(a, n => { if (n.id === nodeId && n.id !== ancestorId) { hit = true; return false; } });
  return hit;
}

function makeNode(type) {
  const spec = WIDGETS[type];
  const node = { type, id: 'n' + (nextId++) };
  for (const [k, , d] of spec.props || []) node[k] = d;
  if (spec.container) node.children = [];
  return node;
}

function detach(id) {
  const parent = findParent(id);
  if (!parent) return null;
  const i = parent.children.indexOf(findNode(id));
  if (i < 0) return null;
  return parent.children.splice(i, 1)[0];
}

// drop = { parentId, index, sameline? }
function insertAt(node, drop) {
  const parent = findNode(drop.parentId) || doc;
  if (!parent.children) parent.children = [];
  const i = Math.max(0, Math.min(drop.index, parent.children.length));
  if (drop.sameline) node.sameline = true; else delete node.sameline;
  parent.children.splice(i, 0, node);
}

function addNode(type) {
  const node = makeNode(type);
  // append into the selected container, otherwise at the end of the window
  const sel = selectedId ? findNode(selectedId) : null;
  const host = sel && isContainer(sel) ? sel : doc;
  if (!host.children) host.children = [];
  host.children.push(node);
  selectedId = node.id;
  lastInsertType = type;
  refresh();
}

function insertNodeAt(type, drop) {
  const node = makeNode(type);
  insertAt(node, drop);
  selectedId = node.id;
  lastInsertType = type;
  refresh();
}

function moveNodeTo(id, drop) {
  if (drop.parentId === id || isAncestor(id, drop.parentId)) return; // no cycles
  const parent = findParent(id);
  const oldIndex = parent ? parent.children.indexOf(findNode(id)) : -1;
  const node = detach(id);
  if (!node) return;
  // removing from earlier in the same list shifts the target index down
  const d = { ...drop };
  if (parent && parent.id === drop.parentId && oldIndex >= 0 && oldIndex < drop.index) d.index -= 1;
  insertAt(node, d);
  selectedId = id;
  refresh();
}

function removeNode(id) {
  detach(id);
  // the selection may have been a descendant of the removed subtree
  if (selectedId && selectedId !== 'root' && !findNode(selectedId)) selectedId = null;
  refresh();
}

function moveNode(id, delta) {
  const parent = findParent(id);
  if (!parent) return;
  const i = parent.children.indexOf(findNode(id));
  const j = i + delta;
  if (i < 0 || j < 0 || j >= parent.children.length) return;
  [parent.children[i], parent.children[j]] = [parent.children[j], parent.children[i]];
  refresh();
}

// ---------- history (undo/redo) ----------

const history = []; // { docStr, sel }
let histIndex = -1;
let lastHistAt = 0;
let lastCoalescible = false;

// Only document changes create entries. Selection is carried along for restore
// but never compared, or arrow-key browsing would flood the ring and push real
// edits out of reach.
function pushHistory(coalesce) {
  const docStr = JSON.stringify({ doc, nextId });
  if (histIndex >= 0 && history[histIndex].docStr === docStr) return;
  const now = Date.now();
  history.length = histIndex + 1;
  // A burst only merges into an entry that was itself a coalescible edit.
  // Without that check, typing right after an insert would overwrite the
  // insert's snapshot and undo would delete the widget instead of the label.
  if (coalesce && lastCoalescible && histIndex > 0 && now - lastHistAt < 1000) {
    history[histIndex] = { docStr, sel: selectedId };
  } else {
    history.push({ docStr, sel: selectedId });
    histIndex = history.length - 1;
    if (history.length > 100) { history.shift(); histIndex--; }
  }
  lastCoalescible = !!coalesce;
  lastHistAt = now;
}

// bypasses refresh() so restoring can't push a new history entry
function restoreSnapshot(entry) {
  const s = JSON.parse(entry.docStr);
  doc.children = s.doc.children;
  for (const [k] of WIDGETS.window.props) doc[k] = s.doc[k];
  nextId = s.nextId;
  selectedId = entry.sel;
  if (selectedId && selectedId !== 'root' && !findNode(selectedId)) selectedId = null;
  renderTree();
  renderProps();
  renderCode();
  pushDoc();
  saveLocal();
}

function undo() { if (histIndex > 0) { histIndex--; restoreSnapshot(history[histIndex]); } }
function redo() { if (histIndex < history.length - 1) { histIndex++; restoreSnapshot(history[histIndex]); } }

// ---------- selection navigation and structure verbs ----------

function selectId(id) { selectedId = id; refresh(); }

function selectSibling(delta) {
  if (!selectedId || selectedId === 'root') {
    if (doc.children.length) selectId(doc.children[delta < 0 ? doc.children.length - 1 : 0].id);
    return;
  }
  const parent = findParent(selectedId);
  if (!parent) return;
  const i = parent.children.findIndex(n => n.id === selectedId);
  const j = Math.max(0, Math.min(parent.children.length - 1, i + delta));
  if (j !== i) selectId(parent.children[j].id);
}

function selectEdge(last) {
  const parent = selectedId && selectedId !== 'root' ? findParent(selectedId) : doc;
  const kids = (parent || doc).children;
  if (kids.length) selectId(kids[last ? kids.length - 1 : 0].id);
}

function descend() {
  const node = selectedId ? findNode(selectedId) : doc;
  const kids = (node && node.children) || [];
  if (kids.length) selectId(kids[0].id);
}

function ascend() {
  if (!selectedId) return;
  if (selectedId === 'root') { selectId(null); return; }
  const parent = findParent(selectedId);
  selectId(parent ? parent.id : null);
}

function cloneWithNewIds(node) {
  const copy = JSON.parse(JSON.stringify(node));
  walk(copy, n => { n.id = 'n' + (nextId++); });
  return copy;
}

// where an insert lands relative to the selection: inside a selected
// container, after a selected leaf, or at the end of the window
function dropAfterSelection() {
  const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  if (node && isContainer(node)) return { parentId: node.id, index: (node.children || []).length };
  if (node) {
    const parent = findParent(node.id);
    return { parentId: parent.id, index: parent.children.indexOf(node) + 1 };
  }
  return { parentId: 'root', index: doc.children.length };
}

function reorderSelection(delta, extreme) {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  const parent = findParent(node.id);
  const i = parent.children.indexOf(node);
  let j = extreme ? (delta < 0 ? 0 : parent.children.length - 1) : i + delta;
  j = Math.max(0, Math.min(parent.children.length - 1, j));
  if (i === j) return;
  parent.children.splice(i, 1);
  parent.children.splice(j, 0, node);
  refresh();
}

function wrapSelection() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  const parent = findParent(node.id);
  const idx = parent.children.indexOf(node);
  const grp = makeNode('group');
  if (node.sameline) { grp.sameline = true; delete node.sameline; }
  parent.children.splice(idx, 1);
  grp.children.push(node);
  parent.children.splice(idx, 0, grp);
  selectId(grp.id);
}

function unwrapSelection() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc || !isContainer(node)) return;
  const parent = findParent(node.id);
  const idx = parent.children.indexOf(node);
  const kids = node.children || [];
  // the container may be carrying a join that wrapSelection moved onto it
  if (node.sameline && kids[0]) kids[0].sameline = true;
  parent.children.splice(idx, 1, ...kids);
  selectId(kids[0] ? kids[0].id : parent.id);
}

function toggleJoin() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  if (node.sameline) delete node.sameline;
  else node.sameline = true;
  refresh();
}

function duplicateSelection() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  const parent = findParent(node.id);
  const copy = cloneWithNewIds(node);
  insertAt(copy, {
    parentId: parent.id,
    index: parent.children.indexOf(node) + 1,
    sameline: !!node.sameline,
  });
  selectId(copy.id);
}

function duplicateTo(id, drop) {
  const node = findNode(id);
  if (!node) return;
  const copy = cloneWithNewIds(node);
  insertAt(copy, drop);
  selectId(copy.id);
}

function deleteSelection() {
  const node = selectedId && findNode(selectedId);
  if (!node || node === doc) return;
  const parent = findParent(node.id);
  const i = parent.children.indexOf(node);
  detach(node.id);
  const next = parent.children[i] || parent.children[i - 1];
  selectId(next ? next.id : (parent === doc ? null : parent.id));
}

// ---------- clipboard and repeat ----------

let clipboardNode = null;
let lastInsertType = null;

function copySelection() {
  const node = selectedId && selectedId !== 'root' && findNode(selectedId);
  if (!node) return false;
  clipboardNode = JSON.stringify(node);
  return true;
}

function cutSelection() {
  if (copySelection()) deleteSelection();
}

function pasteClipboard() {
  if (!clipboardNode) return;
  const node = cloneWithNewIds(JSON.parse(clipboardNode));
  const drop = dropAfterSelection();
  // a joined widget stays joined through cut/copy+paste, matching Ctrl+D
  if (node.sameline) drop.sameline = true;
  insertAt(node, drop);
  selectId(node.id);
}

// Stamping repeats want siblings: with dropAfterSelection, inserting a
// container then stamping again would nest each insert inside the previous.
function dropSiblingAfterSelection() {
  const node = selectedId && selectedId !== 'root' ? findNode(selectedId) : null;
  if (!node) return { parentId: 'root', index: doc.children.length };
  const parent = findParent(node.id);
  return { parentId: parent.id, index: parent.children.indexOf(node) + 1 };
}

function repeatInsert() {
  if (lastInsertType) insertNodeAt(lastInsertType, dropSiblingAfterSelection());
}

function saveLocal() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, nextId, doc })); } catch (e) {}
}

function computeNextId() {
  let m = 100;
  walk(doc, n => {
    const num = parseInt(String(n.id).replace(/^n/, ''), 10);
    if (!isNaN(num) && num >= m) m = num + 1;
  });
  return m;
}

// Imported documents are untrusted. Beyond type-checking, an enum has to be
// checked against its option list: a stray `dir` reaches IM_ASSERT(0) inside
// ImGui and an out-of-range `n` would emit something like InputInt5.
function coerce(t, raw, def, opts) {
  if (t === 'text' || t === 'items') return typeof raw === 'string' ? raw.slice(0, 200) : def;
  if (t === 'bool') return raw === true;
  const num = Number(raw);
  if (t === 'enum') {
    const allowed = (opts || []).map(o => Number(Array.isArray(o) ? o[1] : o));
    return allowed.includes(num) ? num : def;
  }
  if (!Number.isFinite(num)) return def;
  return t === 'int' ? Math.trunc(num) : num;
}

function sanitize(list, ids) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const n of list) {
    if (!n || typeof n !== 'object' || typeof n.type !== 'string') continue;
    const spec = WIDGETS[n.type];
    if (!spec || n.type === 'window') continue;
    const c = { type: n.type };
    // keep looking until the id really is free, or a document full of
    // duplicates would just get more duplicates
    let cid = typeof n.id === 'string' && n.id ? n.id : '';
    if (!cid || ids.has(cid)) { do { cid = 'n' + (nextId++); } while (ids.has(cid)); }
    c.id = cid;
    ids.add(cid);
    for (const [k, t, d, opts] of spec.props || []) c[k] = coerce(t, n[k], d, opts);
    if (n.sameline === true) c.sameline = true;
    if (spec.container) c.children = sanitize(n.children, ids);
    out.push(c);
  }
  return out;
}

// Highest id in the raw payload, so freshly minted ids can't collide with one
// that appears later in the same document.
function maxRawId(list, cur) {
  if (!Array.isArray(list)) return cur;
  for (const n of list) {
    if (!n || typeof n !== 'object') continue;
    const num = parseInt(String(n.id ?? '').replace(/^n/, ''), 10);
    if (!isNaN(num) && num >= cur) cur = num + 1;
    cur = maxRawId(n.children, cur);
  }
  return cur;
}

// Replaces the working document in place so existing references stay valid.
function applyDocData(d, savedNextId) {
  nextId = Math.max(savedNextId || 0, 100, maxRawId(d.children, 100));
  const ids = new Set(['root']);
  doc.children = sanitize(d.children, ids);
  for (const [k, t, def, opts] of WIDGETS.window.props) doc[k] = coerce(t, d[k], def, opts);
  selectedId = null;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.doc || s.doc.type !== 'window') return false;
    applyDocData(s.doc, s.nextId);
    return true;
  } catch (e) { return false; }
}

// ---------- engine bridge ----------

let engineReady = false;
let editMode = true;
let latestRects = [];
let engineWantsText = false;

function pushDoc() {
  if (!engineReady) return;
  Module.ccall('engine_set_document', null, ['string'], [JSON.stringify(doc)]);
}

var Module = {
  canvas: document.getElementById('canvas'),
  print: t => console.log(t),
  printErr: t => console.warn(t),
  onRuntimeInitialized: () => {
    engineReady = true;
    statusBase = 'engine: running (real Dear ImGui via wasm) — ' + paletteCount + ' widget types';
    updateArmedUI(); // writes statusBase without clobbering an active armed line
    Module.ccall('engine_show_demo', null, ['number'], [document.getElementById('demoToggle').checked ? 1 : 0]);
    Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
    pushDoc();
  },
};

// ---------- canvas editing ----------

const canvas = document.getElementById('canvas');
const selbox = document.getElementById('selbox');
const dropline = document.getElementById('dropline');
const dropbox = document.getElementById('dropbox');
const ghost = document.getElementById('ghost');

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: e.clientX - r.left,
    y: e.clientY - r.top,
    inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom,
  };
}

function rectFor(id) {
  return latestRects.find(r => r.id === id);
}

// Smallest containing rect wins. Container rects are emitted at different
// points relative to their children, so area beats draw order here.
function hitTest(p) {
  let best = null;
  for (const r of latestRects) {
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
      if (!best || r.w * r.h < best.w * best.h) best = r;
    }
  }
  return best;
}

function updateSelectionOverlay() {
  const r = editMode && selectedId ? rectFor(selectedId) : null;
  if (!r) { selbox.style.display = 'none'; return; }
  selbox.style.display = 'block';
  selbox.style.left = (r.x - 2) + 'px';
  selbox.style.top = (r.y - 2) + 'px';
  selbox.style.width = (r.w + 4) + 'px';
  selbox.style.height = (r.h + 4) + 'px';
}

function pollEngine() {
  if (!engineReady) return;
  try {
    // the ccall itself throws after a wasm abort, so it must sit inside the
    // try or one abort would kill the rAF chain and spam the interval backstop
    const raw = Module.ccall('engine_get_rects', 'string', [], []);
    const payload = JSON.parse(raw);
    latestRects = payload.rects || [];
    engineWantsText = !!payload.wantText;
    // mirror engine state: the demo can be closed via its own titlebar X
    const demoToggle = document.getElementById('demoToggle');
    if (typeof payload.showDemo === 'boolean' && demoToggle.checked !== payload.showDemo) {
      demoToggle.checked = payload.showDemo;
    }
  } catch (e) {
    if (!pollEngine.reported) { pollEngine.reported = true; console.warn('[tick] ' + (e && e.stack || e)); }
    latestRects = [];
  }
  updateSelectionOverlay();
}

function tick() {
  pollEngine();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// rAF stops entirely while the window is occluded (locked screen, minimized),
// so a timer backstop keeps selection and drop targeting alive regardless
setInterval(pollEngine, 100);

// drag = { kind: 'palette'|'move', type?, nodeId?, started, startX, startY, drop }
let drag = null;

// excludeId keeps a move-drag from targeting itself or its own subtree, and
// forceJoin (held Shift) turns any leaf hit into a SameLine drop.
function computeDropTarget(p, excludeId, forceJoin) {
  if (!p.inside) return null;
  const hit = hitTest(p);
  if (!hit) return null;
  const node = findNode(hit.id);
  if (!node) return null;
  // Hovering the dragged node or its own subtree has no valid answer, so the
  // drop is a no-op rather than a surprise move to the bottom of the panel.
  if (excludeId && (node.id === excludeId || isAncestor(excludeId, node.id))) {
    return null;
  }
  if (node.id === doc.id) {
    return { parentId: doc.id, index: (doc.children || []).length, anchorId: doc.id, pos: 'inside' };
  }
  const parent = findParent(node.id) || doc;
  const idx = parent.children.indexOf(node);
  if (isContainer(node) && !forceJoin) {
    // upper third inserts before the container, the rest drops inside it
    if (p.y < hit.y + hit.h / 3) {
      return { parentId: parent.id, index: idx, anchorId: node.id, pos: 'above' };
    }
    return { parentId: node.id, index: (node.children || []).length, anchorId: node.id, pos: 'inside' };
  }
  if (forceJoin || p.x >= hit.x + hit.w * 0.55) {
    return { parentId: parent.id, index: idx + 1, sameline: true, anchorId: node.id, pos: 'right' };
  }
  const above = p.y < hit.y + hit.h / 2;
  return { parentId: parent.id, index: above ? idx : idx + 1, anchorId: node.id, pos: above ? 'above' : 'below' };
}

function updateDropIndicator(drop) {
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
  if (!drop) return;
  const r = rectFor(drop.anchorId);
  if (!r) return;
  if (drop.pos === 'inside') {
    dropbox.style.display = 'block';
    dropbox.style.left = (r.x + 1) + 'px';
    dropbox.style.top = (r.y + 1) + 'px';
    dropbox.style.width = Math.max(0, r.w - 2) + 'px';
    dropbox.style.height = Math.max(0, r.h - 2) + 'px';
    return;
  }
  dropline.style.display = 'block';
  if (drop.pos === 'right') {
    dropline.style.left = (r.x + r.w + 2) + 'px';
    dropline.style.top = r.y + 'px';
    dropline.style.width = '2px';
    dropline.style.height = r.h + 'px';
    return;
  }
  dropline.style.left = r.x + 'px';
  dropline.style.top = (drop.pos === 'above' ? r.y - 2 : r.y + r.h) + 'px';
  dropline.style.width = r.w + 'px';
  dropline.style.height = '2px';
}

canvas.addEventListener('mousedown', e => {
  if (!editMode || e.button !== 0) return;
  const p = canvasPoint(e);
  if (armed) {
    const drop = computeDropTarget(p, null, e.shiftKey);
    if (drop) stampArmed(drop);
    return;
  }
  const hit = hitTest(p);
  if (hit) {
    selectedId = hit.id;
    refresh();
    if (hit.id !== doc.id) {
      // Alt at drag start means duplicate instead of move, the universal Alt-drag
      drag = {
        kind: 'move', nodeId: hit.id, dup: e.altKey, started: false,
        startX: e.clientX, startY: e.clientY, drop: null,
      };
    }
  } else {
    selectedId = null;
    refresh();
  }
});

function cancelDrag() {
  drag = null;
  ghost.style.display = 'none';
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
}

document.addEventListener('mousemove', e => {
  if (drag) {
    // A mouseup lost to focus stealing would leave a started drag armed forever.
    // Synthetic click sequences (test drivers, extensions) can emit buttons=0
    // moves between down and up, so only started drags cancel here; blur and
    // Escape cover the un-started case.
    if (drag.started && e.buttons === 0) { cancelDrag(); return; }
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.startX) + Math.abs(e.clientY - drag.startY) < 5) return;
      drag.started = true;
      const label = drag.kind === 'palette'
        ? WIDGETS[drag.type].name
        : (findNode(drag.nodeId)?.label || drag.nodeId);
      ghost.textContent = (drag.dup ? '+ ' : '') + label;
      ghost.style.display = 'block';
    }
    ghost.style.left = (e.clientX + 14) + 'px';
    ghost.style.top = (e.clientY + 14) + 'px';
    // duplicating may drop next to the original, so no self-exclusion then
    drag.drop = computeDropTarget(
      canvasPoint(e),
      drag.kind === 'move' && !drag.dup ? drag.nodeId : null,
      e.shiftKey);
    updateDropIndicator(drag.drop);
    return;
  }
  if (armed && editMode) {
    const p = canvasPoint(e);
    if (p.inside) {
      ghost.textContent = WIDGETS[armedType()].name;
      ghost.style.display = 'block';
      ghost.style.left = (e.clientX + 14) + 'px';
      ghost.style.top = (e.clientY + 14) + 'px';
      updateDropIndicator(computeDropTarget(p, null, e.shiftKey));
    } else {
      ghost.style.display = 'none';
      dropline.style.display = 'none';
      dropbox.style.display = 'none';
    }
  }
});

document.addEventListener('mouseup', e => {
  if (!drag) return;
  if (e.button !== 0) { cancelDrag(); return; }
  const d = drag;
  cancelDrag();
  if (!d.started) {
    if (d.kind === 'palette') addNode(d.type);
    return;
  }
  if (!d.drop) return;
  if (d.kind === 'palette') insertNodeAt(d.type, d.drop);
  else if (d.dup) duplicateTo(d.nodeId, d.drop);
  else moveNodeTo(d.nodeId, d.drop);
});

window.addEventListener('blur', () => {
  if (drag) cancelDrag();
  resetTabSpring();
});

// ---------- arming (widget stamp tool) ----------

const FAMILY_OF = {};
for (const [letter, types] of Object.entries(FAMILIES)) {
  for (const t of types) FAMILY_OF[t] = letter;
}

let armed = null; // { letter, index }
let statusBase = 'engine: loading...';

function armedType() {
  return armed ? FAMILIES[armed.letter][armed.index] : null;
}

function arm(letter, backward) {
  const fam = FAMILIES[letter];
  if (armed && armed.letter === letter) {
    armed.index = (armed.index + (backward ? fam.length - 1 : 1)) % fam.length;
  } else {
    armed = { letter, index: 0 };
  }
  updateArmedUI();
}

function disarm() {
  if (!armed) return;
  armed = null;
  ghost.style.display = 'none';
  dropline.style.display = 'none';
  dropbox.style.display = 'none';
  updateArmedUI();
}

function updateArmedUI() {
  const status = document.getElementById('status');
  status.textContent = armed
    ? 'armed: ' + WIDGETS[armedType()].name + ' (' + armed.letter + ' cycles, Enter inserts, Esc exits)'
    : statusBase;
  for (const b of document.querySelectorAll('#palette button')) {
    b.classList.toggle('armedbtn', !!armed && b.dataset.type === armedType());
  }
  // cycling the family while hovering must retag the ghost in place
  if (armed && !drag && ghost.style.display === 'block') {
    ghost.textContent = WIDGETS[armedType()].name;
  }
}

function stampArmed(drop) {
  insertNodeAt(armedType(), drop); // stays armed for repeated stamps
}

// ---------- mode switching (with spring-loaded Tab) ----------

function setLiveMode(live) {
  editMode = !live;
  document.getElementById('liveToggle').checked = live;
  if (live) disarm();
  if (engineReady) Module.ccall('engine_set_edit_mode', null, ['number'], [editMode ? 1 : 0]);
  updateSelectionOverlay();
}

let tabTimer = null;
let tabHeld = false;
let tabPeek = false;
const TAB_HOLD_MS = 220;

function handleTabDown(e) {
  e.preventDefault();
  if (e.repeat || tabHeld) return;
  tabHeld = true;
  tabTimer = setTimeout(() => {
    tabTimer = null;
    // held past the threshold: peek Live, revert on release
    tabPeek = true;
    setLiveMode(true);
  }, TAB_HOLD_MS);
}

function handleTabUp() {
  if (!tabHeld) return;
  tabHeld = false;
  if (tabTimer) {
    // released before the threshold: a tap, toggle the mode
    clearTimeout(tabTimer);
    tabTimer = null;
    setLiveMode(editMode);
  } else if (tabPeek) {
    tabPeek = false;
    setLiveMode(false);
  }
}

function resetTabSpring() {
  if (tabTimer) { clearTimeout(tabTimer); tabTimer = null; }
  tabHeld = false;
  if (tabPeek) { tabPeek = false; setLiveMode(false); }
}

// ---------- keymap and dispatcher ----------

// One table drives dispatch, the ? overlay, and the command palette, the same
// single-source pattern widgets.js uses. `shift: undefined` means don't care.
const KEYMAP = [];
function bind(ctx, show, spec, help, cat, run) {
  KEYMAP.push({ ctx, show, help, cat, run, ...spec });
}

function keyMatches(e, b) {
  const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (key !== b.key) return false;
  // backing out must work whatever is held: Escape mid Alt-duplicate-drag
  // would otherwise match nothing until Alt comes back up
  if (b.key === 'Escape') return true;
  if (!!b.ctrl !== (e.ctrlKey || e.metaKey)) return false;
  if (!!b.alt !== e.altKey) return false;
  if (b.shift !== undefined && !!b.shift !== e.shiftKey) return false;
  return true;
}

function isTextEntry(t) {
  if (!t || !t.tagName) return false;
  if (t.tagName === 'TEXTAREA' || t.isContentEditable) return true;
  return t.tagName === 'INPUT'
    && t.type !== 'checkbox' && t.type !== 'radio' && t.type !== 'file' && t.type !== 'button';
}

// emscripten's GLFW handler preventDefaults Backspace and Tab page-wide, which
// would make every text field uneditable. This capture listener registers
// before engine.js loads, so it runs first and shields text-entry targets.
// Default actions (the actual typing) still happen; only later listeners stop.
window.addEventListener('keydown', e => {
  if ((e.key === 'Backspace' || e.key === 'Tab') && isTextEntry(e.target)) {
    e.stopImmediatePropagation();
  }
}, true);

bind('drag', 'Esc', { key: 'Escape' }, 'Cancel the drag', 'Drag', () => cancelDrag());

bind('edit', 'Up / Down', { key: 'ArrowUp', shift: false }, 'Previous sibling', 'Navigate', () => selectSibling(-1));
bind('edit', '', { key: 'ArrowDown', shift: false }, 'Next sibling', 'Navigate', () => selectSibling(1));
bind('edit', 'Home / End', { key: 'Home' }, 'First sibling', 'Navigate', () => selectEdge(false));
bind('edit', '', { key: 'End' }, 'Last sibling', 'Navigate', () => selectEdge(true));
bind('edit', 'Enter', { key: 'Enter' }, 'Descend into container (or insert the armed widget)', 'Navigate', () => {
  if (armed) { stampArmed(dropSiblingAfterSelection()); return; }
  descend();
});
bind('edit', 'Esc', { key: 'Escape' }, 'Disarm, else ascend to parent, else deselect', 'Navigate', () => {
  if (armed) { disarm(); return; }
  ascend();
});
bind('edit', 'F2', { key: 'F2' }, 'Edit the label in the inspector', 'Navigate', () => {
  renderProps();
  const inp = document.querySelector('#propbody input[type=text]');
  if (inp) { inp.focus(); inp.select(); }
});

bind('edit', 'Ctrl+Up / Ctrl+Down', { key: 'ArrowUp', ctrl: true, shift: false }, 'Move up among siblings', 'Structure', () => reorderSelection(-1, false));
bind('edit', '', { key: 'ArrowDown', ctrl: true, shift: false }, 'Move down among siblings', 'Structure', () => reorderSelection(1, false));
bind('edit', 'Ctrl+Shift+Up / Down', { key: 'ArrowUp', ctrl: true, shift: true }, 'Move to first sibling', 'Structure', () => reorderSelection(-1, true));
bind('edit', '', { key: 'ArrowDown', ctrl: true, shift: true }, 'Move to last sibling', 'Structure', () => reorderSelection(1, true));
bind('edit', 'Ctrl+G', { key: 'G', ctrl: true, shift: false }, 'Wrap selection in a Group', 'Structure', () => wrapSelection());
bind('edit', 'Ctrl+Shift+G', { key: 'G', ctrl: true, shift: true }, 'Unwrap container', 'Structure', () => unwrapSelection());
bind('edit', 'J', { key: 'J', shift: false }, 'Toggle the SameLine join', 'Structure', () => toggleJoin());
bind('edit', 'Ctrl+D', { key: 'D', ctrl: true }, 'Duplicate selection', 'Structure', () => duplicateSelection());
bind('edit', 'Del', { key: 'Delete' }, 'Delete selection', 'Structure', () => deleteSelection());
bind('edit', '', { key: 'Backspace' }, 'Delete selection', 'Structure', () => deleteSelection());
bind('edit', 'Ctrl+C', { key: 'C', ctrl: true, shift: false }, 'Copy subtree', 'Structure', () => {
  // never steal a real text copy from the code pane

});
bind('edit', 'Ctrl+X', { key: 'X', ctrl: true }, 'Cut subtree', 'Structure', () => cutSelection());
bind('edit', 'Ctrl+V', { key: 'V', ctrl: true }, 'Paste after selection', 'Structure', () => pasteClipboard());
bind('edit', 'R', { key: 'R', shift: false }, 'Repeat the last insert', 'Structure', () => repeatInsert());
bind('edit', 'Ctrl+Z', { key: 'Z', ctrl: true, shift: false }, 'Undo', 'Structure', () => undo());
bind('edit', 'Ctrl+Shift+Z', { key: 'Z', ctrl: true, shift: true }, 'Redo', 'Structure', () => redo());
bind('edit', '', { key: 'Y', ctrl: true }, 'Redo', 'Structure', () => redo());

bind('edit', 'V', { key: 'V', shift: false }, 'Back to select (disarm)', 'Insert', () => disarm());
for (const letter of Object.keys(FAMILIES)) {
  const names = FAMILIES[letter].map(t => WIDGETS[t].name).join(', ');
  bind('edit', letter + ' / Shift+' + letter, { key: letter, shift: false },
    'Arm ' + names + ' (press again to cycle)', 'Insert', () => arm(letter, false));
  bind('edit', '', { key: letter, shift: true },
    'Cycle ' + letter + ' family backward', 'Insert', () => arm(letter, true));
}
bind('edit', '/', { key: '/' }, 'Insert menu (filter all widgets)', 'Insert', () => openCmdk('insert'));

bind('global', 'Ctrl+K', { key: 'K', ctrl: true }, 'Command palette', 'Global', () => openCmdk('all'));
bind('global', '?', { key: '?' }, 'Keyboard shortcuts', 'Global', () => toggleHelp());

window.addEventListener('keydown', e => {
  const t = e.target;
  if (isTextEntry(t) || (t && t.tagName === 'SELECT')) {
    if (e.key === 'Escape') {
      // Escape from a field is a full back-out, including a drag that was
      // started while the palette filter still held focus
      t.blur();
      closeOverlays();
      cancelDrag();
      disarm();
      e.preventDefault();
    }
    return;
  }
  // a focused checkbox keeps Space for its own toggle; everything else dispatches
  if (t && t.tagName === 'INPUT' && e.key === ' ') return;
  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) { handleTabDown(e); return; }
  if (e.key === 'Escape' && (!cmdkEl.hidden || !helpEl.hidden)) {
    closeOverlays();
    e.preventDefault();
    return;
  }
  // never steal keys from an active ImGui text field in live mode
  if (!editMode && engineWantsText) return;
  const contexts = [];
  if (drag) contexts.push('drag');
  contexts.push(editMode ? 'edit' : 'live');
  contexts.push('global');
  for (const ctx of contexts) {
    for (const b of KEYMAP) {
      if (b.ctx !== ctx || !keyMatches(e, b)) continue;
      if (b.run(e) === false) continue; // declined, keep looking / keep default
      e.preventDefault();
      return;
    }
  }
});

window.addEventListener('keyup', e => {
  if (e.key === 'Tab') handleTabUp();
});

// ---------- command palette and insert menu ----------

const cmdkEl = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const helpEl = document.getElementById('helpov');
const helpInput = document.getElementById('helpInput');
const helpList = document.getElementById('helpList');

let cmdkItems = [];
let cmdkSel = 0;

function commandEntries() {
  return [
    { label: 'Undo', k: 'Ctrl+Z', run: undo },
    { label: 'Redo', k: 'Ctrl+Shift+Z', run: redo },
    { label: 'Toggle Edit / Live mode', k: 'Tab', run: () => setLiveMode(editMode) },
    { label: 'Duplicate selection', k: 'Ctrl+D', run: duplicateSelection },
    { label: 'Delete selection', k: 'Del', run: deleteSelection },
    { label: 'Wrap selection in Group', k: 'Ctrl+G', run: wrapSelection },
    { label: 'Unwrap container', k: 'Ctrl+Shift+G', run: unwrapSelection },
    { label: 'Toggle SameLine join', k: 'J', run: toggleJoin },
    { label: 'Repeat last insert', k: 'R', run: repeatInsert },
    { label: 'Keyboard shortcuts', k: '?', run: toggleHelp },
    { label: 'Reset layout', run: () => document.getElementById('resetBtn').onclick() },
    { label: 'Export JSON', run: () => document.getElementById('exportBtn').onclick() },
    { label: 'Copy generated C++', run: () => navigator.clipboard.writeText(generateCode()) },
  ];
}

function openCmdk(mode) {
  const inserts = Object.entries(WIDGETS)
    .filter(([, s]) => !s.hidden)
    .map(([type, s]) => ({
      label: 'Insert ' + s.name,
      k: FAMILY_OF[type] || '',
      run: () => insertNodeAt(type, dropAfterSelection()),
    }));
  cmdkItems = mode === 'insert' ? inserts : commandEntries().concat(inserts);
  cmdkEl.hidden = false;
  cmdkInput.value = '';
  cmdkInput.placeholder = mode === 'insert' ? 'insert widget...' : 'search commands and widgets...';
  cmdkSel = 0;
  renderCmdk();
  cmdkInput.focus();
}

function renderCmdk() {
  const term = cmdkInput.value.trim().toLowerCase();
  const vis = cmdkItems.filter(i => !term || i.label.toLowerCase().includes(term));
  // rank prefix matches first so short queries land where expected
  vis.sort((a, b) => {
    const ap = a.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    const bp = b.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    return ap - bp;
  });
  const shown = vis.slice(0, 40);
  cmdkSel = Math.max(0, Math.min(cmdkSel, shown.length - 1));
  cmdkList.innerHTML = '';
  shown.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'ov-item' + (i === cmdkSel ? ' sel' : '');
    const l = document.createElement('span');
    l.textContent = item.label;
    row.appendChild(l);
    if (item.k) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = item.k;
      row.appendChild(k);
    }
    row.onclick = () => { closeOverlays(); item.run(); };
    cmdkList.appendChild(row);
  });
  cmdkList.__visible = shown;
}

cmdkInput.addEventListener('input', () => { cmdkSel = 0; renderCmdk(); });
cmdkInput.addEventListener('keydown', e => {
  const vis = cmdkList.__visible || [];
  if (e.key === 'ArrowDown') { cmdkSel++; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { cmdkSel--; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const item = vis[cmdkSel];
    closeOverlays();
    if (item) item.run();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    // must live here: the stopPropagation below keeps real keypresses from
    // ever reaching the window listener's overlay handling
    closeOverlays();
    e.preventDefault();
  }
  e.stopPropagation();
});

function renderHelp() {
  const term = helpInput.value.trim().toLowerCase();
  const activeCtx = new Set(['global', editMode ? 'edit' : 'live', drag ? 'drag' : null]);
  const rows = [{ show: 'Tab', help: 'Toggle Edit / Live. Hold to peek Live, release to snap back.', cat: 'Global' }];
  for (const b of KEYMAP) {
    if (!b.show || !activeCtx.has(b.ctx)) continue;
    rows.push(b);
  }
  helpList.innerHTML = '';
  let lastCat = '';
  for (const r of rows) {
    if (term && !(r.show + ' ' + r.help).toLowerCase().includes(term)) continue;
    if (r.cat !== lastCat) {
      lastCat = r.cat;
      const c = document.createElement('div');
      c.className = 'ov-cat';
      c.textContent = r.cat;
      helpList.appendChild(c);
    }
    const row = document.createElement('div');
    row.className = 'ov-item';
    const l = document.createElement('span');
    l.textContent = r.help;
    row.appendChild(l);
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = r.show;
    row.appendChild(k);
    helpList.appendChild(row);
  }
}

helpInput.addEventListener('input', renderHelp);
helpInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeOverlays(); e.preventDefault(); }
  e.stopPropagation();
});

function toggleHelp() {
  if (helpEl.hidden) {
    helpEl.hidden = false;
    helpInput.value = '';
    renderHelp();
    helpInput.focus();
  } else {
    helpEl.hidden = true;
  }
}

function closeOverlays() {
  cmdkEl.hidden = true;
  helpEl.hidden = true;
  // Focus would otherwise stay parked in the now-hidden input, and the
  // dispatcher's text-entry guard would treat every later key as typing,
  // leaving the whole keyboard dead until the user clicked something.
  if (document.activeElement === cmdkInput || document.activeElement === helpInput) {
    document.activeElement.blur();
  }
}

cmdkEl.addEventListener('mousedown', e => { if (e.target === cmdkEl) closeOverlays(); });
helpEl.addEventListener('mousedown', e => { if (e.target === helpEl) closeOverlays(); });

// ---------- code generation ----------

function pascal(s, fallback) {
  const words = (s || '').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!words.length || /^[0-9]/.test(words[0])) return fallback;
  return words.map(w => w[0].toUpperCase() + w.slice(1)).join('');
}

function camel(s, fallback) {
  const p = pascal(s, fallback);
  return p[0].toLowerCase() + p.slice(1);
}

const CPP_KEYWORDS = new Set([
  'alignas', 'alignof', 'and', 'asm', 'auto', 'bool', 'break', 'case', 'catch', 'char',
  'class', 'const', 'constexpr', 'continue', 'decltype', 'default', 'delete', 'do',
  'double', 'else', 'enum', 'explicit', 'export', 'extern', 'false', 'float', 'for',
  'friend', 'goto', 'if', 'inline', 'int', 'long', 'mutable', 'namespace', 'new',
  'noexcept', 'not', 'nullptr', 'operator', 'or', 'private', 'protected', 'public',
  'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch',
  'template', 'this', 'throw', 'true', 'try', 'typedef', 'typeid', 'typename',
  'union', 'unsigned', 'using', 'virtual', 'void', 'volatile', 'while', 'xor',
]);

const WINDOW_FLAGS = [
  ['noTitleBar', 'NoTitleBar'], ['noResize', 'NoResize'], ['noMove', 'NoMove'],
  ['noScrollbar', 'NoScrollbar'], ['noCollapse', 'NoCollapse'], ['autoResize', 'AlwaysAutoResize'],
];

function generateCode() {
  const usedNames = new Set();
  const labelCount = new Map();
  const fields = [];
  const fieldSeen = new Set();

  const groupNames = new Map();
  // A counter alone isn't enough: "Value" then "Value 1" then "Value" would
  // hand out `value`, `value1`, `value1`. Track what's actually taken.
  const claim = base => {
    if (CPP_KEYWORDS.has(base)) base += 'Value';
    let name = base;
    let i = 1;
    while (usedNames.has(name)) name = base + (i++);
    usedNames.add(name);
    return name;
  };

  const uniqName = (node, spec) => {
    // Radio buttons in one group deliberately share a backing variable. The
    // shared name still goes through the counter once, so an unrelated widget
    // labelled the same can't end up declaring a second field of that name.
    if (spec.fieldName) {
      const g = spec.fieldName(node);
      if (!groupNames.has(g)) groupNames.set(g, claim(camel(g, node.type)));
      return groupNames.get(g);
    }
    return claim(camel(node.label || node.type, node.type));
  };

  // Duplicate on-screen labels need distinct ImGui IDs, and the suffix has to
  // come from the occurrence rather than the field name, since radio buttons
  // in one group deliberately share a field.
  const imguiId = label => {
    const s = String(label ?? '');
    const c = (labelCount.get(s) || 0) + 1;
    labelCount.set(s, c);
    return q(c === 1 ? s : s + '##' + c);
  };

  const addField = d => {
    for (const line of Array.isArray(d) ? d : [d]) {
      if (line && !fieldSeen.has(line)) { fieldSeen.add(line); fields.push(line); }
    }
  };

  // Scopes that end a tab bar's reach, matching the engine's threading of the
  // same flag. A tab item outside one is an assert in ImGui, not a no-op.
  const ENDS_TABBAR = new Set(['child', 'popup', 'modal', 'tooltip', 'menu', 'menubar', 'table', 'tabitem']);

  const out = [];
  const emit = (node, depth, index, parentType, inTabbar) => {
    const spec = WIDGETS[node.type];
    if (!spec) return;
    const ind = '    '.repeat(depth);
    if (node.type === 'tabitem' && !inTabbar) {
      out.push(ind + '// A Tab item needs a Tab bar around it; skipped.');
      return;
    }
    // BeginMenuBar only works on a window carrying ImGuiWindowFlags_MenuBar,
    // and asserts outright if one is already being appended.
    if (node.type === 'menubar' && parentType !== 'window') {
      out.push(ind + '// A Menu bar must sit directly on the window; skipped.');
      return;
    }
    const v = uniqName(node, spec);
    const hasLabel = (spec.props || []).some(p => p[0] === 'label');
    const idStr = hasLabel ? imguiId(node.label) : q(node.type);

    if (parentType === 'table') out.push(ind + 'ImGui::TableNextColumn();');
    else if (node.sameline && index > 0) out.push(ind + 'ImGui::SameLine();');

    if (spec.field) addField(spec.field(node, v));

    const res = spec.code ? spec.code(node, v, idStr) : null;
    if (!res) return;
    if (Array.isArray(res)) { for (const l of res) out.push(ind + l); return; }

    for (const l of res.open) out.push(ind + l);
    const braced = res.braced !== false;
    if (braced) out.push(ind + '{');
    const cd = braced ? depth + 1 : depth;
    const kids = node.children || [];
    const childTab = node.type === 'tabbar' ? true : (ENDS_TABBAR.has(node.type) ? false : inTabbar);
    for (let i = 0; i < kids.length; i++) emit(kids[i], cd, i, node.type, childTab);
    if (res.extra) for (const l of res.extra) out.push('    '.repeat(cd) + l);
    if (res.pop) out.push('    '.repeat(cd) + res.pop);
    if (braced) out.push(ind + '}');
    else if (res.close) out.push(ind + res.close);
  };

  const kids = doc.children || [];
  for (let i = 0; i < kids.length; i++) emit(kids[i], 1, i, 'window', false);

  const base = pascal(doc.label, 'MyPanel');
  const flags = WINDOW_FLAGS.filter(([k]) => doc[k]).map(([, f]) => 'ImGuiWindowFlags_' + f);
  if (kids.some(c => c.type === 'menubar')) flags.push('ImGuiWindowFlags_MenuBar');

  const head = [];
  head.push('// Generated by ImGuiStudio');
  head.push('');
  head.push(`struct ${base}State`);
  head.push('{');
  for (const f of fields) head.push('    ' + f);
  head.push('};');
  head.push('');
  head.push(`void Draw${base}(${base}State& state)`);
  head.push('{');
  if (flags.length) head.push(`    ImGuiWindowFlags flags = ${flags.join(' | ')};`);
  if (doc.w > 0 || doc.h > 0) {
    head.push(`    ImGui::SetNextWindowSize(ImVec2(${f(doc.w)}, ${f(doc.h)}), ImGuiCond_FirstUseEver);`);
  }
  head.push(`    ImGui::Begin(${q(doc.label || 'My Panel')}${flags.length ? ', nullptr, flags' : ''});`);
  const tail = ['    ImGui::End();', '}'];
  return head.concat(out, tail).join('\n');
}

// Monokai-family highlighter for the code pane: a single-pass tokenizer whose
// scopes mirror editor themes (chained replaces can't express the call-site vs
// definition distinctions). Lookbehinds resolve against the raw source, so
// already-emitted spans can't confuse later branches.
function highlightCpp(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const master = new RegExp([
    /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/,                                    // 1 comment
    /("(?:[^"\\]|\\.)*")/,                                              // 2 string
    /\b(if|else|return|for|while|switch|case|break|struct|const|static)\b/, // 3 keyword + storage
    /\b(void|bool|float|char|int|double|unsigned)\b/,                   // 4 storage.type
    /\b(true|false|nullptr|NULL)\b/,                                    // 5 constant.language
    /\b(\d+(?:\.\d+)?f?)\b/,                                            // 6 constant.numeric
    /\b(ImGui)\b/,                                                      // 7 support namespace
    /\b(ImVec[24])\b/,                                                  // 8 support struct
    /\b(IM_[A-Z_]+)\b/,                                                 // 9 macro
    /((?<=::)[A-Za-z_]\w*(?=\())/,                                      // 10 support.function (call)
    /\b([A-Za-z_]\w*)(?=\()/,                                           // 11 entity.name.function
    /((?<=\b(?:bool|float|char|int|double|unsigned)\s{1,4})[a-z]\w*)/,  // 12 field declaration
    /((?<=\.)[a-z]\w*)/,                                                // 13 field access
    /\b([a-z]\w*)(?=\.)/,                                               // 14 the variable it hangs off
    /\b([A-Z]\w*)\b/,                                                   // 15 entity.name.class
    /((?<=&\s)[a-z]\w*(?=\)))/,                                         // 16 variable.parameter
    /(::|&|=|-)/,                                                       // 17 keyword.operator
  ].map(r => r.source).join('|'), 'g');
  const classes = ['c-com', 'c-str', 'c-kw', 'c-type', 'c-const', 'c-num',
    'c-support', 'c-class', 'c-macro', 'c-supfn', 'c-fn', 'c-field', 'c-field',
    'c-param', 'c-class', 'c-param', 'c-op'];
  let out = '';
  let last = 0;
  let m;
  while ((m = master.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    let cls = '';
    for (let g = 1; g < m.length; g++) {
      if (m[g] !== undefined) { cls = classes[g - 1]; break; }
    }
    out += cls ? '<span class="' + cls + '">' + esc(m[0]) + '</span>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

function applyTheme(key) {
  const t = THEMES[key] || THEMES['monokai-bright'];
  const it = new Set(t.italics || []);
  const slots = {
    'c-com': t.com, 'c-str': t.str, 'c-kw': t.kw, 'c-type': t.type,
    'c-const': t.const, 'c-num': t.num, 'c-support': t.support, 'c-supfn': t.supfn,
    'c-macro': t.macro, 'c-fn': t.fn, 'c-class': t.cls, 'c-param': t.param, 'c-op': t.op,
    'c-field': t.field || t.fg,
  };
  const rules = ['#code { background: ' + t.bg + '; color: ' + t.fg + '; }'];
  for (const [cls, col] of Object.entries(slots)) {
    rules.push('#code .' + cls + ' { color: ' + col + '; font-style: ' + (it.has(cls) ? 'italic' : 'normal') + '; }');
  }
  document.getElementById('themeStyle').textContent = rules.join('\n');
}

const themeSel = document.getElementById('themeSel');
for (const [key, t] of Object.entries(THEMES)) {
  const o = document.createElement('option');
  o.value = key;
  o.textContent = t.name;
  themeSel.appendChild(o);
}
let currentTheme = localStorage.getItem(THEME_KEY);

themeSel.onchange = () => {
  currentTheme = themeSel.value;
  try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
  applyTheme(currentTheme);
};

// ---------- ui rendering ----------

const paletteCount = Object.values(WIDGETS).filter(w => !w.hidden).length;

function renderPalette() {
  const host = document.getElementById('palette');
  const term = document.getElementById('filter').value.trim().toLowerCase();
  host.innerHTML = '';
  for (const cat of CATEGORIES) {
    const entries = Object.entries(WIDGETS).filter(([k, s]) =>
      !s.hidden && s.cat === cat &&
      (!term || s.name.toLowerCase().includes(term) || k.includes(term)));
    if (!entries.length) continue;
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = cat;
    h.style.gridColumn = '1 / 3';
    host.appendChild(h);
    for (const [type, spec] of entries) {
      const b = document.createElement('button');
      b.textContent = spec.name;
      b.dataset.type = type;
      const fam = FAMILY_OF[type];
      b.title = (spec.container ? 'Container. ' : '') + 'Click to append, or drag onto the canvas'
        + (fam ? '. Key: ' + fam : '');
      if (fam) {
        const k = document.createElement('span');
        k.className = 'kbd';
        k.textContent = fam;
        b.appendChild(k);
      }
      b.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        drag = { kind: 'palette', type, started: false, startX: e.clientX, startY: e.clientY, drop: null };
      });
      host.appendChild(b);
    }
  }
}

function renderTree() {
  const host = document.getElementById('tree');
  host.innerHTML = '';
  walk(doc, (node, parent, index, depth) => {
    const spec = WIDGETS[node.type] || {};
    const row = document.createElement('div');
    row.className = 'row' + (node.id === selectedId ? ' selected' : '');
    row.style.paddingLeft = (6 + depth * 12) + 'px';
    row.onclick = () => { selectedId = node.id; refresh(); };

    if (spec.container) {
      const c = document.createElement('span');
      c.className = 'box';
      c.textContent = '▾';
      row.appendChild(c);
    }

    const t = document.createElement('span');
    t.className = 'wtype';
    t.textContent = node.type;
    row.appendChild(t);

    const l = document.createElement('span');
    l.className = 'wlabel';
    l.textContent = node.label || '';
    row.appendChild(l);

    if (node.sameline && index > 0) {
      const j = document.createElement('span');
      j.className = 'join';
      j.textContent = '⤷';
      j.title = 'joined to previous line (SameLine)';
      row.appendChild(j);
    }

    if (parent) {
      for (const [txt, fn] of [['↑', () => moveNode(node.id, -1)], ['↓', () => moveNode(node.id, 1)], ['✕', () => removeNode(node.id)]]) {
        const b = document.createElement('button');
        b.textContent = txt;
        b.onclick = e => { e.stopPropagation(); fn(); };
        row.appendChild(b);
      }
    }
    host.appendChild(row);
  });
  const sel = host.querySelector('.row.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function renderProps() {
  const host = document.getElementById('propbody');
  host.innerHTML = '';
  const node = selectedId ? findNode(selectedId) : null;
  if (!node) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Select a widget in the hierarchy or canvas.';
    host.appendChild(d);
    return;
  }
  const spec = WIDGETS[node.type] || { props: [] };

  const addField = (labelText, input) => {
    const l = document.createElement('label');
    l.textContent = labelText;
    host.appendChild(l);
    host.appendChild(input);
  };

  for (const [key, type, , opts] of spec.props || []) {
    let inp;
    if (type === 'bool') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!node[key];
      inp.onchange = () => { node[key] = inp.checked; refresh(false); };
    } else if (type === 'enum') {
      inp = document.createElement('select');
      for (const o of opts || []) {
        const [text, val] = Array.isArray(o) ? o : [String(o), o];
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = text;
        inp.appendChild(opt);
      }
      inp.value = node[key];
      inp.onchange = () => { node[key] = Number(inp.value); refresh(false); };
    } else if (type === 'int' || type === 'float') {
      inp = document.createElement('input');
      inp.type = 'number';
      inp.step = type === 'int' ? '1' : 'any';
      inp.value = node[key];
      inp.oninput = () => {
        // int props truncate here too, so the preview and the emitted literal
        // can't disagree about a fractional entry
        const v = Number(inp.value);
        node[key] = Number.isFinite(v) ? (type === 'int' ? Math.trunc(v) : v) : 0;
        refresh(false);
      };
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 200;
      inp.value = node[key] ?? '';
      inp.oninput = () => { node[key] = inp.value; refresh(false); };
    }
    addField(key, inp);
  }

  if (node !== doc) {
    const same = document.createElement('input');
    same.type = 'checkbox';
    same.checked = !!node.sameline;
    // full refresh: normalizeDoc may drop the flag on a first child, and the
    // checkbox has to stop showing it as set
    same.onchange = () => { node.sameline = same.checked; refresh(); };
    addField('sameline', same);
  }
}

function renderCode() {
  document.getElementById('code').innerHTML = highlightCpp(generateCode());
}

// A sameline flag on a first child is suppressed at render and emit time
// rather than deleted from the model: deleting it meant a transient reorder
// through index 0 silently destroyed the join.

// rebuildProps=false keeps focus in the inspector while typing, and doubles
// as the history coalescing signal: bursty property edits merge into one
// undo step, discrete operations each get their own.
function refresh(rebuildProps = true) {
  renderTree();
  if (rebuildProps) renderProps();
  renderCode();
  pushDoc();
  saveLocal();
  pushHistory(!rebuildProps);
}

document.getElementById('filter').oninput = renderPalette;

document.getElementById('demoToggle').onchange = e => {
  if (engineReady) Module.ccall('engine_show_demo', null, ['number'], [e.target.checked ? 1 : 0]);
};

document.getElementById('liveToggle').onchange = e => setLiveMode(e.target.checked);

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(generateCode());
};

document.getElementById('resetBtn').onclick = () => {
  applyDocData(JSON.parse(JSON.stringify(DEFAULT_DOC)), 100);
  refresh();
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ v: 2, doc }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'imguistudio-panel.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

const importFile = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFile.click();
importFile.onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    const d = s && s.doc ? s.doc : s;
    if (!d || d.type !== 'window') throw new Error('not a panel document');
    applyDocData(d, 0);
    refresh();
  } catch (err) {
    console.warn('[import] failed:', err);
  }
  e.target.value = '';
};

// hooks for the automated self-test (app/main.js --selftest)
window.__test = {
  rects: () => latestRects,
  doc: () => doc,
  selected: () => selectedId,
  select: id => { selectedId = id; refresh(); },
  key: (k, mods = {}) => window.dispatchEvent(new KeyboardEvent('keydown', {
    key: k, ctrlKey: !!mods.ctrl, shiftKey: !!mods.shift, altKey: !!mods.alt, cancelable: true,
  })),
  keyUp: k => window.dispatchEvent(new KeyboardEvent('keyup', { key: k })),
  armed: () => armedType(),
  isLive: () => !editMode,
  histLen: () => history.length,
  overlayOpen: () => !cmdkEl.hidden || !helpEl.hidden,
  widgetTypes: () => Object.keys(WIDGETS).filter(k => !WIDGETS[k].hidden),
  generate: () => generateCode(),
  addAll: () => {
    // one of every widget type, containers nested so the tree is exercised
    for (const [type, spec] of Object.entries(WIDGETS)) {
      if (spec.hidden) continue;
      const node = makeNode(type);
      doc.children.push(node);
      if (spec.container) node.children.push(makeNode('text'));
    }
    refresh();
    return doc.children.length;
  },
  // Arrangements ImGui asserts on. The engine must survive all of these,
  // because an assert aborts the wasm module and kills the preview outright.
  stress: () => {
    const nested = makeNode('menubar');
    nested.children.push(makeNode('menubar'));      // BeginMenuBar inside BeginMenuBar
    const grp = makeNode('group');
    grp.children.push(makeNode('menubar'));         // menu bar off the window root
    const ab = makeNode('arrowbutton'); ab.dir = 99;   // past ImGuiDir_COUNT
    const ab2 = makeNode('arrowbutton'); ab2.dir = -5; // below ImGuiDir_None
    const tbl = makeNode('table'); tbl.cols = 0;    // BeginTable asserts on < 1
    const tbl2 = makeNode('table'); tbl2.cols = 9999;
    const ti = makeNode('tabitem');                 // tab item with no tab bar
    doc.children.push(nested, grp, ab, ab2, tbl, tbl2, ti);
    refresh();
    return doc.children.length;
  },
  canvasOrigin: () => {
    const r = canvas.getBoundingClientRect();
    return { x: r.left, y: r.top };
  },
  paletteButtonPos: text => {
    for (const b of document.querySelectorAll('#palette button')) {
      // the badge span is part of textContent, so match on the widget name
      if (b.dataset.type && WIDGETS[b.dataset.type].name === text) {
        const r = b.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      }
    }
    return null;
  },
};

renderPalette();
loadLocal();
refresh();
// the loaded document is the undo floor
pushHistory();
</script>
