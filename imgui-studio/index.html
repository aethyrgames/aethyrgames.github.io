bind('global', 'Ctrl+N', { key: 'N', ctrl: true }, 'New project', 'Global',
  () => { addProject(); saveProjects(); });
bind('global', 'Ctrl+K', { key: 'K', ctrl: true }, 'Command palette', 'Global', () => openCmdk('all'));
bind('global', '?', { key: '?' }, 'Keyboard shortcuts', 'Global', () => toggleHelp());

window.addEventListener('keydown', e => {
  const t = e.target;
  // Space is the hold-to-test quasimode, and it was being eaten by whatever
  // text field was last clicked: filter some widgets, hold Space over the
  // canvas, and you typed a space instead of poking the preview. If the
  // pointer is over the canvas the user plainly means the preview, so take
  // the key and step out of the field.
  if (isPeekKey(e) && cursorInside && isTextEntry(t)) {
    t.blur();
    handleSpaceDown(e);
    return;
  }
  // Same key, pointer still over a panel: the field keeps it, because a space is
  // what you meant while typing. But remember it is down, so arriving over the
  // canvas with it still held enters the quasimode rather than doing nothing at
  // all until you let go and press again.
  if (isPeekKey(e) && !e.repeat) spacePhysicallyDown = true;
  if (isTextEntry(t) || (t && t.tagName === 'SELECT')) {
    if (e.key === 'Escape') {
      // Escape from a field is a full back-out, including a drag that was
      // started while the palette filter still held focus
      t.blur();
      closeOverlays();
      cancelDrag();
      disarm();
      e.preventDefault();
    }
    return;
  }
  // a focused checkbox keeps Space for its own toggle; everything else dispatches
  if (t && t.tagName === 'INPUT' && e.key === ' ') return;
  // Space and Tab are ordinary keymap entries now, so they fall through to the
  // dispatcher below with everything else.
  if (e.key === 'Escape' && (!cmdkEl.hidden || !helpEl.hidden)) {
    closeOverlays();
    e.preventDefault();
    return;
  }
  // The mode keys go first, ahead of the guard below: an ImGui text field asking
  // for input would otherwise swallow them, and Tab is how you get back out of
  // Live mode. They used to be handled ahead of the whole keymap for the same
  // reason, and this keeps that precedence now that they are ordinary entries.
  for (const b of KEYMAP) {
    if (b.cat !== MODES_CAT || !keyMatches(e, b)) continue;
    if (b.run(e) === false) continue;
    e.preventDefault();
    return;
  }
  // never steal keys from an active ImGui text field in live mode
  if (!editMode && engineWantsText) return;
  const contexts = [];
  if (drag) contexts.push('drag');
  contexts.push(editMode ? 'edit' : 'live');
  contexts.push('global');
  for (const ctx of contexts) {
    const matches = KEYMAP.filter(b => b.ctx === ctx && keyMatches(e, b));
    if (!matches.length) continue;
    // Several bindings may legitimately share a key within one category, so
    // repeated presses cycle through them; a lone binding behaves as before.
    if (matches.length > 1) {
      const sig = ctx + '|' + comboLabel(matches[0]);
      const now = Date.now();
      cycleState.idx = (cycleState.sig === sig && now - cycleState.at < 900) ? cycleState.idx + 1 : 0;
      cycleState.sig = sig;
      cycleState.at = now;
    } else {
      cycleState.sig = '';
    }
    const start = matches.length > 1 ? cycleState.idx : 0;
    for (let i = 0; i < matches.length; i++) {
      const b = matches[(start + i) % matches.length];
      if (b.run(e) === false) continue; // declined, keep looking / keep default
      e.preventDefault();
      return;
    }
  }
});

const cycleState = { sig: '', idx: 0, at: 0 };

// A hold gesture has to release on whatever key currently carries it, and a keyup
// may arrive with the modifiers already lifted, so only the key itself is
// compared. Rebinding the peek to Alt+Q still releases on Q.
function bindingFor(help) {
  return KEYMAP.find(b => b.cat === MODES_CAT && b.help.startsWith(help));
}
function peekEntry() { return bindingFor('Hold to test interaction'); }
function modeEntry() { return bindingFor('Toggle Edit and Live'); }
function isPeekKey(e) {
  const b = peekEntry();
  return !!b && e.key === b.key && !!b.ctrl === (e.ctrlKey || e.metaKey) && !!b.alt === e.altKey;
}

window.addEventListener('keyup', e => {
  const mode = modeEntry();
  const peek = peekEntry();
  if (mode && e.key === mode.key) handleTabUp();
  else if (peek && e.key === peek.key) releaseSpace();
});

// ---------- command palette and insert menu ----------

const cmdkEl = document.getElementById('cmdk');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
const helpEl = document.getElementById('helpov');
const helpInput = document.getElementById('helpInput');
const helpList = document.getElementById('helpList');

let cmdkItems = [];
let cmdkSel = 0;

function commandEntries() {
  return [
    { label: 'Undo', k: 'Ctrl+Z', run: undo },
    { label: 'Redo', k: 'Ctrl+Shift+Z', run: redo },
    { label: 'Toggle Edit / Live mode', k: 'Tab', run: () => setLiveMode(editMode) },
    { label: 'Duplicate selection', k: 'Ctrl+D', run: duplicateSelection },
    { label: 'Delete selection', k: 'Del', run: deleteSelection },
    { label: 'Wrap in Group', k: 'Ctrl+G', run: wrapSelection },
    { label: 'Unwrap container', k: 'Ctrl+Shift+G', run: unwrapSelection },
    { label: 'Toggle SameLine', k: 'J', run: toggleJoin },
    { label: 'Repeat Insert', k: 'R', run: repeatInsert },
    { label: 'Keyboard shortcuts', k: '?', run: toggleHelp },
    { label: 'Reset to Sample', run: () => document.getElementById('resetBtn').onclick() },
    { label: 'Reset panel layout', run: () => resetPanelLayout() },
    { label: 'Export JSON', run: () => document.getElementById('exportBtn').onclick() },
    { label: 'Copy C++', run: () => navigator.clipboard.writeText(generateCode()) },
  ];
}

function openCmdk(mode) {
  const inserts = Object.entries(WIDGETS)
    .filter(([, s]) => !s.hidden)
    .map(([type, s]) => ({
      label: 'Insert ' + s.name,
      k: FAMILY_OF[type] || '',
      run: () => insertNodeAt(type, dropAfterSelection()),
    }));
  cmdkItems = mode === 'insert' ? inserts : commandEntries().concat(inserts);
  cmdkEl.hidden = false;
  cmdkInput.value = '';
  cmdkInput.placeholder = mode === 'insert' ? 'insert widget...' : 'search commands and widgets...';
  cmdkSel = 0;
  renderCmdk();
  cmdkInput.focus();
}

function renderCmdk() {
  const term = cmdkInput.value.trim().toLowerCase();
  const vis = cmdkItems.filter(i => !term || i.label.toLowerCase().includes(term));
  // rank prefix matches first so short queries land where expected
  vis.sort((a, b) => {
    const ap = a.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    const bp = b.label.toLowerCase().replace('insert ', '').startsWith(term) ? 0 : 1;
    return ap - bp;
  });
  const shown = vis.slice(0, 40);
  cmdkSel = Math.max(0, Math.min(cmdkSel, shown.length - 1));
  cmdkList.innerHTML = '';
  shown.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'ov-item' + (i === cmdkSel ? ' sel' : '');
    const l = document.createElement('span');
    l.textContent = titleCase(item.label);
    row.appendChild(l);
    if (item.k) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = item.k;
      row.appendChild(k);
    }
    row.onclick = () => { closeOverlays(); item.run(); };
    cmdkList.appendChild(row);
  });
  cmdkList.__visible = shown;
}

cmdkInput.addEventListener('input', () => { cmdkSel = 0; renderCmdk(); });
cmdkInput.addEventListener('keydown', e => {
  const vis = cmdkList.__visible || [];
  if (e.key === 'ArrowDown') { cmdkSel++; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { cmdkSel--; renderCmdk(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const item = vis[cmdkSel];
    closeOverlays();
    if (item) item.run();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    // must live here: the stopPropagation below keeps real keypresses from
    // ever reaching the window listener's overlay handling
    closeOverlays();
    e.preventDefault();
  }
  e.stopPropagation();
});

function renderHelp() {
  const term = helpInput.value.trim().toLowerCase();
  const activeCtx = new Set(['global', editMode ? 'edit' : 'live', drag ? 'drag' : null]);
  const rows = [
    { show: 'Space', help: 'Hold to test interaction, release to return to editing', cat: 'Global' },
    { show: 'Tab', help: 'Toggle Edit / Live. Hold to peek Live, release to snap back.', cat: 'Global' },
  ];
  // Every binding gets its own row, labelled from its live combo. Hiding the
  // second half of a pair behind a hand-written "Up / Down" left it unlistable
  // and unrebindable, and the static label went stale the moment either half
  // was rebound.
  for (const b of KEYMAP) {
    if (!activeCtx.has(b.ctx)) continue;
    rows.push(b);
  }
  helpList.innerHTML = '';

  const hint = document.createElement('div');
  hint.className = 'ov-cat';
  hint.textContent = capturing
    ? 'press a key for: ' + capturing.help + '   (Esc cancels)'
    : 'click any shortcut to rebind it';
  hint.style.color = capturing ? 'var(--mk-green)' : 'var(--mk-comment)';
  helpList.appendChild(hint);

  let lastCat = '';
  for (const r of rows) {
    const label = r.id ? comboLabel(r) : r.show;
    if (term && !(label + ' ' + r.help).toLowerCase().includes(term)) continue;
    if (r.cat !== lastCat) {
      lastCat = r.cat;
      const c = document.createElement('div');
      c.className = 'ov-cat';
      c.textContent = r.cat;
      helpList.appendChild(c);
    }
    const fixed = !r.id;   // Space/Tab are hardwired quasimodes
    const row = document.createElement('div');
    row.className = 'ov-item';
    const l = document.createElement('span');
    l.textContent = r.help;
    row.appendChild(l);
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = capturing === r ? '…press a key' : (fixed ? r.show : comboLabel(r));
    if (!fixed && bindOverrides[r.id]) k.style.color = 'var(--mk-green)';
    row.appendChild(k);
    if (!fixed) {
      row.style.cursor = 'pointer';
      row.onclick = () => { capturing = r; renderHelp(); };
    }
    helpList.appendChild(row);
  }

  const reset = document.createElement('div');
  reset.className = 'ov-item';
  reset.style.cursor = 'pointer';
  reset.style.color = 'var(--mk-comment)';
  reset.textContent = 'Reset all shortcuts to defaults';
  reset.onclick = () => { resetBinds(); renderHelp(); };
  helpList.appendChild(reset);
}

let capturing = null;   // binding awaiting a keypress

// While capturing, the next keypress becomes the binding instead of firing.
function captureKey(e) {
  if (!capturing) return false;
  if (['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return true;
  e.preventDefault();
  if (e.key === 'Escape') { capturing = null; renderHelp(); return true; }
  const cand = {
    key: e.key.length === 1 ? e.key.toUpperCase() : e.key,
    ctrl: e.ctrlKey || e.metaKey, alt: e.altKey, shift: e.shiftKey,
  };
  const clash = rebind(capturing, cand);
  capturing = null;
  renderHelp();
  if (clash) {
    const hint = helpList.firstChild;
    hint.textContent = comboLabel(cand) + ' is already "' + clash.help + '" under '
      + clash.cat + '. Keys can only be shared inside one group.';
    hint.style.color = 'var(--mk-pink)';
  }
  return true;
}

helpInput.addEventListener('input', renderHelp);
helpInput.addEventListener('keydown', e => {
  if (captureKey(e)) { e.stopPropagation(); return; }
  if (e.key === 'Escape') { closeOverlays(); e.preventDefault(); }
  e.stopPropagation();
});

function toggleHelp() {
  if (helpEl.hidden) {
    helpEl.hidden = false;
    helpInput.value = '';
    renderHelp();
    helpInput.focus();
  } else {
    helpEl.hidden = true;
  }
}

function closeOverlays() {
  cmdkEl.hidden = true;
  helpEl.hidden = true;
  if (typeof closeConfirm === 'function') closeConfirm();
  if (typeof closeSettings === 'function') closeSettings();
  // Focus would otherwise stay parked in the now-hidden input, and the
  // dispatcher's text-entry guard would treat every later key as typing,
  // leaving the whole keyboard dead until the user clicked something.
  if (document.activeElement === cmdkInput || document.activeElement === helpInput) {
    document.activeElement.blur();
  }
}

cmdkEl.addEventListener('mousedown', e => { if (e.target === cmdkEl) closeOverlays(); });
helpEl.addEventListener('mousedown', e => { if (e.target === helpEl) closeOverlays(); });

// ---------- code generation ----------

function pascal(s, fallback) {
  const words = (s || '').replace(/[^A-Za-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if (!words.length || /^[0-9]/.test(words[0])) return fallback;
  return words.map(w => w[0].toUpperCase() + w.slice(1)).join('');
}

function camel(s, fallback) {
  const p = pascal(s, fallback);
  return p[0].toLowerCase() + p.slice(1);
}

const CPP_KEYWORDS = new Set([
  'alignas', 'alignof', 'and', 'asm', 'auto', 'bool', 'break', 'case', 'catch', 'char',
  'class', 'const', 'constexpr', 'continue', 'decltype', 'default', 'delete', 'do',
  'double', 'else', 'enum', 'explicit', 'export', 'extern', 'false', 'float', 'for',
  'friend', 'goto', 'if', 'inline', 'int', 'long', 'mutable', 'namespace', 'new',
  'noexcept', 'not', 'nullptr', 'operator', 'or', 'private', 'protected', 'public',
  'register', 'return', 'short', 'signed', 'sizeof', 'static', 'struct', 'switch',
  'template', 'this', 'throw', 'true', 'try', 'typedef', 'typeid', 'typename',
  'union', 'unsigned', 'using', 'virtual', 'void', 'volatile', 'while', 'xor',
]);

const WINDOW_FLAGS = [
  ['noTitleBar', 'NoTitleBar'], ['noResize', 'NoResize'], ['noMove', 'NoMove'],
  ['noScrollbar', 'NoScrollbar'], ['noCollapse', 'NoCollapse'], ['autoResize', 'AlwaysAutoResize'],
];

function generateCode() {
  const usedNames = new Set();
  const labelCount = new Map();
  const fields = [];
  const fieldSeen = new Set();
  const owners = [];   // index into `out` -> node id that produced that line
  const skipped = [];  // widgets with no valid C++ form, reported to the user

  const groupNames = new Map();
  // A counter alone isn't enough: "Value" then "Value 1" then "Value" would
  // hand out `value`, `value1`, `value1`. Track what's actually taken.
  const claim = base => {
    if (CPP_KEYWORDS.has(base)) base += 'Value';
    let name = base;
    let i = 1;
    while (usedNames.has(name)) name = base + (i++);
    usedNames.add(name);
    return name;
  };

  const uniqName = (node, spec) => {
    // Radio buttons in one group deliberately share a backing variable. The
    // shared name still goes through the counter once, so an unrelated widget
    // labelled the same can't end up declaring a second field of that name.
    if (spec.fieldName) {
      const g = spec.fieldName(node);
      if (!groupNames.has(g)) groupNames.set(g, claim(camel(g, node.type)));
      return groupNames.get(g);
    }
    return claim(camel(node.label || node.type, node.type));
  };

  // Duplicate on-screen labels need distinct ImGui IDs, and the suffix has to
  // come from the occurrence rather than the field name, since radio buttons
  // in one group deliberately share a field.
  const imguiId = label => {
    const s = String(label ?? '');
    const c = (labelCount.get(s) || 0) + 1;
    labelCount.set(s, c);
    return q(c === 1 ? s : s + '##' + c);
  };

  const addField = d => {
    for (const line of Array.isArray(d) ? d : [d]) {
      if (line && !fieldSeen.has(line)) { fieldSeen.add(line); fields.push(line); }
    }
  };

  // Scopes that end a tab bar's reach, matching the engine's threading of the
  // same flag. A tab item outside one is an assert in ImGui, not a no-op.
  const ENDS_TABBAR = new Set(['child', 'popup', 'modal', 'tooltip', 'menu', 'menubar', 'table', 'tabitem']);

  const out = [];
  const emit = (node, depth, index, parentType, inTabbar) => {
    const spec = WIDGETS[node.type];
    if (!spec) return;
    const ind = '    '.repeat(depth);
    // These arrangements assert inside ImGui, so there is no valid C++ to emit
    // and the subtree has nowhere to go. Record what was dropped: the code pane
    // warns before Apply reads the text back and makes the loss permanent.
    const skip = reason => {
      const lost = countNodes(node.children);
      skipped.push({ type: spec.name, label: node.label || '', reason, lost });
      out.push(ind + `// ${spec.name}${node.label ? ' "' + node.label + '"' : ''}: ${reason}`);
      if (lost) out.push(ind + `// ${lost} widget${lost > 1 ? 's' : ''} inside it cannot be emitted either.`);
    };
    if (node.type === 'tabitem' && !inTabbar) {
      skip('a Tab item needs a Tab bar around it, so it is skipped');
      return;
    }
    // BeginMenuBar only works on a window carrying ImGuiWindowFlags_MenuBar,
    // and asserts outright if one is already being appended.
    if (node.type === 'menubar' && parentType !== 'window') {
      skip('a Menu bar must sit directly on the window, so it is skipped');
      return;
    }
    const v = uniqName(node, spec);
    const hasLabel = (spec.props || []).some(p => p[0] === 'label');
    const idStr = hasLabel ? imguiId(node.label) : q(node.type);
    // Remember which output lines this node produced, so the code pane can
    // scroll to a widget. Claimed on the way out and only where still unclaimed,
    // which leaves each child owning its own lines and the parent owning the
    // Begin/End scaffolding around them.
    const ownFrom = out.length;
    const claimLines = () => {
      for (let k = ownFrom; k < out.length; k++) if (!owners[k]) owners[k] = node.id;
    };

    // A Function container is transparent: its children are lifted into a
    // function of their own and the call takes their place here. They keep the
    // real parent's context, since the helper runs inside that same scope.
    if (node.type === 'section') {
      const fnName = 'Draw' + claimFn(node.label);
      const start = out.length;
      const kids = node.children || [];
      for (let i = 0; i < kids.length; i++) emit(kids[i], 1, i, parentType, inTabbar);
      const lines = out.splice(start);
      const lineOwners = owners.splice(start, lines.length);
      helpers.push({ id: node.id, fnName, lines, owners: lineOwners });
      // No TableNextColumn for the container itself: its children each advance a
      // cell from inside the helper, and advancing here too left an empty one.
      if (parentType !== 'table' && node.sameline && index > 0) {
        out.push(ind + 'ImGui::SameLine();');
      }
      out.push(ind + `${fnName}(state);`);
      claimLines();
      return;
    }

    if (parentType === 'table') out.push(ind + 'ImGui::TableNextColumn();');
    else if (node.sameline && index > 0) out.push(ind + 'ImGui::SameLine();');

    if (spec.field) addField(spec.field(node, v));
    // ImGui's own way to size an item that has no explicit size argument
    if (Number(node.itemw) > 0) out.push(ind + `ImGui::SetNextItemWidth(${f(node.itemw)});`);

    // Colour pushes wrap the whole widget, and for a container they wrap its
    // Begin/End pair because values like ChildBg are read at Begin time.
    const cols = Object.entries(node.colors || {})
      .filter(([slot]) => colorSlots(node.type).includes(slot));
    for (const [slot, c] of cols) {
      out.push(ind + `ImGui::PushStyleColor(ImGuiCol_${slot}, `
        + `ImVec4(${f(c[0])}, ${f(c[1])}, ${f(c[2])}, ${f(c[3] === undefined ? 1 : c[3])}));`);
    }
    const popColors = () => {
      if (cols.length) out.push(ind + `ImGui::PopStyleColor(${cols.length});`);
    };

    const res = spec.code ? spec.code(node, v, idStr) : null;
    if (!res) { popColors(); claimLines(); return; }
    if (Array.isArray(res)) {
      for (const l of res) out.push(ind + l);
      popColors();
      claimLines();
      return;
    }

    for (const l of res.open) out.push(ind + l);
    const braced = res.braced !== false;
    if (braced) out.push(ind + '{');
    const cd = braced ? depth + 1 : depth;
    const kids = node.children || [];
    const childTab = node.type === 'tabbar' ? true : (ENDS_TABBAR.has(node.type) ? false : inTabbar);
    for (let i = 0; i < kids.length; i++) emit(kids[i], cd, i, node.type, childTab);
    if (res.extra) for (const l of res.extra) out.push('    '.repeat(cd) + l);
    if (res.pop) out.push('    '.repeat(cd) + res.pop);
    if (braced) out.push(ind + '}');
    else if (res.close) out.push(ind + res.close);
    popColors();
    claimLines();
  };

  // Windows named by a Button's `toggles`, so their flags are declared.
  const togglesIn = win => {
    const out = new Set();
    const walkKids = list => {
      for (const n of list || []) {
        if (n.type === 'button' && n.toggles) out.add(pascalId(n.toggles));
        walkKids(n.children);
      }
    };
    walkKids(win.children);
    return [...out];
  };

  // One struct and one function per window. That is what a window is in ImGui
  // terms, and it means a document with three panels reads as three functions
  // rather than one long one.
  const windows = (doc.children || []).filter(n => n.type === 'window');
  const sections = [];
  const usedFnNames = new Set();
  // Lifted Function containers, in the order they were reached. Their names share
  // the window functions' namespace, since it is all one translation unit.
  const helpers = [];
  const claimFn = label => {
    const base = pascal(label, 'Section');
    let name = base;
    let i = 2;
    while (usedFnNames.has(name)) name = base + i++;
    usedFnNames.add(name);
    return name;
  };

  for (const win of windows) {
    out.length = 0;
    owners.length = 0;
    fields.length = 0;
    fieldSeen.clear();
    usedNames.clear();
    groupNames.clear();
    labelCount.clear();
    helpers.length = 0;

    const kids = win.children || [];
    for (let i = 0; i < kids.length; i++) emit(kids[i], 1, i, 'window', false);

    let base = pascal(win.label, 'MyPanel');
    let n = 2;
    while (usedFnNames.has(base)) base = pascal(win.label, 'MyPanel') + n++;
    usedFnNames.add(base);

    const flags = WINDOW_FLAGS.filter(([k]) => win[k]).map(([, f]) => 'ImGuiWindowFlags_' + f);
    if (kids.some(c => c.type === 'menubar')) flags.push('ImGuiWindowFlags_MenuBar');

    const head = [];
    head.push(`struct ${base}State`);
    head.push('{');
    if (win.closable) {
      head.push(`    bool show${pascalId(win.label || 'Window')} = `
        + `${win.openAtStart === false ? 'false' : 'true'};`);
    }
    // any window this one's buttons can toggle needs its flag here too
    for (const t of togglesIn(win)) {
      if (t === pascalId(win.label || 'Window') && win.closable) continue;
      head.push(`    bool show${t} = true;`);
    }
    for (const fld of fields) head.push('    ' + fld);
    head.push('};');
    head.push('');
    // Lifted Function containers go between the struct and the window function:
    // they take the same state by reference, so the struct has to come first.
    const helperStart = head.length;
    const helperOwners = [];
    for (const h of helpers) {
      head.push(`static void ${h.fnName}(${base}State& state)`, '{');
      helperOwners.push(h.id, h.id);
      for (let k = 0; k < h.lines.length; k++) {
        head.push(h.lines[k]);
        helperOwners.push(h.owners[k] || h.id);
      }
      head.push('}', '');
      helperOwners.push(h.id, null);
    }
    head.push(`void Draw${base}(${base}State& state)`);
    head.push('{');
    if (flags.length) head.push(`    ImGuiWindowFlags flags = ${flags.join(' | ')};`);
    head.push(`    ImGui::SetNextWindowPos(ImVec2(${f(win.x)}, ${f(win.y)}), ImGuiCond_FirstUseEver);`);
    if (win.w > 0 || win.h > 0) {
      head.push(`    ImGui::SetNextWindowSize(ImVec2(${f(win.w)}, ${f(win.h)}), ImGuiCond_FirstUseEver);`);
    }
    // Window colours have to be pushed before Begin: WindowBg and the title-bar
    // slots are read while the window is being opened, not while it is filled.
    const winCols = Object.entries(win.colors || {})
      .filter(([slot]) => colorSlots('window').includes(slot));
    for (const [slot, c] of winCols) {
      head.push(`    ImGui::PushStyleColor(ImGuiCol_${slot}, `
        + `ImVec4(${f(c[0])}, ${f(c[1])}, ${f(c[2])}, ${f(c[3] === undefined ? 1 : c[3])}));`);
    }
    // A closable window is guarded by a visibility flag your code owns, which
    // is also what a Button's `toggles` flips. ImGui takes it as Begin's p_open,
    // so it draws the X and clears the flag when that is clicked.
    const openFlag = win.closable ? 'show' + pascalId(win.label || 'Window') : null;
    if (openFlag) {
      head.push(`    if (${openFlag})`);
      head.push('    {');
    }
    const ind2 = openFlag ? '        ' : '    ';
    // re-indent the header lines that belong inside the guard
    const guarded = [];
    while (head.length && /^ {4}ImGui::(SetNextWindow|PushStyleColor)/.test(head[head.length - 1])) {
      guarded.unshift(head.pop());
    }
    for (const l of guarded) head.push(openFlag ? '    ' + l : l);
    head.push(`${ind2}ImGui::Begin(${q(win.label || 'My Panel')}`
      + `${openFlag ? ', &' + openFlag : (flags.length ? ', nullptr' : '')}`
      + `${flags.length ? ', flags' : ''});`);
    const tail = [`${ind2}ImGui::End();`];
    if (winCols.length) tail.push(`${ind2}ImGui::PopStyleColor(${winCols.length});`);
    if (openFlag) tail.push('    }');
    tail.push('}');
    const headOwners = head.map(() => null);
    for (let k = 0; k < helperOwners.length; k++) headOwners[helperStart + k] = helperOwners[k];
    sections.push({
      win, head, body: out.slice(),
      owners: headOwners
        .concat(Array.from({ length: out.length }, (_, i) => owners[i] || win.id), tail.map(() => null)),
      tail,
    });
  }

  const lines = ['// Generated by ImGuiStudio', ''];
  let allOwners = [null, null];
  // code the user wrote around the whole file, kept verbatim
  if (doc.pre) {
    for (const l of String(doc.pre).split('\n')) { lines.push(l); allOwners.push(null); }
    lines.push('');
    allOwners.push(null);
  }
  sections.forEach((sec, i) => {
    if (i) { lines.push(''); allOwners.push(null); }
    lines.push(...sec.head, ...sec.body, ...sec.tail);
    allOwners = allOwners.concat(sec.owners);
  });
  if (doc.post) {
    lines.push('');
    allOwners.push(null);
    for (const l of String(doc.post).split('\n')) { lines.push(l); allOwners.push(null); }
  }

  generateCode.skipped = skipped;
  // already shifted onto the final line numbering, section by section
  generateCode.owners = allOwners;
  return lines.join('\n');
}

// Monokai-family highlighter for the code pane: a single-pass tokenizer whose
// scopes mirror editor themes (chained replaces can't express the call-site vs
// definition distinctions). Lookbehinds resolve against the raw source, so
// already-emitted spans can't confuse later branches.
function highlightCpp(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const master = new RegExp([
    /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/,                                    // 1 comment
    /("(?:[^"\\]|\\.)*")/,                                              // 2 string
    /\b(if|else|return|for|while|switch|case|break|struct|const|static)\b/, // 3 keyword + storage
    /\b(void|bool|float|char|int|double|unsigned)\b/,                   // 4 storage.type
    /\b(true|false|nullptr|NULL)\b/,                                    // 5 constant.language
    /\b(\d+(?:\.\d+)?f?)\b/,                                            // 6 constant.numeric
    /\b(ImGui)\b/,                                                      // 7 support namespace
    /\b(ImVec[24])\b/,                                                  // 8 support struct
    /\b(IM_[A-Z_]+)\b/,                                                 // 9 macro
    /((?<=::)[A-Za-z_]\w*(?=\())/,                                      // 10 support.function (call)
    /\b([A-Za-z_]\w*)(?=\()/,                                           // 11 entity.name.function
    /((?<=\b(?:bool|float|char|int|double|unsigned)\s{1,4})[a-z]\w*)/,  // 12 field declaration
    /((?<=\.)[a-z]\w*)/,                                                // 13 field access
    /\b([a-z]\w*)(?=\.)/,                                               // 14 the variable it hangs off
    /\b([A-Z]\w*)\b/,                                                   // 15 entity.name.class
    /((?<=&\s)[a-z]\w*(?=\)))/,                                         // 16 variable.parameter
    /(::|&|=|-)/,                                                       // 17 keyword.operator
  ].map(r => r.source).join('|'), 'g');
  const classes = ['c-com', 'c-str', 'c-kw', 'c-type', 'c-const', 'c-num',
    'c-support', 'c-class', 'c-macro', 'c-supfn', 'c-fn', 'c-field', 'c-field',
    'c-param', 'c-class', 'c-param', 'c-op'];
  let out = '';
  let last = 0;
  let m;
  while ((m = master.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    let cls = '';
    for (let g = 1; g < m.length; g++) {
      if (m[g] !== undefined) { cls = classes[g - 1]; break; }
    }
    out += cls ? '<span class="' + cls + '">' + esc(m[0]) + '</span>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

// Split in two so the variables can be set at load, before the rulers and the
// engine exist: writing custom properties is safe at any point, repainting is
// not. applyUiTheme is what the UI calls once everything is up.
function applyUiTheme(key) {

const hexToRgbBytes = h => {
  const n = parseInt(String(h).replace('#', ''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const bytesToHex = c => '#' + c.map(v =>
  Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

function relLum(hex) {
  return hexToRgbBytes(hex).map(v => v / 255).map(x =>
    x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4))
    .reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0);
}

function contrastRatio(a, b) {
  const l1 = Math.max(relLum(a), relLum(b)), l2 = Math.min(relLum(a), relLum(b));
  return (l1 + 0.05) / (l2 + 0.05);
}

// The workspace has to read as a different surface from the panels around it.
// Several themes' gutters sit within a couple of percent of their panel
// background, which left the canvas looking like a hole in the UI rather than a
// thing on it. Push it away from the panel until the separation is obvious,
// deterministically, so a new theme can't quietly reintroduce the problem.
const CANVAS_MIN_CONTRAST = 1.20;

function deriveCanvasColor(bg, gutter, isDark) {
  let best = gutter;
  if (contrastRatio(bg, best) >= CANVAS_MIN_CONTRAST) return best;
  const dir = isDark ? -1 : -1;   // both directions recess: darker than the panels
  for (let step = 1; step <= 60; step++) {
    const c = hexToRgbBytes(gutter).map(v => v + dir * step * (isDark ? 1.6 : 3.2));
    best = bytesToHex(c);
    if (contrastRatio(bg, best) >= CANVAS_MIN_CONTRAST) return best;
  }
  // A near-black theme simply cannot get darker than it already is. Rather
  // than flip the canvas lighter than its panels, which inverts the look the
  // theme was going for, take the darkest available and let the border below
  // carry the separation.
  return best;
}

// Panel headers read as a recessed band rather than another lit surface. The
// gutter nudged a little darker gets there (#141414 -> #111111 on the default
// theme), but two themes ship a gutter that is already almost black, and a black
// header was the earlier complaint. So the tone has a floor, enforced here where
// a conditional is possible, rather than in a CSS color-mix that cannot clamp.
const HEAD_MIN_TONE = 16;
const tone = hex => {
  const [r, g, b] = hexToRgbBytes(hex);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};

function deriveHeadColor(gutter, isDark) {
  // a light theme's gutter already reads as a band against its panels
  if (!isDark) return gutter;
  let c = hexToRgbBytes(gutter).map(v => v - 3);
  while (tone(bytesToHex(c)) < HEAD_MIN_TONE) {
    const next = c.map(v => v + 1.5);
    if (next.every(v => v >= 255)) break;
    c = next;
  }
  return bytesToHex(c);
}

function setThemeVars(key) {
  const t = UI_THEMES[key] || UI_THEMES.doki;
  const root = document.documentElement.style;
  root.setProperty('--mk-canvas', deriveCanvasColor(t.bg, t.gutter, t.dark !== false));
  root.setProperty('--mk-head', deriveHeadColor(t.gutter, t.dark !== false));
  for (const slot of ['bg', 'surface', 'gutter', 'fg', 'comment', 'border',
    'pink', 'orange', 'yellow', 'green', 'cyan', 'purple']) {
    root.setProperty('--mk-' + slot, t[slot]);
  }
  const n = NEUTRALS[t.dark === false ? 'light' : 'dark'];
  root.setProperty('--mk-hover', n.hover);
  root.setProperty('--mk-veil', n.veil);
  root.setProperty('--mk-backdrop', n.backdrop);
  root.setProperty('--mk-scan', n.scan);
  root.setProperty('--shadow', n.shadow);
  currentUiTheme = UI_THEMES[key] ? key : 'doki';
  try { localStorage.setItem(UI_THEME_KEY, currentUiTheme); } catch (e) {}
}

// ---------- panels, docks, rulers ----------
// A fixed tiled layout with splitters, not a free-form docking system. For four
// panels the research is unanimous that drag-to-tab/floating is over-built, so
// panels move between the two docks and that is the whole story.

const LAYOUT_KEY = 'imguistudio.layout.v1';
const PANEL_DEFAULTS = {
  palette:    { dock: 'left',  order: 0, collapsed: false, hidden: false, grow: 1 },
  hierarchy:  { dock: 'left',  order: 1, collapsed: false, hidden: false, grow: 1 },
  properties: { dock: 'left',  order: 2, collapsed: false, hidden: false, grow: 1 },
  templates:  { dock: 'left',  order: 3, collapsed: true,  hidden: false, grow: 1 },
  code:       { dock: 'right', order: 0, collapsed: false, hidden: false, grow: 1 },
};
const DOCK_SIDES = ['left', 'right', 'top', 'bottom'];
const SIZE_DEFAULTS = { left: 280, right: 470, top: 200, bottom: 200 };
let layout = {
  panels: JSON.parse(JSON.stringify(PANEL_DEFAULTS)),
  size: { ...SIZE_DEFAULTS },
};

function saveLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {}
}

// Sizes are stored in absolute px, so a layout saved on a big monitor would
// otherwise squeeze the canvas to nothing on a smaller one.
const DOCK_MIN = 150;
function clampDockSizes() {
  const pairs = [
    ['left', 'right', Math.max(DOCK_MIN * 2, window.innerWidth - 320)],
    ['top', 'bottom', Math.max(DOCK_MIN * 2, window.innerHeight - 320)],
  ];
  for (const [a, bSide, budget] of pairs) {
    // cap each side first: scaling alone can't help when one dock is bigger
    // than the whole budget, because the other still holds its minimum
    for (const side of [a, bSide]) {
      const v = Math.round(Number(layout.size[side]) || SIZE_DEFAULTS[side]);
      layout.size[side] = Math.max(DOCK_MIN, Math.min(v, budget - DOCK_MIN));
    }
    const total = layout.size[a] + layout.size[bSide];
    if (total > budget) {
      const scale = budget / total;
      layout.size[a] = Math.max(DOCK_MIN, Math.round(layout.size[a] * scale));
      layout.size[bSide] = Math.max(DOCK_MIN, Math.round(layout.size[bSide] * scale));
    }
  }
}

function resetPanelLayout() {
  layout = {
    panels: JSON.parse(JSON.stringify(PANEL_DEFAULTS)),
    size: { ...SIZE_DEFAULTS },
  };
  saveLayout();
  applyLayout();
}

function loadLayout() {
  try {
    const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
    if (!s || !s.panels) return;
    for (const k of Object.keys(PANEL_DEFAULTS)) {
      if (s.panels[k]) layout.panels[k] = { ...PANEL_DEFAULTS[k], ...s.panels[k] };
      if (!DOCK_SIDES.includes(layout.panels[k].dock)) layout.panels[k].dock = 'left';
    }
    // `width` is the old two-dock shape, kept readable so saved layouts survive
    if (s.size) layout.size = { ...layout.size, ...s.size };
    else if (s.width) layout.size = { ...layout.size, ...s.width };
  } catch (e) {}
}

const panelEls = {};

function buildPanels() {
  for (const el of document.querySelectorAll('.panel')) {
    const key = el.dataset.panel;
    const body = document.createElement('div');
    body.className = 'panel-body';
    while (el.firstChild) body.appendChild(el.firstChild);

    const head = document.createElement('div');
    head.className = 'panel-head';
    head.innerHTML = '<span class="tw">▾</span><span class="ttl"></span>';
    head.querySelector('.ttl').textContent = el.dataset.title;
    const close = document.createElement('button');
    close.textContent = '✕';
    close.title = 'Hide this panel';
    close.onclick = e => { e.stopPropagation(); layout.panels[key].hidden = true; applyLayout(); };
    head.appendChild(close);
    head.onclick = () => {
      layout.panels[key].collapsed = !layout.panels[key].collapsed;
      applyLayout();
    };
    head.addEventListener('mousedown', e => startPanelDrag(e, key));

    el.appendChild(head);
    el.appendChild(body);
    panelEls[key] = el;
  }
  applyLayout();
}

function dockEl(side) {
  return document.getElementById('dock' + side[0].toUpperCase() + side.slice(1));
}

function applyLayout() {
  const docks = {};
  for (const s of DOCK_SIDES) { docks[s] = dockEl(s); docks[s].innerHTML = ''; }
  // Hidden panels stay in the DOM as display:none rather than being detached.
  // Detaching them took their render targets out of getElementById, so the next
  // renderPalette/renderProps threw and every edit after that died with it.
  const entries = Object.entries(layout.panels)
    .sort((a, b) => a[1].order - b[1].order);
  for (const [key, p] of entries) {
    const el = panelEls[key];
    el.classList.toggle('collapsed', p.collapsed);
    el.classList.toggle('gone', !!p.hidden);
    el.querySelector('.tw').textContent = p.collapsed ? '▸' : '▾';
    el.style.flexGrow = p.collapsed ? '' : String(p.grow || 1);
    const dock = docks[p.dock] || docks.left;
    // a splitter between neighbours, so a dock's panels can be resized rather
    // than being stuck at their equal share
    if (!p.hidden && dock.querySelector('.panel:not(.gone)')) {
      const sp = document.createElement('div');
      sp.className = 'panelsplit' + (p.dock === 'top' || p.dock === 'bottom' ? ' vert' : '');
      sp.addEventListener('mousedown', ev => startPanelResize(ev, dock, el));
      dock.appendChild(sp);
    }
    dock.appendChild(el);
  }
  clampDockSizes();
  docks.left.style.width = layout.size.left + 'px';
  docks.right.style.width = layout.size.right + 'px';
  docks.top.style.height = layout.size.top + 'px';
  docks.bottom.style.height = layout.size.bottom + 'px';
  renderPanelButtons();
  saveLayout();
  requestAnimationFrame(syncCanvasSize);
}

// The panel toggles used to be buttons in the header. They are the Windows
// menu now, so applyLayout only has to keep an open menu current.
function renderPanelButtons() {
  if (openMenu === 'windows') renderMenu('windows');
}

// Drag the seam between two stacked panels to trade space between them. The
// pair keeps its combined share, so resizing one never disturbs the rest.
function startPanelResize(e, dock, belowEl) {
  e.preventDefault();
  e.stopPropagation();
  const panels = [...dock.querySelectorAll('.panel:not(.gone):not(.collapsed)')];
  const idx = panels.indexOf(belowEl);
  const above = panels[idx - 1];
  if (!above || idx < 0) return;
  const vert = dock.id === 'dockTop' || dock.id === 'dockBottom';
  const keyOf = el => el.dataset.panel;
  const aKey = keyOf(above), bKey = keyOf(belowEl);
  const aBox = above.getBoundingClientRect(), bBox = belowEl.getBoundingClientRect();
  const total = vert ? aBox.width + bBox.width : aBox.height + bBox.height;
  const totalGrow = (layout.panels[aKey].grow || 1) + (layout.panels[bKey].grow || 1);
  const start = vert ? e.clientX : e.clientY;
  const aStart = vert ? aBox.width : aBox.height;
  const move = ev => {
    const delta = (vert ? ev.clientX : ev.clientY) - start;
    const aNext = Math.max(48, Math.min(total - 48, aStart + delta));
    layout.panels[aKey].grow = totalGrow * (aNext / total);
    layout.panels[bKey].grow = totalGrow - layout.panels[aKey].grow;
    above.style.flexGrow = String(layout.panels[aKey].grow);
    belowEl.style.flexGrow = String(layout.panels[bKey].grow);
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    saveLayout();
    requestAnimationFrame(syncCanvasSize);
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

// Drag a panel header to any edge. The zone is picked by which edge the cursor
// is nearest, normalised so a short window's top and bottom compete fairly with
// a wide window's left and right.
let panelDrag = null;
const dropzone = document.getElementById('dropzone');

function edgeUnderCursor(x, y) {
  // If the pointer is inside a dock that already exists, that is the dock you
  // mean. Going by nearest workspace edge meant the top of the left dock read
  // as "top", so reordering within a dock kept throwing the panel somewhere
  // else and felt impossible to aim.
  for (const side of DOCK_SIDES) {
    const el = dockEl(side);
    if (!el.offsetParent) continue;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return side;
  }
  const ws = document.getElementById('workspace').getBoundingClientRect();
  const d = {
    left: (x - ws.left) / ws.width,
    right: (ws.right - x) / ws.width,
    top: (y - ws.top) / ws.height,
    bottom: (ws.bottom - y) / ws.height,
  };
  return DOCK_SIDES.reduce((best, s) => (d[s] < d[best] ? s : best), 'left');
}

// Which slot in the target dock the cursor is over. Dropping used to append
// unconditionally, so a panel put back always went to the bottom and there was
// no way to reorder within a dock at all.
function dropIndexFor(side, key, x, y) {
  const stacks = side === 'left' || side === 'right';
  const others = Object.entries(layout.panels)
    .filter(([k, p]) => !p.hidden && p.dock === side && k !== key)
    .sort((a, b) => a[1].order - b[1].order)
    .map(([k]) => k);
  let i = 0;
  for (const k of others) {
    const el = panelEls[k];
    if (!el || !el.offsetParent) { i++; continue; }
    const r = el.getBoundingClientRect();
    const mid = stacks ? r.top + r.height / 2 : r.left + r.width / 2;
    if ((stacks ? y : x) > mid) i++;
    else break;
  }
  return { index: i, order: others };
}

// Where a dock would land if it isn't on screen yet, so the preview is the real
// size the panel is about to get rather than a generic band.
function dockPreviewRect(side) {
  const ws = document.getElementById('workspace').getBoundingClientRect();
  const live = dockEl(side).getBoundingClientRect();
  if (live.width > 1 && live.height > 1) return live;
  const size = layout.size[side] || SIZE_DEFAULTS[side];
  if (side === 'left') return { left: ws.left, top: ws.top, width: size, height: ws.height };
  if (side === 'right') return { left: ws.right - size, top: ws.top, width: size, height: ws.height };
  if (side === 'top') return { left: ws.left, top: ws.top, width: ws.width, height: size };
  return { left: ws.left, top: ws.bottom - size, width: ws.width, height: size };
}

// Draw the dock at its real size and split it into slots, one per panel that
// will share it, with the dragged one marked. "Somewhere on the right" tells
// you much less than "this tall, second of three".
function showDropPreview(side, key, at) {
  const r = dockPreviewRect(side);
  const stacks = side === 'left' || side === 'right';
  const sharing = Object.entries(layout.panels)
    .filter(([k, p]) => !p.hidden && p.dock === side && k !== key)
    .sort((a, b) => a[1].order - b[1].order)
    .map(([k]) => k);
  // insert at the cursor's slot rather than always at the end
  sharing.splice(at === undefined ? sharing.length : at, 0, key);
  dropzone.style.display = 'block';
  dropzone.style.left = r.left + 'px';
  dropzone.style.top = r.top + 'px';
  dropzone.style.width = r.width + 'px';
  dropzone.style.height = r.height + 'px';
  dropzone.style.flexDirection = stacks ? 'column' : 'row';
  dropzone.innerHTML = '';
  for (const k of sharing) {
    const slot = document.createElement('div');
    slot.className = 'dzslot' + (k === key ? ' me' : '');
    const name = document.createElement('span');
    name.textContent = panelEls[k] ? panelEls[k].dataset.title : k;
    slot.appendChild(name);
    // spell out the share the dragged panel is about to get: "an edge" tells
    // you far less than "a third of this one"
    if (k === key) {
      const frac = document.createElement('span');
      frac.className = 'dzfrac';
      frac.textContent = '1/' + sharing.length;
      slot.appendChild(frac);
    }
    dropzone.appendChild(slot);
  }
}

function startPanelDrag(e, key) {
  if (e.button !== 0 || e.target.tagName === 'BUTTON') return;
  panelDrag = { key, startX: e.clientX, startY: e.clientY, moved: false };
}

// Escape and losing focus both abandon the drag. Without this the dropzone
// overlay stayed up and a later click committed a dock move nobody asked for.
function cancelPanelDrag() {
  if (!panelDrag) return;
  panelEls[panelDrag.key].classList.remove('dragging');
  panelDrag = null;
  dropzone.style.display = 'none';
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && panelDrag) { cancelPanelDrag(); e.preventDefault(); }
}, true);

document.addEventListener('mousemove', e => {
  if (!panelDrag) return;
  if (!panelDrag.moved) {
    if (Math.abs(e.clientX - panelDrag.startX) + Math.abs(e.clientY - panelDrag.startY) < 6) return;
    panelDrag.moved = true;
    panelEls[panelDrag.key].classList.add('dragging');
  }
  panelDrag.lastX = e.clientX;
  panelDrag.lastY = e.clientY;
  panelDrag.side = edgeUnderCursor(e.clientX, e.clientY);
  panelDrag.at = dropIndexFor(panelDrag.side, panelDrag.key, e.clientX, e.clientY).index;
  showDropPreview(panelDrag.side, panelDrag.key, panelDrag.at);
});

document.addEventListener('mouseup', () => {
  if (!panelDrag) return;
  const d = panelDrag;
  panelDrag = null;
  dropzone.style.display = 'none';
  panelEls[d.key].classList.remove('dragging');
  if (!d.moved || !d.side) return;
  const p = layout.panels[d.key];
  const target = dropIndexFor(d.side, d.key, d.lastX, d.lastY);
  p.dock = d.side;
  p.hidden = false;
  // rebuild the dock's order with the panel at the cursor's slot, so putting one
  // back lands where you dropped it instead of at the bottom
  const list = target.order.slice();
  list.splice(Math.min(d.at !== undefined ? d.at : target.index, list.length), 0, d.key);
  list.forEach((k, i) => { layout.panels[k].order = i; });
  applyLayout();
});

// dock splitters
for (const [id, side] of [['resizeLeft', 'left'], ['resizeRight', 'right'],
  ['resizeTop', 'top'], ['resizeBottom', 'bottom']]) {
  const el = document.getElementById(id);
  const vertical = side === 'top' || side === 'bottom';
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    el.classList.add('dragging');
    const startX = vertical ? e.clientY : e.clientX;
    const startW = layout.size[side];
    const move = ev => {
      const at = vertical ? ev.clientY : ev.clientX;
      // top and left grow as the cursor moves away from the origin; the far
      // sides grow as it moves back toward it
      const delta = (side === 'left' || side === 'top') ? at - startX : startX - at;
      layout.size[side] = Math.max(DOCK_MIN, Math.min(760, startW + delta));
      dockEl(side).style[vertical ? 'height' : 'width'] = layout.size[side] + 'px';
      syncCanvasSize();
    };
    const up = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      saveLayout();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
  // double-click a splitter to reset that dock
  el.addEventListener('dblclick', () => {
    layout.size[side] = SIZE_DEFAULTS[side];
    applyLayout();
  });
}

// ---------- canvas sizing, rulers, guides ----------

const rulerTop = document.getElementById('rulerTop');
const rulerLeft = document.getElementById('rulerLeft');
const rulerBottom = document.getElementById('rulerBottom');
const rulerRight = document.getElementById('rulerRight');
// side -> is it a horizontal rule, and which edge do its ticks grow from
const RULERS = [
  { cv: rulerTop, horiz: true, flip: false },
  { cv: rulerLeft, horiz: false, flip: false },
  { cv: rulerBottom, horiz: true, flip: true },
  { cv: rulerRight, horiz: false, flip: true },
];
const guidesEl = document.getElementById('guides');
let showRulers = true;
let showGrid = true;
let guides = [];        // { axis: 'x'|'y', pos }
let cursorCanvas = { x: 0, y: 0 };
let cursorInside = false;

// Where the pointer really is, in client pixels, tracked on the document so it
// stays right while a drag is running and the pointer has left the canvas. This
// is the input to redeliverPointer below, which needs a position the browser
// will not give it again.
let lastClient = null;
document.addEventListener('mousemove',
  e => { lastClient = { x: e.clientX, y: e.clientY }; }, true);

// The engine's cursor position is a CACHE. The GLFW backend fills it from the
// last DOM mouse event, mapped through the canvas rect as it was at that moment,
// and re-asserts that same cached value into ImGui every single frame. So moving
// or resizing the canvas silently invalidates it: the pointer has not moved, but
// the surface pixel under it has, and nothing tells the engine.
//
// That is not a cosmetic drift. ImGui places a window it is dragging at
// `mouse - grabOffset` every frame, so a cursor that is stale by the origin delta
// MOVES the window by the origin delta. The window then sat further into negative
// space, which grew the sheet, which moved the origin again, which moved the
// window again: press a title bar, hold perfectly still, and the window
// accelerated off the sheet at a few thousand pixels a second and never stopped
// until the button came up.
//
// Re-delivering the pointer where it actually is refills the cache against the
// new rect. Only the canvas needs to hear it (that is where GLFW listens, and it
// ignores events aimed anywhere else), so this does not bubble into our own
// handlers. pageX/pageY are what the backend reads.
function redeliverPointer() {
  if (!lastClient) return;
  canvas.dispatchEvent(new MouseEvent('mousemove', {
    clientX: lastClient.x, clientY: lastClient.y, bubbles: false, cancelable: false,
  }));
}

// The wasm surface follows its container instead of being a fixed 1000x740 box,
// so the preview uses whatever width the docks leave.
// The drawing surface has to cover the content, not just the part of it you
// happen to be looking at. Sizing it to the viewport meant a window wider than
// the visible area was drawn only as far as the surface went and then stopped
// dead, and panning had the same effect. It grows to fit whatever the document
// occupies, with a margin so a resize drag has somewhere to go.
const CANVAS_MARGIN = 240;
const CANVAS_MAX = 4096;   // comfortably inside any WebGL texture limit

// World bounds of everything on the sheet. Both edges matter now: content may
// start left of or above the origin, and the surface has to reach it.
function contentBounds() {
  let minX = 0, minY = 0, maxX = 0, maxY = 0;
  for (const r of latestRects) {
    if (r.w === 0 && r.h === 0) continue;      // a hidden closable window
    minX = Math.min(minX, r.x);
    minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + r.w);
    maxY = Math.max(maxY, r.y + r.h);
  }
  // the document may say a window is bigger, or further out, than the last frame
  // drew: a size typed into the inspector should grow the sheet immediately
  for (const win of doc.children) {
    if (win.type !== 'window') continue;
    const x = Number(win.x) || 0, y = Number(win.y) || 0;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + (Number(win.w) || 0));
    maxY = Math.max(maxY, y + (Number(win.h) || 0));
  }
  return { minX, minY, maxX, maxY };
}

// Kept for the callers that only care how far the content reaches.
function contentExtent() {
  const b = contentBounds();
  return { w: b.maxX - Math.min(0, b.minX), h: b.maxY - Math.min(0, b.minY) };
}

// Quantised, because the size is derived from the live rects: dragging a window
// changes the extent every frame, and resizing the surface every frame makes the
// preview strobe. Rounding up to a step means the surface only changes when the
// content crosses a boundary, and it never shrinks while a gesture is running.
const CANVAS_STEP = 256;
const quantise = v => Math.ceil(v / CANVAS_STEP) * CANVAS_STEP;

function syncCanvasSize() {
  const b = contentBounds();
  // Zoomed out, the visible box covers more world than its pixel size, so the
  // surface has to be the box divided by the zoom or the ground runs out before
  // the edge of the view.
  const visW = Math.floor(canvasHost.clientWidth / zoom);
  const visH = Math.floor(canvasHost.clientHeight / zoom);
  // The origin only leaves zero when content actually needs it, so a document
  // living in positive space renders exactly as it always did and the canvas
  // element is not offset for nothing. While a gesture is running it keeps a
  // whole margin of slack in hand instead, so a drag heading for negative space
  // always has sheet ahead of it and cannot outrun the next resize.
  // Only content that has actually reached negative space moves the origin. Giving
  // every gesture a margin of slack up front meant a drag in positive space still
  // shifted the sheet, and the surface was rebuilt every few frames. The cost is
  // that the frame on which content first crosses zero can clip by a pixel or two
  // before the next poll; anything PLACED at a negative position is covered before
  // it is ever drawn, which is what matters.
  const gesture = !!(drag || resizing || wasMovingWindow);
  // Extra headroom once content is ALREADY in negative space and a gesture is
  // running, which is the only time the sheet has to stay ahead of a moving edge.
  // Applying it to every gesture instead churned the surface during ordinary
  // drags in positive space.
  // While ImGui is dragging one of its own windows it positions that window from
  // the MOUSE, not from the document, so it can outrun a sheet that only grows
  // after the fact. Reserving a slab of negative headroom for the duration of the
  // drag means the pointer cannot leave the sheet in a single frame. It costs one
  // resize when the drag starts and one when it ends, and nothing at rest.
  const reserve = wasMovingWindow ? 1024 : 0;
  const needX = Math.max(0, -b.minX) + (reserve ? CANVAS_MARGIN + reserve : CANVAS_MARGIN);
  const needY = Math.max(0, -b.minY) + (reserve ? CANVAS_MARGIN + reserve : CANVAS_MARGIN);
  let ox = (b.minX < 0 || reserve) ? -quantise(needX) : 0;
  let oy = (b.minY < 0 || reserve) ? -quantise(needY) : 0;
  // Never contract mid-gesture: the surface moving under a drag is a jump. This
  // has to include an ImGui-driven window drag, where our own `drag` is null.
  // Without it the slack came and went with the engine's moving flag, the origin
  // oscillated between 0 and -256, and the surface was rebuilt every few frames.
  if (gesture || marquee) {
    ox = Math.min(ox, origin.x);
    oy = Math.min(oy, origin.y);
  }
  const wantW = Math.max(visW, quantise(b.maxX - ox + CANVAS_MARGIN));
  const wantH = Math.max(visH, quantise(b.maxY - oy + CANVAS_MARGIN));
  let w = Math.min(CANVAS_MAX, Math.max(64, wantW));
  let h = Math.min(CANVAS_MAX, Math.max(64, wantH));
  // hold the larger size while dragging or resizing, so a shrinking extent
  // mid-gesture cannot cause a resize storm
  if (gesture || marquee) {
    w = Math.max(w, canvas.width);
    h = Math.max(h, canvas.height);
  }
  const originMoved = ox !== origin.x || oy !== origin.y;
  if (originMoved) {
    origin.x = ox;
    origin.y = oy;
    if (engineReady) Module.ccall('engine_set_origin', null, ['number', 'number'], [ox, oy]);
  }
  const sizeMoved = canvas.width !== w || canvas.height !== h;
  if (sizeMoved) {
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    if (engineReady) Module.ccall('engine_resize', null, ['number', 'number'], [w, h]);
  }
  // the canvas element has to move with its origin, or world 0,0 slides
  if (originMoved) applyViewTransform();
  // Both of those change where a client pixel lands on the surface, so the
  // engine's cached cursor is now wrong. Told after the transform, never before,
  // or it maps against the rect we are in the middle of leaving.
  if (originMoved || sizeMoved) redeliverPointer();
  drawRulers();
}

new ResizeObserver(() => syncCanvasSize()).observe(canvasHost);
// A window that shrinks past what the docks were sized for has to re-clamp
// them, or the canvas gets squeezed out from between them.
window.addEventListener('resize', () => {
  const before = JSON.stringify(layout.size);
  clampDockSizes();
  if (JSON.stringify(layout.size) !== before) applyLayout();
  syncCanvasSize();
  // a shorter window scrolls the hierarchy, and losing sight of what you had
  // selected is disorienting
  revealSelectedRow();
});

function revealSelectedRow() {
  const sel = document.querySelector('#tree .row.selected');
  if (sel && sel.offsetParent) sel.scrollIntoView({ block: 'nearest' });
}

function drawRulers() {
  if (!showRulers) return;
  const W = canvasHost.clientWidth, H = canvasHost.clientHeight;
  for (const { cv, horiz, flip } of RULERS) {
    const len = horiz ? W : H;
    cv.width = horiz ? len : 20;
    cv.height = horiz ? 20 : len;
    const g = cv.getContext('2d');
    // read from the theme rather than baking Monokai into the canvas
    const css = getComputedStyle(document.documentElement);
    const v = n => css.getPropertyValue('--mk-' + n).trim();
    g.fillStyle = v('canvas');
    g.fillRect(0, 0, cv.width, cv.height);
    g.strokeStyle = v('border');
    g.fillStyle = v('comment');
    g.font = '10px JetBrains Mono, monospace';
    g.beginPath();
    // Ticks count in world coordinates, not screen ones, so they keep meaning
    // the same thing once the view has been panned. Negatives are real now:
    // the grid carries on above and to the left of the origin.
    const off = horiz ? pan.x : pan.y;
    // World units, drawn at world * zoom. The step grows as you zoom out so the
    // ticks never collapse into a solid bar, and shrinks as you zoom in so there
    // is something to read between the hundreds.
    const step = zoom >= 2 ? 5 : (zoom >= 0.75 ? 10 : (zoom >= 0.4 ? 20 : 50));
    const first = Math.floor(-off / zoom / step) * step;
    for (let wv = first; wv * zoom + off < len; wv += step) {
      const p = wv * zoom + off;
      if (p < 0) continue;
      const major = wv % 100 === 0, mid = wv % 50 === 0;
      const size = major ? 20 : (mid ? 8 : 4);
      // the bottom and right rules grow their ticks from the canvas edge, which
      // for them is the near side rather than the far one
      if (horiz) {
        const y0 = flip ? 0 : 20 - size, y1 = flip ? size : 20;
        g.moveTo(p + 0.5, y0); g.lineTo(p + 0.5, y1);
      } else {
        const x0 = flip ? 0 : 20 - size, x1 = flip ? size : 20;
        g.moveTo(x0, p + 0.5); g.lineTo(x1, p + 0.5);
      }
      // labels need room, so skip the one that would run off the near edge
      if (major && p > 12) {
        const txt = String(wv);
        if (horiz) g.fillText(txt, p + 2, flip ? 17 : 8);
        else {
          g.save();
          g.translate(flip ? 17 : 8, p + 2);
          g.rotate(-Math.PI / 2);
          g.fillText(txt, -txt.length * 5, 0);
          g.restore();
        }
      }
    }
    g.stroke();
    // cursor position marker, the measurement half of a ruler. A world
    // coordinate can be negative now, so "is the pointer here" is its own flag
    // rather than a -1 sentinel.
    const c = (horiz ? cursorCanvas.x : cursorCanvas.y) * zoom + off;
    if (cursorInside) {
      g.strokeStyle = v('cyan');
      g.beginPath();
      if (horiz) { g.moveTo(c + 0.5, 0); g.lineTo(c + 0.5, 20); }
      else { g.moveTo(0, c + 0.5); g.lineTo(20, c + 0.5); }
      g.stroke();
    }
  }
}

function renderGuides() {
  guidesEl.innerHTML = '';
  guides.forEach((gd, i) => {
    const el = document.createElement('div');
    el.className = 'guide ' + (gd.axis === 'x' ? 'gx' : 'gy');
    // the position is a world coordinate; the layer is the host, which does not
    // pan, so the offset is applied here and the line spans ruler to ruler
    if (gd.axis === 'x') el.style.left = (gd.pos * zoom + pan.x) + 'px';
    else el.style.top = (gd.pos * zoom + pan.y) + 'px';
    el.title = gd.axis + ' = ' + gd.pos + ' (drag to move, double-click to remove)';
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const move = ev => {
        const p = canvasPoint(ev);
        gd.pos = Math.round(gd.axis === 'x' ? p.x : p.y);
        renderGuides();
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        saveGuides();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      guides.splice(i, 1);
      renderGuides();
      saveGuides();
    });
    guidesEl.appendChild(el);
  });
}

function saveGuides() {
  try { localStorage.setItem('imguistudio.guides', JSON.stringify(guides)); } catch (e) {}
}

// drag out of a ruler to create a guide
for (const [cv, axis] of [[rulerTop, 'y'], [rulerLeft, 'x'],
  [rulerBottom, 'y'], [rulerRight, 'x']]) {
  cv.addEventListener('mousedown', e => {
    e.preventDefault();
    const gd = { axis, pos: 0 };
    guides.push(gd);
    const move = ev => {
      const r = canvas.getBoundingClientRect();
      gd.pos = Math.round(axis === 'x' ? ev.clientX - r.left : ev.clientY - r.top);
      renderGuides();
    };
    const up = ev => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      const r = canvas.getBoundingClientRect();
      const inside = ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top && ev.clientY <= r.bottom;
      if (!inside) guides.pop();   // dropped back on the ruler: discard
      renderGuides();
      saveGuides();
    };
    move(e);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

canvasHost.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  cursorCanvas = { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
  cursorInside = true;
  // Space went down while the pointer was elsewhere, so nothing happened then.
  // Now that it is here and the key is still held, the peek is plainly meant.
  if (spacePhysicallyDown && !spaceHeld) {
    if (isTextEntry(document.activeElement)) document.activeElement.blur();
    handleSpaceDown(null);
  }
  drawRulers();
  const host = canvasHost.getBoundingClientRect();
  coordTip.style.display = 'block';
  coordTip.textContent = cursorCanvas.x + ', ' + cursorCanvas.y;
  // flip to the other side of the cursor near the edges so it stays readable
  const lx = e.clientX - host.left + 14;
  const ly = e.clientY - host.top + 16;
  coordTip.style.left = Math.min(lx, host.width - coordTip.offsetWidth - 4) + 'px';
  coordTip.style.top = Math.min(ly, host.height - coordTip.offsetHeight - 4) + 'px';
  updateHoverStatus(e);
});
canvasHost.addEventListener('mouseleave', () => {
  cursorInside = false;
  coordTip.style.display = 'none';
  drawRulers();
  updateHoverStatus(null);
});

function setRulers(on) {
  showRulers = on;
  document.getElementById('canvasarea').classList.toggle('norulers', !on);
  guidesEl.style.display = on ? '' : 'none';
  document.getElementById('rulerBtn').classList.toggle('on', on);
  requestAnimationFrame(syncCanvasSize);
  try { localStorage.setItem('imguistudio.rulers', on ? '1' : '0'); } catch (e) {}
}

function setGrid(on) {
  showGrid = on;
  document.getElementById('gridBtn').classList.toggle('on', on);
  canvasHost.classList.toggle('nogrid', !on);
  try { localStorage.setItem('imguistudio.grid', on ? '1' : '0'); } catch (e) {}
}

document.getElementById('gridBtn').onclick = () => setGrid(!showGrid);
document.getElementById('rulerBtn').onclick = () => setRulers(!showRulers);

// ---------- hotbar ----------
// Positional slots, auto-assigned. Rebinding is reordering, which is what every
// surveyed tool does instead of a per-slot key-remap UI.

function saveHotbar() {
  try { localStorage.setItem(HOTBAR_KEY, JSON.stringify(hotbar)); } catch (e) {}
}

// Returns false when a full bar has nowhere to put the tool, so the caller can
// say so instead of the click looking like it did nothing.
function pinToHotbar(type, slot) {
  if (slot === undefined) {
    if (hotbar.includes(type)) return true;
    slot = hotbar.indexOf(null);
    if (slot < 0) return false;
  }
  // one slot per tool: a second copy just costs a key for no extra reach
  const dupe = hotbar.indexOf(type);
  if (dupe >= 0 && dupe !== slot) hotbar[dupe] = null;
  hotbar[slot] = type;
  saveHotbar();
  renderPalette();
  return true;
}

function unpin(type) {
  const i = hotbar.indexOf(type);
  if (i >= 0) { hotbar[i] = null; saveHotbar(); renderPalette(); }
}

// ---------- ui rendering ----------


// Category collapse state persists. A filter force-opens sections that contain
// a match and restores the pre-filter state when cleared, so searching is a
// view and never a mutation.
const CAT_KEY = 'imguistudio.cats';
let catOpen = {};
try { catOpen = JSON.parse(localStorage.getItem(CAT_KEY) || '{}'); } catch (e) {}
for (const c of CATEGORIES) if (catOpen[c] === undefined) catOpen[c] = true;

function saveCats() {
  try { localStorage.setItem(CAT_KEY, JSON.stringify(catOpen)); } catch (e) {}
}

// A widget that can only live inside a particular container. Offering it when
// that container does not exist just produces a placeholder, so the button is
// disabled and says why instead.
const NEEDS_CONTAINER = {
  tabitem: ['tabbar', 'a Tab bar'],
  menuitem: ['menu', 'a Menu'],
  menu: ['menubar', 'a Menu bar'],
};

function blockedReason(type) {
  const wins = doc.children.filter(n => n.type === 'window');
  if (!wins.length && type !== 'window') {
    return 'Add a Window first: every widget lives inside one.';
  }
  const need = NEEDS_CONTAINER[type];
  if (!need) return null;
  let found = false;
  walk(doc, n => { if (n.type === need[0]) found = true; });
  return found ? null : `Needs ${need[1]}. Add one, then put this inside it.`;
}

function paletteButton(type, spec) {
  const b = document.createElement('button');
  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = titleCase(spec.name);
  b.appendChild(lbl);
  b.dataset.type = type;
  const fam = FAMILY_OF[type];
  const slot = hotbar.indexOf(type);
  const blocked = blockedReason(type);
  if (blocked) {
    b.disabled = true;
    b.classList.add('blocked');
    b.title = blocked;
  } else {
    b.title = (spec.container ? 'Container. ' : '') + 'Click to append, or drag onto the canvas'
      + (fam ? '. Key: ' + fam : '') + (slot >= 0 ? '. Hotbar: ' + HOTBAR_KEYS[slot] : '');
  }
  const badge = slot >= 0 ? HOTBAR_KEYS[slot] : fam;
  if (badge) {
    const k = document.createElement('span');
    k.className = 'kbd';
    if (slot >= 0) k.style.color = 'var(--mk-purple)';
    k.textContent = badge;
    b.appendChild(k);
  }
  b.addEventListener('mousedown', e => {
    if (e.button !== 0 || b.disabled) return;
    e.preventDefault();
    drag = { kind: 'palette', type, started: false, startX: e.clientX, startY: e.clientY, drop: null };
  });
  b.addEventListener('contextmenu', e => {
    e.preventDefault();
    openContextMenu(e, paletteMenu(type, slot >= 0));
  });
  return b;
}

function renderPalette() {
  const host = document.getElementById('palette');
  const term = document.getElementById('filter').value.trim().toLowerCase();
  host.innerHTML = '';

  const matches = ([k, s]) => !s.hidden
    && (!term || s.name.toLowerCase().includes(term) || k.includes(term));

  // pinned first, so the things you use most never need scrolling to
  const pinned = hotbar.filter(t => t && WIDGETS[t] && matches([t, WIDGETS[t]]));
  if (pinned.length) {
    const open = term ? true : catOpen['★ Pinned'] !== false;
    const h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = '<span class="tw"></span><span></span>';
    h.querySelector('.tw').textContent = open ? '▾' : '▸';
    h.lastChild.textContent = '★ Pinned  (' + pinned.length + ')';
    h.style.color = 'var(--mk-purple)';
    h.onclick = () => {
      catOpen['★ Pinned'] = !open;
      saveCats();
      renderPalette();
    };
    host.appendChild(h);
    if (open) for (const t of pinned) host.appendChild(paletteButton(t, WIDGETS[t]));
  }

  for (const cat of CATEGORIES) {
    const entries = Object.entries(WIDGETS).filter(([k, s]) => s.cat === cat && matches([k, s]));
    if (!entries.length) continue;
    // a filter that matched inside a collapsed section force-opens it
    const open = term ? true : catOpen[cat];
    const h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = '<span class="tw"></span><span></span>';
    h.querySelector('.tw').textContent = open ? '▾' : '▸';
    h.lastChild.textContent = cat + '  (' + entries.length + ')';
    h.onclick = () => { catOpen[cat] = !catOpen[cat]; saveCats(); renderPalette(); };
    host.appendChild(h);
    if (!open) continue;
    for (const [type, spec] of entries) host.appendChild(paletteButton(type, spec));
  }
  // both buttons stay put; each is dead when it has nothing left to do
  const sections = CATEGORIES.concat(['★ Pinned']);
  palCollapseAll.disabled = !sections.some(c => paletteSectionOpen(c));
  palExpandAll.disabled = sections.every(c => paletteSectionOpen(c));
  syncFilterClear('filter');
}

function paletteSectionOpen(cat) {
  return cat === '★ Pinned' ? catOpen[cat] !== false : !!catOpen[cat];
}

function setAllPaletteSections(open) {
  for (const c of CATEGORIES) catOpen[c] = open;
  catOpen['★ Pinned'] = open;
  saveCats();
  renderPalette();
}

const palCollapseAll = document.getElementById('palCollapseAll');
const palExpandAll = document.getElementById('palExpandAll');
palCollapseAll.onclick = () => setAllPaletteSections(false);
palExpandAll.onclick = () => setAllPaletteSections(true);

// The × only exists while there is something to clear, and only on hover, so
// it never sits there as decoration.
function syncFilterClear(id) {
  const input = document.getElementById(id);
  if (input) input.closest('.filterwrap').classList.toggle('filled', !!input.value);
}

for (const btn of document.querySelectorAll('.clearfilter')) {
  btn.onclick = () => {
    const input = document.getElementById(btn.dataset.for);
    input.value = '';
    input.dispatchEvent(new Event('input'));
    input.focus();
  };
}

let openMenu = null;

const click = id => document.getElementById(id).onclick();

function renderMenu(name) {
  const items = (MENUS()[name] || []).filter(Boolean);
  items.sort((a, b) => (a.group || '5').localeCompare(b.group || '5') || (a.order || 0) - (b.order || 0));
  menuPop.innerHTML = '';
  let lastGroup = null;
  for (const it of items) {
    if (it.header) {
      const h = document.createElement('div');
      h.className = 'hdr';
      h.textContent = it.header;
      menuPop.appendChild(h);
      lastGroup = it.group;
      continue;
    }
    if (lastGroup !== null && it.group !== lastGroup) {
      const s = document.createElement('div');
      s.className = 'sep';
      menuPop.appendChild(s);
    }
    lastGroup = it.group;
    const row = document.createElement('div');
    row.className = 'mi' + (it.disabled ? ' disabled' : '');
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = it.checked ? '✓' : '';
    row.appendChild(tick);
    const l = document.createElement('span');
    l.textContent = titleCase(it.label);
    row.appendChild(l);
    if (it.key) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = it.key;
      row.appendChild(k);
    }
    if (!it.disabled) {
      row.onclick = () => {
        // checkable rows stay open, so you can flip two without re-opening
        if (it.checked === undefined) closeMenu();
        it.run();
        if (it.checked !== undefined && openMenu) renderMenu(openMenu);
      };
    }
    menuPop.appendChild(row);
  }
  const top = document.querySelector(`.menutop[data-menu="${name}"]`);
  const r = top.getBoundingClientRect();
  menuPop.style.display = 'block';
  menuPop.style.left = Math.min(r.left, window.innerWidth - menuPop.offsetWidth - 6) + 'px';
  menuPop.style.top = r.bottom + 'px';
  for (const b of document.querySelectorAll('.menutop')) {
    b.classList.toggle('open', b.dataset.menu === name);
  }
  openMenu = name;
}

function closeMenu() {
  menuPop.style.display = 'none';
  openMenu = null;
  for (const b of document.querySelectorAll('.menutop')) b.classList.remove('open');
}

for (const b of document.querySelectorAll('.menutop')) {
  b.onclick = e => {
    e.stopPropagation();
    if (openMenu === b.dataset.menu) closeMenu();
    else renderMenu(b.dataset.menu);
  };
  // once one is open, sliding across the bar moves between them
  b.onmouseenter = () => { if (openMenu && openMenu !== b.dataset.menu) renderMenu(b.dataset.menu); };
}
document.addEventListener('mousedown', e => {
  if (openMenu && !menuPop.contains(e.target) && !e.target.closest('.menutop')) closeMenu();
}, true);
window.addEventListener('blur', closeMenu);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openMenu) { closeMenu(); e.preventDefault(); }
}, true);

// ---------- context menus ----------
// Items carry a group id and an order; the renderer sorts by them and inserts a
// separator wherever the group changes. That gives deterministic ordering,
// automatic separators, and destructive-last for free.

const ctxEl = document.getElementById('ctxmenu');
const IMGUI_MANUAL = 'https://pthom.github.io/imgui_manual_online/manual/imgui_manual.html';

function openContextMenu(e, items) {
  ctxEl.innerHTML = '';
  const live = items.filter(Boolean);
  live.sort((a, b) => (a.group || '5').localeCompare(b.group || '5') || (a.order || 0) - (b.order || 0));
  let lastGroup = null;
  for (const it of live) {
    if (it.header) {
      const h = document.createElement('div');
      h.className = 'hdr';
      h.textContent = it.header;
      ctxEl.appendChild(h);
      lastGroup = it.group;
      continue;
    }
    if (lastGroup !== null && it.group !== lastGroup) {
      const s = document.createElement('div');
      s.className = 'sep';
      ctxEl.appendChild(s);
    }
    lastGroup = it.group;
    const row = document.createElement('div');
    row.className = 'mi' + (it.danger ? ' danger' : '');
    if (it.disabled) row.style.opacity = '0.4';
    const l = document.createElement('span');
    l.textContent = titleCase(it.label);
    row.appendChild(l);
    if (it.key) {
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = it.key;
      row.appendChild(k);
    }
    if (!it.disabled) {
      row.onclick = () => { closeContextMenu(); it.run(); };
    }
    ctxEl.appendChild(row);
  }
  ctxEl.style.display = 'block';
  // keep it on screen
  const w = ctxEl.offsetWidth, h = ctxEl.offsetHeight;
  ctxEl.style.left = Math.min(e.clientX, window.innerWidth - w - 6) + 'px';
  ctxEl.style.top = Math.min(e.clientY, window.innerHeight - h - 6) + 'px';
}

function closeContextMenu() { ctxEl.style.display = 'none'; }
document.addEventListener('mousedown', e => {
  if (ctxEl.style.display === 'block' && !ctxEl.contains(e.target)) closeContextMenu();
}, true);
window.addEventListener('blur', closeContextMenu);

// The label promises a page about THIS widget, so resolve the widget's own
// ImGui function and open its declaration (and doc comment) in the pinned
// header. Falls back to the manual only when the function can't be resolved.
function docsUrlFor(type) {
  const entry = Object.entries(parseCpp.schema || {}).find(([, e]) => e.type === type);
  const line = entry && IMGUI_DOC_LINES[entry[0]];
  return line
    ? `https://github.com/ocornut/imgui/blob/${IMGUI_DOC_TAG}/imgui.h#L${line}`
    : IMGUI_MANUAL;
}

function docsItem(type) {
  return {
    group: '9_docs', order: 0,
    label: 'ImGui reference for ' + WIDGETS[type].name,
    run: () => window.open(docsUrlFor(type), '_blank', 'noopener'),
  };
}

function cppSnippet(node) {
  const saved = JSON.stringify(doc.children);
  const savedSel = selectedId;
  doc.children = [JSON.parse(JSON.stringify(node))];
  const code = generateCode();
  doc.children = JSON.parse(saved);
  selectedId = savedSel;
  const body = code.split('\n');
  const a = body.findIndex(l => l.includes('ImGui::Begin('));
  const b = body.findIndex(l => l.includes('ImGui::End()'));
  return body.slice(a + 1, b).map(l => l.replace(/^ {4}/, '')).join('\n');
}
