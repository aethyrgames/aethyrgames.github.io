<style>

<body>
<div class="bg" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <aside class="side" id="sidebar"></aside>
  <div class="main" id="main-content"></div>
</div>
<script src="../js/docs.js"></script>
<script>
// The download links use GitHub's releases/latest/download/<name> form, so they work
// with no script at all. This adds the newest tag and date. When the latest release
// doesn't carry a card's zip yet (the precompiled build can trail a tag), the card
// points at the newest published release that does, or at the releases page.
loadDocsPage('../data/download.json').then(function () {
  var repo = 'aethyrgames/aethyr-mcp-releases';
  var api = 'https://api.github.com/repos/' + repo;
  var getJson = function (url) {
    return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  };
  var retarget = function (card, hit) {
    var lab = card.querySelector('.dl-lab');
    var small = lab && lab.querySelector('small');
    if (hit) {
      card.href = hit.asset.browser_download_url;
      var t = lab && lab.firstChild;
      if (t && t.nodeType === 3 && /^Download\b/.test(t.data)) {
        t.data = 'Download ' + hit.rel.tag_name + t.data.slice('Download'.length);
      }
      if (small) small.textContent = hit.asset.name + ' from ' + hit.rel.tag_name;
    } else {
      card.href = 'https://github.com/' + repo + '/releases';
      if (small) small.textContent = 'not in the latest release yet';
    }
  };
  var addVersion = function (rel, skipCards) {
    // Every card's label reads "Download<small>...</small>". Swap in the current
    // release's tag so the label and the releases/latest/download link always agree.
    // Skip cards whose asset isn't in the latest release (retarget() below stamps
    // those instead, once it knows which older release they actually point at).
    // Leave the label alone (today's text) if the lookup came back empty.
    if (!rel.tag_name) return;
    Array.prototype.forEach.call(document.querySelectorAll('.dl-lab'), function (lab) {
      var card = lab.closest('a.dl');
      if (skipCards && skipCards.indexOf(card) !== -1) return;
      var t = lab.firstChild;
      if (t && t.nodeType === 3 && /^Download\b/.test(t.data)) {
        t.data = 'Download ' + rel.tag_name + t.data.slice('Download'.length);
      }
    });
  };
  getJson(api + '/releases/latest')
    .then(function (rel) {
      var names = (rel.assets || []).map(function (a) { return a.name; });
      var missing = Array.prototype.filter.call(document.querySelectorAll('a.dl[data-asset]'), function (card) {
        return names.indexOf(card.getAttribute('data-asset')) === -1;
      });
      addVersion(rel, missing);
      if (missing.length) {
        getJson(api + '/releases?per_page=20')
          .then(function (list) {
            missing.forEach(function (card) {
              var name = card.getAttribute('data-asset');
              var hit = null;
              (list || []).some(function (r) {
                if (r.draft || r.prerelease) return false;
                var asset = (r.assets || []).filter(function (x) { return x.name === name; })[0];
                if (asset) hit = { rel: r, asset: asset };
                return !!asset;
              });
              retarget(card, hit);
            });
          })
          .catch(function () { missing.forEach(function (card) { retarget(card, null); }); });
      }
      var line = document.querySelector('[data-rel]');
      if (line && rel.tag_name) {
        var date = (rel.published_at || '').slice(0, 10);
        line.innerHTML = 'Latest release: <b>' + esc(rel.tag_name) + '</b>' + (date ? ', published ' + esc(date) : '')
          + ' · <a href="' + esc(rel.html_url) + '">release notes</a>'
          + ' · <a href="https://github.com/' + repo + '/releases">all releases</a>';
      }
    })
    .catch(function (err) { console.warn('release lookup skipped:', err); });
});
</script>
</body>
</html>
