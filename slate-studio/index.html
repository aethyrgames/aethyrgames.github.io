<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slate Studio</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #26282c; --edge: #34373c; --ink: #d6d9de;
    --dim: #8b9199; --accent: #7cb7ff; --sel: #ffb454; --key: #c78fff;
    --str: #98c379; --num: #d19a66; --cmt: #6b7280; --type: #62d4c4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--edge); background: var(--panel); flex: none;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .note { color: var(--dim); font-size: 12px; }
  header .note b { color: var(--sel); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  #left {
    width: 208px; flex: none; border-right: 1px solid var(--edge); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; overflow: auto;
  }
  #left h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim);
    margin: 0; padding: 9px 10px 5px; position: sticky; top: 0; background: var(--panel);
  }
  .cat { font-size: 10px; color: #6b7280; padding: 5px 10px 2px; letter-spacing: .4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 8px 3px; }
  .chip {
    background: #1b1d20; border: 1px solid var(--edge); color: var(--ink);
    border-radius: 3px; padding: 2px 6px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  #verbs { display: flex; gap: 3px; padding: 0 8px 6px; }
  #verbs button {
    flex: 1; background: #1b1d20; border: 1px solid var(--edge); color: var(--dim);
    border-radius: 3px; padding: 3px 0; font: inherit; font-size: 11px; cursor: pointer;
  }
  #verbs button:hover { border-color: var(--accent); color: var(--accent); }
  #tree { padding: 0 0 10px; font-size: 11px; }
  .node {
    padding: 2px 8px; cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; border-left: 2px solid transparent;
  }
  .node:hover { background: #2c2f34; }
  .node.sel { background: #3a3222; border-left-color: var(--sel); }
  .node .cls { color: var(--type); }
  .node .lbl { color: var(--dim); margin-left: 6px; }
  #centre { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage-tabs {
    display: flex; align-items: center; gap: 2px; padding: 4px 8px;
    border-bottom: 1px solid var(--edge); background: var(--panel); flex: none;
  }
  #stage-tabs button {
    background: #1b1d20; border: 1px solid var(--edge); color: var(--dim);
    border-radius: 3px; padding: 3px 10px; font: inherit; font-size: 11px; cursor: pointer;
  }
  #stage-tabs button[aria-pressed="true"] { background: #313640; color: var(--ink); border-color: #47505e; }
  #pstatus { color: var(--num); font-size: 11px; margin-left: 10px; }
  #stage {
    flex: 1; position: relative; overflow: auto; min-width: 0;
    background:
      linear-gradient(90deg, #24262a 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(#24262a 1px, transparent 1px) 0 0 / 24px 24px, var(--bg);
  }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #realstage {
    flex: 1; overflow: auto; min-width: 0; display: flex;
    align-items: flex-start; justify-content: center; padding: 18px;
    background:
      linear-gradient(90deg, #24262a 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(#24262a 1px, transparent 1px) 0 0 / 24px 24px, var(--bg);
  }
  #realwrap { position: relative; flex: none; }
  #rcv { display: block; background: #000; border: 1px solid var(--edge); border-radius: 4px; }
  #overlay {
    position: absolute; pointer-events: none; border: 1.5px solid var(--sel);
    box-shadow: 0 0 0 1px rgba(0,0,0,.5);
  }
  aside {
    width: 460px; flex: none; border-left: 1px solid var(--edge);
    display: flex; flex-direction: column; background: var(--panel); min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--edge); flex: none; }
  .tabs button {
    flex: 1; padding: 7px 4px; background: none; border: none; color: var(--dim);
    font: inherit; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  pre {
    flex: 1; margin: 0; overflow: auto; padding: 10px 12px; min-height: 0;
    font: 12px/1.55 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; tab-size: 4;
  }
  .k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); }
  .c { color: var(--cmt); font-style: italic; } .t { color: var(--type); }
  #inspector {
    border-top: 1px solid var(--edge); padding: 9px 12px; flex: none;
    max-height: 46%; overflow: auto;
  }
  #inspector h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--dim); margin: 0 0 8px;
  }
  #inspector h2 b { color: var(--sel); text-transform: none; letter-spacing: 0; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row label { width: 92px; flex: none; color: var(--dim); font-size: 12px; }
  .row input[type=text], .row input[type=number], .row select {
    background: #1b1d20; border: 1px solid var(--edge); color: var(--ink);
    border-radius: 3px; padding: 3px 6px; font: inherit; font-size: 12px; min-width: 0; flex: 1;
  }
  .row .pad { display: flex; gap: 4px; flex: 1; }
  .row .pad input { width: 100%; }
  .seg { display: flex; gap: 0; flex: 1; }
  .seg button {
    flex: 1; background: #1b1d20; border: 1px solid var(--edge); color: var(--dim);
    font: inherit; font-size: 11px; padding: 3px 0; cursor: pointer;
  }
  .seg button:first-child { border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button[aria-pressed="true"] { background: #313640; color: var(--ink); border-color: #47505e; }
  footer {
    flex: none; padding: 5px 14px; border-top: 1px solid var(--edge);
    color: var(--dim); font-size: 11px; display: flex; gap: 16px; background: var(--panel);
  }
  footer b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>Slate Studio</h1>
  <span class="note">
    The Model canvas is a <b>sketch of Slate</b>: instant, but its text metrics drift.
    <b>Real Slate</b> renders the same document with the engine itself, compiled to wasm.
  </span>
</header>

<main>
  <nav id="left">
    <h2>Palette</h2>
    <div id="palette"></div>
    <h2>Hierarchy</h2>
    <div id="verbs">
      <button data-verb="up" title="Ctrl+Up">&uarr;</button>
      <button data-verb="down" title="Ctrl+Down">&darr;</button>
      <button data-verb="wrapv" title="wrap in SVerticalBox">[V]</button>
      <button data-verb="wraph" title="wrap in SHorizontalBox">[H]</button>
      <button data-verb="delete" title="Delete">&times;</button>
    </div>
    <div id="tree"></div>
  </nav>
  <div id="centre">
    <div id="stage-tabs">
      <button data-view="model" aria-pressed="true" title="the instant 2D sketch">Model</button>
      <button data-view="real" aria-pressed="false" title="the document rendered by the engine">Real Slate</button>
      <span id="pstatus"></span>
    </div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="realstage" hidden>
      <div id="realwrap">
        <canvas id="rcv" width="640" height="520"></canvas>
        <div id="overlay" hidden></div>
      </div>
    </div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-pane="cpp" aria-selected="true">SGeneratedPanel.cpp</button>
      <button role="tab" data-pane="header" aria-selected="false">.h</button>
      <button role="tab" data-pane="build" aria-selected="false">Build.cs</button>
    </div>
    <pre id="code"></pre>
    <div id="inspector"></div>
  </aside>
</main>

<footer>
  <span>window <b id="wsize">—</b></span>
  <span>widgets <b id="wcount">—</b></span>
  <span id="status"></span>
  <span>drag the window's bottom-right corner to test fill rules</span>
</footer>

<script src="slate-widgets.js?v=6158707d66"></script>
<script src="slate-doc.js?v=061db0183a"></script>
<script src="slate-layout.js?v=cce51f5ae8"></script>
<script src="slate-generate.js?v=1d315e7dc6"></script>
<script src="slate-preview.js?v=f643f0318c"></script>
<script src="slate-app.js?v=edc3e815c5"></script>
</body>
</html>
